<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#050806" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>STARGAZE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  /* The page text is Landfall's green. The sky itself takes the colours of the animated window. */
  :root {
    --bg: #050806;
    --phosphor: #8fd7ac;
    --phosphor-bright: #c9f5da;
    --phosphor-dim: #4d7a5e;
    --rule: rgba(143, 215, 172, 0.14);
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', 'Courier New', monospace;
    --output-glow: 0 0 6px rgba(143, 215, 172, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--phosphor); font-family: var(--font-mono); -webkit-font-smoothing: antialiased; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  body { overflow: hidden; }
  #app { height: 100dvh; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  #head { flex: 0 0 auto; padding: 0.7rem 0.9rem 0.45rem; border-bottom: 1px solid var(--rule); font-size: 0.78rem; letter-spacing: 0.08em; line-height: 1.5; }
  #head .row { display: flex; justify-content: space-between; gap: 0.8rem; }
  #head .title { color: var(--phosphor-bright); font-size: 0.92rem; letter-spacing: 0.16em; text-shadow: var(--output-glow); }
  #head .dim { color: var(--phosphor-dim); }

  #skywrap { position: relative; flex: 1 1 auto; min-height: 180px; margin: 0.55rem 0.9rem 0; border: 1px solid var(--rule); background: #04070e; overflow: hidden; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #sky:active { cursor: grabbing; }

  #readout { flex: 0 0 auto; padding: 0.5rem 0.9rem 0.3rem; font-size: 0.8rem; letter-spacing: 0.05em; line-height: 1.55; min-height: 5.2rem; }
  #readout .line { white-space: pre-wrap; }
  #readout .dim { color: var(--phosphor-dim); }
  #readout .hi { color: var(--phosphor-bright); }

  #controls { flex: 0 0 auto; border-top: 1px solid var(--rule); padding: 0.7rem 0.9rem calc(0.7rem + env(safe-area-inset-bottom)); }
  .menu { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem; }
  .option { background: none; appearance: none; -webkit-appearance: none; border: none; color: var(--phosphor-bright); font-family: inherit; font-size: 0.92rem; text-align: left; padding: 0.15rem 0; cursor: pointer; letter-spacing: 0.02em; -webkit-tap-highlight-color: transparent; }
  .option:focus-visible { outline: 1px dashed var(--phosphor); outline-offset: 2px; }
  .option .dot { margin-left: 0.1em; }
  @media (max-width: 480px) { .option { font-size: 0.98rem; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <div class="row"><span><span class="title">STARGAZE</span><span class="dim" id="hMode"></span></span><span id="hPlace">NĀWILIWILI</span></div>
    <div class="row dim"><span id="hPos"></span><span id="hTime"></span></div>
  </div>
  <div id="skywrap"><canvas id="sky"></canvas></div>
  <div id="readout"><div class="line hi" id="rFacing"></div><div class="line" id="rSel"></div></div>
  <div id="controls">
    <div class="menu">
      <button class="option" data-act="lines" type="button" aria-pressed="false">&gt; CONSTELLATIONS<span class="dot" data-for="lines"></span></button>
      <button class="option" data-act="names" type="button" aria-pressed="false">&gt; NAMES<span class="dot" data-for="names"></span></button>
    </div>
  </div>
</div>

    var i, p, zoom = Math.max(0.8, Math.min(2.2, Math.sqrt(80 / S.fov))), labels = [];

        for (var j = 0; j < ln; j++) {

      }

      // planets: a brighter dot
      SKY.bodies.forEach(function (b) {
        if (b.u < -0.01) return; var q = proj(b.e, b.n, b.u); if (!onScreen(q, 10)) return;

        hits.push({ k: 'm', b: mo, x: p[0], y: p[1], m: -10 });
        if (S.names) labels.push({ x: p[0] + mr + 5, y: p[1] + 4, px: p[0], py: p[1], r: mr, t: 'MOON', m: -10, c: GREEN });

    }

    var su = SKY.sun;

  // ------------------------------------------------------------------ the chosen object and the readout

  // ------------------------------------------------------------------ canvas size

    var b = ev.target.closest('button[data-act]'); if (!b) return; var act = b.getAttribute('data-act');
