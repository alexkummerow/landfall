    if (diff < 50) return 0.55;
    if (diff < 100) return 1.0;
    if (diff < 150) return 0.85;
    return 0.65;
  }

  function baseSpeedForWind(speedKt) {
    if (speedKt < 6) return 2.5;
    if (speedKt < 12) return 4.5;
    if (speedKt < 20) return 6.3;
    if (speedKt < 28) return 7.2;
    return 6.0; // past this, more wind mostly means more danger, not more speed
  }

  function sailConfigFactor(sailConfig, windSpeed) {
    if (sailConfig === 'full') return windSpeed > 25 ? 0.7 : 1.0; // overpowered in a full-sail breeze
    if (sailConfig === 'reefed') return windSpeed < 10 ? 0.75 : 0.92;
    if (sailConfig === 'furled') return 0; // no canvas up — computeSailSpeed() already short-circuits before this, kept for safety
    return 0.45; // minimal / storm canvas — slow, but safe
  }

  /* --------------------------------------------------------------
     PROPULSION

     ONE authoritative speed calculation, built from three independent
     contributors — sails, engine, and a small baseline drift/current —
     that are always computed, then combined. Nothing else in the
     simulation is allowed to invent a second speed number: simTick(),
     the ENGINE menu, and the live POSITION readout all call
     computeBoatSpeed() below.
     -------------------------------------------------------------- */
  var BASE_ENGINE_SPEED_KT = 5.5;    // this size of auxiliary diesel, in calm conditions — see "approximately 5-6 knots"
  var HULL_SPEED_KT = 7.3;           // ~1.34*sqrt(waterline) for a boat this size — where a displacement hull really starts fighting its own wake
  var MAX_REALISTIC_SPEED_KT = 8.5;  // absolute ceiling — a ~35ft displacement hull only goes so fast no matter what's pushing it
  var SAIL_PROPULSION_THRESHOLD_KT = 0.5; // below this, sails aren't usefully contributing (becalmed / in irons / furled / not hoisted)
  var SECONDARY_ASSIST_FLOOR = 0.15; // even very near hull speed, the weaker propulsion source still helps a little, never nothing
  var DIESEL_BURN_RATE_GPH = 0.65;   // gallons per hour while running, for a small auxiliary under load

  // ELECTRICAL PANEL — battery charge (0-100%), entirely separate from
  // boat.electrical (physical wiring/system CONDITION, still only
  // damaged by faults/events and fixed by REPAIR). See updateBattery
  // for how these are applied per tick.
  var BATTERY_DRAIN_AUTOPILOT_PER_HOUR = 2;
  var BATTERY_DRAIN_HEATER_PER_HOUR = 2;
  var BATTERY_DRAIN_FAN_PER_HOUR = 0.5;
  var BATTERY_DRAIN_LIGHTS_PER_HOUR = 0.5;
  var BATTERY_DRAIN_CASSETTE_PER_HOUR = 0.05; // a cassette actually playing -- almost negligible next to the majors above; the ACCESSORY circuit itself draws nothing just being switched on, see updateBattery
  var BATTERY_CHARGE_PER_HOUR = 100; // engine running: 0% -> 100% in 60 minutes = 100%/hour

  // SOLAR — a modest passive daytime trickle charge, entirely automatic
  // (no toggle, no separate resource). %/hour in full daylight, by
  // weather condition; Landfall's weather model only ever produces
  // these four strings (see wmoCodeToCondition), but SOLAR_RATE_FALLBACK
  // covers anything unrecognized so this can never break. Deliberately
  // weak relative to BATTERY_CHARGE_PER_HOUR above — a strong sunny day
  // recovers roughly 10-15% battery, enough to meaningfully cut into the
  // ~48%/day an always-on autopilot alone draws, never enough on its own
  // to make engine charging unnecessary.
  var SOLAR_RATE_BY_CONDITION = { clear: 1.0, overcast: 0.5, rain: 0.25, squall: 0.1 };
  var SOLAR_RATE_FALLBACK = 0.5;

  // 0 outside dawn-through-dusk daylight (see timeOfDayPhase); otherwise
  // the weather-tiered rate above. Read by both updateBattery (the
  // actual charge) and cmdElectrical (the qualitative CHARGING/OFF
  // display), so the two always agree.
  function solarChargeRate(state) {
    if (timeOfDayPhase(state) === 'night') return 0;
    var rate = SOLAR_RATE_BY_CONDITION[state.weather.condition];
    return rate != null ? rate : SOLAR_RATE_FALLBACK;
  }

  // Cabin temperature — comfort/morale only, never a survival mechanic.
  // Centralized here so the COLD/COMFORTABLE/HOT bands are easy to
  // retune. Boundaries are strict (below/above), matching "65°F =
  // COMFORTABLE" and "78°F = COMFORTABLE" being the inclusive edges of
  // the comfortable range.
  var CABIN_TEMP_COLD_MAX_F = 65;   // strictly below: COLD
  var CABIN_TEMP_HOT_MIN_F = 78;    // strictly above (base, no fan): HOT — 65-78 inclusive is COMFORTABLE
  var CABIN_TEMP_FAN_RESCUE_MAX_F = 85; // FAN ON can make an otherwise-HOT cabin read COMFORTABLE up to and including this; past it, still HOT even with the fan running — a fan is not air conditioning
  var CABIN_HEATER_TARGET_F = 68;          // the heater's fixed ceiling — it never pushes the cabin above this, and never adds heat once ambient is already warmer
  var CABIN_TEMP_CHANGE_PER_MINUTE_F = 1;  // flat rate the actual cabin temperature moves toward its current target, warming or cooling alike — see syncCabinTemperature

  /* --------------------------------------------------------------
     CLOTHING
     ------------------------------------------------------------
     A lightweight, entirely hidden comfort model — no meter, no body-
     temperature number, ever shown to the player. Internally, every
     worn combination reduces to one number (computeClothingWarmth)
     compared against what the CURRENT location/temperature calls for
     (idealClothingWarmth); the gap between them (clothingWarmthDelta)
     is the ONE source of truth every downstream consumer reads from —
     the morale/fatigue/thirst penalties below, the ambient narration,
     and the single post-dressing observation all derive from this same
     number rather than keeping separate thresholds of their own. Wind
     (above deck only, see windChillPenalty) and wetness (see
     wetWarmthPenalty) both fold straight into that one delta rather
     than existing as parallel systems.

     Calibration note: the per-garment temperature guidelines this was
     tuned against (T-shirt comfortable 68-82°F, Sweater 50-65°F,
     Windbreaker 55-68°F, Pants 50-72°F, Shorts 70-85°F, with specific
     "feedback begins" points like sweater-too-warm at 75°F+) describe
     each garment in isolation with fairly generous, overlapping
     ranges. Combined outfits interact additively, so the effective
     comfortable WINDOW for any one combination is narrower than any
     single garment's own table entry — this is expected, not a bug:
     the table is guidance for relative warmth and rough thresholds,
     not independent per-garment checks. What actually has to hold, and
     is verified against directly, is the specific worked examples:
     sweater+pants is comfortable at 62°F below deck with NO warmth
     complaint (the specific case this system exists to get right), the
     combined outfit at 62°F below deck ranks
     tshirt+pants < tshirt+windbreaker+pants ≈ sweater+pants <
     sweater+windbreaker+pants from cool to warm, and at 78°F below
     deck tshirt+shorts is comfortable while sweater(+pants) is
     noticeably warm and sweater+windbreaker(+pants) is clearly too
     warm.
     -------------------------------------------------------------- */
  var CLOTHING_LABELS = {
    top: { tshirt: 'T-SHIRT', sweater: 'SWEATER', none: 'NONE' },
    outer: { waterproofJacket: 'WATERPROOF JACKET', windbreaker: 'WINDBREAKER', none: 'NONE' },
    bottom: { pants: 'PANTS', shorts: 'SHORTS', underwear: 'UNDERWEAR' },
    feet: { boots: 'BOOTS', socks: 'SOCKS', barefoot: 'BAREFOOT' },
  };

  // Relative warmth points — never shown to the player, only ever
  // compared against idealClothingWarmth's own output. TOP/OUTER/BOTTOM
  // are the primary drivers (matching the per-garment table this was
  // calibrated against); FEET/BEANIE/GLOVES are deliberately small,
  // secondary nudges — socks (the default) contributes nothing extra,
  // so every below-deck example above holds with feet left at their
  // default. Waterproof jacket and underwear aren't in that table; each
  // is placed relative to its nearest sibling (jacket a little warmer/
  // stuffier than windbreaker per its own "more likely to cause warm
  // discomfort indoors" description, underwear lighter than shorts).
  var CLOTHING_WARMTH = {
    top: { tshirt: 2.5, sweater: 6, none: 0 },
    outer: { waterproofJacket: 3.5, windbreaker: 3, none: 0 },
    bottom: { pants: 3.5, shorts: 1, underwear: 0 },
    feet: { boots: 0.8, socks: 0, barefoot: -0.8 },
  };
  var BEANIE_WARMTH = 0.4;
  var GLOVES_WARMTH_BELOW = 0.4;
  var GLOVES_WARMTH_ABOVE = 0.7; // "somewhat more useful above deck in cold/wind"

  // How much of the "ideal" garment warmth a given ambient temperature
  // calls for — decreases as it gets warmer, floored at 0 (nothing
  // extra needed once it's genuinely hot) and capped well above the
  // warmest realistic combination. See the module notes above for the
  // worked examples this was calibrated against.
  function idealClothingWarmth(tempF) {
    if (tempF == null) return 9.5;
    return clamp(9.5 - 0.375 * (tempF - 62), 0, 14);
  }

  // Total worn warmth right now, including the location-aware gloves
  // bonus (gloves matter more above deck in the cold/wind than they do
  // sitting below). Pure garment warmth only — wind and wetness are
  // separate adjustments applied in clothingWarmthDelta, not folded in
  // here, since this number is also the plain "how warm is the outfit"
  // building block the observation text reasons from.
  function computeClothingWarmth(state) {
    var c = state.crew.clothing;
    var warmth = CLOTHING_WARMTH.top[c.top] + CLOTHING_WARMTH.outer[c.outer]
      + CLOTHING_WARMTH.bottom[c.bottom] + CLOTHING_WARMTH.feet[c.feet];
    if (c.beanie) warmth += BEANIE_WARMTH;
    if (c.gloves) warmth += (state.crew.location === 'above' ? GLOVES_WARMTH_ABOVE : GLOVES_WARMTH_BELOW);
    return warmth;
  }

  // The reference temperature comfort is judged against: cabin
  // temperature below deck, outside air temperature above deck — never
  // a second weather/temperature system of its own. Below deck, wind
  // has no direct effect (the cabin protects from it) — see
  // windChillPenalty, which returns 0 whenever location isn't 'above'.
  function clothingReferenceTempF(state) {
    return state.crew.location === 'below' ? state.boat.cabinTemperatureF : state.weather.temperatureF;
  }

  // Wind protection by OUTER layer, above deck only. This is the
  // windbreaker's whole reason to exist: it isn't just another light
  // sweater (see the module notes) — strong wind cuts through an
  // exposed outfit, and a windbreaker specifically (far more than a
  // waterproof jacket, which trades wind protection for rain
  // protection) cancels most of that. Below deck this never applies at
  // all — clothingWarmthDelta only calls this when location is 'above'.
  var WIND_PROTECTION = { windbreaker: 0.85, waterproofJacket: 0.4, none: 0 };
  var WIND_CHILL_MAX_POINTS = 3; // capped -- wind nudges the read, it doesn't dominate it
  function windChillPenalty(state) {
    if (state.crew.location !== 'above') return 0;
    var windSpeed = state.weather.windSpeed || 0;
    var raw = clamp((windSpeed - 8) * 0.08, 0, WIND_CHILL_MAX_POINTS);
    var protection = WIND_PROTECTION[state.crew.clothing.outer] || 0;
    return raw * (1 - protection);
  }

  // Wet clothing loses much of its effective warmth — folding this
  // straight into the same warmth number (rather than a separate
  // bolt-on penalty) is what naturally makes wet+cold read as
  // distinctly worse than wet+warm elsewhere: the SAME wet garment
  // subtracts the SAME fixed amount, but that only pushes the outfit
  // into "cold" territory when the environment was already asking for
  // real warmth. A warm, wet outfit still reads comfortable-ish here;
  // clothingComfortPenalty adds a small flat "damp is unpleasant"
  // pressure on top regardless of temperature for that case.
  var WET_WARMTH_PENALTY = { torso: 1.5, bottom: 1, feet: 0.8 };
  function wetWarmthPenalty(state) {
    var wet = state.crew.wetClothing;
    var penalty = 0;
    if (wet.torso) penalty += WET_WARMTH_PENALTY.torso;
    if (wet.bottom) penalty += WET_WARMTH_PENALTY.bottom;
    if (wet.feet) penalty += WET_WARMTH_PENALTY.feet;
    return penalty;
  }

  // Positive = overdressed for current conditions, negative =
  // underdressed. This ONE number is the basis for the comfort
  // category, the morale/fatigue/thirst penalty, the ambient narration,
  // and the single post-dressing observation — nothing downstream
  // recomputes warmth, wind, or wetness independently.
  function clothingWarmthDelta(state) {
    var effectiveWarmth = computeClothingWarmth(state) - windChillPenalty(state) - wetWarmthPenalty(state);
    return effectiveWarmth - idealClothingWarmth(clothingReferenceTempF(state));
  }

  // Five broad internal bands — never exposed as a meter or label
  // anywhere the player can see. 'comfortable' deliberately spans a
  // real window (+/-3), not a single point, so nearby-but-not-exact
  // combinations don't read as mismatched — this is what keeps a
  // sweater at 62°F below deck squarely comfortable with zero
  // complaint, per this section's own calibration note above.
  function clothingComfortCategory(delta) {
    if (delta <= -5) return 'cold';
    if (delta <= -3) return 'slightlyCold';
    if (delta >= 5) return 'tooWarm';
    if (delta >= 3) return 'slightlyWarm';
    return 'comfortable';
  }

  // How much a protective item cuts INTO the exposure-minutes needed to
  // reach minutesToWetUnprotected below -- e.g. 0.85 means only 15% of
  // real elapsed minutes above deck actually count toward getting wet, so
  // it takes roughly 1/0.15 (~6-7x) longer than unprotected. Never 100%:
  // "not magic in prolonged severe conditions."
  var RAIN_PROTECTION = {
    outer: { waterproofJacket: 0.85, windbreaker: 0.15, none: 0 },
    feet: { boots: 0.85 }, // socks/barefoot get no entry -- 0 and "skip entirely" respectively, handled directly in updateClothingExposure
  };

  // Minutes of UNPROTECTED exposure before a category becomes
  // meaningfully wet, by weather severity -- feel targets, not rigid UI
  // promises: light/moderate rain ~10-20min, heavy rain/rough spray
  // ~5-10min, squall/very heavy spray ~2-5min. Null means no meaningful
  // rain/spray exposure at all right now (dry weather, calm-ish seas).
  function minutesToWetUnprotected(weather) {
    if (weather.condition === 'squall') return 3.5;
    if (weather.condition === 'rain') return weather.seaState >= 4 ? 7 : 15;
    if (weather.seaState >= 5) return 7; // rough spray with no rain falling
    if (weather.seaState >= 4) return 15;
    return null;
  }

  var ABOVE_DECK_GRACE_MINUTES = 1; // see updateClothingExposure -- a brief errand above deck in bad weather shouldn't cost anything at all

  // Continuous above-deck exposure — wetness accumulation and the
  // clothing-mismatch clock both live here, called once per tick from
  // updateCrew (both locations; mismatch tracking applies below deck
  // too, wetness accumulation is above-deck only, and everything above-
  // deck-specific resets the instant the player goes below — "returning
  // below deck should end/reset the active outside-exposure duration").
  function updateClothingExposure(state, hrs) {
    var c = state.crew;
    var minutes = hrs * 60;

    if (c.location === 'above') {
      if (c.aboveDeckSinceMinutes == null) c.aboveDeckSinceMinutes = state.meta.voyageMinutes;
      var continuousMinutes = state.meta.voyageMinutes - c.aboveDeckSinceMinutes;

      if (continuousMinutes > ABOVE_DECK_GRACE_MINUTES) {
        var threshold = minutesToWetUnprotected(state.weather);
        if (threshold != null) {
          var clothing = c.clothing;
          // TORSO: protected by whichever layer is actually exposed to
          // the weather -- the outer garment if one's worn, otherwise
          // the top itself goes straight through with no protection.
          if (!c.wetClothing.torso) {
            var torsoProtection = clothing.outer !== 'none' ? RAIN_PROTECTION.outer[clothing.outer] : 0;
            c.torsoWetExposureMinutes += minutes * (1 - torsoProtection);
            if (c.torsoWetExposureMinutes >= threshold) { c.wetClothing.torso = true; c.torsoWetExposureMinutes = 0; }
          }
          // BOTTOM: nothing protects it at all -- no rain-pants item exists.
          if (!c.wetClothing.bottom) {
            c.bottomWetExposureMinutes += minutes;
            if (c.bottomWetExposureMinutes >= threshold) { c.wetClothing.bottom = true; c.bottomWetExposureMinutes = 0; }
          }
          // FEET: barefoot never creates a stored wet-feet problem at all.
          if (!c.wetClothing.feet && clothing.feet !== 'barefoot') {
            var feetProtection = clothing.feet === 'boots' ? RAIN_PROTECTION.feet.boots : 0;
            c.feetWetExposureMinutes += minutes * (1 - feetProtection);
            if (c.feetWetExposureMinutes >= threshold) { c.wetClothing.feet = true; c.feetWetExposureMinutes = 0; }
          }
        }
      }
    } else {
      c.aboveDeckSinceMinutes = null;
      c.torsoWetExposureMinutes = 0;
      c.bottomWetExposureMinutes = 0;
      c.feetWetExposureMinutes = 0;
    }

    // Comfort-mismatch clock: tracked in both locations (being badly
    // dressed below deck is just as real as above), deliberately with NO
    // grace period of its own -- the one-minute grace above is
    // specifically about brief errands in bad weather, not a free pass
    // on a genuinely mismatched outfit generally. Still fully gated
    // downstream (see clothingComfortPenalty/clothingFatigueRateBonus)
    // before any real consequence kicks in.
    var kind = null;
    var category = clothingComfortCategory(clothingWarmthDelta(state));
    if (category === 'cold' || category === 'slightlyCold') kind = 'cold';
    else if (category === 'tooWarm' || category === 'slightlyWarm') kind = 'warm';
    if (kind !== c.clothingMismatchKind) {
      c.clothingMismatchKind = kind;
      c.clothingMismatchSinceMinutes = kind ? state.meta.voyageMinutes : null;
    }
  }

  function clothingMismatchHours(state) {
    var since = state.crew.clothingMismatchSinceMinutes;
    if (since == null) return 0;
    return (state.meta.voyageMinutes - since) / 60;
  }

  // Gate before ANY real consequence (morale/fatigue/thirst) engages --
  // the ambient narration (checkClothingNarration) and the single
  // post-dressing observation (performClothingLeave) can both describe
  // a mismatch before this, but nothing the player actually FEELS
  // happens until it has genuinely persisted a little while.
  var CLOTHING_CONSEQUENCE_GATE_HOURS = 0.4; // ~24 minutes

  // Morale-target adjustment from clothing comfort — same "no penalty
  // for a while, then a gentle capped drag" shape as wash/dishes/wetClothes
  // elsewhere in computeMoraleTarget. Cold amplification from wetness
  // comes for free here (wetWarmthPenalty already pushed the delta, and
  // so clothingMismatchKind, toward cold) — this only adds a small flat
  // "damp is unpleasant" pressure on top, present whether it's actually
  // cold out or not (WARM+wet stays modest; that's the whole point of
  // it being flat rather than delta-scaled). Capped well under hunger/
  // thirst's own scale — clothing is atmosphere here, never the
  // dominant survival mechanic.
  function clothingComfortPenalty(state) {
    var c = state.crew;
    var hours = clothingMismatchHours(state);
    var penalty = 0;
    if (hours > CLOTHING_CONSEQUENCE_GATE_HOURS) {
      if (c.clothingMismatchKind === 'cold') penalty -= clamp((hours - CLOTHING_CONSEQUENCE_GATE_HOURS) * 6, 0, 7);
      else if (c.clothingMismatchKind === 'warm') penalty -= clamp((hours - CLOTHING_CONSEQUENCE_GATE_HOURS) * 5, 0, 6);
    }
    var wet = c.wetClothing;
    if (wet.torso || wet.bottom || wet.feet) penalty -= 2;
    return clamp(penalty, -12, 0);
  }

  // Additional fatigue-rate points/hour from clothing mismatch — added
  // straight into updateCrew's existing fatigueRate alongside hunger/
  // thirst/sea-state's own bumps. Wet clothing that's ALSO cold enough
  // to register as a mismatch (see clothingWarmthDelta — wetness
  // already pulled it there) stacks an extra bit on top, since that
  // combination is meant to be one of the more genuinely draining
  // clothing mistakes, not just another warm/cold reading.
  function clothingFatigueRateBonus(state) {
    var c = state.crew;
    if (clothingMismatchHours(state) <= CLOTHING_CONSEQUENCE_GATE_HOURS) return 0;
    var bonus = 0;
    if (c.clothingMismatchKind === 'cold') bonus += 0.3;
    else if (c.clothingMismatchKind === 'warm') bonus += 0.2;
    var wet = c.wetClothing;
    if ((wet.torso || wet.bottom || wet.feet) && clothingWarmthDelta(state) <= -3) bonus += 0.4;
    return bonus;
  }

  // Slightly faster thirst while genuinely overdressed for the heat —
  // never applies to the cold/underdressed side.
  function clothingThirstRateBonus(state) {
    if (state.crew.clothingMismatchKind !== 'warm') return 0;
    if (clothingMismatchHours(state) <= CLOTHING_CONSEQUENCE_GATE_HOURS) return 0;
    return 0.15;
  }

  // Canonical departure quantities — the stable ORIGINAL half of every
  // CURRENT / ORIGINAL supply display throughout INVENTORY, EAT, DRINK,
  // and ENGINE. These are plain constants, not part of saved state:
  // every voyage (new or old) departs with the same current-build
  // amounts, so there's nothing to migrate and no way for the
  // denominator to drift — see ORIGINAL QUANTITY MUST BE STABLE in
  // PROJECT.md. FOOD_ITEMS carries its own `original` per item above.
  var FUEL_STARTING_GALLONS = 20;
  var WATER_STARTING_GALLONS = 50.0;
  var ORIGINAL_COFFEE = 24;
  var ORIGINAL_TEA = 24;
  var ORIGINAL_FLARES = 6;
  var ORIGINAL_SPARES = {
    sailRepairKit: 3, steeringParts: 3, engineParts: 3, fuses: 3,
  };

  /* --------------------------------------------------------------
     BOOKSHELF — data-driven reading system. Every book is just an
     entry here (id, title, author, required minutes, and an ordered
     list of {pct, text} milestones); the reading engine (see
     syncReadingProgress) works entirely off this data, so adding a

     Non-story placeholder content only — see task notes.
     -------------------------------------------------------------- */
  var BOOKS = [
    {
      id: 'oldManSea', title: 'The Old Man and the Sea', author: 'Ernest Hemingway', requiredMinutes: 180,
      milestones: [
        { pct: 5, text: 'Maybe luck matters less than returning to the work.' },
        { pct: 25, text: 'The farther you go, the more returning becomes part of the journey.' },
        { pct: 50, text: "Endurance rarely feels like courage while you're enduring." },
        { pct: 75, text: "Skill isn't control.\nIt's knowing what to do without it." },
        { pct: 100, text: 'Sometimes you set out to bring one thing home, only to discover you were carrying something else all along.' },
      ],
    },
    {
      id: 'siddhartha', title: 'Siddhartha', author: 'Hermann Hesse', requiredMinutes: 240,
      milestones: [
        { pct: 5, text: "An answer given isn't the same as an answer understood." },
        { pct: 25, text: 'Maybe searching is its own kind of becoming.' },
        { pct: 50, text: 'You can spend so long looking for a path that you miss where it has already taken you.' },
        { pct: 75, text: 'Some things can only be understood from inside them.' },
        { pct: 100, text: "Maybe wisdom isn't finding the answer.\nMaybe it's no longer needing one." },
      ],
    },
    {
      id: 'odyssey', title: 'The Odyssey', author: 'Homer', requiredMinutes: 720,
      milestones: [
        { pct: 5, text: 'A destination is just a place until you have a reason to return to it.' },
        { pct: 25, text: 'The farther you travel, the more home becomes an idea.' },
        { pct: 50, text: "You can't return as the person who left." },
        { pct: 75, text: "Maybe coming home isn't the same as going back." },
        { pct: 100, text: "Perhaps home isn't where the journey ends.\nIt's what gives the journey a direction." },
      ],
    },
    {
      id: 'jurassicPark', title: 'Jurassic Park', author: 'Michael Crichton', requiredMinutes: 420,
      milestones: [
        { pct: 5, text: "We trust the things we've built because we built them." },
        { pct: 25, text: "Knowing how something works isn't the same as knowing what it will do." },
        { pct: 50, text: 'Control seems easiest to believe in just before you lose it.' },
        { pct: 75, text: "Maybe chaos isn't disorder.\nMaybe it's order we can't see." },
        { pct: 100, text: 'The more complicated something becomes, the stranger it is to believe anyone is really in charge.' },
      ],
    },
    {
      id: 'thisOldBoat', title: 'This Old Boat', author: 'Don Casey', requiredMinutes: 30,
      milestones: [
        { pct: 25, text: 'Almost everything can last longer if someone keeps tending to it.' },
        { pct: 50, text: 'Maintenance is mostly noticing small things before they become large ones.' },
        { pct: 75, text: 'Maybe caring for something is choosing, again and again, not to let it fall apart.' },

  var BOOKS_BY_ID = {};
  BOOKS.forEach(function (b) { BOOKS_BY_ID[b.id] = b; });

  /* --------------------------------------------------------------
     TAPE PLAYER — a persistent world object (the physical cassette
     player below deck), not a UI activity. Its centralized data lives
     here, mirroring BOOKS/BOOKS_BY_ID above; the actual playback
     engine (audio graph, active-tape state, above/below-deck
     filtering) lives in section 6, AMBIENT AUDIO, alongside audioCtx.
     -------------------------------------------------------------- */
  var TAPES = [
    { title: 'Stargazing', path: 'audio/music/stargazing.mp3' },
    { title: 'Homeward', path: 'audio/music/homeward.mp3' },
    { title: 'Sunbeams', path: 'audio/music/sunbeams.mp3' },
  ];
  var TAPES_BY_TITLE = {};
  TAPES.forEach(function (t) { TAPES_BY_TITLE[t.title] = t; });
  var TAPE_OFF_PATH = 'audio/music/tape_off.mp3';

  // Small, periodic morale nudge — same diminishing-returns shape
  // (routineMoraleGain) as WASH/DRESS/etc., just keyed to a meaningful
  // chunk of accumulated reading time rather than granted per click.
  // This is what keeps "leave the book open" from farming morale: the
  // same cooldown that already throttles the other comforts throttles
  // this too, and no single chunk is large enough to matter on its own.
  var READ_MORALE_CHUNK_MINUTES = 60;
  var READ_MORALE_CHUNK_GAIN = 2;

  // Initial per-book save-state shape, generated from BOOKS rather than
  // hardcoded — adding a book to BOOKS is enough for it to show up here
  // too. Reused by both newGameState and migrateProvisionsIfNeeded.
  function newBooksState() {
    var books = {};
    BOOKS.forEach(function (b) {
      books[b.id] = { minutesRead: 0, completed: false, triggeredMilestones: [] };
    });
    return books;
  }

  // Shared CURRENT / ORIGINAL formatting. Gallons keep one decimal place
  // only when the value actually has one — "50" not "50.0", but "42.3"
  // stays "42.3" — matching the existing water/fuel precision. Countable
  // items (food servings, coffee, tea, spares, flares) are always whole
  // numbers already; String() is enough.
  function formatGal(n) {
    var s = n.toFixed(1);
    return (s.slice(-2) === '.0') ? s.slice(0, -2) : s;
  }
  function galCurrentOnly(current) {
    return formatGal(current) + ' gal';
  }
  function galCurrentOriginal(current, original) {
    return formatGal(current) + ' / ' + formatGal(original) + ' gal';
  }
  function countCurrentOriginal(current, original) {
    if (!original) return String(current); // FISHING HOOK -- Fresh Fish has no fixed starting quantity to compare against
    return current + ' / ' + original;
  }

  // Fixed per-action water amounts (all exact binary fractions of a
  // gallon — 1/8, 3/32, 1/4, 1/16 — so repeated subtraction never drifts
  // from floating-point rounding). The single source of truth for how
  // much each routine action draws from state.water.gallons, the ONE
  // authoritative potable-water supply for the whole boat.
  var WATER_DRINK_GAL = 0.125;     // 16 fl oz
  var WATER_COFFEE_GAL = 0.09375;  // 12 fl oz
  var WATER_TEA_GAL = 0.09375;     // 12 fl oz
  var WATER_WASH_GAL = 0.25;       // 32 fl oz
  var WATER_DISHES_GAL = 0.125;    // 16 fl oz

  function hasEnoughWater(state, amountGal) {
    return state.water.gallons >= amountGal - 1e-9; // tiny epsilon guards against a false negative right at an exact boundary
  }
  function consumeWater(state, amountGal) {
    state.water.gallons = Math.max(0, state.water.gallons - amountGal);
  }

  var DRIFT_BASE_KT = 0.2;           // ambient current/windage on the hull — present even with sails furled and the engine off
  var DRIFT_WIND_FACTOR = 0.025;     // more wind pushes an unpowered hull a little faster over the ground
  var DRIFT_MAX_KT = 1.0;            // this is NOT propulsion — keep it small and capped

  function computeSailSpeed(state, heading) {
    var w = state.weather, b = state.boat, c = state.crew;
    if (b.sailConfig === 'furled') return 0; // furled = no canvas up = no sail propulsion, full stop
    if (b.sails === 'DAMAGED') return 0; // torn/collapsed — no sail propulsion until repaired; the boat can still drift
    var speed = baseSpeedForWind(w.windSpeed)
      * pointOfSailFactor(heading, w.windDirection)
      * sailConfigFactor(b.sailConfig, w.windSpeed);
    if (c.fatigue > 80 || thirstLevel(c.hoursSinceWater) >= 3) speed *= 0.9; // poor trim, wandering helm
    if (c.watchState !== 'awake') speed *= 0.85;                            // unattended — trying to sleep, or asleep
    return Math.max(0, speed);
  }

  function computeEngineSpeed(state, heading) {
    var w = state.weather, b = state.boat, c = state.crew;
    if (!b.engineOn) return 0; // DAMAGED engine can never be running — see cmdEngine/performSystemRepairAttempt
    var speed = BASE_ENGINE_SPEED_KT;
    speed *= clamp(1 - w.seaState * 0.05, 0.55, 1); // pounding into a chop costs speed motoring, same as sailing
    // Wind on the nose costs speed under power; a following wind/sea helps a little.
    var windAngle = angleDiff(heading, w.windDirection); // 0 = wind dead ahead, 180 = dead astern
    var windEffect = ((windAngle - 90) / 90) * clamp(w.windSpeed / 30, 0, 1) * 0.15;
    speed *= (1 + windEffect);
    if (c.watchState !== 'awake') speed *= 0.85; // unattended — same imprecision penalty as sailing unattended
    return Math.max(0, speed);
  }

  function computeDriftSpeed(state) {
    // A small, ever-present contribution from current and wind acting on
    // the hull itself, independent of sail or engine — this is what keeps
    // a furled, unpowered boat from reading a flatly impossible 0.0kt.
    // Not propulsion: it never meaningfully adds to real sailing or
    // motoring speed, only fills in when nothing else is pushing.
    return clamp(DRIFT_BASE_KT + state.weather.windSpeed * DRIFT_WIND_FACTOR, 0.1, DRIFT_MAX_KT);
  }

  function isSailingUseful(state, heading) {
    return computeSailSpeed(state, heading) > SAIL_PROPULSION_THRESHOLD_KT;
  }

  function propulsionState(state, heading) {
    if (state.crew.inLifeRaft) return 'drifting'; // the boat's abandoned — its sails/engine are no longer relevant
    var sailing = isSailingUseful(state, heading);
    var engineOn = state.boat.engineOn;
    if (sailing && engineOn) return 'motor-sailing';
    if (sailing) return 'sailing';
    if (engineOn) return 'motoring';
    return 'drifting';
  }

  function propulsionLabel(key) {
    var labels = { sailing: 'Sailing', 'motor-sailing': 'Motor-sailing', motoring: 'Motoring', drifting: 'Drifting' };
    return labels[key] || capitalize(key);
  }

  function computeBoatSpeed(state, heading) {
    if (state.crew.inLifeRaft) {
      // Nothing to sail or motor anymore — the raft only goes where the
      // current and wind take it, same drift term as a furled, engine-off
      // boat, and nothing more.
      return +computeDriftSpeed(state).toFixed(2);
    }
    var sailSpeed = computeSailSpeed(state, heading);
    var engineSpeed = computeEngineSpeed(state, heading);
    var primary = Math.max(sailSpeed, engineSpeed);
    var secondary = Math.min(sailSpeed, engineSpeed);
    var propelled;
    if (secondary <= 0) {
      propelled = primary;
    } else {
      // Motor-sailing: the weaker of the two sources still adds real thrust
      // on top of the stronger one — it must never get crushed toward
      // invisibility just because the other source happens to be bigger
      // (that was the bug: a cube-sum blend let a big engine number swallow
      // the difference between full and minimal sail almost entirely).
      // What DOES genuinely diminish the assist is how close the boat
      // already is to hull speed — pushing a displacement hull past that
      // point costs disproportionately more the closer you get. That's the
      // actual physical reason a big engine boost in light air (far from
      // hull speed) shrinks to a small one in a strong breeze (already near
      // hull speed) — not an artifact of which number happens to be larger.
      var headroom = clamp(1 - primary / HULL_SPEED_KT, SECONDARY_ASSIST_FLOOR, 1);
      propelled = primary + secondary * headroom;
    }
    // Drift/current is a small, separate baseline that's always present —
    // it's what a furled, engine-off boat has left (pure DRIFTING), and it
    // still nudges the total a little even under sail or power, same as a
    // real current would.
    var total = propelled + computeDriftSpeed(state);
    return +Math.min(total, MAX_REALISTIC_SPEED_KT).toFixed(2);

  }

  /* --------------------------------------------------------------
     COURSE TURN — the boat physically comes around onto a new heading
     in real time (4 degrees/second — see HEADING_TURN_RATE_DEG_PER_SEC)
     rather than snapping there instantly. This is a LIVE, ongoing
     background process, not a blocking action: it never touches
     uiBusy, never clears the options panel, and never shows the
     ". .. ..." activity indicator — the player stays fully at the helm
     (or wherever else they navigate) the entire time, watching ACTUAL
     HEADING and SPEED update live if they're looking at the AT THE
     HELM screen (see printHelmAtHelmHeader's auto-attach below) and
     free to pick a new heading at any point, which simply retargets
     this same running turn rather than queuing or blocking (see
     activeTurn.retarget). Shared by CHANGE COURSE, SET FOR NĀWILIWILI
     (both open water only), TAKE THE HELM, and re-engaging AUTOPILOT
     at the electrical panel. Never advances voyageMinutes and nothing
     about it is persisted beyond nav.heading/setCourse themselves; if
     the page reloads mid-turn it simply resumes as a fresh tick would.
     nav.heading is nudged directly by this function's own short-lived
     timer; computeHeading() stands down for the duration (see
     headingTurnActive, checked at its own top) so a live simTick
     landing mid-turn can't fight it. Every intermediate heading is fed
     straight into computeBoatSpeed (wind angle, no-go-zone, sail
     effectiveness) each tick, and into updateNoGoZoneAudio for the
     luffing/sail_fill pair below — never a separate, only-visual
     heading animation layered over an instantly-resolved simulation
     state.
     -------------------------------------------------------------- */
  var headingTurnActive = false;
  var HEADING_TURN_RATE_DEG_PER_SEC = 4;
  var HEADING_TURN_TICK_MS = 100; // real-time cadence for both the heading interpolation and its continuous wind/luffing/speed feed -- smoother than the "at least once a second" the spec calls for
  var activeTurn = null; // non-null only while beginCourseTurn's own real-time loop is running -- lets a second call (course changed again mid-turn) retarget the SAME loop in place rather than starting a second, competing one; see this function's own top

  // Reuses the EXACT existing no-go-zone boundary pointOfSailFactor
  // already enforces (angleDiff < 35 => a 0.05 speed factor, i.e. the
  // sails can't draw) -- never a second, independently invented angle.
  // Furled means no canvas up at all, so there's nothing to luff
  // regardless of angle.
  function isInNoGoZone(state, heading) {
    if (state.boat.sailConfig === 'furled') return false;
    return angleDiff(heading, state.weather.windDirection) < 35;
  }

  // Whether the boat is CURRENTLY luffing, per the state machine below
  // -- deliberately its own tracked flag rather than reading the
  // luffing audio element's raw .paused, since that lags behind during
  // stopSailsLuffingLoop's fade-out (a repeat call mid-fade would
  // otherwise see .paused still false and misread it as still luffing).
  // This is the single source of truth shared by every caller.
  var isCurrentlyLuffing = false;

  // The ONE shared no-go-zone audio state machine -- called any time
  // nav.heading may have just changed, for ANY reason (beginCourseTurn's
  // own real-time interval, or an ordinary simTick's autopilot
  // correction/auto-tack/drift/wobble alike, or a coastal leg change).
  // Reuses isInNoGoZone (the existing 35 degree boundary, see above) as
  // the only source of truth for the zone itself -- never a second one.
  // Responds purely to the CURRENT actual heading each time it's
  // called, so it naturally keeps working correctly across a
  // beginCourseTurn retarget (see "RETARGETING MUST ALSO WORK WITH
  // LUFFING") without needing to know anything about targets at all.
  // On exiting the zone: stop the loop, then immediately play sail_fill
  // once -- deliberately never chained to winch here (see
  // beginCourseTurn's own rotation timer for the ONLY place winch ever
  // plays: the moment ACTUAL HEADING reaches the current target, a
  // completely separate trigger from this zone-crossing sequence).
  function updateNoGoZoneAudio(state) {
    if (state.boat.sailConfig === 'furled') {
      if (isCurrentlyLuffing) { isCurrentlyLuffing = false; stopSailsLuffingLoop(); }
      return;
    }
    var nowLuffing = isInNoGoZone(state, state.nav.heading);
    if (nowLuffing && !isCurrentlyLuffing) {
      isCurrentlyLuffing = true;
      startSailsLuffingLoop(state);
    } else if (!nowLuffing && isCurrentlyLuffing) {
      isCurrentlyLuffing = false;
      stopSailsLuffingLoop();
      playSailsOneShot('fill', null, state);
    }
  }

  // The heading the boat should physically turn toward whenever
  // nav.setCourse changes, AUTOPILOT re-engages, or the player TAKEs THE
  // HELM. AUTOPILOT ON: the same current-corrected, auto-tack-aware
  // solution computeHeading() would steer toward on its own (see
  // autopilotSteeringSolution). Otherwise (autopilot off, whether or not
  // the player is at the helm): the player's raw chosen heading,
  // unadjusted — a deliberate manual turn, no auto-tack, since that's an
  // AUTOPILOT-ON feature only.
  function courseSteeringTarget(state) {
    if (!state.boat.autopilotOn || state.boat.steering === 'DAMAGED') {
      return state.nav.setCourse;
    }
    return autopilotSteeringSolution(state, FINAL_DEST);
  }

  // opts: targetHeading, onSettle(state) (optional — e.g. resuming
  // drift from the new heading once the boat actually arrives). This
  // does NOT touch the screen at all — no printing, no redisplay, no
  // uiBusy — see the module notes above. Each caller (CHANGE COURSE,
  // SET FOR NĀWILIWILI, TAKE THE HELM, AUTOPILOT re-engage) is
  // responsible for its own immediate redisplay right after calling
  // this, exactly as it would for any other state change, since the
  // player stays fully interactive throughout — there's no "turn
  // finished, hand control back" moment to wait for.
  function beginCourseTurn(state, opts) {
    var nav = state.nav;

    if (activeTurn) {
      // A turn is already physically underway — this is a NEW course-
      // change action (a different heading picked, or autopilot
      // recalculated), not a duplicate of the same one. Retarget the
      // EXISTING real-time loop in place from wherever the boat is
      // ACTUALLY pointed right now (never a second, competing
      // interpolation) — this is now a routine, fully-expected path
      // (the player can retarget at any moment while turning), not a
      // rare defensive one.
      activeTurn.retarget(opts);
      return;
    }

    if (Math.abs(signedAngleDiff(opts.targetHeading, nav.heading)) < 0.5) {
      // Already on (or confirmed) that heading — nothing to physically
      // turn through.
      nav.heading = normalizeDeg(opts.targetHeading);
      state.boat.speed = computeBoatSpeed(state, nav.heading);
      if (opts.onSettle) opts.onSettle(state);
      return;
    }

    headingTurnActive = true;
    var currentOpts = opts;

    var rotationTimer = setInterval(function () {
      var target = currentOpts.targetHeading;
      var remaining = signedAngleDiff(target, nav.heading);
      var step = HEADING_TURN_RATE_DEG_PER_SEC * (HEADING_TURN_TICK_MS / 1000);
      if (Math.abs(remaining) <= step) {
        nav.heading = normalizeDeg(target);
      } else {
        nav.heading = normalizeDeg(nav.heading + (remaining > 0 ? step : -step));
      }
      // Every intermediate heading feeds straight back into the real
      // speed calculation (wind angle, no-go-zone, sail effectiveness)
      // — the boat is never just visually rotating while the
      // simulation waits for a final value.
      state.boat.speed = computeBoatSpeed(state, nav.heading);

      // If the player is currently looking at the AT THE HELM screen,
      // this updates its live ACTUAL HEADING/SPEED lines in place (see
      // printHelmAtHelmHeader's auto-attach) — harmless no-op
      // otherwise (headerRefs is only ever set while that screen is
      // actually the one on display).
      if (activeTurn.headerRefs) {
        activeTurn.headerRefs.headingEl.textContent = inventoryLine('ACTUAL HEADING', Math.round(nav.heading) + '\u00B0');
        activeTurn.headerRefs.speedEl.textContent = inventoryLine('SPEED', state.boat.speed.toFixed(1) + ' KT');
      }
      updateNavStrip(state); // the persistent DAY/SPEED/HEADING/LOCATION strip stays live too, regardless of which screen is open

      // Luffing/sail_fill driven purely off the actual heading this
      // tick, via the one shared state machine every heading-change
      // path uses — see updateNoGoZoneAudio's own notes, including why
      // this naturally keeps working correctly through a retarget.
      updateNoGoZoneAudio(state);

      if (Math.abs(signedAngleDiff(target, nav.heading)) < 0.05) {
        clearInterval(rotationTimer);
        headingTurnActive = false;
        activeTurn = null;
        if (currentOpts.onSettle) currentOpts.onSettle(state);
        saveGameState(state);
        // The ONLY place winch_short.mp3 ever plays — right here, the exact
        // instant ACTUAL HEADING reaches the CURRENT (latest) target,
        // for both manual and autopilot turns alike, since both run
        // through this same rotation timer. Reading currentOpts.target
        // Heading here (not whatever the original opts.targetHeading
        // was when this turn began) is what naturally makes an
        // abandoned, retargeted-away-from intermediate heading never
        // trigger it — only the target the boat actually settles on
        // does. Fire and forget: never blocks anything, never shows
        // ". .. ...", never chained to sail_fill (a completely separate
        // trigger — see updateNoGoZoneAudio).
        playSailsOneShot('winch', null, state);
      }
    }, HEADING_TURN_TICK_MS);

    activeTurn = {
      headerRefs: null, // set/refreshed by printHelmAtHelmHeader whenever the AT THE HELM screen is actually the one being rendered
      retarget: function (newOpts) {
        currentOpts = newOpts;
      },
    };
  }

  function updateCrew(state) {
    var c = state.crew;
    var hrs = TICK_MINUTES / 60;

    if (c.watchState === 'sleeping') {
      // Rougher seas make for shallower, less restorative sleep, not just
      // a higher chance of being woken (see wakeChanceWhileSleeping).
      // Morale nudges quality too, gently either way — a steady mind
      // rests better, a low one rests worse — and good sleep gives a
      // little morale back, same as a decent meal does.
      var moraleFactor = clamp(0.88 + (c.morale / 100) * 0.24, 0.75, 1.12);
      var quality = clamp((1 - state.weather.seaState / 10) * moraleFactor, 0.3, 1.1);
      c.fatigue = clamp(c.fatigue - hrs * 9 * quality, 0, 100);
      c.morale = clamp(c.morale + hrs * 1.2 * quality, 0, 100);
      c.hoursSinceRest = 0;
    } else {
      var fatigueRate = 1.6;
      if (state.weather.seaState >= 4) fatigueRate += 1.0;
      if (hungerLevel(c.hoursSinceMeal) >= 2) fatigueRate += 0.4;
      if (hungerLevel(c.hoursSinceMeal) >= 3) fatigueRate += 0.6;
      if (thirstLevel(c.hoursSinceWater) >= 3) fatigueRate += 0.8;
      if (c.morale < 30) fatigueRate += 0.3; // a discouraged crew tires faster
      fatigueRate += clothingFatigueRateBonus(state);
      if (c.watchState === 'trying') fatigueRate *= 0.5; // lying down helps a little even without real sleep
      c.fatigue = clamp(c.fatigue + fatigueRate * hrs, 0, 100);
      if (c.watchState !== 'trying') c.hoursSinceRest += hrs;
    }

    c.hoursSinceMeal += hrs;
    // Real heat and hard physical work (rough seas) both raise water
    // needs — modeled as thirst simply arriving faster. Uses the boat's
    // actual current temperature reading rather than a coastal/tropics
    // proxy, since Landfall already tracks that directly.
    var waterRate = 1;
    if (state.weather.temperatureF >= 82) waterRate += 0.5;
    else if (state.weather.temperatureF >= 72) waterRate += 0.2;
    if (state.weather.seaState >= 4) waterRate += 0.3;
    waterRate += clothingThirstRateBonus(state);
    c.hoursSinceWater += hrs * waterRate;

    // CLOTHING — gradual wetness accumulation (past the one-minute
    // above-deck grace period) and the comfort-mismatch clock; see
    // updateClothingExposure for the full model. Entirely separate from
    // the damp-cabin tracking just below, which is about the CABIN
    // itself getting stuffy, not what's worn.
    updateClothingExposure(state, hrs);

    // Below deck in bad weather, damp/condensation builds up in the
    // cabin, tracked as an accumulating total (it's the CUMULATIVE time
    // shut up in bad weather that matters, not any single tick of it).
    var badWeather = state.weather.condition === 'rain' || state.weather.condition === 'squall' || state.weather.seaState >= WET_CLOTHES_SEASTATE;
    if (badWeather && c.location === 'below') {
      c.dampCabinHours += hrs;
      if (c.dampCabinHours >= CABIN_STUFFY_HOURS && c.cabinStuffySinceMinutes == null) {
        c.cabinStuffySinceMinutes = state.meta.voyageMinutes;
      }
    }

    // Morale drifts toward whatever current conditions actually justify
    // (see computeMoraleTarget) rather than sitting still until some
    // explicit event nudges it — this is what makes neglect visible over
    // a normal day even without any single dramatic moment causing it.
    var moraleTarget = computeMoraleTarget(state);
    c.morale = clamp(c.morale + (moraleTarget - c.morale) * MORALE_DRIFT_PER_HOUR * hrs, 0, 100);
  }

  function clampState(state) {
    var b = state.boat, c = state.crew;
    b.battery = clamp(b.battery, 0, 100);
    c.fatigue = clamp(c.fatigue, 0, 100);
    c.morale = clamp(c.morale, 0, 100);
    state.nav.positionConfidence = b.electrical === 'DAMAGED' ? 'uncertain' : 'good';
  }

  function simTick(state) {
    state.meta.voyageMinutes += TICK_MINUTES;

    var prevCondition = state.weather.condition;
    driftWeather(state.weather, state.nav.lat);
    blendTowardRealAnchor(state.weather, TICK_MINUTES / 60);
    maybeRefreshRealWeather(state);
    maybeRefreshOceanCurrent(state);

    // Real dead-reckoning movement: the boat covers ground along its
    // ACTUAL heading (which may differ from the intended leg while
    // coastal auto-tacking, or simply be the player's own manually set
    // open-ocean course, itself already corrected for current — see
    // computeHeading) for real elapsed time. nav.heading stays the
    // through-water heading the whole way — what sails/wind care about
    // — but actual geographic movement and the displayed speed use the
    // vector sum of that motion through the water and whatever current
    // is moving the water itself (combineWithCurrent), the same
    // distinction a real GPS-vs-knotmeter reading would show. Speed is
    // computed once for the tick and that (speed over ground) is the
    // total distance budget spent below.
    //
    // COASTAL (waypointIndex < OPEN_WATER_WAYPOINT_INDEX): steps through
    // WAYPOINTS exactly as before — if the budget is enough to reach the
    // current waypoint, the boat arrives there exactly, spends only that
    // much of the budget, advances, and covers the REST of the budget
    // along the new leg's (possibly freshly tacking) heading, rather
    // than sailing straight past it. Several coastal waypoints are
    // closer together than one tick's travel at speed, so this matters.
    //
    // OPEN OCEAN: once the loop below clears the corridor (or the tick
    // started already clear of it), any remaining budget moves in a
    // straight line along the resulting course over ground — checked
    // against Nāwiliwili (arrival) and against LAND_MASSES (grounding)
    // rather than against any further waypoint.
    //
    // Applies identically whether this tick is live or part of a
    // multi-tick offline catch-up, since both just call simTick.
    var heading = computeHeading(state);
    var speedThroughWater = computeBoatSpeed(state, heading);
    var cog = combineWithCurrent(heading, speedThroughWater, state.weather.oceanCurrent);
    state.boat.speed = cog.speedOverGround;
    state.nav.heading = heading;

    var nmRemaining = cog.speedOverGround * (TICK_MINUTES / 60);

    if (state.nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX) {
      var crossingGuard = 0;
      while (nmRemaining > 0 && state.nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX && crossingGuard < WAYPOINTS.length + 2) {
        crossingGuard++;
        var wp = WAYPOINTS[state.nav.waypointIndex];
        var distToWp = distanceBetween(state.nav.lat, state.nav.lon, wp.lat, wp.lon);
        if (distToWp <= nmRemaining) {
          state.nav.lat = wp.lat;
          state.nav.lon = wp.lon;
          state.nav.distanceTraveled += distToWp;
          if (state.nav.tack) state.nav.tackDistanceNm += distToWp;
          nmRemaining -= distToWp;
          log(state, waypointArrivalLine(wp));
          state.nav.waypointIndex++;
          heading = computeHeading(state); // fresh bearing (and fresh wobble/tack) for the next leg — or, once past OPEN_WATER_WAYPOINT_INDEX, the initial open-ocean course toward Nāwiliwili
          speedThroughWater = computeBoatSpeed(state, heading);
          cog = combineWithCurrent(heading, speedThroughWater, state.weather.oceanCurrent);
          state.nav.heading = heading;
          state.boat.speed = cog.speedOverGround;
        } else {
          var moved = destinationPoint(state.nav.lat, state.nav.lon, cog.courseOverGround, nmRemaining);
          state.nav.lat = moved.lat;
          state.nav.lon = moved.lon;
          state.nav.distanceTraveled += nmRemaining;
          if (state.nav.tack) state.nav.tackDistanceNm += nmRemaining;
          nmRemaining = 0;
        }
      }
    }

    if (nmRemaining > 0) {
      // OPEN OCEAN: free-heading movement (possibly tacking — heading
      // here is whatever resolveAutoTack chose, not necessarily
      // setCourse directly, and the actual track (cog.courseOverGround)
      // can differ further still once current is added). distanceTraveled
      // still tracks actual nm sailed even though nothing is being
      // "arrived at" along the way — only Nāwiliwili itself, and land,
      // matter now.
      var distToFinal = distanceBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
      if (distToFinal <= nmRemaining) {
        state.nav.lat = FINAL_DEST.lat;
        state.nav.lon = FINAL_DEST.lon;
        state.nav.distanceTraveled += distToFinal;
        if (!state.flags.arrivedAtDestination) {
          state.flags.arrivedAtDestination = true;
          log(state, waypointArrivalLine(FINAL_DEST));
        }
      } else {
        var projected = destinationPoint(state.nav.lat, state.nav.lon, cog.courseOverGround, nmRemaining);
        if (!applyGroundingIfNeeded(state, projected.lat, projected.lon)) {
          state.nav.lat = projected.lat;
          state.nav.lon = projected.lon;
          state.nav.distanceTraveled += nmRemaining;
          if (state.nav.tack) state.nav.tackDistanceNm += nmRemaining;
        }
      }
    }

    // Drives the luffing/sail_fill sequence off the heading this tick
    // actually settled on, regardless of WHY it moved (autopilot
    // correction, auto-tack, drift/wobble, coastal leg change) -- see
    // updateNoGoZoneAudio's own notes. Skipped while a real-time turn
    // (beginCourseTurn) is actively managing this itself, to avoid the
    // two fighting over the same loop/one-shot.
    if (!activeTurn) updateNoGoZoneAudio(state);

    checkLandProximity(state);

    updateCrew(state);
    checkFuel(state);
    updateBattery(state);
    checkAftLocker(state);
    checkScheduledFailures(state);
    checkStormRisk(state);
    checkRescue(state);
    checkWeatherNarration(state, prevCondition);
    checkFatigueNarration(state);
    checkThirstNarration(state);
    checkHungerNarration(state);
    checkCleanlinessNarration(state);
    checkGalleyNarration(state);
    checkClothingNarration(state);
    checkSpoilage(state);
    checkMilestones(state);
    checkAmbientEvent(state);
    processSleepTick(state, prevCondition);

    clampState(state);
  }

  // The continuous, sub-tick-precision game clock. voyageMinutes only
  // advances in whole TICK_MINUTES steps, inside simTick — so anything
  // that needs to react smoothly between ticks (reading progress, cabin
  // temperature) reads this instead. leftoverMinutes is the fractional
  // remainder advanceSimulation hasn't yet folded into a full tick, kept
  // current on every call (live, every LIVE_TICK_SECONDS, or offline
  // catch-up) regardless of whether that call actually ran a tick — so
  // together the two always equal the true elapsed game time.
  function currentGameMinutes(state) {
    return state.meta.voyageMinutes + (state.meta.leftoverMinutes || 0);
  }

  function advanceSimulation(state, minutes) {
    var remaining = minutes + (state.meta.leftoverMinutes || 0);
    var ticks = 0;
    state._ambientEventsThisPass = 0; // capped inside checkAmbientEvent — never dumps a backlog after a long absence
    while (remaining >= TICK_MINUTES && ticks < MAX_CATCHUP_TICKS) {
      simTick(state);
      remaining -= TICK_MINUTES;
      ticks++;
    }
    delete state._ambientEventsThisPass; // transient — never persisted
    state.meta.leftoverMinutes = remaining;
    // Continuous (non-tick) systems: each keeps its own last-synced
    // timestamp and folds in whatever elapsed since, in one shot,
    // regardless of how many (if any) full ticks just ran above — see
    // syncReadingProgress and syncCabinTemperature. This is their ONLY
    // update site; neither is also driven by simTick, so elapsed time
    // is never double-counted between the two.
    syncReadingProgress(state);
    syncCabinTemperature(state);
    return ticks;
  }

  function catchUpFromRealTime(state) {
    var now = Date.now();
    var elapsedMinutes = (now - state.meta.lastTick) / 60000;
    if (elapsedMinutes < 1) { state.meta.lastTick = now; return 0; }
    var ticks = advanceSimulation(state, elapsedMinutes);
    state.meta.lastTick = now;
    return ticks;
  }

  /* ============================================================
     5. NARRATIVE / EVENT CHECKS
     ============================================================ */
  function log(state, text) {
    var ts = state.meta.departedAt + state.meta.voyageMinutes * 60000;
    state.log.push({ t: ts, text: text });
  }

  function checkFuel(state) {
    var b = state.boat;
    if (!b.engineOn) {
      b.engineRunningMinutes = 0; // stopped -- continuous-runtime failure pressure clears, see engineRuntimeWeightBonus
      return;
    }
    var hrs = TICK_MINUTES / 60;
    b.fuelGallons = clamp(b.fuelGallons - hrs * DIESEL_BURN_RATE_GPH, 0, 999);
    b.engineRunningMinutes = (b.engineRunningMinutes || 0) + TICK_MINUTES;
    if (b.fuelGallons <= 0) {
      b.engineOn = false;
      stopAllEngineLoops();
      log(state, "The engine coughs and dies. Fuel's gone.");
    }
  }

  // Battery charge — per-tick, driven by simulated elapsed time so it
  // works identically in live play, offline catch-up, and long
  // absences. Entirely separate from checkScheduledFailures'
  // boat.electrical (physical condition). Cabin temperature used to be
  // computed here too; it's now its own continuous system — see
  // syncCabinTemperature.
  function updateBattery(state) {
    var b = state.boat;
    var hrs = TICK_MINUTES / 60;

    // Charging takes priority: while the engine runs, it's actively
    // pushing power in regardless of what's also drawing from it — a
    // real alternator's output dwarfs any of these small loads (solar
    // included, so it's not worth adding here too — see the module
    // notes on SOLAR_RATE_BY_CONDITION). 0% to 100% in one hour of
    // engine runtime, whether motoring, motor-sailing, or sails furled —
    // anything with the engine on.
    if (b.engineOn) {
      b.battery = clamp(b.battery + hrs * BATTERY_CHARGE_PER_HOUR, 0, 100);
    } else {
      var drain = 0;
      if (b.autopilotOn) drain += BATTERY_DRAIN_AUTOPILOT_PER_HOUR;
      if (b.heaterOn) drain += BATTERY_DRAIN_HEATER_PER_HOUR;
      if (b.fanOn) drain += BATTERY_DRAIN_FAN_PER_HOUR;
      if (b.cabinLightsOn) drain += BATTERY_DRAIN_LIGHTS_PER_HOUR;
      // ACCESSORY HOOK -- the circuit itself draws nothing just being
      // switched on; only an actually-playing cassette (activeTapeTitle
      // set) draws anything at all, and only for as long as it's
      // actually playing — see performStartTape/performStopTape.
      if (b.accessoryOn && activeTapeTitle != null) drain += BATTERY_DRAIN_CASSETTE_PER_HOUR;
      // Solar simply offsets the draw, never pauses it or replaces it --
      // a sunny day with autopilot alone nets a slow drain, not a gain.
      var solar = solarChargeRate(state);
      b.battery = clamp(b.battery + hrs * (solar - drain), 0, 100);
    }

    // Battery failure forces every load off, once, right when it
    // happens — never auto-restored afterward. The player has to
    // manually switch things back on once power returns. ACCESSORY is
    // deliberately NOT in this list — the circuit itself draws nothing,
    // so there's nothing for a dead battery to trip; it's fine left
    // however the player set it. A cassette actually playing right now,
    // though, genuinely can't keep going with no power to run it.
    if (b.battery <= 0) {
      var hadSomethingOn = b.autopilotOn || b.fanOn || b.heaterOn || b.cabinLightsOn;
      b.autopilotOn = false;
      b.fanOn = false;
      b.heaterOn = false;
      b.cabinLightsOn = false;
      if (hadSomethingOn) {
        log(state, 'Battery dead. Everything electrical drops out.');
      }
      if (activeTapeTitle != null) {
        stopCurrentTapeTrackImmediately();
        playTapeOffSound();
      }
    }
  }

  // Cabin temperature — a CONTINUOUS system (unlike battery above): it
  // reacts to actual elapsed game time via its own cabinTemperatureLastSyncedAt
  // timestamp rather than a fixed TICK_MINUTES step, so it doesn't wait
  // for a full simTick to catch up. Called once per advanceSimulation —
  // never also from simTick — so elapsed time is never double-counted.
  // KEPT as its own system even now that TICK_MINUTES=1 (rather than
  // folded back into a plain per-tick update inside simTick): it never
  // reads TICK_MINUTES itself, only currentGameMinutes(), so it's
  // already resolution-independent, and it still earns its keep for
  // sub-minute precision (a value read mid-minute, before that minute's
  // tick has run, is still exactly correct) and for never needing a
  // full tick before reacting to a heater/fan toggle.
  // Follows a simple target-and-catch-up model. The TARGET is the
  // warmer of outside ambient or (only if the heater is on and colder
  // than that) the heater's fixed 68°F ceiling — the heater never
  // pushes the cabin above 68°F, and adds no heat at all once ambient
  // is already warmer than that (ambient simply wins). The actual
  // temperature then moves toward that target at a flat 1°F per
  // in-game minute, warming or cooling alike, never overshooting past
  // it — so a sudden swing in outside temperature or a heater toggle is
  // still felt gradually, not snapped instantly. The fan has NO effect
  // on this physical number at all; it only affects the player-facing
  // HOT/COMFORTABLE read — see cabinConditionLabel.
  function syncCabinTemperature(state) {
    var b = state.boat;
    var now = currentGameMinutes(state);
    if (b.cabinTemperatureLastSyncedAt == null) b.cabinTemperatureLastSyncedAt = now;
    var elapsed = now - b.cabinTemperatureLastSyncedAt;
    b.cabinTemperatureLastSyncedAt = now;
    if (elapsed <= 0) return; // nothing to add (also guards a clock that hasn't moved, or moved backward)

    var outside = state.weather.temperatureF;
    if (b.cabinTemperatureF == null) b.cabinTemperatureF = outside;
    var cabinTarget = outside > CABIN_HEATER_TARGET_F ? outside : (b.heaterOn ? CABIN_HEATER_TARGET_F : outside);
    var maxCabinChange = CABIN_TEMP_CHANGE_PER_MINUTE_F * elapsed;
    if (b.cabinTemperatureF < cabinTarget) {
      b.cabinTemperatureF = Math.min(cabinTarget, b.cabinTemperatureF + maxCabinChange);
    } else if (b.cabinTemperatureF > cabinTarget) {
      b.cabinTemperatureF = Math.max(cabinTarget, b.cabinTemperatureF - maxCabinChange);
    }
  }

  function checkAftLocker(state) {
    var f = state.flags;
    if (!f.aftLockerTriggered && state.meta.voyageMinutes >= f.aftLockerTriggerAt) {
      f.aftLockerTriggered = true;
      log(state, "Something in the aft locker has come loose. A dull, irregular thud with every roll.");
      state.pendingChoice = {
        id: 'aft-locker',
        options: [
          { label: 'INSPECT NOW', action: 'resolve-aft-locker-now' },
          { label: 'SECURE IT LATER', action: 'defer-aft-locker' },
        ],
      };
      return;
    }
    if (f.aftLockerTriggered && !f.aftLockerResolved && f.aftLockerDeferredAt !== null && !f.aftLockerEscalated) {
      var hoursSinceDeferred = (state.meta.voyageMinutes - f.aftLockerDeferredAt) / 60;
      if (hoursSinceDeferred > 5) {
        f.aftLockerEscalated = true;
        state.crew.morale = clamp(state.crew.morale - 4, 0, 100);
        if (state.boat.steering === 'GOOD') {
          state.boat.steering = 'DAMAGED';
          log(state, "The thud from aft has worked something loose against the steering gear. Should have looked sooner.");
        } else {
          log(state, "The thud from aft has worked something loose. Should have looked sooner.");
        }
      }
    }
  }

  /* --------------------------------------------------------------
     BOAT SYSTEM FAILURES

     Four tracked systems — SAILS, STEERING, ENGINE, ELECTRICAL — each
     simply GOOD or DAMAGED, no gradual wear. Two independent sources of
     damage now feed them:

     - The NORMAL/scheduled failure below (48-96h apart on average,
       centered on 72h) — ordinary offshore mechanical trouble, weighted
       heavily toward ENGINE/ELECTRICAL (usage-driven) with SAILS/
       STEERING kept to a low baseline share, since their real risk
       lives in the weather-driven system instead (see checkStormRisk
       further down). Occasionally schedules a short, much less
       aggressive follow-up ("chain") instead of the normal interval.
       Never repicks a system still within its post-repair protection
       window — see performSystemRepairAttempt.
     - checkStormRisk — continuous, condition-driven exposure checks for
       SAILS and STEERING specifically, entirely separate from the timer
       below and NOT subject to the repair protection window (bad
       enough conditions can still tear a just-patched sail).

     Runs from checkScheduledFailures every tick, so it works
     identically in live play, offline catch-up, and long absences.
     -------------------------------------------------------------- */
  var FAILURE_INTERVAL_MIN_HOURS = 48;
  var FAILURE_INTERVAL_MAX_HOURS = 96;   // centered ~72h
  var FAILURE_CHAIN_CHANCE = 0.15;       // ~15% chance of a shortened follow-up after ANY failure
  var FAILURE_CHAIN_MIN_HOURS = 12;
  var FAILURE_CHAIN_MAX_HOURS = 36;
  var BOAT_FAIL_SYSTEMS = ['sails', 'steering', 'engine', 'electrical'];
  // A successful repair shields that one system from the NORMAL draw
  // for roughly this many hours — see performSystemRepairAttempt.
  var REPAIR_PROTECTION_MIN_HOURS = 96;
  var REPAIR_PROTECTION_MAX_HOURS = 120;

  function scheduleNextFailure(state, chained) {
    var hrs = chained
      ? rand(FAILURE_CHAIN_MIN_HOURS, FAILURE_CHAIN_MAX_HOURS)
      : rand(FAILURE_INTERVAL_MIN_HOURS, FAILURE_INTERVAL_MAX_HOURS);
    // Bad weather modestly shortens a chain interval specifically — the
    // normal cadence is left alone by conditions entirely.
    if (chained && (state.weather.seaState >= 4 || state.weather.condition === 'squall')) {
      hrs *= 0.8;
    }
    state.boat.nextFailureAt = state.meta.voyageMinutes + hrs * 60;
  }

  // Baseline share of the NORMAL failure draw per system — ENGINE/
  // ELECTRICAL carry ordinary mechanical risk on their own; SAILS/
  // STEERING sit low here on purpose, since their real exposure comes
  // from checkStormRisk instead.
  var BASE_FAILURE_WEIGHT = { sails: 0.4, steering: 0.4, engine: 1.5, electrical: 1.5 };

  // Rough guideline, not a hard cutoff — 0-4h continuous runtime barely
  // moves the odds, climbing through 4-8h/8-12h, meaningfully elevated
  // beyond 12h. Resets whenever the engine actually stops (see checkFuel).
  function engineRuntimeWeightBonus(minutes) {
    var hrs = (minutes || 0) / 60;
    if (hrs < 4) return 0;
    if (hrs < 8) return 0.4;
    if (hrs < 12) return 1.0;
    return 2.0;
  }

  // Weighting is a soft nudge, not a rule. Deliberately computed across
  // all four systems regardless of current GOOD/DAMAGED/protected state
  // — the draw below only lets an eligible system actually fail, so an
  // ineligible one's share of the odds is simply wasted (no failure this
  // cycle) rather than being redistributed onto whichever systems remain
  // eligible. Without this, ENGINE/ELECTRICAL running out of their own
  // spares (very possible with a high draw weight and only a few spares
  // each) would otherwise inflate SAILS/STEERING's effective share for
  // the rest of the voyage — exactly what BASE_FAILURE_WEIGHT is trying
  // to keep low.
  function pickFailureSystem(state) {
    var b = state.boat, w = state.weather;
    var weights = {};
    BOAT_FAIL_SYSTEMS.forEach(function (k) { weights[k] = BASE_FAILURE_WEIGHT[k]; });
    if (b.engineOn) weights.engine += 1.5;
    weights.engine += engineRuntimeWeightBonus(b.engineRunningMinutes);
    var loadCount = (b.autopilotOn ? 1 : 0) + (b.heaterOn ? 1 : 0) + (b.fanOn ? 1 : 0) + (b.cabinLightsOn ? 1 : 0);
    if (loadCount >= 2) weights.electrical += 1;
    if (loadCount >= 3) weights.electrical += 0.5;
    // Rough OR wet weather, not just heavy seas — a damp panel is its
    // own modest risk.
    if (w.seaState >= 4 || w.condition === 'rain' || w.condition === 'squall') weights.electrical += 0.5;

    var total = BOAT_FAIL_SYSTEMS.reduce(function (sum, k) { return sum + weights[k]; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < BOAT_FAIL_SYSTEMS.length; i++) {
      var k = BOAT_FAIL_SYSTEMS[i];
      r -= weights[k];
      if (r <= 0) {
        var shieldedUntil = b.repairProtectedUntil ? b.repairProtectedUntil[k] : 0;
        var eligible = b[k] === 'GOOD' && !(shieldedUntil && state.meta.voyageMinutes < shieldedUntil);
        return eligible ? k : null;
      }
    }
    return null;
  }

  var FAILURE_NARRATIVES = {
    sails: [
      'A sharp crack overhead. The sail has torn along a seam.',
      'Something lets go in the rig. The sail collapses loose.',
    ],
    steering: [
      'The helm suddenly goes loose in your hands.',
      'The wheel turns, but the rudder does not answer.',
    ],
    engine: [
      'The engine coughs hard and dies.',
      'A warning smell from below. The engine temperature is climbing fast.',
    ],
    electrical: [
      'A fuse blows somewhere behind the panel. The cabin goes dark.',
    ],
  };

  function triggerFailure(state, systemKey) {
    var b = state.boat;
    b[systemKey] = 'DAMAGED';
    if (systemKey === 'engine' && b.engineOn) {
      b.engineOn = false; // shut down immediately if it was running
      stopAllEngineLoops();
    }
    if (systemKey === 'steering') {
      // The helm itself is gone -- can't still be manually steering it.
      // Autopilot is deliberately left alone here (its own ON/OFF flag
      // stays whatever it was): computeHeading already treats damaged
      // steering as unattended drift regardless of that flag, and
      // restoring steering should resume whichever mode the flag says,
      // exactly like it always has.
      state.crew.atHelm = false;
    }
    if (systemKey === 'electrical') {
      // A fuse problem, not a dead battery — battery charge itself is
      // untouched. But every load it feeds drops out right away, same
      // shape as a dead battery, and stays off until the player
      // manually switches it back on (see performElectricalToggle) —
      // repair only restores ACCESS, never flips anything back on itself.
      b.autopilotOn = false;
      b.fanOn = false;
      b.heaterOn = false;
      b.cabinLightsOn = false;
    }
    log(state, pickFromPool(FAILURE_NARRATIVES[systemKey]));
    flushNewLogEntries(state);
  }

  function checkScheduledFailures(state) {
    var b = state.boat;
    if (state.crew.inLifeRaft) return; // no boat systems left to fail
    if (state.meta.voyageMinutes < b.nextFailureAt) return;
    var sys = pickFailureSystem(state);
    if (!sys) {
      // Either everything's already DAMAGED/protected, or the draw simply
      // landed on a system that currently isn't eligible (see
      // pickFailureSystem) — either way, nothing happens this cycle. Push
      // the schedule out so this doesn't re-check every single tick.
      scheduleNextFailure(state, false);
      return;
    }
    triggerFailure(state, sys);
    scheduleNextFailure(state, Math.random() < FAILURE_CHAIN_CHANCE);
  }

  /* --------------------------------------------------------------
     STORM-DRIVEN RISK — SAILS and STEERING

     Entirely separate from the scheduled failure above: continuous,
     per-tick exposure checks driven by current conditions and how the
     boat is actually being sailed, rather than a fixed timer. This is
     deliberately where the real weather risk for these two systems
     lives (see BASE_FAILURE_WEIGHT's low baseline for both) — sustained
     bad decisions accumulate risk tick by tick rather than one big
     single roll, and a few minutes of bad luck can't tear a sail on
     their own. Ignores the post-repair protection window on purpose —
     see performSystemRepairAttempt.
     -------------------------------------------------------------- */

  // Shared by both the storm-sail check and the FORECAST guidance below,
  // so the two always agree about what counts as risky.
  function sailRiskTier(w) {
    if (w.condition === 'squall' || w.windSpeed > 32) return 'severe';
    if (w.windSpeed > 22) return 'strong';
    return 'ordinary';
  }

  // Chance PER 10 MINUTES of exposure at a given tier, before the sail
  // configuration factor below — run through tickProbability() so it
  // compounds correctly regardless of TICK_MINUTES. 'ordinary' is 0: full
  // sail in unremarkable conditions carries no storm-driven risk at all.
  // Calibrated against how driftWeather's own random walk actually
  // behaves absent a real-weather anchor (no mean reversion, clamped at
  // the edges) — it spends a large minority of all time in what
  // sailRiskTier calls 'severe', in streaks of several continuous days,
  // not the occasional squall these numbers might otherwise suggest. A
  // careful player reducing sail through that has to stay safe across
  // real cumulative WEEKS of exposure over a full crossing, not hours.
  var SAIL_STORM_P10_BY_TIER = { ordinary: 0, strong: 0.0005, severe: 0.0015 };
  // How much carrying less canvas cuts that risk — FURLED is 0: no
  // canvas up, nothing for the wind to tear.
  var SAIL_STORM_CONFIG_FACTOR = { full: 1, reefed: 0.35, minimal: 0.08, furled: 0 };

  function checkStormSailRisk(state) {
    var b = state.boat, w = state.weather;
    if (state.crew.inLifeRaft) return;
    if (b.sails !== 'GOOD') return;
    var configFactor = SAIL_STORM_CONFIG_FACTOR[b.sailConfig];
    if (!configFactor) return; // furled, or an unrecognized config -- no exposure
    var p10 = SAIL_STORM_P10_BY_TIER[sailRiskTier(w)] * configFactor;
    if (p10 <= 0) return;
    if (Math.random() < tickProbability(p10)) {
      triggerFailure(state, 'sails');
    }
  }

  // Chance per 10 minutes at ROUGH (4) vs VERY ROUGH/HIGH (5-6), before
  // the speed/sail/autopilot multipliers below. Calmer than that: no
  // storm-driven steering risk at all. Same calibration note as the sail
  // table above — rough seas are common and long-lasting under the
  // random-walk weather fallback, so these are tuned for sustained,
  // multi-day exposure rather than a brief squall.
  var STEERING_STORM_P10_BY_SEASTATE = { 4: 0.00035, 5: 0.00085, 6: 0.00085 };

  function checkStormSteeringRisk(state) {
    var b = state.boat, w = state.weather;
    if (state.crew.inLifeRaft) return;
    if (b.steering !== 'GOOD') return;
    var base = STEERING_STORM_P10_BY_SEASTATE[w.seaState];
    if (!base) return;
    // How hard the boat is being pushed, combined: real speed through a
    // rough seaway, how much sail is up to drive that speed, and whether
    // the autopilot is fighting the helm the whole time rather than a
    // human easing off. Each factor compounds on the others, matching
    // "several conditions combine" — reducing sail, slowing down, or
    // disengaging the autopilot each meaningfully cuts the total.
    var speedFactor = b.speed >= 7.5 ? 1.8 : (b.speed >= 6 ? 1.4 : 1);
    var sailFactor = b.sailConfig === 'full' ? 1.3 : (b.sailConfig === 'reefed' ? 1.0 : 0.6);
    var autopilotFactor = b.autopilotOn ? 1.3 : 1;
    var p10 = base * speedFactor * sailFactor * autopilotFactor;
    if (Math.random() < tickProbability(p10)) {
      triggerFailure(state, 'steering');
    }
  }

  function checkStormRisk(state) {
    checkStormSailRisk(state);
    checkStormSteeringRisk(state);
  }

  /* --------------------------------------------------------------
     RESCUE

     EPIRB -> real-time travel to the search area -> a SEARCH phase
     made of discrete, widely-spaced "encounters" (an aircraft or
     vessel actually searching nearby) each open for a real multi-hour
     window — long enough that checking Landfall a couple of times a
     day is enough to catch one and fire a flare. Missing a window
     never fails the rescue; it just means the next encounter, a few
     hours later, resolves without the flare's help. This is real
     time throughout: nothing here is a caller of advanceSimulation(),
     it only ever reads state.meta.voyageMinutes and reschedules a
     future timestamp for simTick to notice on some later real tick.
     -------------------------------------------------------------- */
  var RESCUE_ENCOUNTER_WINDOW_MINUTES = 180; // how long an encounter stays open for a flare response
  var RESCUE_ENCOUNTER_MIN_GAP = 180;        // 3-8 real hours between search encounters
  var RESCUE_ENCOUNTER_MAX_GAP = 480;

  function estimateRescueTravelMinutes(state) {
    var phase = voyagePhase(state);
    var baseHours = { inland: 1, strait: 2, coastal: 4, offshore: 20, tropics: 16, approach: 7 }[phase];
    if (baseHours == null) baseHours = 14;
    var weatherFactor = (state.weather.seaState >= 5) ? 1.4 : 1.0;
    return Math.round(baseHours * weatherFactor * 60);
  }

  function rescueEncounterChance(state) {
    var r = state.rescue;
    var chance = 0.4; // aboard the boat, reasonable visibility, baseline
    if (state.crew.inLifeRaft) chance -= 0.15; // a much smaller target
    var tod = timeOfDayPhase(state);
    if (tod === 'night') chance -= 0.15;
    if (state.weather.condition === 'squall' || state.weather.seaState >= 5) chance -= 0.1;
    if (r.encounterFlareFired) {
      var boost = 0.4;
      if (state.crew.inLifeRaft) boost += 0.1;  // exactly where a flare matters most
      if (tod === 'night') boost += 0.1;
      chance += boost;
    }
    return clamp(chance, 0.1, 0.95);
  }

  function beginRescueEncounter(state) {
    var r = state.rescue;
    r.encounterActive = true;
    r.encounterStartedAt = state.meta.voyageMinutes;
    r.encounterFlareFired = false;
    r.encounterKind = Math.random() < 0.5 ? 'aircraft' : 'vessel';
    log(state, r.encounterKind === 'aircraft'
      ? 'You hear an aircraft. It circles somewhere in the distance.'
      : 'A vessel is visible, working a search pattern.');
    log(state, 'Rescuers are searching the area.');
    flushNewLogEntries(state);
  }

  function resolveRescueEncounter(state) {
    var r = state.rescue;
    var success = Math.random() < rescueEncounterChance(state);
    r.encounterActive = false;
    if (success) {
      r.phase = 'rescued';
      log(state, r.encounterKind === 'aircraft'
        ? 'The aircraft circles once more. This time it stays.'
        : 'The vessel alters course toward you. It keeps coming.');
      log(state, 'RESCUED');
      flushNewLogEntries(state);
    } else {
      log(state, r.encounterKind === 'aircraft'
        ? "The aircraft's gone quiet. It could come back."
        : 'The vessel moves off, still searching elsewhere.');
      flushNewLogEntries(state);
      r.nextSearchEventAt = state.meta.voyageMinutes + rand(RESCUE_ENCOUNTER_MIN_GAP, RESCUE_ENCOUNTER_MAX_GAP);
    }
  }

  function checkRescue(state) {
    var r = state.rescue;
    if (!r.epirbOn || r.phase === 'rescued') return;

    if (r.phase === 'traveling') {
      if (state.meta.voyageMinutes >= r.activatedAt + r.travelMinutes) {
        r.phase = 'searching';
        log(state, "You're in the search area now.");
        flushNewLogEntries(state);
        r.nextSearchEventAt = state.meta.voyageMinutes + rand(RESCUE_ENCOUNTER_MIN_GAP, RESCUE_ENCOUNTER_MAX_GAP);
      }
      return;
    }
