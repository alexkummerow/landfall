  // Small, quiet morale nudges for the four new routine activities. Full
  // value if it's genuinely been a while; doing the same thing again
  // soon after helps much less — these are small comforts, not a lever
  // to pull repeatedly for morale. crew.lastRoutineAt tracks each one
  // independently (not persisted anywhere the player can see).
  function routineMoraleGain(state, key, fullGain) {
    var last = state.crew.lastRoutineAt[key];
    var hoursSince = last == null ? 999 : (state.meta.voyageMinutes - last) / 60;
    state.crew.lastRoutineAt[key] = state.meta.voyageMinutes;
    if (hoursSince >= 6) return fullGain;
    if (hoursSince >= 2) return Math.round(fullGain * 0.4);
    return Math.max(1, Math.round(fullGain * 0.15));
  }

  function cmdWash(state) {
    runShortAction(state, {
      label: 'WASHING UP',
      duration: 3,
      action: function (s) {
        var hadFreshWater = s.water.primary > 0;
        if (hadFreshWater) s.water.primary = clamp(s.water.primary - 0.15, 0, 999);
        var gain = routineMoraleGain(s, 'wash', 4);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        log(s, hadFreshWater
          ? 'A wash-up with fresh water. Small thing, helps anyway.'
          : "A rinse with what's at hand \u2014 not the same, but it helps.");
        flushNewLogEntries(s);
      },
    });
  }

  function cmdDress(state) {
    runShortAction(state, {
      label: 'CHANGING',
      duration: 2,
      action: function (s) {
        var gain = routineMoraleGain(s, 'dress', 3);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        log(s, 'Dry layers on. Feels like a fresh start to the watch.');
        flushNewLogEntries(s);
      },
    });
  }

  function cmdDishes(state) {
    runShortAction(state, {
      label: 'CLEANING UP',
      duration: 3,
      action: function (s) {
        var gain = routineMoraleGain(s, 'dishes', 3);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        log(s, 'Galley squared away. One less thing underfoot.');
        flushNewLogEntries(s);
      },
    });
  }

  function cmdRead(state) {
    runShortAction(state, {
      label: 'READING',
      duration: 4,
      action: function (s) {
        var gain = routineMoraleGain(s, 'read', 5);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        s.crew.fatigue = clamp(s.crew.fatigue - 2, 0, 100);
        log(s, 'A while lost in a book. The cabin feels smaller and calmer for it.');
        flushNewLogEntries(s);
      },
    });

  function foodItemLine(item, servings) {
    var dots = '.'.repeat(Math.max(2, 22 - item.name.length));
    return item.name + ' ' + dots + ' ' + servings + ' servings';
  }

  function buildEatOptions(state) {
    var opts = FOOD_ITEMS.filter(function (f) { return state.food[f.key] > 0; })
      .map(function (f) { return { label: f.name.toUpperCase() + ' (' + state.food[f.key] + ')', action: 'eat:' + f.key }; });
    if (state.food.coffee > 0) opts.push({ label: 'COFFEE (' + state.food.coffee + ')', action: 'eat:coffee' });
    opts.push({ label: 'NEVER MIND', action: 'cancel' });
    return opts;
  }

  function cmdEat(state) {
    printBlank();
    printLine('PROVISIONS', 'heading-label');
    var any = FOOD_ITEMS.some(function (f) { return state.food[f.key] > 0; }) || state.food.coffee > 0;
    if (!any) {
      printLine('Nothing left aboard to eat.', 'amber');
      return;
    }
    FOOD_ITEMS.forEach(function (f) {
      if (state.food[f.key] > 0) printLine(foodItemLine(f, state.food[f.key]));
    });
    if (state.food.coffee > 0) printLine(foodItemLine({ name: 'Coffee' }, state.food.coffee));
    state.pendingChoice = { id: 'eat-choice', options: buildEatOptions(state) };
  }

  function eatFlavorLine(state, item) {
    var rough = state.weather.seaState >= 4;
    var verb = item.cooked ? 'You make' : 'You eat';
    var where = rough ? 'below, braced against the motion' : (item.cooked ? 'in the galley' : 'in the cockpit');
    return verb + ' ' + item.name.toLowerCase() + ' ' + where + '.';
  }

  function performEat(state, key) {
    if (key === 'coffee') {
      performCoffee(state);
      return;
    }
    var item = FOOD_ITEMS_BY_KEY[key];
    if (!item || state.food[key] <= 0) {
      printBlank();
      printLine("That's already gone.", 'dim');
      return;
    }
    if (item.cooked) {
      if (state.weather.seaState >= 5) {
        printBlank();
        printLine('THE BOAT IS MOVING TOO VIOLENTLY', 'amber');
        printLine('TO COOK SAFELY.', 'amber');
        state.pendingChoice = { id: 'eat-choice', options: buildEatOptions(state) };
        return;
      }
      if (state.supplies.propane <= 0) {
        printBlank();
        printLine('Out of propane. Nothing left to cook with.', 'amber');
        state.pendingChoice = { id: 'eat-choice', options: buildEatOptions(state) };
        return;
      }
    }
    // Gates passed (or there weren't any) — the actual preparing/eating
    // takes a few real seconds. Cooking takes longer than grabbing
    // something ready to eat.
    var label = (item.cooked ? 'MAKING ' : 'PREPARING ') + item.name.toUpperCase();
    runShortAction(state, {
      label: label,
      duration: item.cooked ? 5 : 2,
      action: function (s) {
        if (item.cooked) {
          s.supplies.propane = clamp(s.supplies.propane - 1, 0, 999);
          s.water.primary = clamp(s.water.primary - 0.2, 0, 999);
        }
        s.food[key] -= 1;
        s.crew.hoursSinceMeal = 0;
        var fatigueGain = item.heavy ? 6 : 3;
        var moraleGain = item.comfort ? 6 : (item.heavy ? 3 : 1);
        s.crew.fatigue = clamp(s.crew.fatigue - fatigueGain, 0, 100);
        s.crew.morale = clamp(s.crew.morale + moraleGain, 0, 100);
        log(s, eatFlavorLine(s, item));
        flushNewLogEntries(s);
      },
    });
  }

  function performCoffee(state) {
    if (state.food.coffee <= 0) {
      printBlank();
      printLine('No coffee left.', 'amber');
      return;
    }
    runShortAction(state, {
      label: 'MAKING COFFEE',
      duration: 3,
      action: function (s) {
        s.food.coffee -= 1;
        s.water.primary = clamp(s.water.primary - 0.1, 0, 999);
        s.crew.lastCoffeeAt = s.meta.voyageMinutes;
        s.crew.coffeeCount = (s.crew.coffeeCount || 0) + 1;
        log(s, 'Coffee, strong and hot. The world sharpens a little.');
        flushNewLogEntries(s);

    });

    if (state.water.emergency > 0) {

  function performDrinkFrom(state, tank) {
    if (state.water[tank] <= 0) {

    runShortAction(state, {

        s.crew.hoursSinceWater = 0;

        s.crew.morale = clamp(s.crew.morale + 1, 0, 100);

  function pickObservation(state) {
    var phase = voyagePhase(state);
    var pool = OBSERVATIONS[phase] || OBSERVATIONS.offshore;
    var tod = timeOfDayPhase(state);
    var special = [];
    if (tod === 'night' && pool.awe_night) special = special.concat(pool.awe_night);
    if (tod !== 'night' && pool.awe_day) special = special.concat(pool.awe_day);
    if (tod === 'dawn' && pool.sunrise) special = special.concat(pool.sunrise);
    if (tod === 'dusk' && pool.sunset) special = special.concat(pool.sunset);
    if (pool.awe) special = special.concat(pool.awe);
    var recent = state.flags.recentAmbientTexts || [];
    if (special.length && Math.random() < 0.18) {
      return pickFromPoolAvoidingRecent(special, recent);
    }
    var quiet = pool.quiet || [];
    if (!quiet.length) return 'The sea, the sky, the boat. Nothing more to report.';
    return pickFromPoolAvoidingRecent(quiet, recent);
  }


  function attemptLeakRepair(state) {
    var c = state.crew, spares = state.supplies.spares;
    var hasSealant = spares.sealant > 0;
    var hasHoseKit = spares.hose > 0 && spares.hoseClamps > 0;
    var hasMaterial = hasSealant || hasHoseKit;
    var penalty = 0;
    if (hungerLevel(c.hoursSinceMeal) >= 3) penalty += 0.12;
    if (thirstLevel(c.hoursSinceWater) >= 3) penalty += 0.15;
    if (state.weather.seaState >= 4) penalty += 0.15; // hard to work a repair in a seaway
    if (!hasMaterial) penalty += 0.25; // improvising without the right materials
    if (c.morale < 40) penalty += 0.06; // rattled, more likely to fumble it
    var successChance = clamp(0.75 - c.fatigue / 200 - penalty, 0.15, 0.85);
    var success = Math.random() < successChance;
    c.fatigue = clamp(c.fatigue + 6, 0, 100);
    if (success) {
      if (hasSealant) spares.sealant -= 1;
      else if (hasHoseKit) { spares.hose -= 1; spares.hoseClamps -= 1; }
      state.boat.floodRate = 0;
      state.flags.hullLeakResolved = true;
      // Patching the leak is itself hull work, so it nudges the general
      // hull condition stat too, not just the active flow.
      state.boat.hull = clamp(state.boat.hull + 15, 0, 100);
      log(state, hasMaterial ? "Sealant packed into the seam. The flow stops." : "Wedged and lashed with what's on hand. It's holding, for now.");
    } else {
      log(state, "Can't get at it properly \u2014 the water keeps coming.");
    }
    flushNewLogEntries(state);
  }

  // Which spares a given system's repair likes to consume — reusing the
  // existing spares inventory rather than inventing new resource types.
  // Any one of them being present counts as "has material"; the first
  // available is what gets used up.
  var SYSTEM_REPAIR_MATERIALS = {
    hull: ['sealant', 'hose', 'hoseClamps'],
    rigging: ['riggingTape', 'spareLine', 'shackles'],
    sails: ['sailRepair', 'epoxy'],
    engine: ['oil', 'oilFilters', 'fuelFilters', 'belts', 'impellers'],
    electrical: ['fuses', 'wire', 'connectors', 'batteries'],
    steering: ['spareLine', 'wire'],
  };
  var SYSTEM_REPAIR_NOUN = {
    hull: 'the hull', rigging: 'the rigging', sails: 'the sails',
    engine: 'the engine', electrical: 'the wiring', steering: 'the steering',
  };

  function hasRepairMaterial(state, systemKey) {
    var spares = state.supplies.spares;
    return (SYSTEM_REPAIR_MATERIALS[systemKey] || []).some(function (k) { return spares[k] > 0; });
  }
  function consumeRepairMaterial(state, systemKey) {
    var spares = state.supplies.spares;
    var keys = SYSTEM_REPAIR_MATERIALS[systemKey] || [];
    for (var i = 0; i < keys.length; i++) {
      if (spares[keys[i]] > 0) { spares[keys[i]] -= 1; return; }
    }
  }

  // One shared repair resolver for every general boat system (hull,
  // rigging, sails, engine, electrical, steering) — the aft locker and
  // an active leak stay on their own existing functions (resolveAftLocker,
  // attemptLeakRepair), which this doesn't touch. Each system gets
  // exactly one MAJOR repair for the voyage (parts run out); after that,
  // further attempts are a smaller, temporary stopgap. A rested, fed,
  // steady crew does stronger work — same shape as the other repairs.
  function attemptSystemRepair(state, systemKey) {
    var b = state.boat, c = state.crew;
    var hasMaterial = hasRepairMaterial(state, systemKey);
    var alreadyUsedMajor = b.majorRepairUsed[systemKey];

    var penalty = 0;
    if (hungerLevel(c.hoursSinceMeal) >= 3) penalty += 0.10;
    if (thirstLevel(c.hoursSinceWater) >= 3) penalty += 0.12;
    if (state.weather.seaState >= 4) penalty += 0.15;
    if (!hasMaterial) penalty += 0.20;
    if (c.morale < 40) penalty += 0.08;

    var successChance = clamp(0.8 - c.fatigue / 220 - penalty, 0.2, 0.9);
    var success = Math.random() < successChance;
    c.fatigue = clamp(c.fatigue + 7, 0, 100);

    if (!success) {
      log(state, "Couldn't get " + SYSTEM_REPAIR_NOUN[systemKey] + ' sorted this time.');
      flushNewLogEntries(state);
      return;
    }
    if (hasMaterial) consumeRepairMaterial(state, systemKey);

    // Rested and steady crew do stronger, more lasting work; a repair
    // attempted exhausted or shaken still holds, just not as well.
    var repairQuality = clamp(1 - c.fatigue / 130 + (c.morale - 50) / 250, 0.25, 1);

    if (!alreadyUsedMajor) {
      b.majorRepairUsed[systemKey] = true;
      b[systemKey] = clamp(50 + Math.round(repairQuality * 30), 0, 100);
      log(state, (repairQuality >= 0.6
        ? 'Solid work on ' + SYSTEM_REPAIR_NOUN[systemKey] + '.'
        : 'A tired repair on ' + SYSTEM_REPAIR_NOUN[systemKey] + ' \u2014 holds for now, not the strongest fix.')
        + ' ' + boatConditionLevel(b[systemKey]) + ' now.');
    } else {
      b[systemKey] = clamp(b[systemKey] + 10 + Math.round(repairQuality * 10), 0, 100);
      log(state, 'A stopgap fix on ' + SYSTEM_REPAIR_NOUN[systemKey] + ' \u2014 no parts left aboard for a real repair. '
        + boatConditionLevel(b[systemKey]) + ' now.');
    }
    flushNewLogEntries(state);
  }

  // What's actually reachable and worth offering from here. WORN and
  // above is informational only (see boatConditionLevel); POOR or worse
  // is where a repair has something to do. An active leak always takes
  // priority over hull's general condition, since it's the urgent thing.
  function repairableSystemsAt(state, location) {
    var b = state.boat;
    var items = [];
    if (location === 'above') {
      if (state.flags.aftLockerTriggered && !state.flags.aftLockerResolved) {
        items.push({ label: 'AFT LOCKER', action: 'repair:aftLocker' });
      }
      if (b.sails <= 50) items.push({ label: 'SAILS \u2014 ' + boatConditionLevel(b.sails), action: 'repair:sails' });
      if (b.rigging <= 50) items.push({ label: 'RIGGING \u2014 ' + boatConditionLevel(b.rigging), action: 'repair:rigging' });
    } else {
      if (b.floodRate > 0) {
        items.push({ label: 'HULL LEAK', action: 'repair:leak' });
      } else if (b.hull <= 50) {
        items.push({ label: 'HULL \u2014 ' + boatConditionLevel(b.hull), action: 'repair:hull' });
      }
      if (b.engine <= 50) items.push({ label: 'ENGINE \u2014 ' + boatConditionLevel(b.engine), action: 'repair:engine' });
      if (b.electrical <= 50) items.push({ label: 'BATTERIES \u2014 ' + boatConditionLevel(b.electrical), action: 'repair:electrical' });
      if (b.steering <= 50) items.push({ label: 'STEERING \u2014 ' + boatConditionLevel(b.steering), action: 'repair:steering' });
    }
    return items;
  }

  function cmdRepair(state) {
    var items = repairableSystemsAt(state, state.crew.location);
    if (items.length === 0) {
      printBlank();
      printLine('Nothing aboard is asking to be fixed right now.', 'dim');
      return;
    }
    printBlank();
    printLine('REPAIR', 'heading-label');
    state.pendingChoice = { id: 'repair-menu', options: items.concat([{ label: 'BACK', action: 'cancel' }]) };
  }

  function cmdRestart(state) {
    printBlank();
    printLine('NEW VOYAGE', 'heading-label');
    printLine('This abandons the current voyage and starts over from Seattle.');
    state.pendingChoice = {
      id: 'restart-choice',
      options: [
        { label: 'YES \u2014 START OVER', action: 'confirm-restart' },
        { label: 'NO \u2014 KEEP SAILING', action: 'cancel' },
      ],
    };
  }

  var COMMANDS = {
    status: cmdStatus,
    position: cmdPosition,
    weather: cmdWeather,
    forecast: cmdForecast,
    inventory: cmdInventory,
    distress: cmdDistress,
    sails: cmdSails,
    engine: cmdEngine,
    course: cmdCourse,
    routine: cmdRoutine,
    sleep: cmdSleep,
    eat: cmdEat,
    drink: cmdDrink,
    wash: cmdWash,
    dress: cmdDress,
    dishes: cmdDishes,
    read: cmdRead,
    repair: cmdRepair,
    restart: cmdRestart,
  };

  function runCommand(state, raw) {
    // All commands now arrive from a button that getContextualOptions()
    // itself decided was valid for the current state — no free-text entry
    // point exists anymore (see the header RESTART button for the one
    // command that can fire regardless of state). So this just dispatches.
    var word = raw.trim().toLowerCase();
    if (!word) return;
    var fn = COMMANDS[word];
    if (fn) fn(state);
    if (uiBusy) return; // a short action was kicked off; it owns the render/save/scroll tail when it resolves
    renderOptions(state);
    saveGameState(state);
    scrollToBottom();
  }

  // Builds an options array from ordered groups, inserting a divider
  // between any two non-empty groups and simply omitting a group (and
  // its divider) when it has nothing in it — e.g. REPAIR when there's
  // nothing to fix. Keeps the ABOVE/BELOW menus below free of
  // hand-counted divider bookkeeping as conditional items come and go.
  function groupedOptions(groups) {
    var result = [];
    groups.forEach(function (group) {
      if (!group || group.length === 0) return;
      if (result.length > 0) result.push({ divider: true });
      result = result.concat(group);
    });
    return result;
  }

  function getContextualOptions(state) {
    // A pending decision always wins — including a restart request made
    // mid-departure, mid-attempt, or mid-sleep, which must be answerable
    // even though those states otherwise show just one button. Pending
    // choices (SAILS' FULL/REEFED/etc, DISTRESS' ACTIVATE EPIRB/DEPLOY
    // LIFE RAFT/FIRE FLARE, and so on) are unaffected by physical
    // location — a rescue interaction started below can still surface
    // FIRE FLARE regardless of where the sailor is standing.
    if (state.pendingChoice) return state.pendingChoice.options;

    if (state.departure.stageIndex < DEPARTURE_STEPS.length) {
      return [{ label: DEPARTURE_STEPS[state.departure.stageIndex].label, action: 'departure-step' }];
    }

    if (state.rescue.phase === 'rescued') {
      // The voyage is over — nothing left to do but look back at it. The
      // log itself is always visible above, scrolled into history, so
      // there's nothing else worth offering here. (STATUS used to be
      // the one thing left to press; it's no longer player-facing, and
      // nothing replaces it — there's genuinely nothing left to do.)
      return [];
    }

    if (state.crew.watchState === 'trying') {
      return [{ label: 'GET UP', action: 'give-up-trying' }];
    }
    if (state.crew.watchState === 'sleeping') {
      return [{ label: 'WAKE UP', action: 'wake-up' }];
    }

    if (state.crew.inLifeRaft) {
      // Nothing left to sail, motor, steer, or fix — the voyage has
      // become survival until rescue, full stop. There's no boat left
      // to be above or below on, so this stays the one flat list it
      // always was (minus STATUS, which is gone everywhere now).
      return [
        { label: 'POSITION', action: 'cmd:position' },
        { label: 'WEATHER', action: 'cmd:weather' },
        { label: 'INVENTORY', action: 'cmd:inventory' },
        { divider: true },
        { label: 'EAT', action: 'cmd:eat' },
        { label: 'DRINK', action: 'cmd:drink' },
        { label: 'SLEEP', action: 'cmd:sleep' },
        { label: 'DISTRESS', action: 'cmd:distress' },
      ];
    }

    // REPAIR is always offered in both locations now, plain-labeled —
    // cmdRepair decides, by location, exactly what's reachable and shows
    // its own picker if there's more than one thing (or one) to choose
    // from; "nothing to fix" if not.
    var goLabel = state.crew.location === 'below' ? 'GO ABOVE' : 'GO BELOW';

    if (state.crew.location === 'below') {
      return groupedOptions([
        [{ label: 'ROUTINE', action: 'cmd:routine' }],
        [
          { label: 'POSITION', action: 'cmd:position' },
          { label: 'FORECAST', action: 'cmd:forecast' },
          { label: 'INVENTORY', action: 'cmd:inventory' },
        ],
        [
          { label: 'STATUS', action: 'cmd:status' },
          { label: 'REPAIR', action: 'cmd:repair' },
          { label: 'DISTRESS', action: 'cmd:distress' },
        ],
        [{ label: goLabel, action: 'go-above-below' }],
      ]);
    }

    // ABOVE (the default/starting location).
    return groupedOptions([
      [
        { label: 'SAILS', action: 'cmd:sails' },
        { label: 'ENGINE', action: 'cmd:engine' },
        { label: 'COURSE', action: 'cmd:course' },
        { label: 'WEATHER', action: 'cmd:weather' },
      ],
      [{ label: 'REPAIR', action: 'cmd:repair' }],
      [{ label: goLabel, action: 'go-above-below' }],
    ]);
  }

  // Which of the read-only "information" categories (if any) currently
  // occupies the temp view. Tracked separately from state.pendingChoice
  // because it's pure UI/interaction convenience — not part of the
  // simulation, not persisted, not something a reload should remember.
  var INFO_COMMANDS = { position: true, weather: true, forecast: true, inventory: true };
  var openInfoPanel = null;

  function renderOptions(state) {
    updateNavStrip(state); // the strip reflects live state, so refresh it anywhere the options panel does
    optionsEl.innerHTML = '';
    var opts = getContextualOptions(state);
    opts.forEach(function (opt) {
      if (opt.divider) {
        var div = document.createElement('div');
        div.className = 'option-divider';
        optionsEl.appendChild(div);
        return;
      }
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option';
      btn.textContent = '> ' + opt.label;
      btn.addEventListener('click', function () {
        if (opt.action.indexOf('cmd:') === 0) {
          var cmdName = opt.action.slice(4);
          clearTempView(); // whatever the last command/menu showed is done being looked at
          if (INFO_COMMANDS[cmdName] && openInfoPanel === cmdName) {
            // Same info category clicked again while it's already open:
            // collapse it and return to the plain log view instead of
            // reopening it.
            openInfoPanel = null;
            renderOptions(state);
            saveGameState(state);
            scrollToBottom();
            return;
          }
          openInfoPanel = INFO_COMMANDS[cmdName] ? cmdName : null;
          printEcho(cmdName);
          runCommand(state, cmdName);
        } else {
          clearTempView();
          // Inventory's own category/back sub-choices stay "inside" the
          // inventory panel for toggle purposes; any other action (a sail
          // choice, an eat/drink pick, a generic cancel out of a prompt,
          // etc.) leaves the info-panel system entirely.
          if (opt.action.indexOf('inventory:') !== 0) {
            openInfoPanel = null;
          }
          handleAction(state, opt.action);
        }
      });
      optionsEl.appendChild(btn);
    });
  }

  /* --------------------------------------------------------------
     SHORT PHYSICAL ACTIONS

     A reusable working-indicator system for physical tasks that
     shouldn't resolve instantly — starting the engine, reefing,
     checking the aft locker, pouring water. NOT a loading spinner:
     it represents the sailor actually doing something, so it runs
     on real wall-clock seconds (setTimeout/setInterval), same as a
     human would take a moment. This is orthogonal to — and never
     touches — the voyage clock (meta.voyageMinutes): a few seconds
     of UI pacing is not a time-skip; see PROJECT.md's real-time rule,
     which governs the SIMULATION clock, not interaction pacing.

     Usage: runShortAction(state, { label, duration, action }).
     `action(state)` does whatever an instant handler normally would
     (mutate state, call log()/printLine() itself) — this just wraps
     it with a label and a few seconds of animated dots first, then
     runs the normal render/save tail once it resolves. Any future
     action can opt in with three lines; nothing here is hard-coded
     to a specific task.
     -------------------------------------------------------------- */
  var uiBusy = false; // true while a short action's dots are animating — options are hidden, other actions wait
  var DOT_FRAME_MS = 700;

  function runShortAction(state, config) {
    uiBusy = true;
    var choiceAtStart = state.pendingChoice; // preserved/cleared the same way handleAction's tail would

    optionsEl.innerHTML = '';
    clearTempView(); // whatever menu was open is done being looked at once an action starts
    printPersistentBlank();

    // Normally the label (e.g. "STARTING ENGINE") is printed permanently,
    // same as everything else in the scrollback. config.transientLabel
    // opts a specific action out of that: the label shows only while the
    // dots are running and is gone once resolved, leaving just the
    // result line behind — for actions minor enough that only the
    // outcome, not the doing, belongs in the permanent record.
    var labelEl = null;
    if (config.transientLabel) {
      labelEl = document.createElement('p');
      labelEl.className = 'line heading-label';
      labelEl.textContent = config.label;
      outputEl.insertBefore(labelEl, tempViewEl);
    } else {
      printPersistentLine(config.label, 'heading-label');
    }

    // One animated "." / ".." / "..." run, for `durationSeconds` real seconds,
    // then `onDone`. Factored out so a short action can optionally chain a
    // second, label-less pause after its own result — the dots themselves
    // ARE that pause; nothing about voyage time is touched by any of this.
    function animateDots(durationSeconds, onDone) {
      var dotsLine = document.createElement('p');
      dotsLine.className = 'line dim';
      dotsLine.textContent = '.';
      outputEl.insertBefore(dotsLine, tempViewEl);
      scrollToBottom();

      var frames = ['.', '..', '...'];
      var frameIndex = 0;
      var dotTimer = setInterval(function () {
        frameIndex = (frameIndex + 1) % frames.length;
        dotsLine.textContent = frames[frameIndex];
      }, DOT_FRAME_MS);

      setTimeout(function () {
        clearInterval(dotTimer);
        if (dotsLine.parentNode) dotsLine.parentNode.removeChild(dotsLine);
        if (labelEl && labelEl.parentNode) { labelEl.parentNode.removeChild(labelEl); labelEl = null; }
        onDone();
      }, durationSeconds * 1000);
    }

    function finish() {
      if (state.pendingChoice === choiceAtStart) {
        state.pendingChoice = null;
      }
      uiBusy = false;
      renderOptions(state);
      saveGameState(state);
      updateAudioForState(state);
      scrollToBottom();
    }

    animateDots(config.duration || 3, function () {
      if (config.action) config.action(state);
      if (config.thenBeat) {
        // A second silent beat — no new heading, just more dots — before a
        // final action. Used where a moment needs two results in sequence
        // (e.g., "you ease away from the dock." ... "the voyage has begun.").
        animateDots(config.thenBeat.duration || 3, function () {
          if (config.thenBeat.action) config.thenBeat.action(state);
          finish();
        });
      } else {
        finish();
      }
    });
  }

  function handleAction(state, action) {
    // Restarting discards the current game object entirely, so it can't
    // flow through the normal tail below (which would re-save and
    // re-render the very state this just deleted). Handle it and bail out.
    if (action === 'confirm-restart') {
      confirmRestart();
      return;
    }

    // performEat() (and in principle other handlers) can legitimately
    // re-open a pendingChoice itself — e.g. re-showing the food list after
    // a blocked cooking attempt. Only clear it in the tail below if nothing
    // during this action set a NEW one; otherwise the blanket reset would
    // immediately wipe out the very re-prompt we just opened.
    var choiceBeforeHandling = state.pendingChoice;

    if (action.indexOf('eat:') === 0) {
      performEat(state, action.slice(4));
    } else if (action.indexOf('drink:') === 0) {
      performDrinkFrom(state, action.slice(6));
    } else if (action.indexOf('inventory:') === 0) {
      var invCat = action.slice(10);
      if (invCat === 'back') {
        cmdInventory(state);
      } else {
        showInventoryCategory(state, invCat);
      }
    } else if (action.indexOf('repair:') === 0) {
      var repairKey = action.slice(7);
      if (repairKey === 'aftLocker') {
        runShortAction(state, { label: 'CHECKING AFT LOCKER', duration: 6, action: resolveAftLocker });
      } else if (repairKey === 'leak') {
        runShortAction(state, { label: 'WORKING THE LEAK', duration: 6, action: attemptLeakRepair });
      } else {
        runShortAction(state, {
          label: 'WORKING ON ' + SYSTEM_REPAIR_NOUN[repairKey].toUpperCase(),
          duration: 6,
          action: function (s) { attemptSystemRepair(s, repairKey); },
        });
      }
    } else {
      switch (action) {
        case 'cancel':
          printBlank();
          printLine('Left as it was.', 'dim');
          break;
        case 'give-up-trying':
          state.crew.watchState = 'awake';
          state.crew.sleepAttemptStartedAt = null;
          state.crew.sleepStartedAt = null; // fully awake now — a later session starts its own duration count clean
          printBlank();
          printLine('You give up on it and get up.', 'dim');
          break;
        case 'wake-up':
          printBlank();
          wakeUp(state, 'You wake and go above.');
          break;
        case 'go-above-below':
          // A physical place, tracked independently of any menu — the
          // label the player just clicked already told them which way
          // they're headed, so this just carries it out. "GOING BELOW"/
          // "GOING ABOVE" is only shown while the dots run (transientLabel)
          // and doesn't stick around — just the result, "You go below."/
          // "You go above.", stays in the scrollback, and even that isn't
          // a timestamped voyage-log entry — too minor and too frequent
          // to be worth a permanent log line every time.
          var goingBelow = state.crew.location !== 'below';
          runShortAction(state, {
            label: goingBelow ? 'GOING BELOW' : 'GOING ABOVE',
            transientLabel: true,
            duration: 2,
            action: function (s) {
              s.crew.location = goingBelow ? 'below' : 'above';
              printPersistentLine(goingBelow ? 'You go below.' : 'You go above.', 'dim');
            },
          });
          break;
        case 'sail-full':
          runShortAction(state, {
            label: 'SETTING FULL SAIL',
            duration: 4,
            action: function (s) {
              s.boat.sailConfig = 'full';
              log(s, "Full sail set. More speed, more motion.");
              flushNewLogEntries(s);
            },
          });
          break;
        case 'sail-reefed':
          runShortAction(state, {
            label: 'PUTTING IN A REEF',
            duration: 4,
            action: function (s) {
              s.boat.sailConfig = 'reefed';
              log(s, "Put a reef in. Quieter below, a little slower.");
              flushNewLogEntries(s);
            },
          });
          break;
        case 'sail-minimal':
          runShortAction(state, {
            label: 'REDUCING SAIL',
            duration: 5,
            action: function (s) {
              s.boat.sailConfig = 'minimal';
              log(s, "Reduced to minimal canvas. Slow, but she's not fighting the wind anymore.");
              flushNewLogEntries(s);
            },
          });
          break;
        case 'sail-furled':
          runShortAction(state, {
            label: 'FURLING SAILS',
            duration: 5,
            action: function (s) {
              s.boat.sailConfig = 'furled';
              log(s, "Sails furled. No canvas up at all.");
              flushNewLogEntries(s);
            },
          });
          break;
        case 'engine-start':
          runShortAction(state, {
            label: 'STARTING ENGINE',
            duration: 3,
            action: function (s) {
              s.boat.engineOn = true;
              // Recalculate immediately, using the heading as of the last
              // real tick — never invent a fresh heading here, since
              // computeHeading() also rolls a per-tick drift wobble that
              // must only ever happen on an actual simulated tick.
              s.boat.speed = computeBoatSpeed(s, s.nav.heading);
              log(s, 'The engine catches.');
              flushNewLogEntries(s);
              printBlank();
              printLine(propulsionLabel(propulsionState(s, s.nav.heading)) + '.');
              printLine(s.boat.speed.toFixed(1) + ' kt', 'dim');
            },
          });
          break;
        case 'engine-stop':
          runShortAction(state, {
            label: 'STOPPING ENGINE',
            duration: 2,
            action: function (s) {
              s.boat.engineOn = false;
              s.boat.speed = computeBoatSpeed(s, s.nav.heading);
              log(s, 'Engine stopped.');
              flushNewLogEntries(s);
              printBlank();
              printLine(propulsionLabel(propulsionState(s, s.nav.heading)) + '.');
              printLine(s.boat.speed.toFixed(1) + ' kt', 'dim');
            },
          });
          break;
        case 'activate-epirb':
          runShortAction(state, {
            label: 'ACTIVATING EPIRB',
            duration: 4,
            action: function (s) {
              s.rescue.epirbOn = true;
              s.rescue.activatedAt = s.meta.voyageMinutes;
              s.rescue.phase = 'traveling';
              s.rescue.travelMinutes = estimateRescueTravelMinutes(s);
              log(s, 'Distress beacon transmitting.');
              log(s, 'Rescue requested.');
              flushNewLogEntries(s);
            },
          });
          break;
        case 'deploy-life-raft':
          runShortAction(state, {
            label: 'DEPLOYING LIFE RAFT',
            duration: 6,
            action: function (s) {
              s.crew.inLifeRaft = true;
              log(s, 'The raft inflates alongside.');
              log(s, 'You climb aboard, and cut away from the boat.');
              flushNewLogEntries(s);
            },
          });
          break;
        case 'fire-flare':
          runShortAction(state, {
            label: 'FIRING FLARE',
            duration: 3,
            action: function (s) {
              s.supplies.safety.flares = clamp(s.supplies.safety.flares - 1, 0, 999);
              s.rescue.encounterFlareFired = true;
              log(s, 'A red flare climbs above the water.');
              flushNewLogEntries(s);
              resolveRescueEncounter(s);
            },
          });
          break;
      case 'course-hold':
        state.nav.headingOffset = 0;
        printBlank();
        printLine('Holding the intended course.', 'dim');
        break;
      case 'course-bear-away':
        state.nav.headingOffset = 22;
        log(state, "Bore away to ease the motion. Further off the direct line, but a kinder ride.");
        flushNewLogEntries(state);
        break;
      case 'course-come-up':
        state.nav.headingOffset = -22;
        log(state, "Came up toward the rhumb line. She pounds more for it.");
        flushNewLogEntries(state);
        break;
      case 'resolve-aft-locker-now':
        resolveAftLocker(state);
        break;
      case 'defer-aft-locker':
        state.flags.aftLockerDeferredAt = state.meta.voyageMinutes;
        printBlank();
        printLine('It can wait. For now.', 'dim');
        break;
      case 'departure-step':
        var step = DEPARTURE_STEPS[state.departure.stageIndex];
        if (step) {
          runShortAction(state, {
            label: step.workingLabel || step.label,
            duration: step.duration || 3,
            action: function (s) {
              if (step.onEnter) step.onEnter(s);
              if (step.text) {
                log(s, typeof step.text === 'function' ? step.text(s) : step.text);
                flushNewLogEntries(s);
              }
              s.departure.stageIndex++;
              if (step.afterLog) step.afterLog(s);
            },
            thenBeat: step.thenBeat,
          });
        }
        break;
      default:
        break;
      }
    }
    if (uiBusy) return; // a short action was kicked off; it owns the tail (including the pendingChoice check) when it resolves
    if (state.pendingChoice === choiceBeforeHandling) {
      state.pendingChoice = null;
    }
    renderOptions(state);
    saveGameState(state);
    updateAudioForState(state);
    scrollToBottom();
  }

  /* ============================================================
     9. BOOT SEQUENCE
     ============================================================ */
  // The departure sequence walks through these one button at a time before
  // normal gameplay opens up. Each step is a plain state change (like EAT or
  // REPAIR) — it does not touch the clock; real time is passing throughout
  // exactly as it always does (see PROJECT.md).
  var DEPARTURE_STEPS = [
    { label: 'BOARD', workingLabel: 'BOARDING', duration: 2, text: "You step aboard." },
    {
      label: 'START ENGINE',
      workingLabel: 'STARTING ENGINE',
      duration: 3,
      text: 'The engine catches.',
      onEnter: function (s) { s.boat.engineOn = true; },
    },
    {
      label: 'CAST OFF',
      workingLabel: 'CASTING OFF',
      duration: 3,
      // The scripted sequence ends here — sails stay furled, the engine
      // stays running, and everything from this point on is a player
      // decision. The closing beat below isn't a separate button: once
      // the last line is off, there's nothing left to deliberately DO —
      // the boat just leaves, on its own, as the direct consequence. The
      // pause before "the voyage has begun" is a second dot-animation
      // beat (thenBeat), not a separate delay mechanism — the dots ARE
      // the beat, same real-time short-action system either time.
      afterLog: function (s) {
        printPersistentBlank();
        printPersistentLine('You ease away from the dock.', 'dim');
      },
      thenBeat: {
        duration: 3,
        action: function (s) {
          printPersistentBlank();
          log(s, 'The voyage has begun.');
          flushNewLogEntries(s);
        },
      },
    },
  ];

  var liveTimer = null;

  function startLiveLoop() {
    if (liveTimer) return;
    var last = Date.now();
    liveTimer = setInterval(function () {
      if (!GAME) return;
      var now = Date.now();
      var minutes = (now - last) / 60000;
      last = now;
      var ticks = advanceSimulation(GAME, minutes);
      GAME.meta.lastTick = now;
      if (ticks > 0) {
        flushNewLogEntries(GAME);
        if (!uiBusy) renderOptions(GAME); // a short action owns the options panel while its dots are animating
        updateAudioForState(GAME);
      }
      saveGameState(GAME);
    }, LIVE_TICK_SECONDS * 1000);
  }

  function renderPreDeparture() {
    printPersistentLine(VESSEL_NAME + ' \u2014 ' + DEPARTURE_PORT, 'heading-label');
    printPersistentBlank();
    printPersistentLine('Lines still on the dock. Grey morning, the kind Seattle keeps for departures.');
    printPersistentLine('Ahead: ' + ROUTE_DISTANCE_NM.toLocaleString() + ' nautical miles of open Pacific, and ' + DESTINATION_PORT + ', somewhere past the curve of the world.');
    printPersistentBlank();
    printPersistentLine('You are sailing alone.');

    optionsEl.innerHTML = '';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option';
    btn.textContent = '> ' + DEPARTURE_STEPS[0].label;
    btn.addEventListener('click', function () {
      GAME = newGameState();
      unlockAudio();
      updateAudioForState(GAME); // safe no-op if audio isn't unlocked yet; keeps a restart's ambience in sync immediately
      updateSoundLabel();
      setVesselLine('S/V ' + VESSEL_NAME + ' \u2014 UNDERWAY');
      restartBtn.hidden = false;
      startLiveLoop();
      clearTempView();
      handleAction(GAME, 'departure-step'); // logs, flushes, advances the stage, and renders/saves/scrolls
      updateClock();
    });
    optionsEl.appendChild(btn);
  }

  function confirmRestart() {
    // A restart discards the save and begins a fresh voyage "now" — this is
    // not a time-skip (see PROJECT.md): it doesn't fast-forward or rewind
    // an in-progress voyage, it just starts over exactly like a first visit.
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { console.warn('Could not clear save.', e); }
    GAME = null;
    printedCount = 0;
    resetOutputEl();
    restartBtn.hidden = true;
    setVesselLine('S/V ' + VESSEL_NAME + ' \u2014 AT DOCK');
    renderPreDeparture();
    updateClock();
  }

  function renderReturn(state, ticks) {
    resetOutputEl();
    printPersistentLine('S/V ' + VESSEL_NAME + ' \u2014 underway', 'heading-label');
    if (ticks > 0) {
      printPersistentBlank();
      printPersistentLine('(' + describeGap(ticks * TICK_MINUTES) + ' since you were last aboard.)', 'dim');
    }
    state.log.forEach(printLogEntry);
    printedCount = state.log.length;
    renderOptions(state);
    scrollToBottom();
  }

  // Saves from before real dead reckoning existed have no lat/lon at all —
  // position used to be interpolated from percent-of-route-traveled. Give
  // those saves one seeded fix so the switch doesn't teleport anyone; every
  // tick from here on moves from wherever this lands, same as any other
  // point in the voyage. New saves already have lat/lon and skip this.
  function migrateNavIfNeeded(state) {
    var nav = state.nav;
    if (nav.tack === undefined) nav.tack = null;
    if (nav.tackDistanceNm === undefined) nav.tackDistanceNm = 0;
    if (typeof nav.lat === 'number' && typeof nav.lon === 'number') return;
    var legacyTotal = 2850; // the flat distance old saves' progress was measured against
    var frac = clamp((nav.distanceTraveled || 0) / legacyTotal, 0, 1);
    var start = WAYPOINTS[0];
    nav.lat = start.lat + (FINAL_DEST.lat - start.lat) * frac - Math.sin(frac * Math.PI) * 2.5;
    nav.lon = start.lon + (FINAL_DEST.lon - start.lon) * frac;
    nav.waypointIndex = 1;
    for (var i = 1; i < WAYPOINTS.length; i++) {
      var covered = distanceBetween(start.lat, start.lon, WAYPOINTS[i].lat, WAYPOINTS[i].lon);
      if (covered <= (nav.distanceTraveled || 0)) nav.waypointIndex = Math.min(i + 1, WAYPOINTS.length - 1);
    }
    delete nav.crossTrackDeviation; // replaced by a value computed fresh from position, not stored
    nav.heading = computeHeading(state); // also refreshes nav.intendedCourse so the display isn't stale
  }

  // The closest point lying ON the current WAYPOINTS route (projected
  // onto whichever leg is nearest) to an arbitrary lat/lon, plus the
  // index of that leg's "ahead" waypoint (i.e. the one a boat there
  // should be steering toward). Flat local projection, not full
  // spherical geometry — plenty accurate at the few-mile scale this is
  // ever used at.
  function nearestPointOnRoute(lat, lon) {
    var best = null, bestDist = Infinity;
    for (var i = 0; i < WAYPOINTS.length - 1; i++) {
      var a = WAYPOINTS[i], b = WAYPOINTS[i + 1];
      var mlat = toRad((a.lat + b.lat) / 2);
      var ax = a.lon * Math.cos(mlat), ay = a.lat;
      var bx = b.lon * Math.cos(mlat), by = b.lat;
      var px = lon * Math.cos(mlat), py = lat;
      var abx = bx - ax, aby = by - ay;
      var apx = px - ax, apy = py - ay;
      var ab2 = abx * abx + aby * aby;
      var t = ab2 === 0 ? 0 : clamp((apx * abx + apy * aby) / ab2, 0, 1);
      var cLat = a.lat + t * (b.lat - a.lat);
      var cLon = a.lon + t * (b.lon - a.lon);
      var d = distanceBetween(lat, lon, cLat, cLon);
      if (d < bestDist) { bestDist = d; best = { lat: cLat, lon: cLon, aheadIndex: i + 1 }; }
    }
    return best;
  }

  // Recovery for one specific, known bug: an earlier version of the
  // coastal route crossed straight over the southern end of Marrowstone
  // Island, so a save made during that window could have a position
  // that's physically on the island. The box below is a little larger
  // than the island itself to catch anything that old bug could have
  // produced crossing it. This is NOT a general "keep the boat on the
  // route" snap — a position outside this specific box, however far
  // from any waypoint, is left completely untouched.
  function recoverPositionIfOnLand(state) {
    var nav = state.nav;
    if (typeof nav.lat !== 'number' || typeof nav.lon !== 'number') return;
    var onMarrowstone = nav.lat >= 47.995 && nav.lat <= 48.115 && nav.lon >= -122.71 && nav.lon <= -122.655;
    if (!onMarrowstone) return;
    var recovered = nearestPointOnRoute(nav.lat, nav.lon);
    if (!recovered) return;
    nav.lat = recovered.lat;
    nav.lon = recovered.lon;
    nav.heading = computeHeading(state);
  }

  // One-time migration for the coastal waypoint chain being replaced
  // wholesale with an exact, externally-supplied set of points (a
  // different count and numbering than whatever a save was using
  // before). This does NOT move the boat — its actual lat/lon, the
  // ground truth, is untouched — it only re-points nav.waypointIndex at
  // whichever new waypoint the boat should now be steering toward,
  // found by projecting its current position onto the new route. Runs
  // once per save (guarded by nav.coastalRouteMigrated) rather than
  // every load, since repeatedly re-deriving the target from position
  // could in principle walk it backward a step if wobble ever puts the
  // boat fractionally closer to the previous leg's line.
  function migrateCoastalWaypointIndexIfNeeded(state) {
    var nav = state.nav;
    if (nav.coastalRouteMigrated) return;
    nav.coastalRouteMigrated = true;
    if (typeof nav.lat !== 'number' || typeof nav.lon !== 'number') return; // migrateNavIfNeeded handles this case
    var found = nearestPointOnRoute(nav.lat, nav.lon);
    if (!found) return;
    nav.waypointIndex = found.aheadIndex;
    nav.heading = computeHeading(state); // also refreshes nav.intendedCourse so the display isn't stale
  }

  // Earlier saves tracked food/water as abstract "days remaining," had no
  // propane, and only ever had watchState 'awake'/'sleeping'. Give those
  // saves a real starting inventory (scaled down by how much of the old
  // abstract countdown they'd already burned through) and fill in the new
  // crew fields, then switch to the real systems from here on. New saves
  // already have state.food and skip this entirely.
  function migrateProvisionsIfNeeded(state) {
    var c = state.crew, b = state.boat;
    if (!state.food) {
      var foodFrac = clamp((c.foodDays != null ? c.foodDays : 24) / 24, 0, 1);
      var waterFrac = clamp((c.waterDays != null ? c.waterDays : 30) / 30, 0, 1);
      state.food = {
        oatmeal: Math.round(18 * foodFrac), pasta: Math.round(12 * foodFrac), rice: Math.round(16 * foodFrac),
        soup: Math.round(8 * foodFrac), chili: Math.round(8 * foodFrac), tuna: Math.round(10 * foodFrac),
        crackers: Math.round(12 * foodFrac), peanutButter: Math.round(10 * foodFrac), nuts: Math.round(16 * foodFrac),
        driedFruit: Math.round(12 * foodFrac), energyBars: Math.round(12 * foodFrac),
        freshFruit: Math.round(8 * foodFrac), freshBread: Math.round(6 * foodFrac),
        comfort: Math.round(6 * foodFrac), coffee: Math.round(24 * foodFrac),
      };
      state.water = { primary: +(35 * waterFrac).toFixed(1), emergency: 8 };
      state.supplies = { propane: Math.round(60 * foodFrac) };
      delete c.foodDays;
      delete c.waterDays;
    }
    if (c.sleepAttemptStartedAt === undefined) c.sleepAttemptStartedAt = null;
    if (c.lastCoffeeAt === undefined) c.lastCoffeeAt = null;
    if (c.coffeeCount === undefined) c.coffeeCount = 0;
    if (c.location === undefined) c.location = 'above';
    if (state.flags.hungerNarrated === undefined) state.flags.hungerNarrated = false;
    if (state.flags.freshFruitSpoiled === undefined) state.flags.freshFruitSpoiled = false;
    if (state.flags.freshBreadSpoiled === undefined) state.flags.freshBreadSpoiled = false;
    // Diesel used to be tracked as "hours of motoring left" — convert any
    // older save to real gallons at the same burn rate the simulation now
    // uses, so a save mid-passage doesn't suddenly gain or lose fuel.
    if (b.fuelGallons === undefined) {
      var legacyHours = b.fuelHours != null ? b.fuelHours : 20;
      b.fuelGallons = +(legacyHours * DIESEL_BURN_RATE_GPH).toFixed(1);
      delete b.fuelHours;
    }
    // Consolidate the old 11-category supplies (engine/rigging/electrical/
    // plumbing/repair/medical/safety/tools) into the simplified shape:
    // one merged "spares" bucket, and "safety" holding only the flare
    // count — EPIRB/life-raft are now status derived from state.rescue /
    // crew.inLifeRaft, not a separate inventory count. Also covers saves
    // old enough to have had no supplies breakdown beyond propane at all.
    if (!state.supplies.spares) {
      var oldCats = ['engine', 'rigging', 'electrical', 'plumbing', 'repair'];
      var merged = {};
      oldCats.forEach(function (cat) {
        var obj = state.supplies[cat];
        if (obj) Object.keys(obj).forEach(function (k) { merged[k] = obj[k]; });
      });
      var spareDefaults = {
        oil: 2, coolant: 2, fuelFilters: 4, oilFilters: 2, impellers: 3, belts: 2,
        spareLine: 100, shackles: 6, riggingTape: 2,
        fuses: 10, wire: 50, connectors: 20, batteries: 2,
        hose: 10, hoseClamps: 12,
        sailRepair: 3, epoxy: 2, sealant: 2,
      };
      Object.keys(spareDefaults).forEach(function (k) {
        if (merged[k] === undefined) merged[k] = spareDefaults[k];
      });
      state.supplies.spares = merged;
      oldCats.forEach(function (cat) { delete state.supplies[cat]; });
      delete state.supplies.medical;
      delete state.supplies.tools;
      var oldFlares = (state.supplies.safety && state.supplies.safety.flares != null) ? state.supplies.safety.flares : 6;
      state.supplies.safety = { flares: oldFlares };
    }
    // Flooding/life-raft/rescue are new this pass.
    if (b.floodRate === undefined) b.floodRate = 0;
    if (b.bilgeWater === undefined) b.bilgeWater = 0;
    if (c.inLifeRaft === undefined) c.inLifeRaft = false;
    if (state.flags.hullLeakTriggered === undefined) state.flags.hullLeakTriggered = false;
    if (state.flags.hullLeakResolved === undefined) state.flags.hullLeakResolved = false;
    if (state.flags.bilgeWarned50 === undefined) state.flags.bilgeWarned50 = false;
    if (state.flags.bilgeWarned100 === undefined) state.flags.bilgeWarned100 = false;
    if (!state.rescue) {
      state.rescue = {
        epirbOn: false, activatedAt: null, phase: 'none', travelMinutes: 0,
        nextSearchEventAt: null, encounterActive: false, encounterStartedAt: null,
        encounterKind: null, encounterFlareFired: false,
      };
    }
    // Ambient-event scheduling is new too — undefined is exactly the state
    // checkAmbientEvent() already treats as "not scheduled yet, pick a
    // first time," so there's nothing to actively backfill here; this line
    // just documents that omission is intentional, not an oversight.
    // Steering, per-system major-repair tracking, and the routine-activity
    // cooldowns are new this pass.
    if (b.steering === undefined) b.steering = 100;
    if (!b.majorRepairUsed) {
      b.majorRepairUsed = { hull: false, rigging: false, sails: false, engine: false, electrical: false, steering: false };
    }
    if (!c.lastRoutineAt) {
      c.lastRoutineAt = { wash: null, dress: null, dishes: null, read: null };
    }
  }

  function boot() {
    var saved = loadGameState();
    if (!saved) {
      renderPreDeparture();
      updateClock();
      return;
    }
    GAME = saved;
    migrateNavIfNeeded(GAME);
    recoverPositionIfOnLand(GAME);
    migrateCoastalWaypointIndexIfNeeded(GAME);
    migrateProvisionsIfNeeded(GAME);
    restartBtn.hidden = false;
    setVesselLine('S/V ' + VESSEL_NAME + ' \u2014 UNDERWAY');
    var ticks = catchUpFromRealTime(GAME);
    saveGameState(GAME);
    renderReturn(GAME, ticks);
    startLiveLoop();
    updateClock();
  }

  restartBtn.addEventListener('click', function () {
    if (!GAME || uiBusy) return;
    clearTempView();
    printEcho('restart');
    runCommand(GAME, 'restart');
  });

  soundBtn.addEventListener('click', function () {
    if (!audioUnlocked) {
      unlockAudio();
      if (GAME) updateAudioForState(GAME);
    } else {
      toggleMute();
    }
    updateSoundLabel();
  });

  document.addEventListener('visibilitychange', function () {
    if (!GAME) return;
    if (document.visibilityState === 'hidden') {
      GAME.meta.lastTick = Date.now();
      saveGameState(GAME);
    } else if (document.visibilityState === 'visible') {
      var ticks = catchUpFromRealTime(GAME);
      if (ticks > 0) {
        flushNewLogEntries(GAME);
        if (!uiBusy) renderOptions(GAME); // a short action owns the options panel while its dots are animating
        updateAudioForState(GAME);
      }
      saveGameState(GAME);
      updateClock();
    }
  });

  window.addEventListener('pagehide', function () {
    if (!GAME) return;
    GAME.meta.lastTick = Date.now();
    saveGameState(GAME);
  });

  boot();
  setInterval(updateClock, 30000);

})();
</script>
</body>
</html>
