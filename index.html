  // applyMuteToFishingAudio -- only matters for the rare case where a
  // switch click is still audible at the exact moment mute is toggled,
  // given how short these sounds are.
  function applyMuteToCabinSwitchAudio() {
    Object.keys(cabinSwitchAudioEls).forEach(function (key) {
      var el = cabinSwitchAudioEls[key];
      if (!el || el.paused) return;
      el.volume = muted ? 0 : (el._baseVolume || 0);
    });
  }

  // Toggles flip immediately and redraw the panel — no confirmation
  // prompt, no delay, and deliberately no permanent-log entry for the
  // routine flip itself (these can be switched often; logging every one
  // would clutter the log fast). A dead battery can't power anything
  // new on, though it can still be switched off.
  function performElectricalToggle(state, key) {
    var field = ELECTRICAL_TOGGLE_FIELDS[key];
    if (!field) return;
    var b = state.boat;
    if (!b[field] && b.electrical === 'DAMAGED') {
      printBlank();
      printLine('Electrical system damaged.', 'amber');
      cmdElectrical(state);
      return;
    }
    // ACCESSORY HOOK -- unlike the other four, the circuit itself draws
    // nothing just being switched on (only an actually-playing cassette
    // does — see updateBattery), so a dead battery doesn't stop the
    // player from flipping it on; playing a tape is what's actually
    // gated on real charge, at performStartTape.
    if (!b[field] && b.battery <= 0 && key !== 'accessory') {
      printBlank();
      printLine('No power.', 'amber');
      cmdElectrical(state);
      return;
    }
    var turningOn = !b[field];
    b[field] = turningOn;
    playElectricalSwitchSound(turningOn); // ELECTRICAL HOOK -- only reached once the toggle is actually going through, never on a blocked attempt above

    if (key === 'autopilot') {
      if (turningOn) {
        // If the player was AT THE HELM, the autopilot takes over from
        // them — end manual helming before the turn begins, same as it
        // would end from any other incompatible activity (see
        // performGoAboveBelow/cmdSleep).
        state.crew.atHelm = false;
        // Clear any stale value from an earlier OFF period so the NEXT
        // disengagement (if any) re-initializes drift from wherever the
        // boat actually is at that future moment — see the driftHeading
        // note in the nav state block.
        state.nav.driftHeading = null;
        printBlank();
        printLine('Autopilot engaged.', 'dim');
        beginCourseTurn(state, { targetHeading: courseSteeringTarget(state) });
        cmdElectrical(state);
      } else {
        printBlank();
        printLine('Autopilot disengaged.', 'dim');
        cmdElectrical(state);
      }
      return;
    }
    // ACCESSORY HOOK -- switching the circuit off mid-playback cuts the
    // cassette player the same way losing power outright would; see the
    // matching hook in updateBattery for when the battery itself dies.
    if (key === 'accessory' && !turningOn && activeTapeTitle != null) {
      stopCurrentTapeTrackImmediately();
      playTapeOffSound();
    }
    cmdElectrical(state);
  }

  function cmdPosition(state) {
    var ll = currentLatLon(state);
    printBlank();
    printLine('POSITION', 'heading-label');
    printLine(formatLatLon(ll.lat, ll.lon));
    if (state.nav.positionConfidence === 'uncertain') {
      printLine('(dead reckoning — no recent fix)', 'dim');
    }
    printBlank();
    printLine('HEADING', 'heading-label');
    printLine(Math.round(state.nav.heading) + '\u00B0  (intended course ' + Math.round(state.nav.intendedCourse) + '\u00B0)');
    if (state.nav.tack) {
      printLine('BEATING TO WINDWARD \u2014 AUTO-TACK (' + state.nav.tack.toUpperCase() + ' TACK)', 'dim');
    }
    printBlank();
    printLine('PROPULSION', 'heading-label');
    printLine(propulsionLabel(propulsionState(state, state.nav.heading)));
    printBlank();
    printLine('SPEED', 'heading-label');
    // Computed fresh from current conditions rather than read back from
    // state.boat.speed, which is only ever written by simTick() and can
    // otherwise sit uninitialized (or stale) until the next full tick —
    // up to 10 real minutes after a fresh departure, showing a misleading
    // 0.0 even when the boat is actually making way.
    var liveSpeed = computeBoatSpeed(state, state.nav.heading);
    printLine(liveSpeed.toFixed(1) + ' kt');
    printBlank();
    printLine('DISTANCE', 'heading-label');
    var remaining = distanceBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
    printLine(Math.round(state.nav.distanceTraveled) + ' nm sailed \u2014 approximately ' + Math.round(remaining) + ' nm remaining');
    if (state.nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX) {
      var segStart = WAYPOINTS[Math.max(0, state.nav.waypointIndex - 1)];
      var segEnd = WAYPOINTS[state.nav.waypointIndex] || FINAL_DEST;
      var xt = crossTrackNm(state.nav.lat, state.nav.lon, segStart.lat, segStart.lon, segEnd.lat, segEnd.lon);
      if (xt > 15) {
        printLine('Off the intended track by roughly ' + Math.round(xt) + ' nm.', 'amber');
      }
    }
    state.pendingChoice = {
      id: 'position-menu',
      options: [
        { label: 'OPEN MAP', action: 'open-map' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  function cmdWeather(state) {
    var w = state.weather;
    printBlank();
    printLine('WEATHER', 'heading-label');
    printLine(instrumentLine('WIND', compassPoint(w.windDirection) + ' ' + Math.round(w.windSpeed) + ' KT'));
    printLine(instrumentLine('SEAS', seaStateShortLabel(w.seaState) + ' \u00B7 ' + seaStateWaveHeightFt(w.seaState) + ' FT'));
    printLine(instrumentLine('TEMP', Math.round(w.temperatureF) + '\u00B0F'));
    printLine(instrumentLine('SKY', w.condition.toUpperCase()));
    if (w.oceanCurrent.speedKt == null) {
      printLine(instrumentLine('CURRENT', 'NO DATA'));
    } else if (w.oceanCurrent.speedKt < 0.2) {
      printLine(instrumentLine('CURRENT', 'NEGLIGIBLE'));
    } else {
      printLine(instrumentLine('CURRENT', compassPoint(w.oceanCurrent.directionDeg) + ' ' + w.oceanCurrent.speedKt.toFixed(1) + ' KT'));
    }
    state.pendingChoice = {
      id: 'weather-menu',
      options: [
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  // Fallback trend lines when no real forecastLine is cached — two
  // lines (wind, then seas), both derived from the SAME underlying
  // state.weather.trend, matching the two-strand NEXT 12 HOURS
  // structure. real.forecastLine, when available, is already
  // summarized from actual forecast data and is used as-is instead.
  var WIND_TREND_LINES = {
    building: 'Wind expected to build further.',
    easing: 'Wind easing over the next several hours.',
    steady: 'No significant wind change expected.',
  };
  var SEA_TREND_LINES = {
    building: 'Seas building to match.',
    easing: 'Seas gradually subsiding.',
    steady: 'Seas holding at their present state.',
  };

  // FORECAST — what's coming, distinct from WEATHER's what's-happening-
  // now: a forward-looking trend (the real API-derived forecastLine
  // when available, otherwise the wind/sea trend lines above — either
  // way driven by actual simulation state, never hardcoded per call),
  // plus a strategically meaningful current observation when one
  // exists (see currentStrategicNote — never a recommendation, purely
  // what the data shows), then the external OPEN IN WINDY link.
  function cmdForecast(state) {
    if (state.boat.battery <= 0 || state.boat.electrical === 'DAMAGED') {
      printBlank();
      printLine('FORECAST', 'heading-label');
      printBlank();
      printLine('NO POWER', 'amber');
      state.pendingChoice = { id: 'forecast-menu', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }
    var real = state.weather.realWx;
    printBlank();
    printLine('FORECAST', 'heading-label');
    printBlank();
    printLine('NEXT 12 HOURS', 'heading-label');
    if (real && real.forecastLine) {
      printLine(real.forecastLine);
    } else {
      var trend = state.weather.trend;
      printLine(WIND_TREND_LINES[trend] || WIND_TREND_LINES.steady);
      printLine(SEA_TREND_LINES[trend] || SEA_TREND_LINES.steady);
    }
    var currentNote = currentStrategicNote(state);
    if (currentNote) {
      printBlank();
      printLine(currentNote);
    }
    var seamanshipNote = seamanshipForecastNote(state);
    if (seamanshipNote) {
      printBlank();
      printLine(seamanshipNote, 'amber');
    }
    state.pendingChoice = {
      id: 'forecast-menu',
      options: [
        { label: 'OPEN IN WINDY', action: 'open-in-windy' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }



  function cmdSails(state) {
    printBlank();
    printLine('SAILS', 'heading-label');
    printLine('Currently: ' + sailConfigLabel(state.boat.sailConfig) + '.');
    state.pendingChoice = { id: 'sails-choice', options: sailOptions(state) };
  }

  /* --------------------------------------------------------------
     INVENTORY
     ------------------------------------------------------------
     What is physically aboard, right now — distinct from the LOG,
     which is what has happened. Provisions/water/fuel read from the
     same state.food / state.water / state.boat.fuelGallons that EAT,
     DRINK, and the ENGINE menu already use — there is no second copy
     of any of these numbers. The remaining categories (spares) live
     under state.supplies.*.

     INVENTORY is deliberately the ONE place CURRENT/ORIGINAL appears —
     it's where the player compares what remains against what they
     started with. EAT and DRINK (below) show CURRENT only: those menus
     are about a choice right now, not a supply audit.
     -------------------------------------------------------------- */
  var SPARES_NAMES = {
    sailRepairKit: 'Sail repair kit', steeringParts: 'Steering parts', engineParts: 'Engine parts', fuses: 'Fuses',
  };

  function inventoryLine(name, valueText) {
    var dots = '.'.repeat(Math.max(2, 22 - name.length));
    return name + ' ' + dots + ' ' + valueText;
  }

  function printSuppliesCategory(state, catKey, names, originals) {
    var data = state.supplies[catKey] || {};
    var keys = Object.keys(names);
    var any = keys.some(function (k) { return data[k] > 0; });
    if (!any) {
      printLine('Nothing left in this category.', 'amber');
      return;
    }
    keys.forEach(function (k) {
      if (data[k] > 0) printLine(inventoryLine(names[k], countCurrentOriginal(data[k], originals[k])));
    });
  }

  function showInventoryCategory(state, cat) {
    if (state.crew.location === 'below' && needsCabinLight(state)) { blockedByDarkness(state); return; }
    printBlank();
    switch (cat) {
      case 'provisions':
        printLine('PROVISIONS', 'heading-label');
        var anyFood = FOOD_ITEMS.some(function (f) { return state.food[f.key] > 0; });
        if (!anyFood) {
          printLine('Nothing left aboard to eat.', 'amber');
        } else {
          FOOD_ITEMS.forEach(function (f) { if (state.food[f.key] > 0) printLine(foodItemLine(f, state.food[f.key])); });
        }
        printLine(inventoryLine('Coffee', countCurrentOriginal(state.drinks.coffee, ORIGINAL_COFFEE)));
        printLine(inventoryLine('Tea', countCurrentOriginal(state.drinks.tea, ORIGINAL_TEA)));
        break;
      case 'water':
        printLine('WATER', 'heading-label');
        printLine(inventoryLine('Water', galCurrentOriginal(state.water.gallons, WATER_STARTING_GALLONS)));
        break;
      case 'fuel':
        printLine('FUEL', 'heading-label');
        printLine(inventoryLine('Diesel', galCurrentOriginal(state.boat.fuelGallons, FUEL_STARTING_GALLONS)));
        break;
      case 'spares':
        printLine('SPARES', 'heading-label');
        printSuppliesCategory(state, 'spares', SPARES_NAMES, ORIGINAL_SPARES);
        break;
      default:
        printLine('Nothing there.', 'dim');
    }
    state.pendingChoice = { id: 'inventory-category', options: [{ label: 'BACK', action: 'inventory:back' }] };
  }

  function cmdInventory(state) {
    if (state.crew.location === 'below' && needsCabinLight(state)) { blockedByDarkness(state); return; }
    printBlank();
    printLine('INVENTORY', 'heading-label');
    state.pendingChoice = {
      id: 'inventory-menu',
      options: [
        { label: 'PROVISIONS', action: 'inventory:provisions' },
        { label: 'WATER', action: 'inventory:water' },
        { label: 'FUEL', action: 'inventory:fuel' },
        { label: 'SPARES', action: 'inventory:spares' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  function rescueStatusLine(state) {
    var r = state.rescue;
    if (r.phase === 'traveling') return 'help is on the way.';
    if (r.phase === 'searching') return r.encounterActive ? 'rescuers searching nearby.' : 'search underway.';
    if (r.phase === 'rescued') return 'rescued.';
    return '';
  }

  // Reachable only once rescue is already underway (via RESCUE
  // STATUS in getContextualOptions) -- the old entry point (DISTRESS,
  // with ACTIVATE EPIRB/DEPLOY LIFE RAFT as player choices) is gone;
  // see cmdRadioForRescue below for how rescue actually starts now.
  // FIRE FLARE is the one action that still happens here, unchanged.
  function cmdDistress(state) {
    printBlank();
    printLine('RESCUE STATUS', 'heading-label');
    var r = state.rescue;
    var opts = [];
    printLine('RESCUE REQUESTED \u2014 ' + rescueStatusLine(state));
    if (r.encounterActive && state.supplies.safety.flares > 0) {
      opts.push({ label: 'FIRE FLARE', action: 'fire-flare' });
    }
    opts.push({ label: 'BACK', action: 'cancel' });
    state.pendingChoice = { id: 'rescue-status-menu', options: opts };
  }

  // The point-of-no-return warning -- selecting RADIO FOR RESCUE never
  // starts rescue by itself; only COMMENCE RESCUE (handled in
  // handleAction) actually does, ending the voyage immediately via
  // beginRescueEndingSequence below.
  function cmdRadioForRescue(state) {
    printBlank();
    printLine('RADIO FOR RESCUE', 'heading-label');
    printBlank();
    printLine('Requesting rescue will end the voyage.');
    printLine('You will not continue to Kaua\u02bbi.');
    state.pendingChoice = {
      id: 'radio-rescue-confirm',
      options: [
        { label: 'COMMENCE RESCUE', action: 'commence-rescue' },
        { label: 'CANCEL', action: 'cancel' },
      ],
    };
  }

  // The rescue ending itself -- immediate and final, no search/travel/
  // flare/EPIRB/life-raft sequence. A short, timed staggered reveal
  // (same "..." pacing rhythm as the marlin reveal elsewhere in this
  // file) culminating in the one permanent end state: NO LANDFALL,
  // with RESTART as the only way forward. uiBusy is held for the
  // duration so the header restart button can't interrupt it partway
  // through (same reasoning as runShortAction's own use of it).
  var RESCUE_ENDING_LINES = [
    'You make the call.',
    '...',
    'Someone answers.',
    '...',
    'You won\u2019t reach Kaua\u02bbi this time.',
    '...',
  ];
  function beginRescueEndingSequence(state) {
    uiBusy = true;
    var index = 0;
    function showNext() {
      printLine(RESCUE_ENDING_LINES[index]);
      scrollToBottom();
      index++;
      if (index < RESCUE_ENDING_LINES.length) {
        setTimeout(showNext, 1400);
      } else {
        setTimeout(function () {
          printBlank();
          printLine('NO LANDFALL', 'heading-label');
          state.rescue.phase = 'rescued';
          state.pendingChoice = { id: 'rescue-ending', options: [{ label: 'RESTART', action: 'confirm-restart' }] };
          uiBusy = false;
          renderOptions(state);
          saveGameState(state);
          scrollToBottom();
        }, 1400);
      }
    }
    showNext();
  }

  function cmdEngine(state) {
    printBlank();
    printLine('ENGINE', 'heading-label');
    printLine('Status: ' + (state.boat.engineOn ? 'RUNNING' : 'OFF'));
    printLine('Diesel: ' + galCurrentOriginal(state.boat.fuelGallons, FUEL_STARTING_GALLONS));
    if (!state.boat.engineOn && state.boat.engine === 'DAMAGED') {
      printLine('Engine is damaged. Repair it before starting.', 'amber');
      state.pendingChoice = { id: 'engine-choice', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }
    if (!state.boat.engineOn && state.boat.fuelGallons <= 0) {
      printLine('No diesel left to start it.', 'amber');
      state.pendingChoice = { id: 'engine-choice', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }
    var toggleOption = state.boat.engineOn
      ? { label: 'STOP ENGINE', action: 'engine-stop' }
      : { label: 'START ENGINE', action: 'engine-start' };
    state.pendingChoice = { id: 'engine-choice', options: [toggleOption, { label: 'BACK', action: 'cancel' }] };
  }

  // The persistent "AT THE HELM" block — SET COURSE / ACTUAL HEADING /
  // WIND FROM / SPEED — shared by cmdHelm's own atHelm branch and
  // cmdChangeCourse (so it stays visible above the dial controls).
  // Whenever a real-time turn is currently running (activeTurn), this
  // ALSO (re-)attaches that turn's live updates to whichever lines were
  // just rendered here — see beginCourseTurn's own rotation timer,
  // which writes into activeTurn.headerRefs each tick. This is what
  // makes the header "live" regardless of how the player navigated
  // back to it: every time this function runs while a turn is active,
  // the turn's next tick starts updating THESE (currently on-screen)
  // nodes, not whatever it had before. Returns the same refs, mainly
  // for beginCourseTurn's own immediate use right after starting/
  // retargeting a turn while this screen is already showing.
  function printHelmAtHelmHeader(state) {
    printLine('AT THE HELM', 'heading-label');
    printLine(inventoryLine('SET COURSE', Math.round(state.nav.setCourse) + '\u00B0'));
    var headingEl = document.createElement('p');
    headingEl.className = 'line';
    headingEl.textContent = inventoryLine('ACTUAL HEADING', Math.round(state.nav.heading) + '\u00B0');
    tempViewEl.appendChild(headingEl);
    printLine(inventoryLine('WIND FROM', Math.round(state.weather.windDirection) + '\u00B0'));
    var speedEl = document.createElement('p');
    speedEl.className = 'line';
    speedEl.textContent = inventoryLine('SPEED', state.boat.speed.toFixed(1) + ' KT');
    tempViewEl.appendChild(speedEl);
    var refs = { headingEl: headingEl, speedEl: speedEl };
    if (activeTurn) activeTurn.headerRefs = refs;
    return refs;
  }

  function cmdHelm(state) {
    var nav = state.nav;
    printBlank();

    if (nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX) {
      // COASTAL: fully automatic. SET COURSE is the current leg's
      // bearing (auto-updates as the boat clears each waypoint);
      // ACTUAL HEADING reflects whatever the coastal auto-tack is doing
      // right now, which can differ from it. No manual control here —
      // the corridor is authored-safe and the player isn't required to
      // navigate it (nor is the new manual-helm system relevant here —
      // see the module notes on computeHeading). Bearing/distance are
      // computed fresh here rather than read from nav.intendedCourse,
      // which only updates once per simTick and can be a stale tick
      // behind when just viewed.
      printLine('HELM', 'heading-label');
      var wp = WAYPOINTS[nav.waypointIndex] || FINAL_DEST;
      printLine('SET COURSE ' + Math.round(bearingBetween(nav.lat, nav.lon, wp.lat, wp.lon)) + '\u00B0');
      printLine('ACTUAL HEADING ' + Math.round(nav.heading) + '\u00B0');
      if (nav.tack) {
        printLine('BEATING TO WINDWARD \u2014 AUTO-TACK (' + nav.tack.toUpperCase() + ' TACK)', 'dim');
      }
      printLine('NEXT ' + wp.name);
      printLine('DISTANCE ' + Math.round(distanceBetween(nav.lat, nav.lon, wp.lat, wp.lon)).toLocaleString() + ' NM');
      printBlank();
      printLine('Automatic through the coastal passage \u2014 course control unlocks in open water.', 'dim');
      state.pendingChoice = { id: 'helm-menu', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }

    nav.intendedCourse = bearingBetween(nav.lat, nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
    if (nav.setCourse == null) {
      nav.setCourse = Math.round(nav.intendedCourse);
    }
    // Computed fresh for the same reason as the coastal branch above —
    // must reflect the boat's actual current position the instant the
    // screen is viewed, e.g. right after SET FOR NĀWILIWILI, not
    // whatever nav.intendedCourse held as of the last tick.
    var liveBearingToDest = bearingBetween(nav.lat, nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);

    if (state.boat.steering === 'DAMAGED') {
      // Same "nothing to be done here" shape regardless of the
      // autopilot flag or manual-helm state — see the module notes on
      // computeHeading: damaged steering already forces the boat to
      // unattended drift either way, and TAKE THE HELM isn't reachable
      // with the helm itself broken. Preserve the existing repair/
      // rescue path; no second steering-condition system.
      printLine('HELM', 'heading-label');
      printLine(inventoryLine('SET COURSE', Math.round(nav.setCourse) + '\u00B0'));
      printLine(inventoryLine('ACTUAL HEADING', Math.round(nav.heading) + '\u00B0'));
      printLine(inventoryLine('BEARING TO N\u0100WILIWILI', Math.round(liveBearingToDest) + '\u00B0'));
      printBlank();
      printLine(inventoryLine('DISTANCE', Math.round(distanceBetween(nav.lat, nav.lon, FINAL_DEST.lat, FINAL_DEST.lon)).toLocaleString() + ' NM'));
      printLine(inventoryLine('AUTOPILOT', state.boat.autopilotOn ? 'ON' : 'OFF'));
      if (nav.landWarningLevel !== 'none') {
        printBlank();
        printLine(LAND_WARNING_TEXT[nav.landWarningLevel], 'amber');
      }
      printBlank();
      printLine('Steering is damaged. Course cannot be changed until it\u2019s repaired.', 'amber');
      state.pendingChoice = { id: 'helm-menu', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }

    if (state.crew.atHelm) {
      // AT THE HELM: the player is actively hand-steering. Deliberately
      // a leaner field set than the other two states — SET COURSE,
      // ACTUAL HEADING, WIND FROM, SPEED — the direct feedback loop for
      // learning to sail by feel (course chosen vs. where the bow
      // actually settles vs. wind vs. how fast that combination is
      // going), rather than the navigational BEARING/DISTANCE fields
      // that matter more when something else is doing the steering.
      printHelmAtHelmHeader(state);
      if (nav.landWarningLevel !== 'none') {
        printBlank();
        printLine(LAND_WARNING_TEXT[nav.landWarningLevel], 'amber');
      }
      state.pendingChoice = {
        id: 'helm-menu',
        options: [
          { label: 'CHANGE COURSE', action: 'cmd:change-course' },
          { label: 'SET FOR N\u0100WILIWILI', action: 'set-for-nawiliwili' },
          { label: 'LEAVE THE HELM', action: 'leave-helm' },
        ],
      };
      return;
    }

    printLine('HELM', 'heading-label');
    if (state.boat.autopilotOn) {
      printLine(inventoryLine('SET COURSE', Math.round(nav.setCourse) + '\u00B0'));
      printLine(inventoryLine('ACTUAL HEADING', Math.round(nav.heading) + '\u00B0'));
      if (nav.tack) {
        printLine('BEATING TO WINDWARD \u2014 AUTO-TACK (' + nav.tack.toUpperCase() + ' TACK)', 'dim');
      }
      printLine(inventoryLine('BEARING TO N\u0100WILIWILI', Math.round(liveBearingToDest) + '\u00B0'));
      printBlank();
      printLine(inventoryLine('DISTANCE', Math.round(distanceBetween(nav.lat, nav.lon, FINAL_DEST.lat, FINAL_DEST.lon)).toLocaleString() + ' NM'));
      printLine(inventoryLine('AUTOPILOT', 'ON'));
      if (nav.landWarningLevel !== 'none') {
        printBlank();
        printLine(LAND_WARNING_TEXT[nav.landWarningLevel], 'amber');
      }
      state.pendingChoice = {
        id: 'helm-menu',
        options: [
          { label: 'CHANGE COURSE', action: 'cmd:change-course' },
          { label: 'SET FOR N\u0100WILIWILI', action: 'set-for-nawiliwili' },
          { label: 'BACK', action: 'cancel' },
        ],
      };
      return;
    }

    // AUTOPILOT OFF, nobody at the helm: unattended. SET COURSE is
    // deliberately not shown here — nothing is currently steering
    // toward it, so displaying it alongside ACTUAL HEADING would
    // wrongly suggest something still is. It's preserved internally
    // (see computeHeading/TAKE THE HELM) — just not surfaced until
    // someone actually takes the helm or the autopilot comes back on.
    printLine(inventoryLine('ACTUAL HEADING', Math.round(nav.heading) + '\u00B0'));
    printLine(inventoryLine('BEARING TO N\u0100WILIWILI', Math.round(liveBearingToDest) + '\u00B0'));
    printBlank();
    printLine(inventoryLine('DISTANCE', Math.round(distanceBetween(nav.lat, nav.lon, FINAL_DEST.lat, FINAL_DEST.lon)).toLocaleString() + ' NM'));
    printLine(inventoryLine('AUTOPILOT', 'OFF'));
    if (nav.landWarningLevel !== 'none') {
      printBlank();
      printLine(LAND_WARNING_TEXT[nav.landWarningLevel], 'amber');
    }
    state.pendingChoice = {
      id: 'helm-menu',
      options: [
        { label: 'TAKE THE HELM', action: 'take-helm' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  var COURSE_DIAL_STEPS = [-10, -1, 1, 10];

  // The player's way of picking any of 000-359 through a button-only
  // interface: dial a draft value up or down from the current course,
  // then confirm. Only ever reachable once open ocean unlocks it (the
  // HELM screen doesn't offer CHANGE COURSE before then). Also reachable
  // while autopilot is steering (not just AT THE HELM) — the persistent
  // AT THE HELM header only makes sense for the latter, so it appears
  // here only when state.crew.atHelm; the autopilot-driven path keeps
  // its previous CURRENT COURSE/NEW COURSE-only display unchanged.
  function cmdChangeCourse(state) {
    var nav = state.nav;
    if (state.boat.steering === 'DAMAGED') { cmdHelm(state); return; } // shouldn't be reachable — button isn't shown otherwise
    if (nav.courseDraft == null) nav.courseDraft = Math.round(nav.setCourse);
    printBlank();
    if (state.crew.atHelm) {
      printHelmAtHelmHeader(state);
      printBlank();
      printLine('CHANGE COURSE', 'heading-label');
      printLine('NEW COURSE ' + nav.courseDraft + '\u00B0');
    } else {
      printLine('CHANGE COURSE', 'heading-label');
      printLine('CURRENT COURSE ' + Math.round(nav.setCourse) + '\u00B0');
      printLine('NEW COURSE ' + nav.courseDraft + '\u00B0');
    }
    var opts = COURSE_DIAL_STEPS.map(function (step) {
      return { label: (step > 0 ? '+' : '') + step + '\u00B0', action: 'course-draft:' + step };
    });
    opts.push({ label: 'SET ' + nav.courseDraft + '\u00B0', action: 'course-draft-confirm' });
    opts.push({ label: 'BACK', action: 'course-draft-cancel' });
    state.pendingChoice = { id: 'change-course-menu', options: opts };
  }

  function cmdSleep(state) {
    if (state.crew.watchState !== 'awake') return; // shouldn't be reachable — button isn't shown otherwise
    state.crew.watchState = 'trying';
    state.crew.sleepAttemptStartedAt = state.meta.voyageMinutes;
    state.pendingChoice = null; // otherwise the WELLBEING menu that led here keeps winning in getContextualOptions, and GET UP never actually appears
    clearTempView(); // otherwise printEcho's "> SLEEP" (from the button that led here) sits there redundantly for the whole sleep session
    log(state, tryingToSleepNarrative());
    flushNewLogEntries(state);
  }

  // GALLEY — food, drink, and the dishes chore, all in one place. The
  // menu itself never hides options based on darkness (matches the old
  // WELLBEING screen's philosophy) — EAT/DRINK already check
  // needsCabinLight at their own top, so the player discovers the
  // restriction by trying the thing rather than never seeing it offered.
  function cmdGalley(state) {
    printBlank();
    printLine('GALLEY', 'heading-label');
    printBlank();
    var c = state.crew;
    printLine(statusLine('HUNGER', HUNGER_LABELS[hungerLevel(c.hoursSinceMeal)]));
    printLine(statusLine('THIRST', THIRST_LABELS[thirstLevel(c.hoursSinceWater)]));
    var options = [
      { label: 'EAT', action: 'cmd:eat' },
      { label: 'DRINK', action: 'cmd:drink' },
    ];
    var dishesOpt = choreOptionIfDue(state, 'dishes');
    if (dishesOpt) options.push(dishesOpt);
    options.push({ label: 'BACK', action: 'cancel' });
    state.pendingChoice = { id: 'galley-menu', options: options };
  }

  // HEAD — personal washing. HYGIENE is a pure read of the existing
  // hoursSinceWash (see hygieneLevel) — no second cleanliness number.
  // There's no shower aboard Solace; WASH is the wet head's sink/
  // washcloth wash-up, unchanged from before.
  function cmdHead(state) {
    printBlank();
    printLine('HEAD', 'heading-label');
    printBlank();
    printLine(statusLine('HYGIENE', HYGIENE_LABELS[hygieneLevel(hoursSinceWash(state))]));
    state.pendingChoice = {
      id: 'head-menu',
      options: [
        { label: 'WASH', action: 'cmd:wash' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  // Short, restrained variants per chore so the same line doesn't repeat
  // constantly — picked at random each time; small pools are plenty for
  // something this incidental.
  var CHORE_LINES = {
    dishes: [
      'Washed the bowl and left it upside down to dry. Rain against the cabin roof.',
      'Rinsed the dishes and stowed them. Small thing, but it helps.',
      'Dishes done. The galley looks like itself again.',
    ],
    dryClothes: [
      'Hung everything near the companionway. It smells like wet canvas in here.',
      'Wrung out the oilskins and draped them to dry.',
      'Strung a line below and hung the wet gear along it.',
    ],
    tools: [
      'Stowed the tools back in their places.',
      'Wiped down the tools and put them away.',
      'Cleared the tools off the settee. The cabin feels less like a workshop.',
    ],
    bunk: [
      'Pulled the bunk back together.',
      'Straightened the berth and folded the blanket.',
      'Made the bunk. Small order in a small space.',
    ],
    air: [
      'Cracked the hatch and let the cabin breathe for a while.',
      'Aired the cabin out. The dampness lifts, a little.',
      'Opened things up below. Fresher air, finally.',
    ],
    tidy: [
      'Put everything back where it belongs.\nThe cabin feels bigger somehow.',
      'Cleared the clutter off the settee and stowed it properly.',
      'A few minutes of tidying. Everything has a place again.',
    ],
  };
  function pickChoreLine(kind) {
    var pool = CHORE_LINES[kind];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // One definition per chore: what clears it, what (if anything) gates
  // or consumes on top of that, and the small diminishing-returns
  // morale nudge for actually doing it — same shape as WASH/DISHES
  // always used. Never a big number; this is atmosphere, not a lever.
  var CHORE_DEFS = {
    dishes: {
      label: 'CLEANING UP', duration: 3, moraleKey: 'dishes', moraleGain: 3,
      canDo: function (s) { return hasEnoughWater(s, WATER_DISHES_GAL); },
      consume: function (s) { consumeWater(s, WATER_DISHES_GAL); },
      clear: function (s) { s.crew.dishesDirtySinceMinutes = null; },
    },
    dryClothes: {
      label: 'DRYING GEAR', duration: 3, moraleKey: 'dryClothes', moraleGain: 3,
      clear: function (s) { s.crew.clothesWetSinceMinutes = null; },
    },
    tools: {
      label: 'STOWING TOOLS', duration: 2, moraleKey: 'tools', moraleGain: 2,
      clear: function (s) { s.crew.toolsOutSinceMinutes = null; },
    },
    bunk: {
      label: 'MAKING BUNK', duration: 2, moraleKey: 'bunk', moraleGain: 2,
      clear: function (s) { s.crew.bunkUnmadeSinceMinutes = null; },
    },
    air: {
      label: 'AIRING CABIN', duration: 3, moraleKey: 'air', moraleGain: 3,
      clear: function (s) { s.crew.cabinStuffySinceMinutes = null; s.crew.dampCabinHours = 0; },
    },
    tidy: {
      label: 'TIDYING UP', duration: 3, moraleKey: 'tidy', moraleGain: 3,
      clear: function (s) { s.crew.clutterCount = 0; s.crew.clutterSinceMinutes = null; },
    },
  };
  var CHORE_LABELS = {
    dishes: 'DO DISHES', dryClothes: 'DRY CLOTHES', tools: 'PUT AWAY TOOLS',
    bunk: 'MAKE BUNK', air: 'AIR OUT CABIN', tidy: 'TIDY UP',
  };

  // Chores are now distributed across the physical rooms they belong
  // to (see room-mapping comment above CHORE_DEFS's original home)
  // rather than living in one combined CHORES screen — this replaces
  // the old buildChoreOptions/cmdChore with a per-kind check each
  // room's own command calls for itself. Same underlying triggers,
  // same performChore dispatcher, same CHORE_DEFS — only how a due
  // chore surfaces to the player has changed.
  function choreOptionIfDue(state, kind) {
    var c = state.crew;
    var due;
    if (kind === 'dishes') due = c.dishesDirtySinceMinutes != null;
    else if (kind === 'dryClothes') due = c.clothesWetSinceMinutes != null;
    else if (kind === 'tools') due = c.toolsOutSinceMinutes != null;
    else if (kind === 'bunk') due = c.bunkUnmadeSinceMinutes != null;
    else if (kind === 'air') due = c.cabinStuffySinceMinutes != null;
    else if (kind === 'tidy') due = c.clutterCount >= CLUTTER_TIDY_THRESHOLD;
    else due = false;
    return due ? { label: CHORE_LABELS[kind], action: 'chore:' + kind } : null;
  }

  // Which GALLEY_AUDIO_FILES key (if any) plays for a given chore kind
  // — currently just dishes (dishes.mp3); every other CHORE_DEFS kind
  // stays on the plain fixed-duration dots, as before. Same map-based
  // shape as FOOD_PREP_AUDIO_KEY, so adding a sound for another chore
  // later is one entry here, not a new branch.
  var CHORE_AUDIO_KEY = {
    dishes: 'dishes',
  };

  function performChore(state, kind) {
    if (needsCabinLight(state)) { blockedByDarkness(state); return; }
    var def = CHORE_DEFS[kind];
    if (!def) return;
    if (def.canDo && !def.canDo(state)) {
      printBlank();
      printLine('Not enough water.', 'amber');
      return;
    }
    var doChore = function (s) {
      if (def.consume) def.consume(s);
      def.clear(s);
      var gain = routineMoraleGain(s, def.moraleKey, def.moraleGain);
      s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
      log(s, pickChoreLine(kind));
      flushNewLogEntries(s);
    };
    var choreAudioKey = CHORE_AUDIO_KEY[kind];
    if (choreAudioKey) {
      runAudioSyncedAction(state, {
        label: def.label,
        playAudio: function (onEnded) { return playGalleyOneShot(choreAudioKey, onEnded); },
        action: doChore,
      });
    } else {
      runShortAction(state, {
        label: def.label,
        duration: def.duration,
        action: doChore,
      });
    }
  }

  // SALOON — the quiet leisure/psychological center of the boat: READ,
  // LISTEN (the existing tape player, renamed only at this access
  // point), and RELAX (see below). TIDY UP lands here as the most
  // sensible home for general below-deck clutter, which comes from
  // activity all over the boat (a book left out, a meal's wrappers),
  // not one single room.
  function cmdSaloon(state) {
    printBlank();
    printLine('SALOON', 'heading-label');
    printBlank();
    printLine(statusLine('MORALE', moraleLevel(state.crew.morale)));
    var options = [
      { label: 'READ', action: 'cmd:bookshelf' },
      { label: 'LISTEN', action: 'cmd:tape-player' },
      { label: 'RELAX', action: 'cmd:relax' },
    ];
    var tidyOpt = choreOptionIfDue(state, 'tidy');
    if (tidyOpt) options.push(tidyOpt);
    options.push({ label: 'BACK', action: 'cancel' });
    state.pendingChoice = { id: 'saloon-menu', options: options };
  }

  // RELAX — sitting with nothing particular to do. Not meditation, not
  // sleep, not a minigame: a short, understated beat (one of several
  // varied setup lines, so it doesn't repeat verbatim) followed by one
  // random PONDERING (see the PONDERINGS pool and pickPondering — this
  // is now the ONLY place they surface; checkAmbientEvent no longer
  // picks them). Small, diminishing-returns morale nudge via the same
  // routineMoraleGain every other routine activity already uses, so
  // it's not an efficient morale-farming loop.
  var RELAX_SETUP_LINES = [
    'You sit for a while and listen to the boat.',
    'You settle into the saloon and let your mind wander.',
    'You lean back and let the boat do the work for a while.',
    'You let yourself do nothing in particular for a few minutes.',
    'You sit quietly and watch the light move across the cabin.',
  ];
  function cmdRelax(state) {
    runShortAction(state, {
      label: 'RELAXING',
      duration: 5,
      action: function (s) {
        var gain = routineMoraleGain(s, 'relax', 4);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        log(s, pickFromPool(RELAX_SETUP_LINES));
        var thought = pickPondering(s);
        var f = s.flags;
        if (!f.recentAmbientTexts) f.recentAmbientTexts = [];
        f.recentAmbientTexts.push(thought);
        if (f.recentAmbientTexts.length > AMBIENT_HISTORY_LENGTH) f.recentAmbientTexts.shift();
        log(s, thought);
        flushNewLogEntries(s);
        cmdSaloon(s);
      },
    });
  }

  // CABIN — sleep, clothing, and their related chores. COMFORT is a
  // pure read of the existing clothing-comfort system (comfortLabel,
  // defined near HUNGER/THIRST/ENERGY above) — never a second
  // temperature calculation.
  function cmdCabin(state) {
    printBlank();
    printLine('CABIN', 'heading-label');
    printBlank();
    var c = state.crew;
    printLine(statusLine('ENERGY', ENERGY_LABELS[energyLevel(c.fatigue)]));
    printLine(statusLine('COMFORT', comfortLabel(state)));
    var options = [
      { label: 'SLEEP', action: 'cmd:sleep' },
      { label: 'CHANGE', action: 'cmd:clothing' },
    ];
    var dryOpt = choreOptionIfDue(state, 'dryClothes');
    if (dryOpt) options.push(dryOpt);
    var bunkOpt = choreOptionIfDue(state, 'bunk');
    if (bunkOpt) options.push(bunkOpt);
    var airOpt = choreOptionIfDue(state, 'air');
    if (airOpt) options.push(airOpt);
    options.push({ label: 'BACK', action: 'cancel' });
    state.pendingChoice = { id: 'cabin-menu', options: options };
  }

  // NAV STATION — Solace herself: navigation, weather, resources,
  // electrical, boat STATUS, and DISTRESS. PUT AWAY TOOLS lands here
  // too (tools come out for REPAIR, itself reached from STATUS) rather
  // than in a personal-living-space room. Preserves every existing
  // nav/weather/inventory/electrical/status/rescue function exactly —
  // this only changes where they're reached from.
  function cmdNavStation(state) {
    printBlank();
    printLine('NAV STATION', 'heading-label');
    var toolsOpt = choreOptionIfDue(state, 'tools');
    var rescueItem = rescueMenuOption(state);
    var extraGroup = [];
    if (toolsOpt) extraGroup.push(toolsOpt);
    if (rescueItem) extraGroup.push(rescueItem);
    var options = groupedOptions([
      [
        { label: 'POSITION', action: 'cmd:position' },
        { label: 'WEATHER', action: 'cmd:weather' },
        { label: 'FORECAST', action: 'cmd:forecast' },
        { label: 'INVENTORY', action: 'cmd:inventory' },
      ],
      [
        { label: 'ELECTRICAL', action: 'cmd:electrical' },
        { label: 'STATUS', action: 'cmd:status' },
      ],
      extraGroup,
      [{ label: 'BACK', action: 'cancel' }],
    ]);
    state.pendingChoice = { id: 'nav-station-menu', options: options };
  }


  // Small, quiet morale nudges for the four new routine activities. Full
  // value if it's genuinely been a while; doing the same thing again
  // soon after helps much less — these are small comforts, not a lever
  // to pull repeatedly for morale. crew.lastRoutineAt tracks each one
  // independently (not persisted anywhere the player can see).
  function routineMoraleGain(state, key, fullGain) {
    var last = state.crew.lastRoutineAt[key];
    var hoursSince = last == null ? 999 : (state.meta.voyageMinutes - last) / 60;
    state.crew.lastRoutineAt[key] = state.meta.voyageMinutes;
    if (hoursSince >= 6) return fullGain;
    if (hoursSince >= 2) return Math.round(fullGain * 0.4);
    return Math.max(1, Math.round(fullGain * 0.15));
  }

  function cmdWash(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:head'); return; }
    if (!hasEnoughWater(state, WATER_WASH_GAL)) {
      printBlank();
      printLine('Not enough water.', 'amber');
      return;
    }
    runShortAction(state, {
      label: 'WASHING UP',
      duration: 3,
      action: function (s) {
        consumeWater(s, WATER_WASH_GAL);
        var gain = routineMoraleGain(s, 'wash', 4);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        log(s, 'A wash-up with fresh water. Small thing, helps anyway.');
        flushNewLogEntries(s);
      },
    });
  }

  // CLOTHING — see the CLOTHING section (near CABIN_TEMP_COLD_MAX_F) for
  // the hidden warmth/wetness model this menu is a thin front end for.
  // No numbers or GOOD/BAD meter shown here — just what's worn, and
  // WET tags where it matters.
  function clothingWetDisplayCategory(state) {
    // Torso wetness displays on whichever layer is actually exposed —
    // the outer garment if one's worn, otherwise the top itself.
    return state.crew.clothing.outer !== 'none' ? 'outer' : 'top';
  }

  function clothingLine(name, valueLabel, isWet) {
    return inventoryLine(name, valueLabel + (isWet ? ' \u2014 WET' : ''));
  }

  // CLOTHING MENU NAVIGATION — every submenu (TOP/OUTER/BOTTOM/FEET/
  // ACCESSORIES) redisplays this same screen, freshly reflecting
  // whatever just changed, rather than dropping back to the contextual
  // BELOW DECK menu — see performClothingChange/performAccessoryToggle.
  // The player only ever leaves CLOTHING by explicitly choosing BACK,
  // which is its own action ('clothing-done', not the generic 'cancel'
  // every other screen uses) so it can generate the one finished-outfit
  // observation — see performClothingLeave.
  function cmdClothing(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:cabin'); return; }
    printBlank();
    printLine('CHANGE', 'heading-label');
    var clo = state.crew.clothing, wet = state.crew.wetClothing;
    var wetDisplayCat = clothingWetDisplayCategory(state);
    printLine(clothingLine('TOP', CLOTHING_LABELS.top[clo.top], wetDisplayCat === 'top' && wet.torso));
    printLine(clothingLine('OUTER', CLOTHING_LABELS.outer[clo.outer], wetDisplayCat === 'outer' && wet.torso));
    printLine(clothingLine('BOTTOM', CLOTHING_LABELS.bottom[clo.bottom], wet.bottom));
    printLine(clothingLine('FEET', CLOTHING_LABELS.feet[clo.feet], wet.feet));
    printLine(inventoryLine('BEANIE', clo.beanie ? 'ON' : 'OFF'));
    printLine(inventoryLine('GLOVES', clo.gloves ? 'ON' : 'OFF'));
    state.pendingChoice = {
      id: 'clothing-menu',
      options: [
        { label: 'TOP', action: 'cmd:clothing-top' },
        { label: 'OUTER', action: 'cmd:clothing-outer' },
        { label: 'BOTTOM', action: 'cmd:clothing-bottom' },
        { label: 'FEET', action: 'cmd:clothing-feet' },
        { label: 'ACCESSORIES', action: 'cmd:clothing-accessories' },
        { label: 'BACK', action: 'clothing-done' },
      ],
    };
  }

  // TOP/OUTER/BOTTOM/FEET are all the same shape — three choices plus
  // BACK — so one generic submenu builder covers all four.
  var CLOTHING_CATEGORY_ORDER = {
    top: ['tshirt', 'sweater', 'none'],
    outer: ['waterproofJacket', 'windbreaker', 'none'],
    bottom: ['pants', 'shorts', 'underwear'],
    feet: ['boots', 'socks', 'barefoot'],
  };
  var CLOTHING_CATEGORY_TITLE = { top: 'TOP', outer: 'OUTER', bottom: 'BOTTOM', feet: 'FEET' };

  function cmdClothingCategory(state, category) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:cabin'); return; }
    printBlank();
    printLine(CLOTHING_CATEGORY_TITLE[category], 'heading-label');
    var options = CLOTHING_CATEGORY_ORDER[category].map(function (value) {
      return { label: CLOTHING_LABELS[category][value], action: 'wear:' + category + ':' + value };
    });
    options.push({ label: 'BACK', action: 'cmd:clothing' });
    state.pendingChoice = { id: 'clothing-category-menu', options: options };
  }
  function cmdClothingTop(state) { cmdClothingCategory(state, 'top'); }
  function cmdClothingOuter(state) { cmdClothingCategory(state, 'outer'); }
  function cmdClothingBottom(state) { cmdClothingCategory(state, 'bottom'); }
  function cmdClothingFeet(state) { cmdClothingCategory(state, 'feet'); }

  function cmdClothingAccessories(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:cabin'); return; }
    printBlank();
    printLine('ACCESSORIES', 'heading-label');
    var clo = state.crew.clothing;
    printLine(inventoryLine('BEANIE', clo.beanie ? 'ON' : 'OFF'));
    printLine(inventoryLine('GLOVES', clo.gloves ? 'ON' : 'OFF'));
    state.pendingChoice = {
      id: 'clothing-accessories-menu',
      options: [
        { label: 'BEANIE', action: 'toggle-accessory:beanie' },
        { label: 'GLOVES', action: 'toggle-accessory:gloves' },
        { label: 'BACK', action: 'cmd:clothing' },
      ],
    };
  }

  // Which hidden wet-state bucket each worn category feeds — TOP and
  // OUTER share one (torso), since only one of them is ever actually
  // exposed to the weather at a time; see clothingWetDisplayCategory.
  var CLOTHING_WET_KEY = { top: 'torso', outer: 'torso', bottom: 'bottom', feet: 'feet' };
  var CLOTHING_WET_EXPOSURE_FIELD = { torso: 'torsoWetExposureMinutes', bottom: 'bottomWetExposureMinutes', feet: 'feetWetExposureMinutes' };

  // No flat morale bonus for changing clothes — the reward for dressing
  // right is avoiding the discomfort penalties above, not a free lever
  // to pull. Putting on something dry over a WORN-wet item retires that
  // item to the existing DRY CLOTHES chore (clothesWetSinceMinutes)
  // rather than magically drying it on the spot — see performChore's
  // dryClothes definition. No per-item prose either: picking individual
  // garments just changes them and refreshes the menu (see cmdClothing)
  // — the one moment of actual text happens when the player leaves via
  // BACK (performClothingLeave), not on every selection along the way.
  function performClothingChange(state, category, value) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:cabin'); return; }
    var c = state.crew;
    if (c.clothing[category] === value) {
      cmdClothing(state); // already wearing this -- nothing to change, back to the main CLOTHING screen same as any other pick
      return;
    }
    var wetKey = CLOTHING_WET_KEY[category];
    var wasWet = c.wetClothing[wetKey];
    runShortAction(state, {
      label: 'CHANGING',
      duration: 2,
      action: function (s) {
        var cc = s.crew;
        cc.clothing[category] = value;
        cc.wetClothing[wetKey] = false;
        cc[CLOTHING_WET_EXPOSURE_FIELD[wetKey]] = 0;
        if (wasWet && cc.clothesWetSinceMinutes == null) {
          cc.clothesWetSinceMinutes = s.meta.voyageMinutes;
        }
        // Stay in CLOTHING (refreshed) rather than dropping back to the
        // contextual BELOW DECK menu — lets the player make several
        // changes in a row without re-opening CLOTHING each time; see
        // the CLOTHING MENU NAVIGATION note above cmdClothing.
        cmdClothing(s);
      },
    });
  }

  function performAccessoryToggle(state, key) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:cabin'); return; }
    var turningOn = !state.crew.clothing[key];
    runShortAction(state, {
      label: turningOn ? 'PUTTING ON' : 'TAKING OFF',
      duration: 1,
      action: function (s) {
        s.crew.clothing[key] = turningOn;
        // Same "stay put, refreshed, no per-item prose" behavior as a
        // full clothing change above — accessories are equally covered
        // by "any clothing item, including things like sweaters and
        // windbreakers."
        cmdClothing(s);
      },
    });
  }

  // The one moment real clothing feedback happens — see the module
  // notes on clothingObservationLine. Mirrors the plain 'cancel'
  // action's immediate, synchronous style (and its fall-through to
  // whatever menu sits behind CLOTHING) but replaces the generic "Left
  // as it was." with one genuine observation about the outfit just
  // finished.
  function performClothingLeave(state) {
    printBlank();
    printLine(clothingObservationLine(state), 'dim');
  }


  function bookProgressPct(bookDef, bookState) {
    return clamp(Math.round((bookState.minutesRead / bookDef.requiredMinutes) * 100), 0, 100);
  }
  function formatBookProgress(bookDef, bookState) {
    if (bookState.completed) return 'READ';
    return bookProgressPct(bookDef, bookState) + '%';
  }

  function buildBookshelfOptions(state) {
    var opts = BOOKS.map(function (b) {
      var bs = state.books[b.id];
      return { label: b.title.toUpperCase() + ' \u2014 ' + formatBookProgress(b, bs), action: 'start-reading:' + b.id };
    });
    opts.push({ label: 'BACK', action: 'cmd:saloon' });
    return opts;
  }

  function cmdBookshelf(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:saloon'); return; }
    printBlank();
    printLine('BOOKSHELF', 'heading-label');
    state.pendingChoice = { id: 'bookshelf-menu', options: buildBookshelfOptions(state) };
  }

  // Begins the continuous activity: crew.readingBookId marks it active,
  // and syncReadingProgress (called every advanceSimulation, live or
  // offline catch-up alike) does the actual accumulating. The screen
  // itself just shows the quiet "settled in" dots and STOP READING —
  // nothing here needs repeated clicking.
  function performStartReading(state, bookId) {
    var bookDef = BOOKS_BY_ID[bookId];
    if (!bookDef) return;
    var bookState = state.books[bookId];
    if (bookState.completed) { cmdBookshelf(state); return; } // no rereading system yet -- just stay on the shelf
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:saloon'); return; } // defensive -- darkness could fall between opening the shelf and picking a book
    state.crew.readingBookId = bookId;
    state.crew.readingLastSyncedAt = currentGameMinutes(state); // starts the continuous clock fresh — nothing before this moment counts toward this session
    bumpClutter(state, 1); // the book itself, left out
    log(state, 'You open ' + bookDef.title + '.');
    flushNewLogEntries(state);
    state.pendingChoice = { id: 'reading', options: [{ label: 'STOP READING', action: 'stop-reading' }] };
  }

  function performStopReading(state) {
    if (state.crew.readingBookId == null) { cmdSaloon(state); return; } // defensive -- shouldn't be reachable otherwise
    syncReadingProgress(state); // commit the final partial interval since the last sync before stopping, so it's never lost
    if (state.crew.readingBookId == null) { flushNewLogEntries(state); return; } // the sync itself already ended the session (completion or darkness) and set up its own next screen -- don't double-handle it
    state.crew.readingBookId = null;
    log(state, 'You close the book.');
    flushNewLogEntries(state);
    cmdBookshelf(state);
  }

  // TAPE PLAYER — mirrors cmdBookshelf/buildBookshelfOptions in
  // presentation, but unlike READ this is never an exclusive activity:
  // selecting a tape here only ever starts/stops/changes the
  // persistent tape-player object (see section 6); it never sets up a
  // continuous "session" pendingChoice the way performStartReading
  // does, and the player is free to leave this screen immediately
  // while the tape keeps playing.
  function buildTapePlayerOptions(state) {
    var opts = [];
    if (activeTapeTitle != null) {
      opts.push({ label: 'STOP TAPE', action: 'stop-tape' });
    }
    TAPES.forEach(function (t) {
      if (t.title === activeTapeTitle) return; // don't re-list the one already playing
      opts.push({ label: t.title.toUpperCase(), action: 'start-tape:' + t.title });
    });
    opts.push({ label: 'BACK', action: 'cmd:saloon' });
    return opts;
  }

  function cmdTapePlayer(state) {
    printBlank();
    printLine('TAPE PLAYER', 'heading-label');
    if (activeTapeTitle != null) {
      printBlank();
      printLine(activeTapeTitle.toUpperCase() + ' \u2014 PLAYING', 'dim');
    }
    state.pendingChoice = { id: 'tape-player-menu', options: buildTapePlayerOptions(state) };
  }

  function performStartTape(state, title) {
    var tape = TAPES_BY_TITLE[title];
    if (!tape) { cmdTapePlayer(state); return; } // defensive
    // ACCESSORY HOOK -- gates BOTH a fresh start and changing tapes
    // (activeTapeTitle != null already implies the circuit was on and
    // had power a moment ago, but check fresh anyway rather than assume).
    var b = state.boat;
    if (!b.accessoryOn) {
      printBlank();
      printLine('The accessory circuit is off.', 'amber');
      cmdTapePlayer(state);
      return;
    }
    if (b.battery <= 0) {
      printBlank();
      printLine('You press PLAY. Nothing. The cassette player has no power.', 'amber');
      cmdTapePlayer(state);
      return;
    }
    if (activeTapeTitle != null) {
      // Changing tapes: stop the current one, play the mechanical
      // cassette-stop sound, and queue the new tape to start the
      // moment that sound actually finishes -- never overlapping.
      stopCurrentTapeTrackImmediately();
      pendingNextTapeTitle = tape.title;
      pendingNextTapePath = tape.path;
      playTapeOffSound();
    } else {
      startTapeTrack(tape.title, tape.path);
    }
    cmdTapePlayer(state);
  }

  function performStopTape(state) {
    stopCurrentTapeTrackImmediately();
    pendingNextTapeTitle = null; // an explicit stop cancels any change-in-progress too
    pendingNextTapePath = null;
    playTapeOffSound();
    cmdTapePlayer(state);
  }

  // The continuous reading engine. Progress, milestones, morale, and
  // both kinds of stop (completion, darkness) all live here so the old
  // one-shot logic never has to be duplicated per book. Unlike the old
  // per-tick version, this reacts to actual elapsed game time via its
  // own readingLastSyncedAt timestamp rather than a fixed TICK_MINUTES
  // step, so it doesn't wait for a full simTick to catch up. Called
  // once per advanceSimulation — never also from simTick — so elapsed
  // time is never double-counted.
  // KEPT as its own system even now that TICK_MINUTES=1, same reasoning
  // as syncCabinTemperature above: it never reads TICK_MINUTES, only
  // currentGameMinutes(), so it was already resolution-independent, and
  // it still earns its keep — STOP READING commits an exact sub-minute
  // partial interval rather than losing up to a minute of it, and a
  // milestone/completion is detected the moment it's crossed rather
  // than waiting for the next full tick.
  function syncReadingProgress(state) {
    var c = state.crew;
    if (c.readingBookId == null) return;

    var bookDef = BOOKS_BY_ID[c.readingBookId];
    var bookState = state.books[c.readingBookId];
    if (!bookDef || !bookState) { c.readingBookId = null; state.pendingChoice = null; return; } // defensive

    // Commit whatever time has genuinely elapsed FIRST, before checking
    // for anything that might end the session below -- otherwise a
    // session-ending interruption (darkness, something else taking over
    // the screen) would silently discard reading time that already
    // happened before it was detected, which is exactly the kind of
    // lost-progress bug this continuous system exists to prevent.
    var now = currentGameMinutes(state);
    if (c.readingLastSyncedAt == null) c.readingLastSyncedAt = now;
    var elapsed = now - c.readingLastSyncedAt;
    c.readingLastSyncedAt = now;
    if (elapsed > 0) {
      bookState.minutesRead += elapsed;
      var completing = bookState.minutesRead >= bookDef.requiredMinutes;
      if (completing) bookState.minutesRead = bookDef.requiredMinutes;
      var pct = bookProgressPct(bookDef, bookState);

      // Trigger every newly-crossed milestone, oldest first -- a large
      // offline jump can cross several at once.
      bookDef.milestones.forEach(function (m) {
        if (pct >= m.pct && bookState.triggeredMilestones.indexOf(m.pct) === -1) {
          bookState.triggeredMilestones.push(m.pct);
          log(state, m.text);
        }
      });

      c.readingMoraleAccumMinutes += elapsed;
      if (c.readingMoraleAccumMinutes >= READ_MORALE_CHUNK_MINUTES) {
        c.readingMoraleAccumMinutes -= READ_MORALE_CHUNK_MINUTES;
        var gain = routineMoraleGain(state, 'read', READ_MORALE_CHUNK_GAIN);
        c.morale = clamp(c.morale + gain, 0, 100);
      }

      if (completing) {
        bookState.completed = true;
        c.readingBookId = null;
        state.pendingChoice = { id: 'bookshelf-menu', options: buildBookshelfOptions(state) };
        return; // session already ended by completion -- no need to also check the interruption conditions below
      }
    }

    // Something else already took over the screen (an aft-locker prompt
    // and the like) -- reading quietly stops rather than fighting for
    // the UI; the interrupting event's own message already explains
    // what happened.
    if (state.pendingChoice && state.pendingChoice.id !== 'reading') {
      c.readingBookId = null;
      return;
    }

    // Darkness falling mid-session stops reading outright. Progress up
    // to this point is already committed above; lights are never
    // auto-turned-on and the player is never auto-navigated to the
    // electrical panel.
    if (c.location === 'below' && needsCabinLight(state)) {
      c.readingBookId = null;
      state.pendingChoice = null;
      log(state, 'Too dark to keep reading.');
      return;
    }
  }

  function foodItemLine(item, servings) {
    var dots = '.'.repeat(Math.max(2, 22 - item.name.length));
    return item.name + ' ' + dots + ' ' + countCurrentOriginal(servings, item.original);
  }

  // Resolves the currently-held catch (if any) into a food-item-shaped
  // object so the rest of performEat/eatFlavorLine can treat it exactly
  // like any other meal — species-specific name, always a cooked meal
  // (see FISH_MEAL_BY_SPECIES). Returns null if nothing's held, or the
  // held species somehow has no mapped meal (shouldn't happen — every
  // real FISH_SPECIES entry has one).
  function heldFishAsMealItem(state) {
    var held = state.fishing.heldFish;
    if (!held) return null;
    var mealName = FISH_MEAL_BY_SPECIES[held.speciesId];
    if (!mealName) return null;
    return { key: HELD_FISH_KEY, name: mealName, type: 'meal', cooked: true };
  }

  function buildMealsOptions(state) {
    var opts = FOOD_ITEMS.filter(function (f) { return f.type === 'meal' && state.food[f.key] > 0; })
      .map(function (f) { return { label: f.name.toUpperCase() + ' (' + state.food[f.key] + ')', action: 'eat:' + f.key }; });
    // FISHING HOOK -- the currently-held catch's specialty meal, if any,
    // appended as an additional MEALS option — never a generic FRESH
    // FISH entry. Only one can ever be held, so the count is always 1.
    var fishItem = heldFishAsMealItem(state);
    if (fishItem) opts.push({ label: fishItem.name.toUpperCase() + ' (1)', action: 'eat:' + HELD_FISH_KEY });
    opts.push({ label: 'BACK', action: 'cmd:eat' });
    return opts;
  }

  function buildSnacksOptions(state) {
    var opts = FOOD_ITEMS.filter(function (f) { return (f.type === 'snack' || f.type === 'chocolate') && state.food[f.key] > 0; })
      .map(function (f) { return { label: f.name.toUpperCase() + ' (' + state.food[f.key] + ')', action: 'eat:' + f.key }; });
    opts.push({ label: 'BACK', action: 'cmd:eat' });
    return opts;
  }

  // Whichever of MEALS/SNACKS an item belongs to, as a redisplay target
  // for a failed cooking gate (rough seas / not enough water) —
  // chocolate never reaches these gates (see performEat), so this only
  // ever needs to choose between the other two.
  function eatSubmenuPendingChoice(state, item) {
    return item.type === 'meal'
      ? { id: 'meals-menu', options: buildMealsOptions(state) }
      : { id: 'snacks-menu', options: buildSnacksOptions(state) };
  }

  function cmdEat(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:galley'); return; }
    printBlank();
    printLine('PROVISIONS', 'heading-label');
    var anyMeal = FOOD_ITEMS.some(function (f) { return f.type === 'meal' && state.food[f.key] > 0; }) || !!heldFishAsMealItem(state);
    var anySnack = FOOD_ITEMS.some(function (f) { return (f.type === 'snack' || f.type === 'chocolate') && state.food[f.key] > 0; });
    if (!anyMeal && !anySnack) {
      printLine('Nothing left aboard to eat.', 'amber');
      return;
    }
    state.pendingChoice = {
      id: 'provisions-menu',
      options: [
        { label: 'MEALS', action: 'cmd:meals' },
        { label: 'SNACKS', action: 'cmd:snacks' },
        { label: 'NEVER MIND', action: 'cancel' },
      ],
    };
  }

  function cmdMeals(state) {
    printBlank();
    printLine('MEALS', 'heading-label');
    state.pendingChoice = { id: 'meals-menu', options: buildMealsOptions(state) };
  }

  function cmdSnacks(state) {
    printBlank();
    printLine('SNACKS', 'heading-label');
    state.pendingChoice = { id: 'snacks-menu', options: buildSnacksOptions(state) };
  }

  function eatFlavorLine(state, item) {
    var rough = state.weather.seaState >= 4;
    var verb = item.cooked ? 'You make' : 'You eat';
    var where = rough ? 'below, braced against the motion' : (item.cooked ? 'in the galley' : 'in the cockpit');
    return verb + ' ' + item.name.toLowerCase() + ' ' + where + '.';
  }

  // How much hunger-relief TIME each type buys, applied as the value
  // hoursSinceMeal resets to (often negative — "buys a few extra hours
  // before hunger starts building again") rather than always snapping to
  // a flat zero. A MEAL's -3 keeps the sailor out of HUNGRY (threshold
  // 3, see hungerLevel) roughly twice as long as a SNACK's 0 — a meal
  // holding about twice as long as a snack is the whole point. Chocolate
  // isn't listed: it never touches hoursSinceMeal at all.
  var HUNGER_RESET_HOURS_BY_TYPE = { meal: -3, snack: 0 };

  // Comfort, not sustenance — no prep, no seastate/water gates,
  // no hunger/thirst/energy effect at all. A small, temporary morale
  // lift with the same diminishing-returns shape as routineMoraleGain,
  // keyed off lastChocolateAt so several pieces eaten back to back don't
  // each land a full comfort bump.
  function chocolateMoraleGain(state) {
    var last = state.crew.lastChocolateAt;
    var hoursSince = last == null ? 999 : (state.meta.voyageMinutes - last) / 60;
    var fullGain = 7;
    if (hoursSince >= 12) return fullGain;
    if (hoursSince >= 3) return Math.round(fullGain * 0.4);
    return Math.max(1, Math.round(fullGain * 0.15));
  }
  // Two pools depending on whether the sailor is still hungry (hungerLevel
  // > 0, i.e. not FULL) when the chocolate goes down — chocolate never
  // relieves hunger itself (see performEat), so a still-hungry sailor
  // gets copy that says so honestly rather than reading like a meal.
  var CHOCOLATE_LINES_FULL = ['You eat some chocolate.', 'A square of chocolate. Small, but it helps.'];
  var CHOCOLATE_LINES_HUNGRY = [
    'You\u2019re still hungry, but your spirits lift a little.',
    'You\u2019re still hungry. The chocolate helps anyway.',
    'It doesn\u2019t do much for the hunger, but your mood lifts.',
    'Still hungry, but a little better for it.',
  ];
  function eatChocolateLine(state) {
    if (state.food.chocolate === 0) return 'You eat the last of the chocolate, and sit for a while.';
    var lines = hungerLevel(state.crew.hoursSinceMeal) > 0 ? CHOCOLATE_LINES_HUNGRY : CHOCOLATE_LINES_FULL;
    return lines[Math.floor(Math.random() * lines.length)];
  }

  // Which GALLEY_AUDIO_FILES key (see the GALLEY AUDIO section above)
  // plays while a given food item is being prepared, keyed by
  // item.name since that's the one thing every source (a FOOD_ITEMS
  // entry, a held-fish meal via heldFishAsMealItem/
  // FISH_MEAL_BY_SPECIES, and Chocolate's own type:'chocolate' entry)
  // shares. Covers meals, snacks, and chocolate alike -- this is not
  // gated on item.cooked, since several mapped items (Energy Bar,
  // Mixed Nuts, Dried Mangos, Tuna on Crackers, Chocolate) are
  // uncooked. An item absent from this map just uses the plain fixed-
  // duration EATING/MAKING/PREPARING dots, as before. Adding a new
  // preparation sound for a new or existing item later is one line
  // here plus one entry in GALLEY_AUDIO_FILES/GALLEY_AUDIO_VOLUME —
  // nothing else in performEat changes.
  var FOOD_PREP_AUDIO_KEY = {
    // THICK BOIL
    'Chili Rice': 'thickBoil',
    'Oatmeal': 'thickBoil',
    'Rockfish Stew': 'thickBoil',
    'Lingcod Stew': 'thickBoil',
    'Bonito Curry': 'thickBoil',
    'Mahi Coconut Curry': 'thickBoil',
    // THIN BOIL
    'Mac & Cheese': 'thinBoil',
    'Chicken Noodle Soup': 'thinBoil',
    // BOIL + SIZZLE
    'Salmon + Mashed Potatoes': 'boilSizzle',
    'Salmon Rice Bowl': 'boilSizzle',
    'Mackerel Rice Bowl': 'boilSizzle',
    'Albacore Over Pasta': 'boilSizzle',
    'Ono Rice Bowl': 'boilSizzle',
    'Herring Rice Bowl': 'boilSizzle',
    'Salmon + Roasted Potatoes': 'boilSizzle',
    // SIZZLE
    'Pancakes': 'sizzle',
    // BOIL + CHOP
    'Aku Poke Bowl': 'boilChop',
    'Ahi Poke Bowl': 'boilChop',
    // POPCORN
    'Popcorn': 'popcorn',
    // WRAPPER
    'Energy Bar': 'wrapper',
    'Chocolate': 'wrapper',
    // NUTS
    'Mixed Nuts': 'nuts',
    // MANGO
    'Dried Mangos': 'mango',
    // TUNA ON CRACKERS
    'Tuna on Crackers': 'tunaCrackers',
  };

  function performEat(state, key) {
    var isHeldFish = key === HELD_FISH_KEY;
    var item = isHeldFish ? heldFishAsMealItem(state) : FOOD_ITEMS_BY_KEY[key];
    if (!item || (!isHeldFish && state.food[key] <= 0)) {
      printBlank();
      printLine("That's already gone.", 'dim');
      return;
    }

    if (item.type === 'chocolate') {
      var doEatChocolate = function (s) {
        s.food[key] -= 1;
        var gain = chocolateMoraleGain(s);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        s.crew.lastChocolateAt = s.meta.voyageMinutes;
        log(s, eatChocolateLine(s));
        flushNewLogEntries(s);
      };
      var chocolatePrepAudioKey = FOOD_PREP_AUDIO_KEY[item.name];
      if (chocolatePrepAudioKey) {
        runAudioSyncedAction(state, {
          label: 'EATING CHOCOLATE',
          playAudio: function (onEnded) { return playGalleyOneShot(chocolatePrepAudioKey, onEnded); },
          action: doEatChocolate,
        });
      } else {
        runShortAction(state, {
          label: 'EATING CHOCOLATE',
          duration: 2,
          action: doEatChocolate,
        });
      }
      return;
    }

    if (item.cooked) {
      if (state.weather.seaState >= 5) {
        printBlank();
        printLine('THE BOAT IS MOVING TOO VIOLENTLY', 'amber');
        printLine('TO COOK SAFELY.', 'amber');
        state.pendingChoice = eatSubmenuPendingChoice(state, item);
        return;
      }
    }
    // Cooking water: only items with a per-serving cost (item.waterGal,
    // currently just Oatmeal) draw any; everything else is 0 and this
    // check is simply skipped for them.
    var waterNeeded = item.waterGal || 0;
    if (waterNeeded > 0 && !hasEnoughWater(state, waterNeeded)) {
      printBlank();
      printLine('Not enough water.', 'amber');
      state.pendingChoice = eatSubmenuPendingChoice(state, item);
      return;
    }
    // Gates passed (or there weren't any) — the actual preparing/eating
    // takes a few real seconds. Cooking takes longer than grabbing
    // something ready to eat. This same mutation logic runs regardless
    // of which busy-action runner wraps it below — only the wrapper
    // (and therefore what determines the duration) differs.
    var label = (item.cooked ? 'MAKING ' : 'PREPARING ') + item.name.toUpperCase();
    var doEat = function (s) {
      var c = s.crew;
      if (waterNeeded > 0) consumeWater(s, waterNeeded);
      // FISHING HOOK -- the held catch is consumed whole, species and
      // all, rather than decrementing a food[] count — only one can
      // ever be held at a time. Clearing it here (rather than leaving
      // it to checkSpoilage) is what stops an eaten fish from later
      // being logged as spoiled.
      if (isHeldFish) {
        s.fishing.heldFish = null;
      } else {
        s.food[key] -= 1;
      }

      // Hunger: a real meal genuinely holds longer than a snack, so
      // this resets to a type-dependent offset rather than always
      // snapping to a flat zero.
      c.hoursSinceMeal = HUNGER_RESET_HOURS_BY_TYPE[item.type] || 0;

      // Meal-history monotony (hidden, never shown): an exponential
      // moving average nudged toward 1 by a snack, toward 0 by a real
      // meal. One item barely moves it; several days the same way
      // clearly does — see computeMoraleTarget's snackMealRatio
      // pressure.
      var snackWeight = item.type === 'snack' ? 1 : 0;
      c.snackMealRatio = c.snackMealRatio * 0.7 + snackWeight * 0.3;

      // A cooked meal leaves dishes behind — stamped once, not
      // re-stamped by a second meal before they're washed, so the
      // clock reflects how long they've ACTUALLY been sitting.
      if (item.cooked && c.dishesDirtySinceMinutes == null) {
        c.dishesDirtySinceMinutes = s.meta.voyageMinutes;
      }
      bumpClutter(s, 1); // wrappers, crumbs, a bowl left out — any meal leaves a little something

      var fatigueGain = item.type === 'meal' ? 3 : 1;
      var moraleGain = item.type === 'meal' ? 3 : 1;
      // Finally breaking a run of snack-heavy eating with something
      // proper feels genuinely restorative, on top of the flat amount.
      if (item.cooked && c.snackMealRatio > 0.5) moraleGain += 2;
      c.fatigue = clamp(c.fatigue - fatigueGain, 0, 100);
      c.morale = clamp(c.morale + moraleGain, 0, 100);
      log(s, eatFlavorLine(s, item));
      flushNewLogEntries(s);
    };

    // Any item with a mapped preparation sound (see FOOD_PREP_AUDIO_KEY
    // above — covers meals, snacks, and chocolate alike, not gated on
    // item.cooked) runs the EATING/MAKING/PREPARING dots for the actual
    // length of that audio file (see runAudioSyncedAction and
    // playGalleyOneShot) rather than a fixed duration — this is the
    // one general hook point every current and future galley
    // preparation sound goes through; everything else about the
    // action (gates already checked above, the mutation itself, the
    // resulting log line) is identical to any other item.
    var prepAudioKey = FOOD_PREP_AUDIO_KEY[item.name];
    if (prepAudioKey) {
      runAudioSyncedAction(state, {
        label: label,
        playAudio: function (onEnded) { return playGalleyOneShot(prepAudioKey, onEnded); },
        action: doEat,
      });
    } else {
      runShortAction(state, {
        label: label,
        duration: item.cooked ? 5 : 2,
        action: doEat,
      });
    }
  }

  // DRINK — its own ROUTINE submenu (matching the existing submenu
  // pattern), listing WATER/COFFEE/TEA with their live, authoritative
  // quantities right in the option label. All three draw from the SAME
  // state.water.gallons pool; there is no separate reserve for any of
  // them. Coffee and tea are counted resources of their own
  // (state.drinks), spent one at a time alongside the water they're
  // made with. Current-quantity only, like EAT — DRINK is about a choice
  // right now, not a supply audit; CURRENT/ORIGINAL is INVENTORY's job.
  function drinkMenuOptions(state) {
    return [
      { label: instrumentLine('WATER', galCurrentOnly(state.water.gallons).toUpperCase()), action: 'drink:water' },
      { label: instrumentLine('COFFEE', String(state.drinks.coffee)), action: 'drink:coffee' },
      { label: instrumentLine('TEA', String(state.drinks.tea)), action: 'drink:tea' },
      { label: 'BACK', action: 'cancel' },

  function performDrinkWater(state) {

      label: 'POURING WATER',

        flushNewLogEntries(s);

  function pickObservation(state) {
    var phase = voyagePhase(state);
    var pool = OBSERVATIONS[phase] || OBSERVATIONS.offshore;
    var tod = timeOfDayPhase(state);
    var special = [];
    if (tod === 'night' && pool.awe_night) special = special.concat(pool.awe_night);
    if (tod !== 'night' && pool.awe_day) special = special.concat(pool.awe_day);
    if (tod === 'dawn' && pool.sunrise) special = special.concat(pool.sunrise);
    if (tod === 'dusk' && pool.sunset) special = special.concat(pool.sunset);
    if (pool.awe) special = special.concat(pool.awe);
    var recent = state.flags.recentAmbientTexts || [];
    if (special.length && Math.random() < 0.18) {
      return pickFromPoolAvoidingRecent(special, recent);
    }
    var quiet = pool.quiet || [];
    if (!quiet.length) return 'The sea, the sky, the boat. Nothing more to report.';
    return pickFromPoolAvoidingRecent(quiet, recent);
  }


  // Which spare each system's repair consumes, and its display name.
  var REPAIR_SPARE_KEY = { sails: 'sailRepairKit', steering: 'steeringParts', engine: 'engineParts', electrical: 'fuses' };
  var REPAIR_SPARE_LABEL = { sailRepairKit: 'SAIL REPAIR KIT', steeringParts: 'STEERING PARTS', engineParts: 'ENGINE PARTS', fuses: 'FUSES' };
  var REPAIR_SYSTEM_LABEL = { sails: 'SAILS', steering: 'STEERING', engine: 'ENGINE', electrical: 'ELECTRICAL' };

  var REPAIR_SUCCESS_LINES = {
    sails: ['The patch holds. Sail drawing again.', 'Stitched and taped \u2014 she fills properly again.'],
    steering: ['The steering answers again.', 'The rudder bites again, helm answering true.'],
    engine: ['The engine turns over and settles into its rhythm.', 'She catches, coughs once, then runs clean.'],
    electrical: ['New fuse in. The panel comes back to life.', 'Power\u2019s back. The panel lights up again.'],
  };
  var REPAIR_FAILURE_LINES = {
    sails: ['The patch pulls loose as soon as it takes load.', 'Can\u2019t get the seam to hold.'],
    steering: ['The repair does not hold.', 'Whatever\u2019s wrong down there, this didn\u2019t fix it.'],
    engine: ['You put it back together and try the starter. Nothing.', 'Turns over, but won\u2019t catch.'],
    electrical: ['The new fuse goes immediately.', 'Still dead \u2014 the problem\u2019s elsewhere in the run.'],
  };

  // Centralized so the GOOD/FAIR/UNCERTAIN/POOR bands are easy to retune
  // without touching the penalty math itself.
  var REPAIR_SUCCESS_LABEL_THRESHOLDS = [
    { min: 0.70, text: 'GOOD' },
    { min: 0.50, text: 'FAIR' },
    { min: 0.30, text: 'UNCERTAIN' },
    { min: 0, text: 'POOR' },
  ];
  function repairSuccessLabel(chance) {
    for (var i = 0; i < REPAIR_SUCCESS_LABEL_THRESHOLDS.length; i++) {
      if (chance >= REPAIR_SUCCESS_LABEL_THRESHOLDS[i].min) return REPAIR_SUCCESS_LABEL_THRESHOLDS[i].text;
    }
    return 'POOR';
  }

  var REPAIR_BASE_SUCCESS_CHANCE = 0.95;
  var REPAIR_SUCCESS_FLOOR = 0.15; // no single bad factor, or even several, fully prohibits an attempt
  var REPAIR_SUCCESS_CEILING = 0.95;

  // Only the factors actually hurting the attempt are returned — a clean
  // bill of health on any one just leaves it off the list, per the spec.
  // Labels/thresholds mirror STATUS's own wellbeing bands, no new
  // vocabulary invented for this screen.
  function computeRepairPenalties(state) {
    var c = state.crew, w = state.weather;
    var factors = [];

    var eLvl = energyLevel(c.fatigue); // 0=DEPLETED..4=RESTED
    var energyPenalty = [0.35, 0.20, 0.08, 0, 0][eLvl];
    if (energyPenalty > 0) factors.push({ label: 'ENERGY', value: ENERGY_LABELS[eLvl], penalty: energyPenalty });

    var hLvl = hungerLevel(c.hoursSinceMeal); // 0=FULL..4=STARVING
    var hungerPenalty = [0, 0, 0.12, 0.22, 0.22][hLvl];
    if (hungerPenalty > 0) factors.push({ label: 'HUNGER', value: HUNGER_LABELS[hLvl], penalty: hungerPenalty });

    var tLvl = thirstLevel(c.hoursSinceWater);
    var thirstPenalty = [0, 0, 0.12, 0.28, 0.28][tLvl];
    if (thirstPenalty > 0) factors.push({ label: 'THIRST', value: THIRST_LABELS[tLvl], penalty: thirstPenalty });

    var moralePenalty = 0, moraleLabelText = null;
    if (c.morale < 20) { moralePenalty = 0.22; moraleLabelText = 'DEPLETED'; }
    else if (c.morale < 40) { moralePenalty = 0.12; moraleLabelText = 'LOW'; }
    if (moralePenalty > 0) factors.push({ label: 'MORALE', value: moraleLabelText, penalty: moralePenalty });

    var seaPenalty = 0;
    if (w.seaState >= 5) seaPenalty = 0.30;       // VERY ROUGH / HIGH
    else if (w.seaState === 4) seaPenalty = 0.15; // ROUGH
    if (seaPenalty > 0) factors.push({ label: 'SEA STATE', value: SEA_STATE_SHORT_LABELS[w.seaState], penalty: seaPenalty });

    var totalPenalty = factors.reduce(function (sum, f) { return sum + f.penalty; }, 0);
    return { factors: factors, totalPenalty: totalPenalty };
  }

  function repairSuccessChance(state) {
    var p = computeRepairPenalties(state);
    return clamp(REPAIR_BASE_SUCCESS_CHANCE - p.totalPenalty, REPAIR_SUCCESS_FLOOR, REPAIR_SUCCESS_CEILING);
  }

  // The decision screen for one damaged system: only negative factors,
  // the resulting SUCCESS label, and — if a spare remains — the button
  // to actually attempt it. No confirmation beyond this screen itself.
  function cmdRepairSystem(state, systemKey) {
    printBlank();
    printLine('REPAIR \u2014 ' + REPAIR_SYSTEM_LABEL[systemKey], 'heading-label');
    var p = computeRepairPenalties(state);
    p.factors.forEach(function (f) {
      printLine(statusLine(f.label, f.value));
    });
    var chance = repairSuccessChance(state);
    printLine(statusLine('SUCCESS', repairSuccessLabel(chance)));
    var spareKey = REPAIR_SPARE_KEY[systemKey];
    var options = [];
    if (state.supplies.spares[spareKey] > 0) {
      options.push({ label: 'ATTEMPT REPAIR', action: 'attempt-repair:' + systemKey });
    } else {
      printBlank();
      printLine('NO ' + REPAIR_SPARE_LABEL[spareKey] + ' REMAIN.', 'amber');
    }
    options.push({ label: 'BACK', action: 'cmd:repair' });
    state.pendingChoice = { id: 'repair-decision', options: options };
  }

  // The actual attempt: one spare consumed regardless of outcome, some
  // fatigue either way, and — only on success — the system restored to
  // GOOD. A failed attempt leaves the system DAMAGED; it never damages
  // anything else.
  function performSystemRepairAttempt(state, systemKey) {
    var spareKey = REPAIR_SPARE_KEY[systemKey];
    if (state.supplies.spares[spareKey] <= 0) return; // not reachable with the button hidden, but guard anyway
    var chance = repairSuccessChance(state);
    runShortAction(state, {
      label: 'WORKING ON ' + REPAIR_SYSTEM_LABEL[systemKey],
      duration: 6,
      action: function (s) {
        s.supplies.spares[spareKey] -= 1;
        s.crew.fatigue = clamp(s.crew.fatigue + rand(6, 10), 0, 100);
        if (s.crew.toolsOutSinceMinutes == null) s.crew.toolsOutSinceMinutes = s.meta.voyageMinutes;
        if (Math.random() < chance) {
          s.boat[systemKey] = 'GOOD';
