<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05080a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>SOLACE — Ship's Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #050806;
    --bg-lit: #0a0f0c;           /* CABIN LIGHTS ON — subtly brighter, same near-black green cast; nothing else changes */
    --phosphor: #8fd7ac;         /* SOFT — all normal non-interactive game text */
    --phosphor-bright: #c9f5da;  /* BRIGHT — selectable actions/commands only */
    --phosphor-dim: #4d7a5e;     /* DARK — timestamps ONLY, nothing else */
    --amber: #cf9f4a;
    --danger: #b5583f;
    --rule: rgba(143, 215, 172, 0.14);
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }

  html.cabin-lit, body.cabin-lit {
    background: var(--bg-lit);
  }

  body {
    font-family: var(--font-mono);
    color: var(--phosphor);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  #crt {
    position: relative;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.14) 0px,
      rgba(0,0,0,0.14) 1px,
      transparent 2px,
      transparent 3px
    );
    mix-blend-mode: multiply;
    opacity: 0.35;
    animation: flicker 7s infinite;
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 0.35; }
    97% { opacity: 0.28; }
    98% { opacity: 0.4; }
  }

  @media (prefers-reduced-motion: reduce) {
    #scanlines { animation: none; }
  }

  #topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--phosphor);
    flex-shrink: 0;
    gap: 0.6rem;
  }

  #topbar-right {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .hdr-btn {
    background: none;
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid var(--rule);
    color: var(--phosphor-bright);
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    padding: 0.25rem 0.6rem;
    cursor: pointer;
  }
  .hdr-btn:hover { border-color: var(--phosphor); }
  .hdr-btn[hidden] { display: none; }

  #navstrip {
    display: flex;
    flex-wrap: nowrap;
    gap: 0.65rem;
    padding: 0.5rem 1.1rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--phosphor);
    flex-shrink: 0;
    overflow-x: auto;
  }
  #navstrip[hidden] { display: none; }
  #navstrip span { white-space: nowrap; }
  #navstrip span::after { content: '\00b7'; margin-left: 0.65rem; }
  #navstrip span:last-child::after { content: none; margin-left: 0; }

  #output {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem 1.2rem 0.4rem;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    text-shadow: 0 0 6px rgba(143,215,172,0.22);
  }

  .line {
    margin: 0 0 0.35rem;
    line-height: 1.55;
    font-size: 0.95rem;
  }

  .gap { height: 0.7rem; margin: 0; }

  .heading-label {
    color: var(--phosphor);
    letter-spacing: 0.08em;
  }

  .dim { color: var(--phosphor); }
  .amber { color: var(--amber); }
  .danger { color: var(--danger); }
  .echo { color: var(--phosphor); }

  .entry { margin-bottom: 0.9rem; }
  .entry-ts {
    color: var(--phosphor-dim);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    margin-bottom: 0.15rem;
  }
  .entry-text {
    font-size: 0.95rem;
    line-height: 1.6;
  }

  #controls {
    flex-shrink: 0;
    border-top: 1px solid var(--rule);
    padding: 0.8rem 1.2rem calc(0.7rem + env(safe-area-inset-bottom));
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  #options {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    max-height: 48vh;
    overflow-y: auto;
  }

  .option-divider {
    margin: 0.35rem 0;
  }

  .option {
    background: none;
    appearance: none;
    -webkit-appearance: none;
    border: none;
    color: var(--phosphor-bright);
    font-family: inherit;
    font-size: 0.92rem;
    text-align: left;
    padding: 0.15rem 0;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .option:hover, .option:focus-visible { text-decoration: underline; }
  .option:focus-visible { outline: 1px dashed var(--phosphor); outline-offset: 2px; }

  @media (max-width: 480px) {
    .line, .entry-text, .option { font-size: 0.98rem; }
    #output, #controls { padding-left: 0.9rem; padding-right: 0.9rem; }
  }
</style>
</head>
<body>
  <div id="crt">
    <div id="scanlines" aria-hidden="true"></div>
    <header id="topbar">
      <span id="vessel-line">S/V SOLACE — AT DOCK</span>
      <div id="topbar-right">
        <button id="restart-btn" class="hdr-btn" type="button" hidden>RESTART</button>
        <button id="sound-btn" class="hdr-btn" type="button">SOUND: OFF</button>
        <span id="clock">—</span>
      </div>
    </header>
    <div id="navstrip" hidden>
      <span id="nav-day"></span>
      <span id="nav-speed"></span>
      <span id="nav-heading"></span>
      <span id="nav-region"></span>
    </div>

    <main id="output" aria-live="polite"><div id="temp-view"></div></main>

    <footer id="controls">
      <div id="options"></div>
    </footer>
  </div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     LANDFALL — prototype vertical slice (Seattle -> Kauaʻi)
     ---------------------------------------------------------------------
     Built as a single self-contained file (matches how you usually ship
     these — no build step, drop straight into Neocities). The sections
     below mirror the multi-file layout from the brief; split them into
     separate <script src="..."> files later if you ever want to, nothing
     here depends on being in one file.

       1. Config & constants
       2. Game state
       3. Save / load (localStorage)
       4. Simulation engine
       5. Narrative / event checks
       6. Ambient audio (procedural, WebAudio — no sound files needed)
       7. Terminal rendering
       8. Commands
       9. Boot sequence

     REAL-TIME PRINCIPLE (see PROJECT.md for the full rationale):
     1 real minute = 1 game minute, always. Nothing in this file may
     call advanceSimulation() with an arbitrary chosen duration — the
     only legitimate callers are catchUpFromRealTime() (diffing real
     timestamps) and the live tick loop (diffing real elapsed ms).
     REST/SLEEP is a STATE (crew.watchState), not a time-skip action —
     see beginSleep() / wakeUp() / checkSleepInterrupt() below.
     ===================================================================== */

  /* ============================================================
     1. CONFIG & CONSTANTS
     ============================================================ */
  var STORAGE_KEY = 'kauaiVoyage_v1';
  var TICK_MINUTES = 1;               // simulation resolution, in simulated minutes -- was 10; every per-tick rate/probability elsewhere is expressed as an hourly rate times (TICK_MINUTES/60), or converted via tickProbability() below, so it scales correctly with this value. A few things (driftWeather's random-walk magnitudes, computeHeading's wobble/drift-wander) are scaled by TICK_MINUTES/10 directly since they were tuned by feel for the old 10-minute step, not derived from a stated hourly rate.
  var MAX_CATCHUP_TICKS = 200000;     // safety cap (~139 days) for offline catch-up -- scaled 10x alongside TICK_MINUTES to preserve the same real-world catch-up window per advanceSimulation call
  var LIVE_TICK_SECONDS = 20;         // how often we advance sim while the tab is open

  var VESSEL_NAME = 'SOLACE';
  var DEPARTURE_PORT = "Shilshole Bay, Seattle";
  var DESTINATION_PORT = "Nawiliwili, Kauaʻi";

  var GAME = null;
  var printedCount = 0;

  /* ============================================================
     2. GAME STATE
     ============================================================ */
  function newGameState() {
    var now = Date.now();
    var start = WAYPOINTS[0];
    var startBearing = bearingBetween(start.lat, start.lon, WAYPOINTS[1].lat, WAYPOINTS[1].lon);
    var state = {
      version: 1,
      meta: {
        departedAt: now,
        lastTick: now,
        leftoverMinutes: 0,
        voyageMinutes: 0,
        foodInventoryVersion: 2, // current canonical FOOD_ITEMS quantities — see migrateProvisionsIfNeeded; a fresh voyage is already at the current version and must never be rebased
      },
      nav: {
        lat: start.lat,
        lon: start.lon,
        waypointIndex: 1,          // index into WAYPOINTS currently being steered toward, while in the coastal corridor (< OPEN_WATER_WAYPOINT_INDEX); frozen at OPEN_WATER_WAYPOINT_INDEX once free-heading navigation takes over
        distanceTraveled: 0,       // odometer — actual nm sailed, not progress toward the goal
        intendedCourse: startBearing, // coastal phase: bearing to the current waypoint. Open-ocean phase: live direct bearing to Nāwiliwili (for the BEARING TO NĀWILIWILI display) — NOT necessarily what the boat is actually steering; see setCourse for that. Refreshed every tick either way.
        setCourse: null,           // the player's manually chosen open-ocean compass heading (0-359), via CHANGE COURSE or SET FOR NĀWILIWILI — null until the coastal corridor is cleared, at which point computeHeading() initializes it toward Nāwiliwili if still unset
        courseDraft: null,         // in-progress heading value while the CHANGE COURSE picker is open; null when not in use
        landWarningLevel: 'none',  // 'none' | 'ahead' | 'close' | 'danger' — escalating land-proximity state, so each level only logs once on the way up (and clears silently once the danger passes)
        groundedOn: null,          // name of the landmass currently blocking movement, or null — see applyGroundingIfNeeded()
        tack: null,                // null | 'port' | 'starboard' — set only while auto-tacking through the COASTAL corridor; see resolveCoastalAutoTack(). Never set in open ocean.
        tackDistanceNm: 0,         // nm covered on the current coastal tack, for deciding when to come about
        driftHeading: null,        // open ocean, AUTOPILOT OFF only — the free-wandering heading; null until autopilot is first switched off, initialized from the boat's actual heading at that moment so it never jumps
        heading: startBearing,
        positionConfidence: 'good',
        coastalRouteMigrated: true, // a fresh voyage never needs the one-time resync migrateCoastalWaypointIndexIfNeeded() does for older saves
      },
      weather: {
        // SW — real wind, not routing logic, so it can still drift into a
        // headwind over time. But the old 340 (NNW) was picked back when
        // heading was a fake constant unconnected to geography; now that
        // the first leg genuinely points north out of Shilshole, a due-
        // north headwind there would leave the boat nearly unsailable
        // before it even clears the marina. A SW wind gives it a fair
        // reach instead, which also happens to be a common real Puget
        // Sound pattern in unsettled weather like this game opens with.
        windDirection: 225,
        windSpeed: 13,
        seaState: 2,
        condition: 'overcast',
        trend: 'steady',
        temperatureF: 56, // a plausible Shilshole-in-fall reading; see estimateTemperatureF for the offline fallback as the boat moves
        // Cache of the last successful REAL-WORLD observation for the
        // boat's own position (see fetchRealWeather/maybeRefreshRealWeather).
        // Purely a cache the simulation reads when deciding whether/how to
        // nudge toward reality — nothing here is required for Landfall to
        // run, and a save with all of this null just means "no real data
        // yet," which behaves identically to never having connectivity.
        realWx: {
          fetchedRealMs: null,   // Date.now() at the successful fetch -- drives both the refresh cadence and "how stale is this" (real time, not sim time, so a long offline gap can't be mistaken for dozens of due refreshes)
          lat: null,
          lon: null,
          windSpeedKt: null,
          windDirectionDeg: null,
          temperatureF: null,
          condition: null,
          forecastLine: null,    // pre-summarized 1-2 line FORECAST text, or null to fall back to the existing simulated forecast lines
        },
        // Same caching pattern as realWx, separate provider (Open-Meteo's
        // marine API, not the atmospheric one) and separate cadence — see
        // fetchOceanCurrent/maybeRefreshOceanCurrent. speedKt/directionDeg
        // null means "no current data for this position" and the whole
        // current system just goes quiet (no correction, no WEATHER line,
        // no forecast observation) rather than inventing a reading.
        oceanCurrent: {
          fetchedRealMs: null,
          lat: null,
          lon: null,
          speedKt: null,
          directionDeg: null,    // direction the current flows TOWARD (oceanographic convention — the opposite sense from wind, which is FROM)
          northSample: null,     // { speedKt, directionDeg } roughly CURRENT_SAMPLE_OFFSET_NM north of the boat, or null — see maybeRefreshOceanCurrent/currentStrategicNote
          southSample: null,     // same, to the south
        },
      },
      boat: {
        sailConfig: 'furled',       // full | reefed | minimal | furled — starts furled; nothing raises sails but the player
        engineOn: false,           // running under power (departure motor-out, or engine failure recovery later)
        fuelGallons: 20,           // diesel remaining, in gallons — see DIESEL_BURN_RATE_GPH
        speed: 0,                  // kt — recomputed every tick; POSITION displays a live value regardless
        // The four tracked systems — GOOD or DAMAGED, nothing in between.
        // No passive wear: these only change via a scheduled failure
        // event or a repair. See checkScheduledFailures / performSystemRepairAttempt.
        sails: 'GOOD',
        steering: 'GOOD',
        engine: 'GOOD',
        electrical: 'GOOD',        // physical wiring/fuse CONDITION, separate from battery charge below
        nextFailureAt: rand(24, 48) * 60, // voyageMinutes of the next scheduled normal failure — see scheduleNextFailure
        battery: 100,               // 0-100% charge — see BATTERY_DRAIN_PER_HOUR/BATTERY_CHARGE_PER_HOUR, never affected by electrical condition or repairs
        autopilotOn: true,          // holds SET COURSE and auto-tacks; OFF (or STEERING/ELECTRICAL damaged) means the boat just wanders roughly along its present heading — see computeHeading
        fanOn: false,
        heaterOn: false,
        cabinLightsOn: false,
        cabinTemperatureF: null,    // initialized near outside temperature at departure — see newGameState below
      },
      crew: {
        fatigue: 8,
        hoursSinceRest: 3,
        hoursSinceMeal: 2,
        hoursSinceWater: 2,
        morale: 72,
        watchState: 'awake',        // 'awake' | 'trying' | 'sleeping' — see SLEEP PRESSURE note below
        sleepAttemptStartedAt: null, // voyageMinutes when SLEEP was selected, for the "trying" timeout
        sleepStartedAt: null,        // voyageMinutes at the moment sleep actually began, for duration text on waking
        lastCoffeeAt: null,          // voyageMinutes of the last coffee, for the mild/subtle alertness effect
        coffeeCount: 0,
        inLifeRaft: false,
        location: 'above',          // 'above' | 'below' — a physical place, not a menu state; see GO ABOVE/GO BELOW
        lastRoutineAt: { wash: null, dress: null, dishes: null, read: null, dryClothes: null, tools: null, bunk: null, air: null, tidy: null }, // voyageMinutes of last use, for gentle diminishing returns
        snackMealRatio: 0,            // 0-1 exponential moving average of how "snacky" recent meals have been (see performEat) — hidden monotony pressure on morale, never shown
        dishesDirtySinceMinutes: null, // voyageMinutes a cooked meal first left dishes dirty, or null if clean — set once, not re-stamped by later meals, cleared by DISHES
        lastChocolateAt: null,        // voyageMinutes of last chocolate, for diminishing returns — mirrors lastCoffeeAt's role
        clothesWetSinceMinutes: null, // voyageMinutes clothes were first noticed wet (above deck in rain/spray), or null — cleared by DRY CLOTHES or CHANGE
        toolsOutSinceMinutes: null,   // voyageMinutes since a completed repair left tools out, or null — cleared by PUT AWAY TOOLS
        bunkUnmadeSinceMinutes: null, // voyageMinutes since last waking, or null once made — cleared by MAKE BUNK
        dampCabinHours: 0,            // accumulates while below deck in bad weather; resets when the cabin is aired out
        cabinStuffySinceMinutes: null, // voyageMinutes dampCabinHours first crossed the threshold, or null — cleared by AIR OUT CABIN
        clutterCount: 0,              // small accumulator from minor activity (eating, reading); resets once TIDY UP is done
        clutterSinceMinutes: null,    // voyageMinutes clutterCount first crossed the threshold, or null — for consistent chore ordering
        readingBookId: null,          // id into BOOKS while continuous reading is active, or null — see syncReadingProgress
        readingLastSyncedAt: null,    // currentGameMinutes() as of the last syncReadingProgress commit — set fresh in performStartReading, meaningless while readingBookId is null
        readingMoraleAccumMinutes: 0, // accumulated reading minutes since the last morale chunk was awarded — hidden, never shown
        tapeListenDay: null,          // Math.floor(voyageMinutes/1440) as of tapeListenCount below — the only tape-player state that's persisted; see awardTapeListenMorale
        tapeListenCount: 0,           // qualifying tape-listening sessions credited so far on tapeListenDay — resets whenever the current voyage day no longer matches
      },
      food: {
        oatmeal: 12, pasta: 8, rice: 12, soup: 6, chili: 6,
        tuna: 8, crackers: 8, peanutButter: 8, nuts: 12,
        driedFruit: 8, energyBars: 8, freshFruit: 6, freshBread: 4,
        chocolate: 4,
        freshFish: 0, // FISHING HOOK -- caught, not part of starting provisions; see FOOD_ITEMS and the FISHING section
      },
      drinks: {
        coffee: 24, tea: 24,
      },
      water: {
        gallons: 50.0, // ONE authoritative potable-water supply for the whole boat -- drinking, coffee, tea, washing, dishes, and cooking all draw from this same value. See WATER_* constants and hasEnoughWater/consumeWater.
      },
      supplies: {
        propane: 60, // stove uses
        spares: {
          sailRepairKit: 2, steeringParts: 2, engineParts: 2, fuses: 3,
        },
        safety: { flares: 6 }, // EPIRB/life raft are status, not a count — see state.rescue / crew.inLifeRaft
      },
      // FISHING HOOK -- the only persisted fishing state; the in-progress
      // cast/bite/reaction session itself is NOT here (see the FISHING
      // section's fishingSession variable and its own comment for why).
      fishing: {
        keptFishOnDay: null,                     // voyageDayNumber() on which a fish was last kept, for the one-kept-fish-per-day rule
        freshFishCaughtAt: [],                   // voyageMinutes of each currently-held Fresh Fish unit, for individual spoilage — see checkSpoilage()
      },
      books: newBooksState(),
      flags: {
        aftLockerTriggerAt: rand(8 * 60, 16 * 60), // guaranteed once, sometime hour 8-16
        aftLockerTriggered: false,
        aftLockerResolved: false,
        aftLockerEscalated: false,
        aftLockerDeferredAt: null,
        fatigueNarrated: false,
        thirstNarrated: false,
        hungerNarrated: false,
        cleanlinessNarrated: false,
        galleyNarrated: false,
        freshFruitSpoiled: false,
        freshBreadSpoiled: false,
        lastMilestone: 0,
        arrivedAtDestination: false, // guards the open-ocean arrival log line so it fires once, not every tick spent sitting at Nāwiliwili
      },
      rescue: {
        epirbOn: false,
        activatedAt: null,       // voyageMinutes
        phase: 'none',           // 'none' | 'traveling' | 'searching' | 'rescued'
        travelMinutes: 0,        // computed once at activation, from position/conditions
        nextSearchEventAt: null,
        encounterActive: false,
        encounterStartedAt: null,
        encounterKind: null,     // 'aircraft' | 'vessel'
        encounterFlareFired: false,
      },
      departure: { stageIndex: 0 }, // walks through DEPARTURE_STEPS before normal gameplay opens up
      pendingChoice: null,
      log: [],
    };
    state.boat.cabinTemperatureF = state.weather.temperatureF; // starts at ambient — see syncCabinTemperature for the ongoing drift
    state.boat.cabinTemperatureLastSyncedAt = 0; // currentGameMinutes() is 0 here too (voyageMinutes and leftoverMinutes both start at 0)
    return state;
  }

  /* ============================================================
     3. SAVE / LOAD
     ============================================================ */
  // Never pass a raw caught error/exception object to console.warn —
  // some console/devtools environments (remote-debugging-protocol
  // relays in particular, common in automated or embedded testing
  // setups) serialize console arguments through structured-clone-like
  // logic, and not every thrown value is guaranteed cloneable there (a
  // DOMException, e.g. AbortError from a fetch timeout, is a known
  // case). This is the actual, confirmed source of "DataCloneError:
  // The object can not be cloned" showing up alongside otherwise
  // ordinary warnings: logging the error was itself throwing a SECOND,
  // unrelated error, in whichever of these call sites happened to fire.
  // Always extract a plain string description instead.
  function describeError(err) {
    if (!err) return 'unknown error';
    var name = err.name ? String(err.name) : 'Error';
    var message = err.message ? String(err.message) : '';
    return message ? (name + ' \u2014 ' + message) : name;
  }

  function loadGameState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      console.warn('Save file unreadable, starting fresh:', describeError(e));
      return null;
    }
  }

  function saveGameState(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('Could not save game:', describeError(e));
    }
  }

  /* ============================================================
     4. SIMULATION ENGINE
     ============================================================ */
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function rand(min, max) { return min + Math.random() * (max - min); }
  function pickFromPool(pool) { return pool[Math.floor(Math.random() * pool.length)]; }
  // Converts a probability that was designed as "chance per 10-minute
  // tick" (the old TICK_MINUTES) into the correct chance per CURRENT
  // tick, preserving the cumulative odds of the event having happened
  // by any given point in time -- not just a linear p/10 approximation.
  // If P is the chance of NOT happening in one old 10-minute tick, then
  // over TICK_MINUTES/10 of a new tick the chance of not happening must
  // be P^(TICK_MINUTES/10), so that TICK_MINUTES/10 of those compose
  // back to exactly P across the same 10 minutes. Used by
  // fallAsleepChance and wakeChanceWhileSleeping, both explicitly
  // "per-tick" probabilities tuned against the old step size.
  function tickProbability(p10) {
    return 1 - Math.pow(1 - p10, TICK_MINUTES / 10);
  }
  function normalizeDeg(d) { return ((d % 360) + 360) % 360; }
  function angleDiff(a, b) {
    var d = Math.abs(a - b) % 360;
    return d > 180 ? 360 - d : d;
  }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* --------------------------------------------------------------
     NAVIGATION GEOMETRY
     ------------------------------------------------------------
     Real spherical-earth math: bearings, distances, and "move from
     here, on this heading, this far" position updates. The boat's
     lat/lon is dead reckoning — it only ever changes by physically
     moving from its last position (see simTick below). Nothing here
     ever snaps or interpolates the boat toward a waypoint; waypoints
     are only used to compute a bearing to steer toward.
     -------------------------------------------------------------- */
  var EARTH_RADIUS_NM = 3440.065;

  function toRad(deg) { return deg * Math.PI / 180; }
  function toDeg(rad) { return rad * 180 / Math.PI; }
  function normalizeLon(lon) { return ((lon + 540) % 360) - 180; }

  function distanceBetween(lat1, lon1, lat2, lon2) {
    var phi1 = toRad(lat1), phi2 = toRad(lat2);
    var dPhi = toRad(lat2 - lat1);
    var dLambda = toRad(lon2 - lon1);
    var a = Math.sin(dPhi / 2) * Math.sin(dPhi / 2) +
      Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) * Math.sin(dLambda / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return EARTH_RADIUS_NM * c;
  }

  function bearingBetween(lat1, lon1, lat2, lon2) {
    var phi1 = toRad(lat1), phi2 = toRad(lat2);
    var dLambda = toRad(lon2 - lon1);
    var y = Math.sin(dLambda) * Math.cos(phi2);
    var x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLambda);
    return normalizeDeg(toDeg(Math.atan2(y, x)));
  }

  // Given a start point, a true heading, and a distance, return where the
  // boat physically ends up. This is the ONLY thing that may ever change
  // state.nav.lat/lon — called once per simulated tick with that tick's
  // actual heading and actual distance covered.
  function destinationPoint(lat, lon, headingDeg, distanceNm) {
    var delta = distanceNm / EARTH_RADIUS_NM;
    var theta = toRad(headingDeg);
    var phi1 = toRad(lat), lambda1 = toRad(lon);
    var phi2 = Math.asin(Math.sin(phi1) * Math.cos(delta) + Math.cos(phi1) * Math.sin(delta) * Math.cos(theta));
    var lambda2 = lambda1 + Math.atan2(
      Math.sin(theta) * Math.sin(delta) * Math.cos(phi1),
      Math.cos(delta) - Math.sin(phi1) * Math.sin(phi2)
    );
    return { lat: toDeg(phi2), lon: normalizeLon(toDeg(lambda2)) };
  }

  // Perpendicular distance (nm) from a point to the great-circle line
  // running from (lat1,lon1) to (lat2,lon2) — used to tell the player how
  // far off their intended track they actually are, computed fresh from
  // real position rather than accumulated as a separate counter.
  function crossTrackNm(lat, lon, lat1, lon1, lat2, lon2) {
    var d13 = distanceBetween(lat1, lon1, lat, lon) / EARTH_RADIUS_NM;
    var brng13 = toRad(bearingBetween(lat1, lon1, lat, lon));
    var brng12 = toRad(bearingBetween(lat1, lon1, lat2, lon2));
    var xt = Math.asin(Math.sin(d13) * Math.sin(brng13 - brng12));
    return Math.abs(xt * EARTH_RADIUS_NM);
  }

    for (var d = 0; d <= LAND_LOOKAHEAD_NM; d += LAND_SAMPLE_STEP_NM) {

    // wobbled actual heading — using the noisy value here would make

    // what's really the same ongoing situation.
    var nearest = nearestLandAhead(state.nav.lat, state.nav.lon, state.nav.setCourse);

  // to pass through islands" actually means mechanically. Grounding
  // blocks movement and logs once per episode (tracked by name), not
  // every tick the player leaves the boat pointed at the beach, but
  // never damages the boat — there is no hull condition to damage.
  // Clears silently the moment a tick's projected position no longer

  function voyagePhase(state) {

    if (wi <= 9) return 'strait';    // the Strait of Juan de Fuca
    if (wi <= 11) return 'coastal';  // approaching / just past Cape Flattery

  var HUNGER_LABELS = ['FULL', 'SATISFIED', 'HUNGRY', 'VERY HUNGRY', 'STARVING'];
  var THIRST_LABELS = ['WELL HYDRATED', 'HYDRATED', 'THIRSTY', 'VERY THIRSTY', 'SEVERELY THIRSTY'];
  var ENERGY_LABELS = ['DEPLETED', 'EXHAUSTED', 'TIRED', 'GOOD', 'RESTED'];

  function hungerLevel(hoursSinceMeal) {
    if (hoursSinceMeal <= 3) return 0;
    if (hoursSinceMeal <= 7) return 1;
    if (hoursSinceMeal <= 13) return 2;
    if (hoursSinceMeal <= 20) return 3;
    return 4;

  function thirstLevel(hoursSinceWater) {
    if (hoursSinceWater <= 3) return 0;

    if (hoursSinceWater <= 20) return 3;
    return 4;

  // simTick same as everything else) — no separate "penalty" bookkeeping

    else if (tLevel === 3) target -= 18;

    else if (c.fatigue <= 40) target += 0;
    else if (c.fatigue <= 60) target -= 8;
    else if (c.fatigue <= 80) target -= 16;

    var washHours = hoursSinceWash(state);

    var dishHours = dishesDirtyHours(state);

    // neglected at once the total stays modest next to hunger/thirst.
    var wetHours = clothesWetHours(state);
    if (wetHours > 10) target -= clamp((wetHours - 10) * 0.2, 0, 6);

    var toolHours = toolsOutHours(state);
    if (toolHours > 20) target -= clamp((toolHours - 20) * 0.1, 0, 4);

    var bunkHours = bunkUnmadeHours(state);
    if (bunkHours > 24) target -= clamp((bunkHours - 24) * 0.08, 0, 3);

    if (c.cabinStuffySinceMinutes != null) target -= 4;
    if (c.clutterCount >= CLUTTER_TIDY_THRESHOLD) target -= 3;

    // Cabin comfort: same gentle, capped shape as the drags above, and
    // naturally self-correcting — there's no separate bonus for
    // bringing the cabin back to COMFORTABLE, the penalty below just
    // stops applying once it's not COLD or HOT anymore. HOT specifically
    // uses the same fan-rescue logic as the displayed condition
    // (cabinConditionLabel) — a running fan that's successfully keeping
    // things COMFORTABLE (up to CABIN_TEMP_FAN_RESCUE_MAX_F) means no
    // HOT penalty either, even though the raw temperature is still
    // above the base HOT threshold. COLD gets no equivalent rescue from
    // the heater — only the actual temperature rising resolves it.
    var cabinTempF = state.boat.cabinTemperatureF;
    if (cabinTempF != null) {
      if (cabinTempF < CABIN_TEMP_COLD_MAX_F) {
        target -= clamp((CABIN_TEMP_COLD_MAX_F - cabinTempF) * 0.4, 0, 6);
      } else if (cabinTempF > CABIN_TEMP_HOT_MIN_F && cabinConditionLabel(cabinTempF, state.boat.fanOn) === 'HOT') {
        target -= clamp((cabinTempF - CABIN_TEMP_HOT_MIN_F) * 0.4, 0, 6);
      }
    }

    // Meal monotony: a snack instead of a real meal is nothing on its
    // own — this only engages once recent eating has genuinely skewed
    // toward quick/snack food for a stretch (see performEat).
    if (c.snackMealRatio > 0.55) target -= (c.snackMealRatio - 0.55) * 20;

    // Sustained rough seas: because morale only ever drifts toward this
    // target rather than snapping to it, a single rough tick barely
    // moves anything — it's genuinely PROLONGED rough weather that pulls
    // morale down, exactly as intended, with no separate duration
    // counter needed.
    if (state.weather.seaState >= 5) target -= 8;
    else if (state.weather.seaState >= 4) target -= 3;
    if (state.weather.condition === 'squall') target -= 10;

    return clamp(target, 0, 100);
  }

  // Coffee: a small, temporary, subtle edge — never a fatigue cure. Active
  // for a few hours after the last cup; recent coffee also makes it a bit
  // harder to fall asleep (see fallAsleepChance below).
  function coffeeActive(state) {
    var last = state.crew.lastCoffeeAt;
    return last != null && (state.meta.voyageMinutes - last) < 180;
  }

  // Foods: one unit is one serving. `cooked` items need the stove (propane
  // + water per waterGal, and calm-enough seas); everything else is ready
  // to eat as-is. `category` drives how much hunger-relief time a meal
  // buys (see HUNGER_RESET_OFFSET_HOURS), how it weighs into recent-meal
  // monotony (see performEat/snackMealRatio), and — for chocolate only —
  // an entirely separate path with no hunger/energy effect at all.
  var FOOD_ITEMS = [
    { key: 'oatmeal', name: 'Oatmeal', cooked: true, heavy: true, waterGal: 0.0625, category: 'substantial', original: 12 },
    { key: 'pasta', name: 'Pasta', cooked: true, heavy: true, waterGal: 0.125, category: 'substantial', original: 8 },
    { key: 'rice', name: 'Rice', cooked: true, heavy: true, waterGal: 0.0625, category: 'substantial', original: 12 },
    { key: 'soup', name: 'Soup', cooked: true, heavy: true, category: 'substantial', original: 6 },
    { key: 'chili', name: 'Chili / Beans', cooked: true, heavy: true, category: 'substantial', original: 6 },
    { key: 'tuna', name: 'Tuna', cooked: false, heavy: false, category: 'roughWeather', original: 8 },
    { key: 'crackers', name: 'Crackers', cooked: false, heavy: false, category: 'roughWeather', original: 8 },
    { key: 'peanutButter', name: 'Peanut Butter', cooked: false, heavy: false, category: 'roughWeather', original: 8 },
    { key: 'nuts', name: 'Nuts', cooked: false, heavy: false, category: 'quick', original: 12 },
    { key: 'driedFruit', name: 'Dried Fruit', cooked: false, heavy: false, category: 'quick', original: 8 },
    { key: 'energyBars', name: 'Energy Bars', cooked: false, heavy: false, category: 'quick', original: 8 },
    { key: 'freshFruit', name: 'Fresh Fruit', cooked: false, heavy: false, perishable: true, category: 'fresh', original: 6 },
    { key: 'freshBread', name: 'Fresh Bread', cooked: false, heavy: false, perishable: true, category: 'fresh', original: 4 },
    { key: 'chocolate', name: 'Chocolate', cooked: false, heavy: false, category: 'chocolate', original: 4 },
    // FISHING HOOK -- caught via FISH, not part of starting provisions
    // (original: 0; see countCurrentOriginal's falsy-original handling
    // and checkSpoilage's per-catch spoilage check, keyed off
    // state.fishing.freshFishCaughtAt rather than a fixed voyage-day
    // threshold like the other two 'fresh' items above).
    { key: 'freshFish', name: 'Fresh Fish', cooked: true, heavy: false, perishable: true, category: 'fresh', original: 0 },
  ];
  var FOOD_ITEMS_BY_KEY = {};
  FOOD_ITEMS.forEach(function (f) { FOOD_ITEMS_BY_KEY[f.key] = f; });

  // Current canonical food schema version — bump this whenever
  // FOOD_ITEMS' `original` quantities change again, so an existing
  // voyage rebases exactly once (see migrateProvisionsIfNeeded) rather
  // than every time it loads. newGameState() sets meta.foodInventoryVersion
  // to this same value up front, so a fresh voyage is already current
  // and never gets rebased.
  var FOOD_INVENTORY_VERSION = 2;
  // The canonical departure quantities food actually shipped with
  // before the two rounds of reduction that led to today's FOOD_ITEMS —
  // i.e. what a save with no foodInventoryVersion marker at all actually
  // started its voyage with, however far it's since been consumed down
  // or however many later reductions have already applied to it.
  var OLD_FOOD_ORIGINAL = {
    oatmeal: 18, pasta: 12, rice: 16, soup: 8, chili: 8,
    tuna: 10, crackers: 12, peanutButter: 10, nuts: 16,
    driedFruit: 12, energyBars: 12, freshFruit: 8, freshBread: 6,
    chocolate: 6,
  };

  // Fallback temperature from latitude alone, when no real-world reading
  // is available (or ever arrives) — cool in the mid-40s near Shilshole,
  // warming to tropical as the boat approaches Kaua'i, so temperature
  // still tracks the boat's own progress with zero connectivity.
  function estimateTemperatureF(lat) {
    var t = clamp((47.7 - lat) / (47.7 - 22.0), 0, 1); // 0 at Shilshole's latitude, 1 at Kaua'i's
    return 56 + t * 26; // ~56F at the dock, ~82F approaching Kaua'i
  }

  function driftWeather(w, lat) {
    // Small random walk so conditions feel alive without being chaotic.
    // Every magnitude/probability below was tuned by feel against the
    // old 10-minute tick, with no separately-stated hourly rate to
    // derive from -- so each is scaled by this fraction, preserving the
    // same expected amount of change/chance per hour regardless of the
    // current tick size.
    var scale = TICK_MINUTES / 10;
    w.windDirection = normalizeDeg(w.windDirection + (Math.random() - 0.5) * 6 * scale);
    var delta = (Math.random() - 0.5) * 2.2 * scale;
    if (w.trend === 'building') delta += 0.5 * scale;
    if (w.trend === 'easing') delta -= 0.5 * scale;
    w.windSpeed = clamp(w.windSpeed + delta, 2, 45);

    if (Math.random() < 0.01 * scale) {
      var trends = ['building', 'easing', 'steady'];
      w.trend = trends[Math.floor(Math.random() * trends.length)];
    }

    var target = clamp(Math.round(w.windSpeed / 7), 0, 6);
    if (w.seaState < target && Math.random() < 0.2 * scale) w.seaState++;
    if (w.seaState > target && Math.random() < 0.2 * scale) w.seaState--;

    if (Math.random() < 0.006 * scale) {
      var options = w.windSpeed > 25
        ? ['squall', 'rain', 'overcast']
        : ['clear', 'overcast', 'rain'];
      w.condition = options[Math.floor(Math.random() * options.length)];
    }

    // Temperature: gentle pull toward what the boat's own latitude would
    // suggest, plus a small wobble — this is only the fallback used when
    // there's no fresh real-world reading. blendTowardRealAnchor (called
    // right after this in simTick) takes over, the same way it does for
    // wind, whenever real data is actually available.
    var tempTarget = estimateTemperatureF(lat);
    w.temperatureF = w.temperatureF + (tempTarget - w.temperatureF) * 0.02 * scale + (Math.random() - 0.5) * 0.6 * scale;
  }

  /* --------------------------------------------------------------
     REAL-WORLD WEATHER
     ------------------------------------------------------------
     boat coordinates -> weather provider -> normalized Landfall
     weather -> existing weather/sailing simulation. Everything below
     this comment is the only place that knows Open-Meteo exists; the
     rest of Landfall just reads state.weather.windSpeed/windDirection/
     temperatureF/condition, same fields driftWeather has always
     written, and has no idea whether the last write came from the
     random walk or a real observation.

     Provider: Open-Meteo (api.open-meteo.com). No API key — nothing to
     leak from a public, static GitHub Pages file — CORS-enabled for a
     direct browser fetch, and backed by global weather MODELS (ECMWF/
     NOAA/etc.), not station reports, so open-ocean coordinates hundreds
     of miles from land return real numbers rather than nothing. Sea
     state is deliberately left alone: it already derives from wind
     speed (below), so grounding wind in reality grounds sea state too
     without a second, separate marine-data integration.
     -------------------------------------------------------------- */
  function wmoCodeToCondition(code, windSpeedKt) {
    if (code === 95 || code === 96 || code === 99) return 'squall'; // thunderstorm
    if (windSpeedKt != null && windSpeedKt > 30 && code >= 51) return 'squall'; // heavy wind plus any precipitation reads as a squall in Landfall's four-condition model
    if (code === 0 || code === 1) return 'clear';
    if (code === 2 || code === 3 || code === 45 || code === 48) return 'overcast';
    if (code >= 51) return 'rain'; // covers drizzle, rain, showers, and snow — Landfall has no separate category for any of these
    return 'overcast';
  }

  // A short, Landfall-toned summary of the next ~12 hours — never the
  // raw hourly table. Looks at wind trend and precipitation odds only.
  function summarizeForecast(hourly, currentIso) {
    if (!hourly || !hourly.time || !hourly.wind_speed_10m) return null;
    var startIdx = hourly.time.indexOf(currentIso);
    if (startIdx < 0) startIdx = 0;
    var endIdx = Math.min(hourly.time.length, startIdx + 13);
    if (endIdx - startIdx < 2) return null;
    var windNow = hourly.wind_speed_10m[startIdx];
    var windLater = hourly.wind_speed_10m[endIdx - 1];
    var maxPrecipProb = 0;
    var sawStorm = false;
    for (var i = startIdx; i < endIdx; i++) {
      var p = hourly.precipitation_probability ? hourly.precipitation_probability[i] : null;
      if (typeof p === 'number') maxPrecipProb = Math.max(maxPrecipProb, p);
      var code = hourly.weather_code ? hourly.weather_code[i] : null;
      if (code === 95 || code === 96 || code === 99) sawStorm = true;
    }

    var lines = [];
    if (typeof windNow === 'number' && typeof windLater === 'number') {
      if (windLater - windNow >= 6) lines.push('Winds strengthening over the next several hours.');
      else if (windNow - windLater >= 6) lines.push('Winds easing over the next several hours.');
      else lines.push('Little change expected in wind over the next several hours.');
    }
    if (sawStorm) lines.push('Thunderstorms possible.');
    else if (maxPrecipProb >= 60) lines.push('Rain likely.');
    else if (maxPrecipProb >= 30) lines.push('A chance of rain.');

    return lines.length ? lines.join(' ') : null;
  }

  function normalizeRealWeather(raw) {
    if (!raw || !raw.current) return null;
    var cur = raw.current;
    if (typeof cur.wind_speed_10m !== 'number' || typeof cur.temperature_2m !== 'number') return null;
    return {
      windSpeedKt: cur.wind_speed_10m,
      windDirectionDeg: typeof cur.wind_direction_10m === 'number' ? cur.wind_direction_10m : null,
      temperatureF: cur.temperature_2m,
      condition: wmoCodeToCondition(cur.weather_code, cur.wind_speed_10m),
      forecastLine: summarizeForecast(raw.hourly, cur.time),
    };
  }

  // Provider-specific fetch, isolated so a different/backup source could
  // slot in later without touching anything above. Any failure at all —
  // offline, timeout, an outage, a malformed response, a coordinate the
  // provider can't cover — resolves to null; callers already treat null
  // as "no fresh data this time" and fall back to the simulation.
  async function fetchRealWeather(lat, lon) {
    var url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + encodeURIComponent(lat.toFixed(2))
      + '&longitude=' + encodeURIComponent(lon.toFixed(2))
      + '&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code'
      + '&hourly=wind_speed_10m,weather_code,precipitation_probability'
      + '&forecast_days=2&wind_speed_unit=kn&temperature_unit=fahrenheit&timezone=UTC';
    var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timeoutId = controller ? setTimeout(function () { controller.abort(); }, 8000) : null;
    try {
      var res = await fetch(url, controller ? { signal: controller.signal } : undefined);
      if (timeoutId) clearTimeout(timeoutId);
      if (!res || !res.ok) return null;
      var data = await res.json();
      return normalizeRealWeather(data);
    } catch (err) {
      if (timeoutId) clearTimeout(timeoutId);
      return null;
    }
  }

  var WEATHER_REFRESH_MS = 45 * 60 * 1000;  // ~45 real minutes between lookups
  var WEATHER_REFRESH_DISTANCE_NM = 60;     // ...or sooner once the boat has moved this far from the last successful lookup's position
  var weatherFetchInFlight = false;         // module-level, not saved — only exists to stop overlapping requests during a fast catch-up burst

  // Checked once per tick; only actually calls out to the network when a
  // refresh is genuinely due. During a long offline catch-up this still
  // fires at most once — the loop runs many simulated ticks in a
  // fraction of a real second, so "real ms since the last fetch" and
  // "a fetch is already in flight" both stay true for the rest of that
  // burst, which is exactly what keeps this from turning into dozens of
  // historical API calls.
  function maybeRefreshRealWeather(state) {
    if (weatherFetchInFlight) return;
    var anchor = state.weather.realWx;
    var now = Date.now();
    var dueByTime = anchor.fetchedRealMs == null || (now - anchor.fetchedRealMs) >= WEATHER_REFRESH_MS;
    var dueByDistance = !dueByTime && anchor.lat != null
      && distanceBetween(state.nav.lat, state.nav.lon, anchor.lat, anchor.lon) >= WEATHER_REFRESH_DISTANCE_NM;
    if (!dueByTime && !dueByDistance) return;

    weatherFetchInFlight = true;
    var lat = state.nav.lat, lon = state.nav.lon;
    fetchRealWeather(lat, lon).then(function (result) {
      weatherFetchInFlight = false;
      if (!result || !GAME) return; // failed, or the state has moved on (e.g. RESTART) since this was kicked off — leave everything exactly as it is
      GAME.weather.realWx = {
        fetchedRealMs: Date.now(),
        lat: lat, lon: lon,
        windSpeedKt: result.windSpeedKt,
        windDirectionDeg: result.windDirectionDeg,
        temperatureF: result.temperatureF,
        condition: result.condition,
        forecastLine: result.forecastLine,
      };
      saveGameState(GAME);
    }).catch(function () {
      weatherFetchInFlight = false;
    });
  }

  var WEATHER_BLEND_PER_HOUR = 0.5; // how quickly simulated wind/temperature closes the gap toward the latest real-world anchor — gradual, never an instant jump between ticks

  /* --------------------------------------------------------------
     OCEAN CURRENT — a second, independent real-world data source
     (Open-Meteo's Marine API, not the atmospheric one used above),
     cached and refreshed the same way real weather is: a background
     fetch on its own cadence, never blocking simTick, silently
     unavailable rather than invented when the provider has nothing
     for a given point. Feeds two things: a small heading correction so
     automatic steering still makes good the player's chosen course
     through a cross-current (see computeHeading/currentCorrectionDeg),
     and the true vector sum of boat-through-water + current that
     actually moves the boat and sets the displayed speed (see
     combineWithCurrent, used in simTick). Never used to choose a
     course on its own — only to keep what the player already chose
     honest against real current, and to inform the player's own
     decision via WEATHER and FORECAST.
     -------------------------------------------------------------- */
  function normalizeOceanCurrent(raw) {
    if (!raw || !raw.current) return null;
    var cur = raw.current;
    if (typeof cur.ocean_current_velocity !== 'number' || typeof cur.ocean_current_direction !== 'number') return null;
    return {
      speedKt: cur.ocean_current_velocity / 1.852, // Open-Meteo's marine API reports this in km/h by default
      directionDeg: cur.ocean_current_direction,    // TOWARD, per oceanographic convention — not FROM, unlike wind
    };
  }

  async function fetchOceanCurrent(lat, lon) {
    var url = 'https://marine-api.open-meteo.com/v1/marine'
      + '?latitude=' + encodeURIComponent(lat.toFixed(2))
      + '&longitude=' + encodeURIComponent(lon.toFixed(2))
      + '&current=ocean_current_velocity,ocean_current_direction'
      + '&forecast_days=1&timezone=UTC';
    var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timeoutId = controller ? setTimeout(function () { controller.abort(); }, 8000) : null;
    try {
      var res = await fetch(url, controller ? { signal: controller.signal } : undefined);
      if (timeoutId) clearTimeout(timeoutId);
      if (!res || !res.ok) {
        if (typeof console !== 'undefined') console.warn('[Landfall current] request returned', res ? res.status : 'no response', 'for', lat.toFixed(2) + ',' + lon.toFixed(2));
        return null;
      }
      var data = await res.json();
      var normalized = normalizeOceanCurrent(data);
      // The marine API's automatic model selection can return a 200 with
      // the requested fields present but null — usually meaning no
      // current model has reliable coverage for this point (narrow/
      // complex coastal water is the most common case). That's a real,
      // expected "no data here" outcome, not a bug, but worth being able
      // to tell apart from an actual failure.
      if (!normalized && typeof console !== 'undefined') {
        // data is already the plain result of res.json(), so this is
        // safe on its own merits -- stringified anyway, purely so this
        // line can never be a source of doubt the way the raw-error
        // logging above turned out to be.
        var safeData;
        try { safeData = JSON.stringify(data); } catch (e) { safeData = '(unprintable)'; }
        console.warn('[Landfall current] response had no usable current data for', lat.toFixed(2) + ',' + lon.toFixed(2), '— likely no model coverage at this point.', safeData);
      }
      return normalized;
    } catch (err) {
      if (timeoutId) clearTimeout(timeoutId);
      // Log a plain, always-cloneable description of the failure —
      // never the raw error/exception object itself. Some console/
      // devtools environments relay console arguments through a
      // structured-clone-like serialization step, and not every thrown
      // value is guaranteed cloneable there (a DOMException, which is
      // exactly what the AbortController timeout below throws, is a
      // known case) — passing one straight to console.warn was itself
      // throwing a SEPARATE DataCloneError on top of the original
      // failure in at least some setups, which is what was actually
      // showing up in the console. err.name/err.message are always
      // plain strings, so this can't recreate that problem.
      if (typeof console !== 'undefined') {
        var errName = (err && err.name) ? String(err.name) : 'Error';
        var errMessage = (err && err.message) ? String(err.message) : '';
        if (errName === 'AbortError') {
          console.warn('[Landfall current] request timed out for', lat.toFixed(2) + ',' + lon.toFixed(2));
        } else {
          console.warn('[Landfall current] fetch failed for', lat.toFixed(2) + ',' + lon.toFixed(2) + ':', errName + (errMessage ? ' — ' + errMessage : ''), '(if this page was opened directly from disk via file://, that is almost always the cause — browsers block cross-origin fetch from file:// pages)');
        }
      }
      return null;
    }
  }

  var CURRENT_REFRESH_MS = 90 * 60 * 1000;   // currents shift far more slowly than wind — a lighter cadence than weather's own refresh is plenty
  var CURRENT_REFRESH_DISTANCE_NM = 80;
  var currentFetchInFlight = false;
  // Tracks the last ATTEMPT (success or failure), separately from
  // oceanCurrent.fetchedRealMs (last SUCCESS). Without this, a fetch
  // that keeps failing — no coverage, offline, a genuine CORS block —
  // would look "due" again on literally the very next tick, since
  // fetchedRealMs never advances on failure. This is what actually
  // stops a persistent failure from retrying every simulated tick.
  var currentLastAttemptMs = null;
  var CURRENT_RETRY_COOLDOWN_MS = 10 * 60 * 1000;

  var CURRENT_SAMPLE_OFFSET_NM = 60; // how far north/south of the boat's own position to sample for a strategic gradient — see currentStrategicNote

  function maybeRefreshOceanCurrent(state) {
    if (currentFetchInFlight) return;
    var now = Date.now();
    if (currentLastAttemptMs != null && (now - currentLastAttemptMs) < CURRENT_RETRY_COOLDOWN_MS) return;
    var anchor = state.weather.oceanCurrent;
    var dueByTime = anchor.fetchedRealMs == null || (now - anchor.fetchedRealMs) >= CURRENT_REFRESH_MS;
    var dueByDistance = !dueByTime && anchor.lat != null
      && distanceBetween(state.nav.lat, state.nav.lon, anchor.lat, anchor.lon) >= CURRENT_REFRESH_DISTANCE_NM;
    if (!dueByTime && !dueByDistance) return;

    currentFetchInFlight = true;
    currentLastAttemptMs = now;
    var lat = state.nav.lat, lon = state.nav.lon;
    var northPt = destinationPoint(lat, lon, 0, CURRENT_SAMPLE_OFFSET_NM);
    var southPt = destinationPoint(lat, lon, 180, CURRENT_SAMPLE_OFFSET_NM);
    // Three requests per refresh cycle (roughly hourly-ish, or on ~80nm
    // of progress) — the boat's own reading plus two strategic samples,
    // run in parallel rather than sequentially so this doesn't add
    // noticeable latency. Not excessive: this is the SAME cadence as a
    // single weather refresh, just three small requests instead of one.
    Promise.all([
      fetchOceanCurrent(lat, lon),
      fetchOceanCurrent(northPt.lat, northPt.lon),
      fetchOceanCurrent(southPt.lat, southPt.lon),
    ]).then(function (results) {
      currentFetchInFlight = false;
      var here = results[0], north = results[1], south = results[2];
      if (!here || !GAME) return; // the boat's own reading is required to anchor anything; a sample failing on its own just means no gradient note for now — the existing simulated/last-known state (see combineWithCurrent's own null-current fallback) carries the voyage forward either way
      GAME.weather.oceanCurrent = {
        fetchedRealMs: Date.now(),
        lat: lat, lon: lon,
        speedKt: here.speedKt,
        directionDeg: here.directionDeg,
        northSample: north,
        southSample: south,
      };
      if (typeof console !== 'undefined') console.log('[Landfall current] observation received for', lat.toFixed(2) + ',' + lon.toFixed(2) + ':', here.speedKt.toFixed(2) + 'kt toward ' + here.directionDeg + 'deg', '| north sample:', north ? north.speedKt.toFixed(2) + 'kt' : 'none', '| south sample:', south ? south.speedKt.toFixed(2) + 'kt' : 'none');
      saveGameState(GAME);
    }).catch(function () {
      currentFetchInFlight = false;
    });
  }

  // Standard current-triangle correction: given a desired course and a
  // known current, how many degrees to turn the heading (through water)
  // toward the side the current is coming from, so the two vectors sum
  // back to roughly the desired course over ground. Returns 0 with no
  // current data, or if the cross-component would exceed what the boat
  // can counter at its own speed (an unresolvable set — direct sailing
  // is left to just be pushed off, same as it would be for a real boat
  // in a current stronger than it can make way across).
  function currentCorrectionDeg(desiredDeg, boatSpeedKt, current) {
    if (!current || current.speedKt == null || boatSpeedKt <= 0) return 0;
    var relBearingRad = signedAngleDiff(current.directionDeg, desiredDeg) * Math.PI / 180;
    var crossComponent = current.speedKt * Math.sin(relBearingRad);
    var ratio = clamp(crossComponent / boatSpeedKt, -1, 1);
    return -(Math.asin(ratio) * 180 / Math.PI);
  }

  // The actual vector sum of the boat's motion through the water and
  // the current moving that water across the Earth — this is what
  // simTick uses for real geographic movement and what boat.speed
  // displays (speed over GROUND, matching what a GPS would show),
  // while nav.heading stays the through-water heading wind/sails care
  // about. With no current data, this is just a pass-through.
  function combineWithCurrent(headingDeg, speedThroughWaterKt, current) {
    if (!current || current.speedKt == null) {
      return { courseOverGround: headingDeg, speedOverGround: speedThroughWaterKt };
    }
    var hRad = headingDeg * Math.PI / 180;
    var cRad = current.directionDeg * Math.PI / 180;
    var vx = speedThroughWaterKt * Math.sin(hRad) + current.speedKt * Math.sin(cRad);
    var vy = speedThroughWaterKt * Math.cos(hRad) + current.speedKt * Math.cos(cRad);
    var speedOverGround = Math.sqrt(vx * vx + vy * vy);
    var courseOverGround = normalizeDeg(Math.atan2(vx, vy) * 180 / Math.PI);
    return { courseOverGround: courseOverGround, speedOverGround: speedOverGround };
  }

  var CURRENT_GRADIENT_THRESHOLD_KT = 0.4; // how much a sample's along-course component has to beat the boat's own before it's worth mentioning at all

  // How much a current vector helps (positive) or hurts (negative)
  // progress along a given course — the current's own speed projected
  // onto that course direction.
  function alongCourseComponent(current, courseDeg) {
    if (!current || current.speedKt == null) return null;
    var relRad = signedAngleDiff(current.directionDeg, courseDeg) * Math.PI / 180;
    return current.speedKt * Math.cos(relRad);
  }

  // A brief, purely observational note about nearby current for
  // FORECAST — never a recommendation, and never weighed against
  // weather to declare an overall "better" option; that judgment is
  // left entirely to the player. Compares the boat's own along-course
  // current component against the cached north/south samples (see
  // maybeRefreshOceanCurrent) and only speaks up once the difference is
  // large enough to matter; small gradients stay silent background
  // simulation. Returns null when there's nothing meaningful to say or
  // the samples aren't cached yet — FORECAST's own trend line and the
  // OPEN IN WINDY link are unaffected either way.
  function currentStrategicNote(state) {
    var oc = state.weather.oceanCurrent;
    if (oc.fetchedRealMs == null) return null;
    var courseDeg = state.nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX ? state.nav.intendedCourse : state.nav.setCourse;
    var here = alongCourseComponent(oc, courseDeg);
    if (here == null) return null;

    var north = oc.northSample ? alongCourseComponent(oc.northSample, courseDeg) : null;
    var south = oc.southSample ? alongCourseComponent(oc.southSample, courseDeg) : null;

    var bestSide = null, bestSample = null, bestGain = CURRENT_GRADIENT_THRESHOLD_KT;
    if (north != null && (north - here) >= bestGain) {
      bestSide = 'north'; bestSample = oc.northSample; bestGain = north - here;
    }
    if (south != null && (south - here) >= bestGain) {
      bestSide = 'south'; bestSample = oc.southSample; bestGain = south - here;
    }

    if (bestSide) {
      return 'A stronger ' + compassPoint(bestSample.directionDeg) + '-setting current develops ' + bestSide + ' of your position.';
    }
    if (here <= -CURRENT_GRADIENT_THRESHOLD_KT) {
      return 'Adverse current persists along the present track.';
    }
    return null;
  }

  // Nudges the SAME fields driftWeather writes toward the last successful
  // real observation, rather than snapping to it — see the module
  // header above for why the sailing model needs no separate wiring to
  // "use" real weather: it already reads these exact fields.
  function blendTowardRealAnchor(w, hrs) {
    var anchor = w.realWx;
    if (!anchor || anchor.fetchedRealMs == null) return; // no real observation yet — pure simulation
    var factor = clamp(WEATHER_BLEND_PER_HOUR * hrs, 0, 1);
    if (typeof anchor.windSpeedKt === 'number') {
      w.windSpeed = clamp(w.windSpeed + (anchor.windSpeedKt - w.windSpeed) * factor, 2, 45);
    }
    if (typeof anchor.windDirectionDeg === 'number') {
      var diff = signedAngleDiff(anchor.windDirectionDeg, w.windDirection);
      w.windDirection = normalizeDeg(w.windDirection + diff * factor);
    }
    if (typeof anchor.temperatureF === 'number') {
      w.temperatureF = w.temperatureF + (anchor.temperatureF - w.temperatureF) * factor;
    }
    if (anchor.condition && anchor.condition !== w.condition) {
      w.condition = anchor.condition; // a discrete observation, adopted outright rather than interpolated
    }
  }

  function signedAngleDiff(a, b) {
    // Signed angle FROM b TO a, in (-180, 180]: positive = a is clockwise
    // of b, negative = counterclockwise. Used both by auto-tack below
    // (which side of the wind a heading falls on) and by the
    // real-weather blend (closing the gap the short way around the
    // compass).
    var d = normalizeDeg(a - b);
    return d > 180 ? d - 360 : d;
  }

  // AUTO-TACK — active throughout the whole voyage; see computeHeading.
  // The player controls SET COURSE (the intended track: the current
  // waypoint's bearing while coastal, or the player's own chosen
  // heading once in open ocean); this decides what the boat actually
  // steers tick to tick (ACTUAL HEADING) to make that course good. If
  // SET COURSE is too close to the wind to sail directly, the boat
  // beats to windward instead of luffing indefinitely — short legs
  // through the coastal corridor (tight enough to stay inside the
  // verified-safe route), longer legs once in open water, both shrinking
  // further as the boat nears whatever it's currently aiming for. The
  // player never manually tacks; changing SET COURSE (via CHANGE COURSE
  // or SET FOR NĀWILIWILI) is the only navigation input there is.
  var NOGO_ZONE_DEG = 35;          // matches pointOfSailFactor's own no-go threshold
  var CLOSE_HAULED_ANGLE_DEG = 42; // realistic close-hauled angle — lands in pointOfSailFactor's 35-50deg tier, a real reduced-but-genuine speed, not a crawl
  var COASTAL_MAX_TACK_LEG_NM = 0.6; // short legs — the corridor can run within under a mile of real charted shoreline
  var OPEN_WATER_MAX_TACK_LEG_NM = 8; // longer, realistic offshore tacks once clear of the corridor
  var TACK_LEG_WAYPOINT_FRACTION = 0.3; // ...or this fraction of the remaining distance to the current target (waypoint, or Nāwiliwili in open water), whichever is smaller — shrinks tacks further approaching any mark

  function closeHauledHeading(windDirection, tack) {
    return normalizeDeg(windDirection + (tack === 'port' ? CLOSE_HAULED_ANGLE_DEG : -CLOSE_HAULED_ANGLE_DEG));
  }

  // targetPoint is only used for the tack-leg-length "shrink near a
  // mark" calculation — the current waypoint while coastal, Nāwiliwili
  // itself in open water — never for steering; steering is entirely
  // desired (SET COURSE) vs. the wind.
  function resolveAutoTack(state, desired, targetPoint) {
    var nav = state.nav, w = state.weather, b = state.boat;

    if (b.sailConfig === 'furled' || state.crew.inLifeRaft) {
      if (nav.tack) { nav.tack = null; nav.tackDistanceNm = 0; }
      return desired;
    }

    var inNoGo = angleDiff(desired, w.windDirection) < NOGO_ZONE_DEG;

    if (!inNoGo) {
      if (nav.tack) {
        log(state, 'Wind angle improved. Resuming direct sailing.');
        nav.tack = null;
        nav.tackDistanceNm = 0;
      }
      return desired;
    }

    var sideForDesired = signedAngleDiff(w.windDirection, desired) < 0 ? 'port' : 'starboard';

    if (!nav.tack) {
      nav.tack = sideForDesired;
      nav.tackDistanceNm = 0;
      log(state, 'Wind moved onto the bow. Beating to windward.');
    } else {
      var remaining = distanceBetween(nav.lat, nav.lon, targetPoint.lat, targetPoint.lon);
      var maxLeg = nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX ? COASTAL_MAX_TACK_LEG_NM : OPEN_WATER_MAX_TACK_LEG_NM;
      var legLimit = Math.min(maxLeg, Math.max(0.2, remaining * TACK_LEG_WAYPOINT_FRACTION));
      // Come about either on schedule, or immediately if the desired
      // course (a new waypoint, or the player changing SET COURSE) has
      // moved to the other side of the wind since — continuing the
      // current tack would then just sail away from the goal. Flipping
      // to the opposite of the current tack is correct either way: on a
      // scheduled tack sideForDesired still matches the old tack, so the
      // opposite is the new one; on a course-driven switch sideForDesired
      // IS the opposite already (only two tacks exist).
      if (nav.tack !== sideForDesired || nav.tackDistanceNm >= legLimit) {
        nav.tack = nav.tack === 'port' ? 'starboard' : 'port';
        nav.tackDistanceNm = 0;
        log(state, 'Automatic tack. Now on ' + nav.tack + ' tack.');
      }
    }

    return closeHauledHeading(w.windDirection, nav.tack);
  }

  // NAVIGATION — two phases, split at OPEN_WATER_WAYPOINT_INDEX, but
  // auto-tacking applies throughout both; the only thing that changes
  // is where SET COURSE (desired) comes from:
  //
  // Coastal corridor (waypointIndex < OPEN_WATER_WAYPOINT_INDEX): SET
  // COURSE is the bearing to WAYPOINTS[waypointIndex], recalculated
  // every tick; simTick() advances waypointIndex on arrival — the
  // player is never asked to navigate confined water.
  //
  // Open ocean (waypointIndex >= OPEN_WATER_WAYPOINT_INDEX): SET COURSE
  // is whatever compass heading is in nav.setCourse — set by the player
  // via CHANGE COURSE or SET FOR NĀWILIWILI, or, if the player was away
  // when the corridor cleared, initialized automatically to the direct
  // bearing toward Nāwiliwili so the voyage keeps moving. nav.intendedCourse
  // is repurposed here to the LIVE direct bearing to Nāwiliwili (BEARING
  // TO NĀWILIWILI) — informational only, never what's actually steered.
  //
  // Either way, resolveAutoTack() decides what the boat actually steers
  // (ACTUAL HEADING) tick to tick to make SET COURSE good.
  function computeHeading(state) {
    var nav = state.nav;
    var desired, targetPoint, steered;

    if (nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX) {
      // Coastal corridor: ALWAYS the existing safe automatic navigation,
      // regardless of the autopilot toggle. The player is never asked
      // to navigate confined water — autopilot or not — so this is the
      // smallest sensible exception needed to preserve safe coastal
      // routing (see the module notes above).
      targetPoint = WAYPOINTS[nav.waypointIndex] || FINAL_DEST;
      nav.intendedCourse = bearingBetween(nav.lat, nav.lon, targetPoint.lat, targetPoint.lon);
      desired = nav.intendedCourse;
      steered = resolveAutoTack(state, desired, targetPoint);
    } else {
      nav.intendedCourse = bearingBetween(nav.lat, nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
      if (nav.setCourse == null) {
        nav.setCourse = Math.round(nav.intendedCourse);
      }
      targetPoint = FINAL_DEST;

      if (!state.boat.autopilotOn || state.boat.steering === 'DAMAGED') {
        // Autopilot off, or steering damaged: no course-keeping, no
        // auto-tacking — the boat just continues roughly along wherever
        // it's already pointed, wandering gradually (restrained in calm
        // conditions, further in rough seas) rather than snapping
        // anywhere. nav.setCourse itself is left untouched, so switching
        // autopilot back on (once steering is repaired, if that's what
        // disabled it) simply resumes steering for it. If the drift
        // walks the heading into the no-go zone, it's left to slow/luff
        // there — computeBoatSpeed's point-of-sail handling already does
        // that — rather than auto-tacking out of it.
        if (nav.driftHeading == null) {
          nav.driftHeading = nav.heading != null ? nav.heading : nav.setCourse;
        }
        var seaWander = (0.3 + state.weather.seaState * 0.35) * (TICK_MINUTES / 10);
        nav.driftHeading = normalizeDeg(nav.driftHeading + (Math.random() - 0.5) * seaWander);
        if (nav.tack) { nav.tack = null; nav.tackDistanceNm = 0; }
        steered = nav.driftHeading;
      } else {
        desired = nav.setCourse;

        // Current correction — open water only; the coastal corridor's
        // own automatic navigation already handles getting through
        // safely (see the module notes above). This adjusts the LOCAL
        // desired bearing fed into auto-tack, never nav.setCourse itself
        // (the player's own chosen course is never touched) and never
        // nav.intendedCourse (BEARING TO NĀWILIWILI stays the plain
        // geographic bearing). The order matches real seamanship: work
        // out what heading through the water actually makes the chosen
        // course good against the current FIRST, then decide whether
        // that heading is sailable or needs a tack.
        var currentAnchor = state.weather.oceanCurrent;
        if (currentAnchor.fetchedRealMs != null) {
          var estSpeed = computeBoatSpeed(state, desired);
          desired = normalizeDeg(desired + currentCorrectionDeg(desired, estSpeed, currentAnchor));
        }
        steered = resolveAutoTack(state, desired, targetPoint);
      }
    }
    // Small per-tick heading noise: imperfect helming, wave action, minor
    // leeway and current. This is the mechanism by which weather actually
    // shoves the track off line rather than just slowing the boat down —
    // calm seas barely nudge it, rough ones can walk it a long way over
    // many ticks, exactly the way a real storm would.
    var wobble = (Math.random() - 0.5) * (3 + state.weather.seaState * 2) * (TICK_MINUTES / 10);
    return normalizeDeg(steered + wobble);
  }


  function pointOfSailFactor(headingDeg, windFromDeg) {
    // Angle between the boat's heading and the direction the wind comes FROM.
    // 0deg = sailing straight into the wind ("in irons" — very slow)
    // 90deg = wind on the beam (an efficient, fast angle for most boats)
    // 180deg = sailing dead downwind (comfortable, but not the fastest angle)
    var diff = angleDiff(headingDeg, windFromDeg);
    if (diff < 35) return 0.05;
    if (diff < 50) return 0.55;
    if (diff < 100) return 1.0;
    if (diff < 150) return 0.85;
    return 0.65;

  function computeSailSpeed(state, heading) {
    var w = state.weather, b = state.boat, c = state.crew;

  function computeEngineSpeed(state, heading) {
    var w = state.weather, b = state.boat, c = state.crew;
    if (!b.engineOn) return 0; // DAMAGED engine can never be running — see cmdEngine/performSystemRepairAttempt
    var speed = BASE_ENGINE_SPEED_KT;
    speed *= clamp(1 - w.seaState * 0.05, 0.55, 1); // pounding into a chop costs speed motoring, same as sailing
    // Wind on the nose costs speed under power; a following wind/sea helps a little.
    var windAngle = angleDiff(heading, w.windDirection); // 0 = wind dead ahead, 180 = dead astern
    var windEffect = ((windAngle - 90) / 90) * clamp(w.windSpeed / 30, 0, 1) * 0.15;
    speed *= (1 + windEffect);
    if (c.watchState !== 'awake') speed *= 0.85; // unattended — same imprecision penalty as sailing unattended
    return Math.max(0, speed);
  }

  function computeDriftSpeed(state) {
    // A small, ever-present contribution from current and wind acting on
    // the hull itself, independent of sail or engine — this is what keeps
    // a furled, unpowered boat from reading a flatly impossible 0.0kt.
    // Not propulsion: it never meaningfully adds to real sailing or
    // motoring speed, only fills in when nothing else is pushing.
    return clamp(DRIFT_BASE_KT + state.weather.windSpeed * DRIFT_WIND_FACTOR, 0.1, DRIFT_MAX_KT);
  }

  function isSailingUseful(state, heading) {
    return computeSailSpeed(state, heading) > SAIL_PROPULSION_THRESHOLD_KT;
  }

  function propulsionState(state, heading) {
    if (state.crew.inLifeRaft) return 'drifting'; // the boat's abandoned — its sails/engine are no longer relevant
    var sailing = isSailingUseful(state, heading);
    var engineOn = state.boat.engineOn;
    if (sailing && engineOn) return 'motor-sailing';
    if (sailing) return 'sailing';
    if (engineOn) return 'motoring';
    return 'drifting';
  }

  function propulsionLabel(key) {
    var labels = { sailing: 'Sailing', 'motor-sailing': 'Motor-sailing', motoring: 'Motoring', drifting: 'Drifting' };
    return labels[key] || capitalize(key);
  }

  function computeBoatSpeed(state, heading) {
    if (state.crew.inLifeRaft) {
      // Nothing to sail or motor anymore — the raft only goes where the
      // current and wind take it, same drift term as a furled, engine-off
      // boat, and nothing more.
      return +computeDriftSpeed(state).toFixed(2);
    }
    var sailSpeed = computeSailSpeed(state, heading);
    var engineSpeed = computeEngineSpeed(state, heading);
    var primary = Math.max(sailSpeed, engineSpeed);
    var secondary = Math.min(sailSpeed, engineSpeed);
    var propelled;
    if (secondary <= 0) {
      propelled = primary;
    } else {
      // Motor-sailing: the weaker of the two sources still adds real thrust
      // on top of the stronger one — it must never get crushed toward
      // invisibility just because the other source happens to be bigger
      // (that was the bug: a cube-sum blend let a big engine number swallow
      // the difference between full and minimal sail almost entirely).
      // What DOES genuinely diminish the assist is how close the boat
      // already is to hull speed — pushing a displacement hull past that
      // point costs disproportionately more the closer you get. That's the
      // actual physical reason a big engine boost in light air (far from
      // hull speed) shrinks to a small one in a strong breeze (already near
      // hull speed) — not an artifact of which number happens to be larger.
      var headroom = clamp(1 - primary / HULL_SPEED_KT, SECONDARY_ASSIST_FLOOR, 1);
      propelled = primary + secondary * headroom;
    }
    // Drift/current is a small, separate baseline that's always present —
    // it's what a furled, engine-off boat has left (pure DRIFTING), and it
    // still nudges the total a little even under sail or power, same as a
    // real current would.
    var total = propelled + computeDriftSpeed(state);
    return +Math.min(total, MAX_REALISTIC_SPEED_KT).toFixed(2);

  }

  // nav.heading and boat.speed are otherwise only written inside
  // simTick() — real, instantaneous quantities that just happen to be
  // cached in state rather than recomputed on every read. That's fine
  // as long as something calls this the moment anything upstream of
  // them actually changes; without it, a course change updates
  // nav.setCourse immediately but leaves heading/tack/speed sitting at
  // whatever they were until the next tick runs, which can be minutes
  // away in live play. Call this right after any state change that
  // should make the boat respond NOW rather than waiting for that —
  // currently, only the two places nav.setCourse itself changes. Does
  // not advance voyageMinutes or move the boat; it only recomputes what
  // the boat would be doing at the CURRENT moment, the same computation
  // simTick would make anyway, just not deferred until the next one.
  function refreshHeadingAndSpeed(state) {
    var heading = computeHeading(state);
    state.nav.heading = heading;
    state.boat.speed = computeBoatSpeed(state, heading);
  }

  function updateCrew(state) {
    var c = state.crew;
    var hrs = TICK_MINUTES / 60;

    if (c.watchState === 'sleeping') {
      // Rougher seas make for shallower, less restorative sleep, not just
      // a higher chance of being woken (see wakeChanceWhileSleeping).
      // Morale nudges quality too, gently either way — a steady mind
      // rests better, a low one rests worse — and good sleep gives a
      // little morale back, same as a decent meal does.
      var moraleFactor = clamp(0.88 + (c.morale / 100) * 0.24, 0.75, 1.12);
      var quality = clamp((1 - state.weather.seaState / 10) * moraleFactor, 0.3, 1.1);
      c.fatigue = clamp(c.fatigue - hrs * 9 * quality, 0, 100);
      c.morale = clamp(c.morale + hrs * 1.2 * quality, 0, 100);
      c.hoursSinceRest = 0;
    } else {
      var fatigueRate = 1.6;
      if (state.weather.seaState >= 4) fatigueRate += 1.0;
      if (hungerLevel(c.hoursSinceMeal) >= 2) fatigueRate += 0.4;
      if (hungerLevel(c.hoursSinceMeal) >= 3) fatigueRate += 0.6;
      if (thirstLevel(c.hoursSinceWater) >= 3) fatigueRate += 0.8;
      if (c.morale < 30) fatigueRate += 0.3; // a discouraged crew tires faster
      if (c.watchState === 'trying') fatigueRate *= 0.5; // lying down helps a little even without real sleep
      c.fatigue = clamp(c.fatigue + fatigueRate * hrs, 0, 100);
      if (c.watchState !== 'trying') c.hoursSinceRest += hrs;
    }

    c.hoursSinceMeal += hrs;
    // Real heat and hard physical work (rough seas) both raise water
    // needs — modeled as thirst simply arriving faster. Uses the boat's
    // actual current temperature reading rather than a coastal/tropics
    // proxy, since Landfall already tracks that directly.
    var waterRate = 1;
    if (state.weather.temperatureF >= 82) waterRate += 0.5;
    else if (state.weather.temperatureF >= 72) waterRate += 0.2;
    if (state.weather.seaState >= 4) waterRate += 0.3;
    c.hoursSinceWater += hrs * waterRate;

    // Being above deck in genuinely bad weather leaves clothes wet — set
    // once, not continuously restamped, so DRY CLOTHES's clock reflects
    // how long they've actually been wet. Being below deck in the same
    // conditions instead lets damp/condensation build up in the cabin,
    // tracked as an accumulating total (it's the CUMULATIVE time shut up
    // in bad weather that matters, not any single tick of it).
    var badWeather = state.weather.condition === 'rain' || state.weather.condition === 'squall' || state.weather.seaState >= WET_CLOTHES_SEASTATE;
    if (badWeather) {
      if (c.location === 'above' && c.clothesWetSinceMinutes == null) {
        c.clothesWetSinceMinutes = state.meta.voyageMinutes;
      } else if (c.location === 'below') {
        c.dampCabinHours += hrs;
        if (c.dampCabinHours >= CABIN_STUFFY_HOURS && c.cabinStuffySinceMinutes == null) {
          c.cabinStuffySinceMinutes = state.meta.voyageMinutes;
        }
      }
    }

    // Morale drifts toward whatever current conditions actually justify
    // (see computeMoraleTarget) rather than sitting still until some
    // explicit event nudges it — this is what makes neglect visible over
    // a normal day even without any single dramatic moment causing it.
    var moraleTarget = computeMoraleTarget(state);
    c.morale = clamp(c.morale + (moraleTarget - c.morale) * MORALE_DRIFT_PER_HOUR * hrs, 0, 100);
  }

  function clampState(state) {
    var b = state.boat, c = state.crew;
    b.battery = clamp(b.battery, 0, 100);
    c.fatigue = clamp(c.fatigue, 0, 100);
    c.morale = clamp(c.morale, 0, 100);
    state.nav.positionConfidence = b.electrical === 'DAMAGED' ? 'uncertain' : 'good';
  }

  function simTick(state) {
    state.meta.voyageMinutes += TICK_MINUTES;

    var prevCondition = state.weather.condition;
    driftWeather(state.weather, state.nav.lat);
    blendTowardRealAnchor(state.weather, TICK_MINUTES / 60);
    maybeRefreshRealWeather(state);
    maybeRefreshOceanCurrent(state);

    // Real dead-reckoning movement: the boat covers ground along its
    // ACTUAL heading (which may differ from the intended leg while
    // coastal auto-tacking, or simply be the player's own manually set
    // open-ocean course, itself already corrected for current — see
    // computeHeading) for real elapsed time. nav.heading stays the
    // through-water heading the whole way — what sails/wind care about
    // — but actual geographic movement and the displayed speed use the
    // vector sum of that motion through the water and whatever current
    // is moving the water itself (combineWithCurrent), the same
    // distinction a real GPS-vs-knotmeter reading would show. Speed is
    // computed once for the tick and that (speed over ground) is the
    // total distance budget spent below.
