<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05080a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>SOLACE — Ship's Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #050806;
    --phosphor: #8fd7ac;         /* SOFT — all normal non-interactive game text */
    --phosphor-bright: #c9f5da;  /* BRIGHT — selectable actions/commands only */
    --phosphor-dim: #4d7a5e;     /* DARK — timestamps ONLY, nothing else */
    --amber: #cf9f4a;
    --danger: #b5583f;
    --rule: rgba(143, 215, 172, 0.14);
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }

  body {
    font-family: var(--font-mono);
    color: var(--phosphor);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  #crt {
    position: relative;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.14) 0px,
      rgba(0,0,0,0.14) 1px,
      transparent 2px,
      transparent 3px
    );
    mix-blend-mode: multiply;
    opacity: 0.35;
    animation: flicker 7s infinite;
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 0.35; }
    97% { opacity: 0.28; }
    98% { opacity: 0.4; }
  }

  @media (prefers-reduced-motion: reduce) {
    #scanlines { animation: none; }
  }

  #topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--phosphor);
    flex-shrink: 0;
    gap: 0.6rem;
  }

  #topbar-right {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .hdr-btn {
    background: none;
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid var(--rule);
    color: var(--phosphor-bright);
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    padding: 0.25rem 0.6rem;
    cursor: pointer;
  }
  .hdr-btn:hover { border-color: var(--phosphor); }
  .hdr-btn[hidden] { display: none; }

  #navstrip {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 1rem;
    padding: 0.5rem 1.1rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--phosphor);
    flex-shrink: 0;
  }
  #navstrip[hidden] { display: none; }
  #navstrip span::after { content: '\00b7'; margin-left: 1rem; }
  #navstrip span:last-child::after { content: none; margin-left: 0; }

  #output {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem 1.2rem 0.4rem;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    text-shadow: 0 0 6px rgba(143,215,172,0.22);
  }

  .line {
    margin: 0 0 0.35rem;
    line-height: 1.55;
    font-size: 0.95rem;
  }

  .gap { height: 0.7rem; margin: 0; }

  .heading-label {
    color: var(--phosphor);
    letter-spacing: 0.08em;
  }

  .dim { color: var(--phosphor); }
  .amber { color: var(--amber); }
  .danger { color: var(--danger); }
  .echo { color: var(--phosphor); }

  .entry { margin-bottom: 0.9rem; }
  .entry-ts {
    color: var(--phosphor-dim);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    margin-bottom: 0.15rem;
  }
  .entry-text {
    font-size: 0.95rem;
    line-height: 1.6;
  }

  #controls {
    flex-shrink: 0;
    border-top: 1px solid var(--rule);
    padding: 0.8rem 1.2rem calc(0.7rem + env(safe-area-inset-bottom));
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  #options {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    max-height: 48vh;
    overflow-y: auto;
  }

  .option-divider {
    margin: 0.35rem 0;
  }

  .option {
    background: none;
    appearance: none;
    -webkit-appearance: none;
    border: none;
    color: var(--phosphor-bright);
    font-family: inherit;
    font-size: 0.92rem;
    text-align: left;
    padding: 0.15rem 0;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .option:hover, .option:focus-visible { text-decoration: underline; }
  .option:focus-visible { outline: 1px dashed var(--phosphor); outline-offset: 2px; }

  @media (max-width: 480px) {
    .line, .entry-text, .option { font-size: 0.98rem; }
    #output, #controls { padding-left: 0.9rem; padding-right: 0.9rem; }
  }
</style>
</head>
<body>
  <div id="crt">
    <div id="scanlines" aria-hidden="true"></div>
    <header id="topbar">
      <span id="vessel-line">S/V SOLACE — AT DOCK</span>
      <div id="topbar-right">
        <button id="restart-btn" class="hdr-btn" type="button" hidden>RESTART</button>
        <button id="sound-btn" class="hdr-btn" type="button">SOUND: OFF</button>
        <span id="clock">—</span>
      </div>
    </header>
    <div id="navstrip" hidden>
      <span id="nav-day"></span>
      <span id="nav-speed"></span>
      <span id="nav-heading"></span>
      <span id="nav-region"></span>
    </div>

    <main id="output" aria-live="polite"><div id="temp-view"></div></main>

    <footer id="controls">
      <div id="options"></div>
    </footer>
  </div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     LANDFALL — prototype vertical slice (Seattle -> Kauaʻi)
     ---------------------------------------------------------------------
     Built as a single self-contained file (matches how you usually ship
     these — no build step, drop straight into Neocities). The sections
     below mirror the multi-file layout from the brief; split them into
     separate <script src="..."> files later if you ever want to, nothing
     here depends on being in one file.

       1. Config & constants
       2. Game state
       3. Save / load (localStorage)
       4. Simulation engine
       5. Narrative / event checks
       6. Ambient audio (procedural, WebAudio — no sound files needed)
       7. Terminal rendering
       8. Commands
       9. Boot sequence

     REAL-TIME PRINCIPLE (see PROJECT.md for the full rationale):
     1 real minute = 1 game minute, always. Nothing in this file may
     call advanceSimulation() with an arbitrary chosen duration — the
     only legitimate callers are catchUpFromRealTime() (diffing real
     timestamps) and the live tick loop (diffing real elapsed ms).
     REST/SLEEP is a STATE (crew.watchState), not a time-skip action —
     see beginSleep() / wakeUp() / checkSleepInterrupt() below.
     ===================================================================== */

  /* ============================================================
     1. CONFIG & CONSTANTS
     ============================================================ */
  var STORAGE_KEY = 'kauaiVoyage_v1';
  var TICK_MINUTES = 10;              // simulation resolution, in simulated minutes
  var MAX_CATCHUP_TICKS = 20000;      // safety cap (~139 days) for offline catch-up
  var LIVE_TICK_SECONDS = 20;         // how often we advance sim while the tab is open

  var VESSEL_NAME = 'SOLACE';
  var DEPARTURE_PORT = "Shilshole Bay, Seattle";
  var DESTINATION_PORT = "Nawiliwili, Kauaʻi";

  var GAME = null;
  var printedCount = 0;

  /* ============================================================
     2. GAME STATE
     ============================================================ */
  function newGameState() {
    var now = Date.now();
    var start = WAYPOINTS[0];
    var startBearing = bearingBetween(start.lat, start.lon, WAYPOINTS[1].lat, WAYPOINTS[1].lon);
    return {
      version: 1,
      meta: {
        departedAt: now,
        lastTick: now,
        leftoverMinutes: 0,
        voyageMinutes: 0,
      },
      nav: {
        lat: start.lat,
        lon: start.lon,
        waypointIndex: 1,          // index into WAYPOINTS currently being steered toward
        distanceTraveled: 0,       // odometer — actual nm sailed, not progress toward the goal
        intendedCourse: startBearing, // bearing to the current waypoint; refreshed every tick
        headingOffset: 0,          // 0 = on course, +22 = borne away, -22 = come up
        heading: startBearing,
        positionConfidence: 'good',
        coastalRouteMigrated: true, // a fresh voyage never needs the one-time resync migrateCoastalWaypointIndexIfNeeded() does for older saves
        tack: null,                // null | 'port' | 'starboard' — set only while auto-tacking to windward; see resolveAutoTack()
        tackDistanceNm: 0,         // nm covered on the current tack, for deciding when to come about
      },
      weather: {
        // SW — real wind, not routing logic, so it can still drift into a
        // headwind over time. But the old 340 (NNW) was picked back when
        // heading was a fake constant unconnected to geography; now that
        // the first leg genuinely points north out of Shilshole, a due-
        // north headwind there would leave the boat nearly unsailable
        // before it even clears the marina. A SW wind gives it a fair
        // reach instead, which also happens to be a common real Puget
        // Sound pattern in unsettled weather like this game opens with.
        windDirection: 225,
        windSpeed: 13,
        seaState: 2,
        condition: 'overcast',
        trend: 'steady',
      },
      boat: {
        sailConfig: 'furled',       // full | reefed | minimal | furled — starts furled; nothing raises sails but the player
        engineOn: false,           // running under power (departure motor-out, or engine failure recovery later)
        fuelGallons: 20,           // diesel remaining, in gallons — see DIESEL_BURN_RATE_GPH
        speed: 0,                  // kt — recomputed every tick; POSITION displays a live value regardless
        hull: 100,
        rigging: 100,
        sails: 100,
        electrical: 100,           // shown to the player as BATTERIES in STATUS
        engine: 100,
        steering: 100,
        // Each system gets exactly one MAJOR repair for the voyage (see
        // attemptSystemRepair) — real parts run out. Once used, further
        // problems on that system can still be patched, just not as well.
        majorRepairUsed: { hull: false, rigging: false, sails: false, engine: false, electrical: false, steering: false },
        floodRate: 0,    // gal/hr currently entering the hull — 0 unless a leak is active
        bilgeWater: 0,   // gal currently accumulated in the bilge
      },
      crew: {
        fatigue: 8,
        hoursSinceRest: 3,
        hoursSinceMeal: 2,
        hoursSinceWater: 2,
        morale: 72,
        watchState: 'awake',        // 'awake' | 'trying' | 'sleeping' — see SLEEP PRESSURE note below
        sleepAttemptStartedAt: null, // voyageMinutes when SLEEP was selected, for the "trying" timeout
        sleepStartedAt: null,        // voyageMinutes at the moment sleep actually began, for duration text on waking
        lastCoffeeAt: null,          // voyageMinutes of the last coffee, for the mild/subtle alertness effect
        coffeeCount: 0,
        inLifeRaft: false,
        location: 'above',          // 'above' | 'below' — a physical place, not a menu state; see GO ABOVE/GO BELOW
        lastRoutineAt: { wash: null, dress: null, dishes: null, read: null }, // voyageMinutes of last use, for gentle diminishing returns
      },
      food: {
        oatmeal: 18, pasta: 12, rice: 16, soup: 8, chili: 8,
        tuna: 10, crackers: 12, peanutButter: 10, nuts: 16,
        driedFruit: 12, energyBars: 12, freshFruit: 8, freshBread: 6,
        comfort: 6, coffee: 24,
      },
      water: {
        primary: 35,    // gallons
        emergency: 8,   // gallons — a deliberate reserve, not silently spent
      },
      supplies: {
        propane: 60, // stove uses
        spares: {
          oil: 2, coolant: 2, fuelFilters: 4, oilFilters: 2, impellers: 3, belts: 2,
          spareLine: 100, shackles: 6, riggingTape: 2,
          fuses: 10, wire: 50, connectors: 20, batteries: 2,
          hose: 10, hoseClamps: 12,
          sailRepair: 3, epoxy: 2, sealant: 2,
        },
        safety: { flares: 6 }, // EPIRB/life raft are status, not a count — see state.rescue / crew.inLifeRaft
      },
      flags: {
        aftLockerTriggerAt: rand(8 * 60, 16 * 60), // guaranteed once, sometime hour 8-16
        aftLockerTriggered: false,
        aftLockerResolved: false,
        aftLockerEscalated: false,
        aftLockerDeferredAt: null,
        sailWarningIssued: false,
        fatigueNarrated: false,
        thirstNarrated: false,
        hungerNarrated: false,
        freshFruitSpoiled: false,
        freshBreadSpoiled: false,
        lastMilestone: 0,
        hullLeakTriggerAt: null, // set lazily by checkHullLeak's own per-tick roll, not a fixed guaranteed time
        hullLeakTriggered: false,
        hullLeakResolved: false,
        bilgeWarned50: false,
        bilgeWarned100: false,
      },
      rescue: {
        epirbOn: false,
        activatedAt: null,       // voyageMinutes
        phase: 'none',           // 'none' | 'traveling' | 'searching' | 'rescued'
        travelMinutes: 0,        // computed once at activation, from position/conditions
        nextSearchEventAt: null,
        encounterActive: false,
        encounterStartedAt: null,
        encounterKind: null,     // 'aircraft' | 'vessel'
        encounterFlareFired: false,
      },
      departure: { stageIndex: 0 }, // walks through DEPARTURE_STEPS before normal gameplay opens up
      pendingChoice: null,
      log: [],
    };
  }

  /* ============================================================
     3. SAVE / LOAD
     ============================================================ */
  function loadGameState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      console.warn('Save file unreadable, starting fresh.', e);
      return null;
    }
  }

  function saveGameState(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('Could not save game.', e);
    }
  }

  /* ============================================================
     4. SIMULATION ENGINE
     ============================================================ */
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function rand(min, max) { return min + Math.random() * (max - min); }
  function normalizeDeg(d) { return ((d % 360) + 360) % 360; }
  function angleDiff(a, b) {
    var d = Math.abs(a - b) % 360;
    return d > 180 ? 360 - d : d;
  }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* --------------------------------------------------------------
     NAVIGATION GEOMETRY
     ------------------------------------------------------------
     Real spherical-earth math: bearings, distances, and "move from
     here, on this heading, this far" position updates. The boat's
     lat/lon is dead reckoning — it only ever changes by physically
     moving from its last position (see simTick below). Nothing here
     ever snaps or interpolates the boat toward a waypoint; waypoints
     are only used to compute a bearing to steer toward.
     -------------------------------------------------------------- */
  var EARTH_RADIUS_NM = 3440.065;

  function toRad(deg) { return deg * Math.PI / 180; }
  function toDeg(rad) { return rad * 180 / Math.PI; }
  function normalizeLon(lon) { return ((lon + 540) % 360) - 180; }

  function distanceBetween(lat1, lon1, lat2, lon2) {
    var phi1 = toRad(lat1), phi2 = toRad(lat2);
    var dPhi = toRad(lat2 - lat1);
    var dLambda = toRad(lon2 - lon1);
    var a = Math.sin(dPhi / 2) * Math.sin(dPhi / 2) +
      Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) * Math.sin(dLambda / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return EARTH_RADIUS_NM * c;
  }

  function bearingBetween(lat1, lon1, lat2, lon2) {
    var phi1 = toRad(lat1), phi2 = toRad(lat2);
    var dLambda = toRad(lon2 - lon1);
    var y = Math.sin(dLambda) * Math.cos(phi2);
    var x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLambda);
    return normalizeDeg(toDeg(Math.atan2(y, x)));
  }

  // Given a start point, a true heading, and a distance, return where the
  // boat physically ends up. This is the ONLY thing that may ever change
  // state.nav.lat/lon — called once per simulated tick with that tick's
  // actual heading and actual distance covered.
  function destinationPoint(lat, lon, headingDeg, distanceNm) {
    var delta = distanceNm / EARTH_RADIUS_NM;
    var theta = toRad(headingDeg);
    var phi1 = toRad(lat), lambda1 = toRad(lon);
    var phi2 = Math.asin(Math.sin(phi1) * Math.cos(delta) + Math.cos(phi1) * Math.sin(delta) * Math.cos(theta));
    var lambda2 = lambda1 + Math.atan2(
      Math.sin(theta) * Math.sin(delta) * Math.cos(phi1),
      Math.cos(delta) - Math.sin(phi1) * Math.sin(phi2)
    );
    return { lat: toDeg(phi2), lon: normalizeLon(toDeg(lambda2)) };
  }

  // Perpendicular distance (nm) from a point to the great-circle line
  // running from (lat1,lon1) to (lat2,lon2) — used to tell the player how
  // far off their intended track they actually are, computed fresh from
  // real position rather than accumulated as a separate counter.
  function crossTrackNm(lat, lon, lat1, lon1, lat2, lon2) {
    var d13 = distanceBetween(lat1, lon1, lat, lon) / EARTH_RADIUS_NM;
    var brng13 = toRad(bearingBetween(lat1, lon1, lat, lon));
    var brng12 = toRad(bearingBetween(lat1, lon1, lat2, lon2));
    var xt = Math.asin(Math.sin(d13) * Math.sin(brng13 - brng12));
    return Math.abs(xt * EARTH_RADIUS_NM);
  }

  // Real named waypoints, Shilshole Bay out to Kauaʻi. These are steering
  // TARGETS — the "intended course" is the bearing toward whichever one
  // is current. The boat is never moved to them directly; see simTick()
  // for the only place actual position changes, and for how the current
  // target advances when the boat's per-tick movement budget reaches it.
  //
  // The coastal leg (Shilshole through Cape Flattery) below is an exact,
  // manually-selected chain supplied directly and is not to be modified,
  // reordered, averaged, or have points inserted between them — see
  // simTick() for how a single simulation tick correctly crosses one or
  // more of these closely-spaced points without overshooting along a
  // stale bearing, which is what this exact chain depends on for safe
  // routing rather than the waypoint coordinates having built-in margin.
  var WAYPOINTS = [
    { name: 'Shilshole Bay Marina', lat: 47.682726, lon: -122.407350 },
    { name: 'Shilshole Exit',       lat: 47.693946, lon: -122.410738 },
    { name: 'Puget Sound',          lat: 47.942709, lon: -122.505301 },
    { name: 'Admiralty South',      lat: 47.973161, lon: -122.626334 },
    { name: 'Admiralty North',      lat: 48.124463, lon: -122.657525 },
    { name: 'Point Wilson',         lat: 48.153816, lon: -122.731903 },
    { name: 'Strait East',          lat: 48.211898, lon: -122.953640 },
    { name: 'Strait East 2',        lat: 48.211882, lon: -123.105442 },
    { name: 'Strait Mid',           lat: 48.221306, lon: -124.018222 },
    { name: 'Strait West',          lat: 48.384889, lon: -124.455780 },
    { name: 'Cape Approach',        lat: 48.421859, lon: -124.693376 },
    { name: 'Cape Flattery',        lat: 48.401734, lon: -124.827023 },
    { name: 'open water, well offshore', lat: 40.0,   lon: -130.0 },
    { name: 'the trade wind belt',       lat: 28.0,   lon: -145.0 },
    { name: 'Kauaʻi',                    lat: 21.954, lon: -159.356 },
  ];
  var FINAL_DEST = WAYPOINTS[WAYPOINTS.length - 1];
  var OPEN_WATER_WAYPOINT_INDEX = 12; // targeting waypoint 12 ("open water, well offshore") or later = clear of Cape Flattery and coastal hazards; below that, course changes are geographically constrained

  var TOTAL_ROUTE_NM = 0;
  (function () {
    for (var i = 1; i < WAYPOINTS.length; i++) {
      TOTAL_ROUTE_NM += distanceBetween(WAYPOINTS[i - 1].lat, WAYPOINTS[i - 1].lon, WAYPOINTS[i].lat, WAYPOINTS[i].lon);
    }
  })();
  var ROUTE_DISTANCE_NM = Math.round(TOTAL_ROUTE_NM); // departure-screen blurb only — never used to place the boat

  /* --------------------------------------------------------------
     OBSERVE
     ------------------------------------------------------------
     Not primarily informational — it exists to make the voyage feel
     physical and lonely. Mostly quiet, occasionally something more.
     -------------------------------------------------------------- */
  function voyagePhase(state) {
    var wi = state.nav.waypointIndex;
    if (wi <= 5) return 'inland';    // Shilshole through clearing Point Wilson
    if (wi <= 9) return 'strait';    // the Strait of Juan de Fuca
    if (wi <= 11) return 'coastal';  // approaching / just past Cape Flattery
    if (wi >= 14) return 'approach'; // final leg toward Kauaʻi
    if (wi === 13) return 'tropics'; // trade wind belt
    return 'offshore'; // wi === 12 ("open water, well offshore")
  }

  function timeOfDayPhase(state) {
    var d = new Date(state.meta.departedAt + state.meta.voyageMinutes * 60000);
    var h = d.getHours();
    if (h < 5) return 'night';
    if (h < 7) return 'dawn';
    if (h < 11) return 'morning';
    if (h < 15) return 'midday';
    if (h < 18) return 'afternoon';
    if (h < 20) return 'dusk';
    return 'night';
  }

  var OBSERVATIONS = {
    inland: {
      quiet: [
        'A ferry crosses well astern, lit up like a small town.',
        'The shoreline slides by, dark hills and scattered lights.',
        'Gulls work the water off the bow, indifferent to the boat.',
        'Rain moves over the mainland, visible as a grey smear on the hills.',
        'Another sailboat, reefed down, passes well to port.',
        'The smell of the tide flats carries out on the wind.',
      ],
      awe: ['The mountains catch the last light, briefly on fire before it fades.'],
    },
    strait: {
      quiet: [
        'Cliffs rise pale on one side, open water on the other.',
        'A container ship passes far off, low and enormous.',
        'Fog sits in patches over the water, thinning and thickening.',
        'Seabirds ride the swell without apparent effort.',
      ],
      awe: ['For a few minutes the strait goes glassy, mountains doubled in the water.'],
    },
    coastal: {
      quiet: [
        'The coastline is a low grey line, then nothing.',
        'Swell starts to build under the hull, the first real ocean motion.',
        'A fishing boat works a line somewhere off to starboard.',
        'The water changes color, green to a deeper, colder blue.',
      ],
      awe: ['The land disappears behind for good. Just water now, in every direction.'],
    },
    offshore: {
      quiet: [
        'Long swells lift and drop the boat, unhurried.',
        'A seabird glides past without a single wingbeat.',
        'Clouds stack on the horizon, building into something or nothing.',
        'The horizon is empty in every direction.',
        'A squall passes well clear, visible as a grey curtain of rain.',
        'The wake trails off pale behind the boat, then is gone.',
        'Something logs a splash off the beam. Gone before you can look.',
      ],
      awe_night: [
        'The wake glows faintly green — phosphorescence, stirred up by the hull.',
        'No moon tonight. The stars are absurd, edge to edge, no city to dim them.',
        'A meteor burns a long line across the sky and is gone.',
      ],
      awe_day: [
        'A pod of dolphins rides the bow wave for a while, then peels off.',

    w.windDirection = normalizeDeg(w.windDirection + (Math.random() - 0.5) * 6);

  // AUTO-TACKING — a sailing-simulation detail underneath the existing
  // navigation system, not a new navigation feature. CHANGE COURSE, the
  // route, waypoints, and when course changes are available are all
  // completely untouched: this only decides, given whatever heading the
  // existing systems currently want (waypoint bearing + the player's
  // headingOffset from CHANGE COURSE), whether that heading is sailable
  // right now, and if not, what the boat physically does about it
  // instead of luffing in place. nav.intendedCourse keeps its existing
  // meaning (bearing to the current waypoint) throughout; it's nav.heading
  // — the boat's actual steered heading — that reflects the tack.
  var NOGO_ZONE_DEG = 35;          // matches pointOfSailFactor's own no-go threshold, so this is the exact same zone that already tanks sail speed

  // Tack legs are long in the open ocean (realistic cruising behavior,
  // and keeps the log from filling up with routine tacks) but short
  // through the coastal corridor, where the route can run within well
  // under a mile of real charted shoreline (see WAYPOINTS' own notes on
  // the Marrowstone/Whidbey passage) and a wide zigzag could carry the
  // boat off that verified-safe line. Reuses the same constrained-waters
  // boundary COURSE already uses (OPEN_WATER_WAYPOINT_INDEX), rather
  // than inventing a second one.
  var OPEN_WATER_MAX_TACK_LEG_NM = 8;

  }

  // directly if it's sailable, or a close-hauled tack if it isn't.
  // Reads/writes nav.tack and nav.tackDistanceNm; simTick() is what
  // accumulates tackDistanceNm as the boat actually moves.
  function resolveAutoTack(state, desired, wp) {
    var nav = state.nav, w = state.weather, b = state.boat;

    // Nothing to beat with — no canvas up, or nothing left to sail at
    // all. Steer the existing direct course exactly as before.

      if (nav.tack) { nav.tack = null; nav.tackDistanceNm = 0; }

    var inNoGo = angleDiff(desired, w.windDirection) < NOGO_ZONE_DEG;

        nav.tack = null;

      // course (waypoint progress, or the player using CHANGE COURSE)

      // current tack would then just be sailing away from the goal.
      // Flipping to the opposite of the current tack is correct either

      // the difference between full and minimal sail almost entirely).

      // already is to hull speed — pushing a displacement hull past that

      // hull speed) shrinks to a small one in a strong breeze (already near

    var total = propelled + computeDriftSpeed(state);

    // that's the total distance budget spent below — but if that budget
    // is enough to actually reach the current waypoint, the boat arrives
    // there exactly, spends only that much of the budget, advances to the
    // next waypoint, and covers the REST of the budget along the new
    // bearing — rather than sailing straight past it on the old one.
    // Several of the coastal steering waypoints are closer together than

    checkWeatherNarration(state, prevCondition);
    checkFatigueNarration(state);
    checkThirstNarration(state);
    checkHungerNarration(state);
    checkSpoilage(state);
    checkMilestones(state);
    checkAmbientEvent(state);
    processSleepTick(state, prevCondition);

    clampState(state);
  }

  function advanceSimulation(state, minutes) {
    var remaining = minutes + (state.meta.leftoverMinutes || 0);
    var ticks = 0;
    state._ambientEventsThisPass = 0; // capped inside checkAmbientEvent — never dumps a backlog after a long absence
    while (remaining >= TICK_MINUTES && ticks < MAX_CATCHUP_TICKS) {
      simTick(state);
      remaining -= TICK_MINUTES;
      ticks++;
    }
    delete state._ambientEventsThisPass; // transient — never persisted
    state.meta.leftoverMinutes = remaining;
    return ticks;
  }

  function catchUpFromRealTime(state) {
    var now = Date.now();
    var elapsedMinutes = (now - state.meta.lastTick) / 60000;
    if (elapsedMinutes < 1) { state.meta.lastTick = now; return 0; }
    var ticks = advanceSimulation(state, elapsedMinutes);
    state.meta.lastTick = now;
    return ticks;
  }

  /* ============================================================
     5. NARRATIVE / EVENT CHECKS
     ============================================================ */
  function log(state, text) {
    var ts = state.meta.departedAt + state.meta.voyageMinutes * 60000;
    state.log.push({ t: ts, text: text });
  }

  function checkFuel(state) {
    var b = state.boat;
    if (!b.engineOn) return;
    var hrs = TICK_MINUTES / 60;
    b.fuelGallons = clamp(b.fuelGallons - hrs * DIESEL_BURN_RATE_GPH, 0, 999);
    if (b.fuelGallons <= 0) {
      b.engineOn = false;
      log(state, "The engine coughs and dies. Fuel's gone.");
    }
  }

  function checkSailStrain(state) {
    if (state.boat.sailConfig === 'furled') return; // nothing to strain with no canvas up
    var w = state.weather, b = state.boat, f = state.flags;
    if (b.sailConfig === 'full' && w.windSpeed > 24) {
      if (!f.sailWarningIssued) {
        f.sailWarningIssued = true;
        log(state, "Wind's up past what she likes with full sail on her. She's carrying too much.");
      }
      if (Math.random() < 0.05) {
        b.sails = clamp(b.sails - rand(3, 9), 0, 100);
        b.rigging = clamp(b.rigging - rand(1, 5), 0, 100);
        log(state, "A gust rounds her up hard. Something aloft strains and holds — for now.");
      }
    }
    if (w.windSpeed <= 20) f.sailWarningIssued = false;
  }

  // Background wear for the systems checkSailStrain doesn't cover.
  // Rates are deliberately gentle — see PROJECT.md: competence should
  // produce calm, not a slow-motion equipment apocalypse. Numbers below
  // are tuned so that heavy, sustained use over the ~3-4 week voyage is
  // what erodes a system, not routine operation.
  function checkSystemWear(state) {
    var b = state.boat, w = state.weather;
    var hrs = TICK_MINUTES / 60;

    // Motoring wears the engine down slowly — noticeable only after many
    // cumulative hours running, which the fuel supply already limits to
    // roughly a day and a half of continuous use at most.
    if (b.engineOn) {
      b.engine = clamp(b.engine - hrs * 0.6, 0, 100);
    }

    // Batteries drain a little just from being aboard and in use over a
    // long voyage — slow background wear, not tied to any one action.
    b.electrical = clamp(b.electrical - hrs * 0.08, 0, 100);

    // Steering sees slow wear from continuous use under way, faster when
    // fighting a confused sea.
    if (b.speed > 0.3) {
      var steeringRate = 0.05 + (w.seaState >= 4 ? 0.08 : 0);
      b.steering = clamp(b.steering - hrs * steeringRate, 0, 100);
    }

    // Heavy seas can knock the boat around hard enough to hurt the hull
    // or steering directly — a chance-based jolt, same shape as
    // checkSailStrain's gust damage, not a steady drain.
    if (w.seaState >= 5) {
      if (Math.random() < 0.02) {
        b.hull = clamp(b.hull - rand(2, 7), 0, 100);
        log(state, 'A hard sea slams into her broadside. Something below flinches.');
      }
      if (Math.random() < 0.015) {
        b.steering = clamp(b.steering - rand(2, 6), 0, 100);
        log(state, 'The helm fights the confused sea hard, gear straining under it.');
      }
    }
  }

  function checkAftLocker(state) {
    var f = state.flags;
    if (!f.aftLockerTriggered && state.meta.voyageMinutes >= f.aftLockerTriggerAt) {
      f.aftLockerTriggered = true;
      log(state, "Something in the aft locker has come loose. A dull, irregular thud with every roll.");
      state.pendingChoice = {
        id: 'aft-locker',
        options: [
          { label: 'INSPECT NOW', action: 'resolve-aft-locker-now' },
          { label: 'SECURE IT LATER', action: 'defer-aft-locker' },
        ],
      };
      return;
    }
    if (f.aftLockerTriggered && !f.aftLockerResolved && f.aftLockerDeferredAt !== null && !f.aftLockerEscalated) {
      var hoursSinceDeferred = (state.meta.voyageMinutes - f.aftLockerDeferredAt) / 60;
      if (hoursSinceDeferred > 5) {
        f.aftLockerEscalated = true;
        state.boat.rigging = clamp(state.boat.rigging - rand(2, 6), 0, 100);
        state.crew.morale = clamp(state.crew.morale - 4, 0, 100);
        log(state, "The thud from aft has worked something loose against the steering gear. Should have looked sooner.");
      }
    }
  }

  /* --------------------------------------------------------------
     FLOODING

     A rare, weather-correlated event — not guaranteed every voyage.
     A hull leak (boat.floodRate, gal/hr) either stays within what the
     bilge pump can clear on its own, or it doesn't — in which case
     water genuinely accumulates (boat.bilgeWater) until repaired.
     This is the one path that makes the life raft a meaningful,
     last-resort option rather than a decoration.
     -------------------------------------------------------------- */
  var BILGE_PUMP_CAPACITY_GPH = 60; // the automatic pump clears this much on its own
  var BILGE_CRITICAL_GALLONS = 150; // past this, the boat is in genuine danger — see DISTRESS's life-raft gate

  function checkHullLeak(state) {
    var f = state.flags;
    if (f.hullLeakTriggered || state.crew.inLifeRaft) return;
    if (state.departure.stageIndex < DEPARTURE_STEPS.length) return;
    if (voyagePhase(state) === 'inland') return; // not out in real conditions yet
    var chance = 0.00025; // per 10-minute tick, offshore, in ordinary conditions
    if (state.weather.seaState >= 5) chance *= 4;
    else if (state.weather.seaState >= 4) chance *= 2;
    if (Math.random() < chance) {
      f.hullLeakTriggered = true;
      state.boat.floodRate = rand(15, 90);
      log(state, "Water where there shouldn't be any \u2014 a leak somewhere below the waterline.");
      flushNewLogEntries(state);
    }
  }

  function checkFlooding(state) {
    var b = state.boat, f = state.flags;
    if (b.floodRate <= 0 && b.bilgeWater <= 0) return;
    var hours = TICK_MINUTES / 60;
    var net = b.floodRate - BILGE_PUMP_CAPACITY_GPH; // negative once the pump is winning
    b.bilgeWater = clamp(b.bilgeWater + net * hours, 0, 9999);
    if (b.bilgeWater >= 50 && !f.bilgeWarned50) {
      f.bilgeWarned50 = true;
      log(state, "Water sloshing in the bilge now. The pump is working for it.");
      flushNewLogEntries(state);
    }
    if (b.bilgeWater >= 100 && !f.bilgeWarned100) {
      f.bilgeWarned100 = true;
      log(state, "The pump can't keep up. Water's rising below.");
      flushNewLogEntries(state);
    }
  }

  /* --------------------------------------------------------------
     RESCUE

     EPIRB -> real-time travel to the search area -> a SEARCH phase
     made of discrete, widely-spaced "encounters" (an aircraft or
     vessel actually searching nearby) each open for a real multi-hour
     window — long enough that checking Landfall a couple of times a
     day is enough to catch one and fire a flare. Missing a window
     never fails the rescue; it just means the next encounter, a few
     hours later, resolves without the flare's help. This is real
     time throughout: nothing here is a caller of advanceSimulation(),
     it only ever reads state.meta.voyageMinutes and reschedules a
     future timestamp for simTick to notice on some later real tick.
     -------------------------------------------------------------- */
  var RESCUE_ENCOUNTER_WINDOW_MINUTES = 180; // how long an encounter stays open for a flare response
  var RESCUE_ENCOUNTER_MIN_GAP = 180;        // 3-8 real hours between search encounters
  var RESCUE_ENCOUNTER_MAX_GAP = 480;

  function estimateRescueTravelMinutes(state) {
    var phase = voyagePhase(state);
    var baseHours = { inland: 1, strait: 2, coastal: 4, offshore: 20, tropics: 16, approach: 7 }[phase];
    if (baseHours == null) baseHours = 14;
    var weatherFactor = (state.weather.seaState >= 5) ? 1.4 : 1.0;
    return Math.round(baseHours * weatherFactor * 60);
  }

  function rescueEncounterChance(state) {
    var r = state.rescue;
    var chance = 0.4; // aboard the boat, reasonable visibility, baseline
    if (state.crew.inLifeRaft) chance -= 0.15; // a much smaller target
    var tod = timeOfDayPhase(state);
    if (tod === 'night') chance -= 0.15;
    if (state.weather.condition === 'squall' || state.weather.seaState >= 5) chance -= 0.1;
    if (r.encounterFlareFired) {
      var boost = 0.4;
      if (state.crew.inLifeRaft) boost += 0.1;  // exactly where a flare matters most
      if (tod === 'night') boost += 0.1;
      chance += boost;
    }
    return clamp(chance, 0.1, 0.95);
  }

  function beginRescueEncounter(state) {
    var r = state.rescue;
    r.encounterActive = true;
    r.encounterStartedAt = state.meta.voyageMinutes;
    r.encounterFlareFired = false;
    r.encounterKind = Math.random() < 0.5 ? 'aircraft' : 'vessel';
    log(state, r.encounterKind === 'aircraft'
      ? 'You hear an aircraft. It circles somewhere in the distance.'
      : 'A vessel is visible, working a search pattern.');
    log(state, 'Rescuers are searching the area.');
    flushNewLogEntries(state);
  }

  function resolveRescueEncounter(state) {
    var r = state.rescue;
    var success = Math.random() < rescueEncounterChance(state);
    r.encounterActive = false;
    if (success) {
      r.phase = 'rescued';
      log(state, r.encounterKind === 'aircraft'
        ? 'The aircraft circles once more. This time it stays.'
        : 'The vessel alters course toward you. It keeps coming.');
      log(state, 'RESCUED');
      flushNewLogEntries(state);
    } else {
      log(state, r.encounterKind === 'aircraft'
        ? "The aircraft's gone quiet. It could come back."
        : 'The vessel moves off, still searching elsewhere.');
      flushNewLogEntries(state);
      r.nextSearchEventAt = state.meta.voyageMinutes + rand(RESCUE_ENCOUNTER_MIN_GAP, RESCUE_ENCOUNTER_MAX_GAP);
    }
  }

  function checkRescue(state) {
    var r = state.rescue;
    if (!r.epirbOn || r.phase === 'rescued') return;

    if (r.phase === 'traveling') {
      if (state.meta.voyageMinutes >= r.activatedAt + r.travelMinutes) {
        r.phase = 'searching';
        log(state, "You're in the search area now.");
        flushNewLogEntries(state);
        r.nextSearchEventAt = state.meta.voyageMinutes + rand(RESCUE_ENCOUNTER_MIN_GAP, RESCUE_ENCOUNTER_MAX_GAP);
      }
      return;
    }

    if (r.phase !== 'searching') return;

    if (r.encounterActive) {
      if (state.meta.voyageMinutes >= r.encounterStartedAt + RESCUE_ENCOUNTER_WINDOW_MINUTES) {
        resolveRescueEncounter(state);
      }
      return;
    }

    if (r.nextSearchEventAt != null && state.meta.voyageMinutes >= r.nextSearchEventAt) {
      beginRescueEncounter(state);
    }
  }

  function weatherChangeLine(condition) {
    var lines = {
      rain: "Rain starts, fine and steady.",
      squall: "A squall line closing fast. Everything goes grey.",
      overcast: "Cloud thickens overhead. The horizon dims.",
      clear: "The overcast breaks. Stars, briefly, then gone again.",
    };
    return lines[condition] || ("Sky shifts to " + condition + ".");
  }

  function checkWeatherNarration(state, prevCondition) {
    if (state.weather.condition !== prevCondition) {
      log(state, weatherChangeLine(state.weather.condition));
    }
  }

  function checkFatigueNarration(state) {
    var f = state.flags;
    if (state.crew.fatigue > 75 && !f.fatigueNarrated) {
      f.fatigueNarrated = true;
      log(state, "Hands feel slow. Everything simple takes an extra beat.");
    }
    if (state.crew.fatigue < 50) f.fatigueNarrated = false;
  }

  function checkThirstNarration(state) {
    var f = state.flags;
    if (thirstLevel(state.crew.hoursSinceWater) >= 3 && !f.thirstNarrated) {
      f.thirstNarrated = true;
      log(state, "Your mouth feels like the inside of a sail bag. Water, before anything else.");
    }
    if (thirstLevel(state.crew.hoursSinceWater) < 2) f.thirstNarrated = false;
  }

  function checkHungerNarration(state) {
    var f = state.flags;
    if (hungerLevel(state.crew.hoursSinceMeal) >= 3 && !f.hungerNarrated) {
      f.hungerNarrated = true;
      log(state, "Stomach's stopped asking and started aching. You need real food.");
    }
    if (hungerLevel(state.crew.hoursSinceMeal) < 2) f.hungerNarrated = false;
  }

  /* --------------------------------------------------------------
     PASSIVE AMBIENT EVENTS

     Observations ("something the sailor notices outside themselves")
     and ponderings ("something that surfaces in the sailor's mind")
     both flow through here — chosen at random, on a single schedule
     that reschedules itself every time, so the two never label
     themselves and never compete for airtime by running on separate
     clocks. Nothing about this touches the voyage clock; it only
     ever decides whether THIS tick is the one that writes a log line.
     -------------------------------------------------------------- */
  var AMBIENT_MIN_GAP_MINUTES = 90;   // at least 1.5h between ambient events
  var AMBIENT_MAX_GAP_MINUTES = 300;  // at most 5h — "substantial stretches" without one
  var AMBIENT_CATCHUP_CAP = 2;        // a long absence surfaces at most this many, never a backlog dump
  var AMBIENT_HISTORY_LENGTH = 6;     // how many recent picks to avoid repeating

  function ambientEventsAllowed(state) {
    if (state.departure.stageIndex < DEPARTURE_STEPS.length) return false; // mid opening-sequence — no room for musing
    if (state.crew.inLifeRaft) return false; // pure survival focus — no idle noticing from a raft
    if (state.crew.watchState !== 'awake') return false;      // asleep or trying to be — not noticing anything
    if (state.pendingChoice) return false;                    // mid-decision, not the moment for a stray thought
    if (state.weather.condition === 'squall') return false;   // storms and emergencies dominate attention
    if (state.weather.seaState >= 5) return false;
    if (state.flags.aftLockerTriggered && !state.flags.aftLockerResolved) return false; // an active problem aboard
    if (state.boat.floodRate > 0) return false; // active flooding dominates attention too
    if (hungerLevel(state.crew.hoursSinceMeal) >= 3) return false;  // severe hunger/thirst — physical concerns dominate
    if (thirstLevel(state.crew.hoursSinceWater) >= 3) return false;
    return true;
  }

  function ponderingChance(state) {
    var chance = 0.35; // observations are somewhat more common than ponderings overall
    if (state.meta.voyageMinutes / 1440 > 4) chance += 0.15; // more likely after several days offshore
    var tod = timeOfDayPhase(state);
    if (tod === 'night' || tod === 'dawn' || tod === 'dusk') chance += 0.15; // solitude, routine, quiet hours
    if (state.weather.seaState <= 2 && state.weather.condition !== 'rain') chance += 0.1; // calm sailing
    var phase = voyagePhase(state);
    if (phase === 'offshore' || phase === 'tropics') chance += 0.1; // extended solitude, long uneventful stretches
    return clamp(chance, 0.1, 0.75);
  }

  function checkAmbientEvent(state) {
    var f = state.flags;
    if (f.nextAmbientEventAt == null) {
      f.nextAmbientEventAt = state.meta.voyageMinutes + rand(AMBIENT_MIN_GAP_MINUTES, AMBIENT_MAX_GAP_MINUTES);
      return;
    }
    if (state.meta.voyageMinutes < f.nextAmbientEventAt) return;
    // Reschedule unconditionally, whether or not something actually fires —
    // a suppressed slot (danger, asleep, etc.) doesn't get "saved up" for
    // later; it just tries again at the next randomized interval.
    f.nextAmbientEventAt = state.meta.voyageMinutes + rand(AMBIENT_MIN_GAP_MINUTES, AMBIENT_MAX_GAP_MINUTES);

    if (state._ambientEventsThisPass !== undefined && state._ambientEventsThisPass >= AMBIENT_CATCHUP_CAP) return;
    if (!ambientEventsAllowed(state)) return;

    var text = Math.random() < ponderingChance(state) ? pickPondering(state) : pickObservation(state);
    if (!f.recentAmbientTexts) f.recentAmbientTexts = [];
    f.recentAmbientTexts.push(text);
    if (f.recentAmbientTexts.length > AMBIENT_HISTORY_LENGTH) f.recentAmbientTexts.shift();
    log(state, text);
    flushNewLogEntries(state);
    if (state._ambientEventsThisPass !== undefined) state._ambientEventsThisPass++;
  }

  function checkSpoilage(state) {
    var days = state.meta.voyageMinutes / 1440;
    var f = state.flags, food = state.food;
    if (!f.freshFruitSpoiled && days > 6 && food.freshFruit > 0) {
      food.freshFruit = 0;
      f.freshFruitSpoiled = true;
      log(state, "The last of the fresh fruit has gone soft and off. Over the side with it.");
    }
    if (!f.freshBreadSpoiled && days > 4 && food.freshBread > 0) {
      food.freshBread = 0;
      f.freshBreadSpoiled = true;
      log(state, "The bread has finally gone \u2014 mold, then over the side.");
    }
  }

  function checkMilestones(state) {
    var milestone = Math.floor(state.nav.distanceTraveled / 300);
    if (milestone > state.flags.lastMilestone) {
      state.flags.lastMilestone = milestone;
      log(state, (milestone * 300) + " nautical miles behind you now.");
    }
  }

  function waypointArrivalLine(wp) {
    var lines = {
      'Shilshole Exit': 'Clear of the marina, into open Puget Sound.',
      'Puget Sound': 'Threading the channel toward Admiralty Inlet.',
      'Admiralty South': 'Into Admiralty Inlet \u2014 the water narrows here.',
      'Admiralty North': 'Clear of Marrowstone Island. Turning toward Port Townsend.',
      'Point Wilson': 'Port Townsend slides by off the beam. Almost to the strait.',
      'Strait East': 'Into the Strait of Juan de Fuca proper.',
      'Strait East 2': 'Dungeness Spit somewhere off to port, well clear.',
      'Strait Mid': 'Mid-strait now \u2014 the Olympics to port, Vancouver Island to starboard.',
      'Strait West': "Nearing the strait's mouth. Cape Flattery ahead.",
      'Cape Approach': 'Rounding toward Cape Flattery.',
      'Cape Flattery': 'Clear of Cape Flattery. The Pacific opens up ahead.',
      'open water, well offshore': 'Well clear of the coast now, turning south to find the trades.',
      'the trade wind belt': 'Into the trade winds. Turning west for Hawaiʻi.',
      'Kauaʻi': 'Kauaʻi rises off the bow.',
    };
    return lines[wp.name] || (wp.name + ' behind you now.');
  }

  function resolveAftLocker(state) {
    var c = state.crew;
    var spares = state.supplies.spares;
    var hasShackle = spares.shackles > 0;
    var penalty = 0;
    if (hungerLevel(c.hoursSinceMeal) >= 3) penalty += 0.12;
    if (thirstLevel(c.hoursSinceWater) >= 3) penalty += 0.15;
    if (coffeeActive(state)) penalty -= 0.05;
    if (!hasShackle) penalty += 0.15; // improvising without the right hardware
    if (c.morale < 40) penalty += 0.06; // rattled, more likely to fumble it
    var successChance = clamp(0.92 - c.fatigue / 150 - penalty, 0.2, 0.92);
    var success = Math.random() < successChance;
    state.flags.aftLockerResolved = true;
    c.fatigue = clamp(c.fatigue + 4, 0, 100);
    if (success) {
      if (hasShackle) {
        spares.shackles -= 1;
        log(state, "Found it: a jerry can, worked loose from its strap. A new shackle sets it right. Quiet again.");
      } else {
        log(state, "Found it: a jerry can, worked loose from its strap. No spare shackle aboard — lashed it down instead. Quiet again, for now.");
      }
    } else {
      state.boat.rigging = clamp(state.boat.rigging - rand(3, 8), 0, 100);
      log(state, "Fumbled it in the dark — a bruised knuckle, and something aft feels different now, secured or not.");
    }
    flushNewLogEntries(state);
  }

  /* --------------------------------------------------------------
     SLEEP PRESSURE

     Sleep is still a STATE, never a call that manufactures time — but
     it's now three states, not two: 'awake' -> 'trying' -> 'sleeping'.
     Selecting SLEEP only ever starts an attempt; every tick after that
     (whether the live loop or catchUpFromRealTime) rolls real, condition-
     driven odds for actually falling asleep, and later for staying that
     way. A well-rested sailor can select SLEEP and simply lie there,
     exactly as asked — this is what keeps "close game, tap SLEEP" from
     ever being a guaranteed free fatigue reset.
     -------------------------------------------------------------- */
  var TRYING_TO_SLEEP_GIVE_UP_MINUTES = 120; // give up and get up after 2 hours of not falling asleep

  function tryingToSleepNarrative() {
    var options = [
      "You go below and try to settle. The autopilot holds her course.",
      "You lie down, still half dressed, and wait for it to take you.",
      "Eyes closed. Whether sleep comes is another matter.",
    ];
    return options[Math.floor(Math.random() * options.length)];
  }

  function describeSleepDuration(minutes) {
    if (minutes < 20) return "a few minutes";
    if (minutes < 60) return "under an hour";
    var rounded = Math.round((minutes / 60) * 2) / 2; // nearest half hour
    return rounded + (rounded === 1 ? " hour" : " hours");
  }

  // Per-tick chance of actually dropping off while 'trying'. Fatigue does
  // most of the work; a long stretch already awake nudges it further;
  // rough seas and recent coffee push back against it.
  function fallAsleepChance(state) {
    var c = state.crew;
    var base = 0.15;
    var fatigueBoost = clamp(c.fatigue / 100, 0, 1) * 0.55;
    var awakeBoost = clamp((c.hoursSinceRest - 4) / 20, 0, 0.25);
    var seaPenalty = state.weather.seaState >= 4 ? 0.15 : (state.weather.seaState >= 3 ? 0.05 : 0);
    var coffeePenalty = coffeeActive(state) ? 0.18 : 0;
    return clamp(base + fatigueBoost + awakeBoost - seaPenalty - coffeePenalty, 0.03, 0.9);
  }

  // Per-tick chance of surfacing again once 'sleeping'. Low remaining
  // fatigue (already well rested) makes waking likelier; rough seas add
  // their own chance on top — sleep interrupted by weather, not just
  // completed by resting enough.
  function wakeChanceWhileSleeping(state) {
    var c = state.crew;
    var restedness = clamp(1 - c.fatigue / 100, 0, 1);
    var base = 0.02 + restedness * 0.10;
    var seaBoost = state.weather.seaState >= 5 ? 0.12 : (state.weather.seaState >= 4 ? 0.05 : 0);
    return clamp(base + seaBoost, 0.01, 0.6);
  }

  function wakeUp(state, baseText, includeDuration) {
    var start = state.crew.sleepStartedAt;
    var minutesAsleep = start == null ? 0 : state.meta.voyageMinutes - start;
    state.crew.watchState = 'awake';
    state.crew.sleepStartedAt = null;
    var text = baseText;
    if (includeDuration !== false && minutesAsleep >= 5) {
      text += ' Roughly ' + describeSleepDuration(minutesAsleep) + ' below.';
    }
    log(state, text);
    flushNewLogEntries(state);
  }

  // Advances the 'trying' -> 'sleeping' -> 'awake' state machine by one
  // tick. This is the only place any of those transitions happen, so it
  // runs identically whether it's the live loop or a multi-day catch-up.
  function processSleepTick(state, prevCondition) {
    var c = state.crew;

    if (c.watchState === 'trying') {
      if (Math.random() < fallAsleepChance(state)) {
        c.watchState = 'sleeping';
        // Only stamp this on the FIRST drop-off of the session — a restless
        // wake-and-resettle (above) deliberately leaves sleepStartedAt alone
        // so the eventual "roughly X hours below" spans the whole night,
        // not just the last stretch after the last stir.
        if (c.sleepStartedAt == null) c.sleepStartedAt = state.meta.voyageMinutes;
        return;
      }
      var elapsed = state.meta.voyageMinutes - c.sleepAttemptStartedAt;
      if (elapsed >= TRYING_TO_SLEEP_GIVE_UP_MINUTES) {
        c.watchState = 'awake';
        c.sleepAttemptStartedAt = null;
        c.sleepStartedAt = null; // fully awake now — a later session starts its own duration count clean
        log(state, "The rest wouldn't come. Up again.");
      }
      return;
    }

    if (c.watchState === 'sleeping') {
      // Something demanding attention (e.g. the aft locker) always wins.
      if (state.pendingChoice) {
        wakeUp(state, "Something's wrong. You're awake, fast.", false);
        return;
      }
      // A squall breaking is loud and wet enough to end anyone's sleep.
      if (state.weather.condition === 'squall' && prevCondition !== 'squall') {
        wakeUp(state, "Cold spray through the hatch \u2014 you're awake.", false);
        return;
      }
      if (Math.random() < wakeChanceWhileSleeping(state)) {
        if (c.fatigue <= 20) {
          // Actually rested — this is a real end to the sleep, not a blip.
          wakeUp(state, "You surface on your own, rested.");
        } else {
          // Still genuinely exhausted: a real wake would leave them stuck
          // fully 'awake' and racking up MORE fatigue for the rest of an
          // unattended absence over one unlucky roll. A still-tired sailor
          // instead stirs and drifts straight back toward sleep — logged,
          // but not a full wake (watchState goes to 'trying', where the
          // normal high fallAsleepChance at this fatigue very quickly
          // pulls them back under).
          log(state, "Restless. You surface for a moment, then let it take you again.");
          flushNewLogEntries(state);
          c.watchState = 'trying';
          c.sleepAttemptStartedAt = state.meta.voyageMinutes;
        }
      }
    }
  }

  /* ============================================================
     6. AMBIENT AUDIO (procedural, WebAudio — no sound files needed)
     ------------------------------------------------------------
     Every layer here is synthesized so the prototype has real,
     working ambience out of the box. Later, any noise-based layer
     could be swapped for a recorded sample (AudioBufferSourceNode)
     without changing the mixing architecture: masterGain feeds the
     destination, and each layer is just a source -> filter -> gain
     chain into that master.
     ============================================================ */
  var audioCtx = null;
  var audioUnlocked = false;
  var masterGain = null;
  var muted = false;
  var layers = {};

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      buildAudioGraph();
    } catch (e) {
      console.warn('Audio unavailable:', e);
    }
  }

  function makeNoiseBuffer(ctx, seconds) {
    var bufferSize = Math.floor(ctx.sampleRate * seconds);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    var last = 0;
    for (var i = 0; i < bufferSize; i++) {
      var white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02; // lightly filtered ("brown-ish") noise reads as wind/sea, not static
      data[i] = last * 3.5;
    }
    return buffer;
  }

  function makeNoiseLayer(ctx, seconds, filterType, freq, q) {
    var source = ctx.createBufferSource();
    source.buffer = makeNoiseBuffer(ctx, seconds);
    source.loop = true;
    var filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = freq;
    if (q) filter.Q.value = q;
    var gainNode = ctx.createGain();
    gainNode.gain.value = 0;
    source.connect(filter).connect(gainNode).connect(masterGain);
    source.start();
    return { source: source, filter: filter, gain: gainNode, targetGain: 0 };
  }

  function buildAudioGraph() {
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 0.5;
    masterGain.connect(audioCtx.destination);

    layers.wind = makeNoiseLayer(audioCtx, 4, 'bandpass', 900, 0.6);
    layers.waves = makeNoiseLayer(audioCtx, 6, 'lowpass', 220, 0.8);
    layers.rigging = makeNoiseLayer(audioCtx, 3, 'highpass', 2200, 1.2);
    layers.rain = makeNoiseLayer(audioCtx, 4, 'highpass', 3500, 0.7);

    var hum = audioCtx.createOscillator();
    hum.type = 'sine';
    hum.frequency.value = 55;
    var humGain = audioCtx.createGain();
    humGain.gain.value = 0.02;
    hum.connect(humGain).connect(masterGain);
    hum.start();

    scheduleWaveSwell();
    scheduleHullCreaks();
    if (GAME) updateAudioForState(GAME);
  }

  function scheduleWaveSwell() {
    if (!audioCtx || !layers.waves) return;
    var now = audioCtx.currentTime;
    var base = layers.waves.targetGain || 0.15;
    layers.waves.gain.gain.linearRampToValueAtTime(base * (0.7 + Math.random() * 0.6), now + 4 + Math.random() * 4);
    setTimeout(scheduleWaveSwell, 4000 + Math.random() * 4000);
  }

  function scheduleHullCreaks() {
    if (!audioCtx) return;
    var seaState = GAME ? GAME.weather.seaState : 2;
    var delay = Math.max(2000, 14000 - seaState * 1800) + Math.random() * 4000;
    setTimeout(function () {
      playCreak();
      scheduleHullCreaks();
    }, delay);
  }

  function playCreak() {
    if (!audioCtx || muted) return;
    var osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 70 + Math.random() * 40;
    var g = audioCtx.createGain();
    g.gain.value = 0;
    osc.connect(g).connect(masterGain);
    var now = audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(0.06, now + 0.05);
    g.gain.linearRampToValueAtTime(0, now + 0.6);
    osc.start(now);
    osc.stop(now + 0.7);
  }

  function updateAudioForState(state) {
    if (!audioCtx || !layers.wind) return;
    var w = state.weather;
    var now = audioCtx.currentTime;

    var windLevel = clamp(w.windSpeed / 40, 0, 1);
    layers.wind.gain.gain.linearRampToValueAtTime(0.04 + windLevel * 0.22, now + 2);
    layers.wind.filter.frequency.linearRampToValueAtTime(600 + windLevel * 1400, now + 2);

    var seaLevel = clamp(w.seaState / 6, 0, 1);
    layers.waves.targetGain = 0.08 + seaLevel * 0.22;
    layers.waves.gain.gain.linearRampToValueAtTime(layers.waves.targetGain, now + 3);

    layers.rigging.gain.gain.linearRampToValueAtTime(0.02 + windLevel * 0.05, now + 2);

    var rainOn = (w.condition === 'rain' || w.condition === 'squall') ? 1 : 0;
    layers.rain.gain.gain.linearRampToValueAtTime(rainOn * 0.12, now + 2);
  }

  function toggleMute() {
    muted = !muted;
    if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
    updateSoundLabel();
  }

  function updateSoundLabel() {
    soundBtn.textContent = audioUnlocked ? (muted ? 'SOUND: OFF' : 'SOUND: ON') : 'SOUND: OFF';
  }

  /* ============================================================
     7. TERMINAL RENDERING
     ============================================================ */
  var outputEl = document.getElementById('output');
  var tempViewEl = document.getElementById('temp-view');
  var optionsEl = document.getElementById('options');
  var clockEl = document.getElementById('clock');
  var vesselLineEl = document.getElementById('vessel-line');
  var navStripEl = document.getElementById('navstrip');
  var navDayEl = document.getElementById('nav-day');
  var navSpeedEl = document.getElementById('nav-speed');
  var navHeadingEl = document.getElementById('nav-heading');
  var navRegionEl = document.getElementById('nav-region');
  var soundBtn = document.getElementById('sound-btn');
  var restartBtn = document.getElementById('restart-btn');

  /* --------------------------------------------------------------
     TWO SEPARATE RENDER SURFACES, both inside #output:

     PERSISTENT (printPersistentLine/Blank, printLogEntry) — the
     voyage's actual history. Append-only, never cleared, drives
     entirely off state.log (plus a handful of one-time scene-setting
     lines: the pre-departure intro, the short-action "STARTING
     ENGINE"-style headers, the CAST OFF closing beat, the welcome-
     back header). Always inserted just BEFORE tempViewEl, so that
     div stays pinned as the last child no matter how much history
     accumulates above it.

     TEMPORARY (printLine/Blank/Echo, inside #temp-view) — whatever
     menu or status screen is currently open: STATUS, POSITION,
     INVENTORY and its categories, the SAILS/ENGINE/COURSE prompts,
     confirmation/rejection text like "Left as it was." or "Nothing
     there." None of this is a voyage event, so none of it touches
     state.log — and unlike the persistent side, it gets wiped by
     clearTempView() at the start of every new interaction, so
     yesterday's menu never lingers behind today's.

     A real ACTION taken from a menu (eating, drinking, starting the
     engine, changing sail) still calls log()+flushNewLogEntries() to
     land on the persistent side, exactly like any other voyage event
     — only the menu's own browsing/status text is temporary.
     -------------------------------------------------------------- */
  function printLine(text, cls) {
    var p = document.createElement('p');
    p.className = 'line' + (cls ? ' ' + cls : '');
    p.textContent = text;
    tempViewEl.appendChild(p);
  }

  function printBlank() {
    var p = document.createElement('p');
    p.className = 'gap';
    tempViewEl.appendChild(p);
  }

  function printEcho(text) {
    var p = document.createElement('p');
    p.className = 'line echo';
    p.textContent = '> ' + text.toUpperCase();
    tempViewEl.appendChild(p);
  }

  function clearTempView() {
    tempViewEl.innerHTML = '';
  }

  function printPersistentLine(text, cls) {
    var p = document.createElement('p');
    p.className = 'line' + (cls ? ' ' + cls : '');
    p.textContent = text;
    outputEl.insertBefore(p, tempViewEl);
  }

  function printPersistentBlank() {
    var p = document.createElement('p');
    p.className = 'gap';
    outputEl.insertBefore(p, tempViewEl);
  }

  function formatShipTime(ts) {
    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var d = new Date(ts);
    var dd = String(d.getDate()).padStart(2, '0');
    var mon = months[d.getMonth()];
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    return dd + ' ' + mon + ' ' + hh + ':' + mm;
  }

  function printLogEntry(entry) {
    var wrap = document.createElement('div');
    wrap.className = 'entry';
    var ts = document.createElement('div');
    ts.className = 'entry-ts';
    ts.textContent = formatShipTime(entry.t);
    var body = document.createElement('div');
    body.className = 'entry-text';
    body.textContent = entry.text;
    wrap.appendChild(ts);
    wrap.appendChild(body);
    outputEl.insertBefore(wrap, tempViewEl);
  }

  function scrollToBottom() {
    outputEl.scrollTop = outputEl.scrollHeight;
  }

  function flushNewLogEntries(state) {
    for (; printedCount < state.log.length; printedCount++) {
      printLogEntry(state.log[printedCount]);
    }
    scrollToBottom();
  }

  // outputEl.innerHTML = '' (a full reset, used by confirmRestart and
  // renderReturn) would delete tempViewEl itself, since it's a child of
  // outputEl — re-attach the same node right after, so every later
  // printPersistentLine/printLogEntry call still has a valid insertBefore
  // target instead of throwing on a detached reference.
  function resetOutputEl() {
    outputEl.innerHTML = '';
    outputEl.appendChild(tempViewEl);
  }

  function setVesselLine(text) { vesselLineEl.textContent = text; }

  function updateClock() {
    if (!GAME) { clockEl.textContent = '\u2014'; navStripEl.hidden = true; return; }
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    clockEl.textContent = hh + ':' + mm;
    updateNavStrip(GAME);
  }

  function regionName(state) {
    var phase = voyagePhase(state);
    if (phase === 'inland') {
      var distFromStart = distanceBetween(state.nav.lat, state.nav.lon, WAYPOINTS[0].lat, WAYPOINTS[0].lon);
      return distFromStart < 3 ? 'SHILSHOLE BAY' : 'PUGET SOUND';
    }
    if (phase === 'strait') return 'STRAIT OF JUAN DE FUCA';
    if (phase === 'coastal' || phase === 'offshore') return 'NORTH PACIFIC';
    if (phase === 'tropics') return 'CENTRAL NORTH PACIFIC';
    if (phase === 'approach') {
      var distToFinal = distanceBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
      if (distToFinal < 5) return 'NAWILIWILI';
      if (distToFinal < 60) return 'KAUA\u02BBI';
      return 'HAWAIIAN WATERS';
    }
    return 'NORTH PACIFIC';
  }

  // Day 1 is the calendar date the voyage departed on; Day 2 begins at
  // the following local midnight, not 24 elapsed hours after departure
  // (a 4pm departure should read DAY 2 at midnight that same night, a
  // few hours in, not at 4pm the next day).
  function voyageDayNumber(state) {
    var departure = new Date(state.meta.departedAt);
    var current = new Date(state.meta.departedAt + state.meta.voyageMinutes * 60000);
    var departureMidnight = new Date(departure.getFullYear(), departure.getMonth(), departure.getDate());
    var currentMidnight = new Date(current.getFullYear(), current.getMonth(), current.getDate());
    var daysSince = Math.round((currentMidnight - departureMidnight) / 86400000);
    return daysSince + 1;
  }

  function updateNavStrip(state) {
    if (!state || state.departure.stageIndex < DEPARTURE_STEPS.length) {
      navStripEl.hidden = true;
      return;
    }
    navStripEl.hidden = false;
    var day = voyageDayNumber(state);
    var speed = computeBoatSpeed(state, state.nav.heading);
    navDayEl.textContent = 'DAY ' + day;
    navSpeedEl.textContent = speed.toFixed(1) + ' KT';
    navHeadingEl.textContent = Math.round(state.nav.heading) + '\u00B0';
    navRegionEl.textContent = regionName(state);
  }

  function compassPoint(deg) {
    var pts = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return pts[Math.round(normalizeDeg(deg) / 22.5) % 16];
  }

  function describeLevel(value, tiers) {
    for (var i = 0; i < tiers.length; i++) {
      if (value <= tiers[i].max) return tiers[i].text;
    }
    return tiers[tiers.length - 1].text;
  }

  function fatiguePhrase(v) {
    return describeLevel(v, [
      { max: 20, text: "Fresh. Alert." },
      { max: 40, text: "Tired, but steady." },
      { max: 60, text: "Heavy. Simple tasks take longer than they should." },
      { max: 80, text: "Severe. Concentration is becoming difficult." },
      { max: 100, text: "Exhausted. You shouldn't be making decisions right now." },
    ]);
  }

  // Five-level MORALE, the only face this state shows the player (the
  // underlying 0-100 crew.morale stays hidden, same as fatigue/hunger/
  // thirst always have).
  function moraleLevel(v) {
    return describeLevel(v, [
      { max: 19, text: 'DEPLETED' },
      { max: 39, text: 'LOW' },
      { max: 59, text: 'STEADY' },
      { max: 79, text: 'GOOD' },
      { max: 100, text: 'HIGH' },
    ]);
  }

  // Five-level boat-system condition (HULL, RIGGING, SAILS, ENGINE,
  // BATTERIES/electrical, STEERING all share this scale). WORN is
  // informational — nothing to do yet. POOR and below is where REPAIR
  // has something to offer (see cmdRepair / attemptSystemRepair).
  function boatConditionLevel(v) {
    return describeLevel(v, [
      { max: 10, text: 'FAILED' },
      { max: 25, text: 'DAMAGED' },
      { max: 50, text: 'POOR' },
      { max: 75, text: 'WORN' },
      { max: 100, text: 'GOOD' },
    ]);
  }

  // BILGE reuses the exact thresholds the flooding warnings already fire
  // at (50/100/150 gal) rather than inventing a parallel number — it's
  // the same water, just read as a condition tier instead of a gallon
  // count.
  function bilgeConditionLevel(gal) {
    return describeLevel(gal, [
      { max: 19, text: 'GOOD' },
      { max: 49, text: 'WORN' },
      { max: 99, text: 'POOR' },
      { max: 149, text: 'DAMAGED' },
      { max: Infinity, text: 'FAILED' },
    ]);
  }

  function countPhrase(n, criticalMax, lowMax) {
    return describeLevel(n, [
      { max: criticalMax, text: "nearly gone — this needs attention" },
      { max: lowMax, text: "running low" },
      { max: 999, text: "adequate" },
    ]);
  }

  function describeSeaState(n) {
    var labels = [
      "Flat calm.", "Slight ripple.", "Small waves, some whitecaps.",
      "Moderate seas, frequent whitecaps.", "Rough. Spray coming aboard.",
      "Very rough. Heavy going.", "High seas.",
    ];
    return labels[clamp(n, 0, 6)];
  }

  function formatLatLon(lat, lon) {
    var latDeg = Math.floor(Math.abs(lat));
    var latMin = (Math.abs(lat) - latDeg) * 60;
    var lonDeg = Math.floor(Math.abs(lon));
    var lonMin = (Math.abs(lon) - lonDeg) * 60;
    var ns = lat >= 0 ? 'N' : 'S';
    var ew = lon >= 0 ? 'E' : 'W';
    return latDeg + '\u00B0 ' + latMin.toFixed(1) + "' " + ns + ', ' + lonDeg + '\u00B0 ' + lonMin.toFixed(1) + "' " + ew;
  }

  function currentLatLon(state) {
    // The stored lat/lon IS the position — this just adds display-only
    // uncertainty when the electrical system can't be trusted for a fix.
    // It never feeds back into the real, saved position.
    var lat = state.nav.lat, lon = state.nav.lon;
    if (state.nav.positionConfidence === 'uncertain') {
      lat += (Math.random() - 0.5) * 0.4;
      lon += (Math.random() - 0.5) * 0.4;
    }
    return { lat: lat, lon: lon };
  }

  function describeGap(minutes) {
    if (minutes < 90) return Math.round(minutes) + ' minutes';
    var hours = minutes / 60;
    if (hours < 48) return hours.toFixed(1) + ' hours';
    return (hours / 24).toFixed(1) + ' days';
  }

  function sailConfigLabel(cfg) {
    return { full: 'full sail', reefed: 'reefed', minimal: 'minimal canvas', furled: 'furled' }[cfg] || cfg;
  }

  // All four states, each named plainly for what it is rather than as a
  // move relative to wherever the boat happens to be now — with FURLED in
  // the mix, "reduce to reefed" stops making sense if you're coming FROM
  // furled (that would be an increase, not a reduction). The current
  // configuration is left off the list (it's already shown above this in
  // cmdSails) rather than offered as a do-nothing button.
  function sailOptions(state) {
    var cfg = state.boat.sailConfig;
    var configs = [
      { key: 'full', label: 'FULL', action: 'sail-full' },
      { key: 'reefed', label: 'REEFED', action: 'sail-reefed' },
      { key: 'minimal', label: 'MINIMAL', action: 'sail-minimal' },
      { key: 'furled', label: 'FURLED', action: 'sail-furled' },
    ];
    var opts = configs.filter(function (c) { return c.key !== cfg; })
      .map(function (c) { return { label: c.label, action: c.action }; });
    opts.push({ label: 'BACK', action: 'cancel' });
    return opts;
  }

  /* ============================================================
     8. COMMANDS
     ============================================================ */
  function cmdStatus(state) {
    var b = state.boat;
    // Space-padded columns, not inventoryLine's dot-fill — STATUS reads as
    // a short instrument panel, not a supply list.
    function statusLine(label, value) {
      return label + ' '.repeat(Math.max(2, 12 - label.length)) + value;
    }
    printBlank();
    printLine('STATUS', 'heading-label');
    printBlank();
    printLine(statusLine('MORALE', moraleLevel(state.crew.morale)));
    printBlank();
    printLine(statusLine('HULL', boatConditionLevel(b.hull)));
    printLine(statusLine('RIGGING', boatConditionLevel(b.rigging)));
    printLine(statusLine('SAILS', boatConditionLevel(b.sails)));
    printLine(statusLine('ENGINE', boatConditionLevel(b.engine)));
    printLine(statusLine('BATTERIES', boatConditionLevel(b.electrical)));
    printLine(statusLine('BILGE', bilgeConditionLevel(b.bilgeWater)));
    printLine(statusLine('STEERING', boatConditionLevel(b.steering)));
    printBlank();
    printLine(statusLine('FUEL', Math.round(clamp(b.fuelGallons / FUEL_STARTING_GALLONS, 0, 1) * 100) + '%'));
    printLine(statusLine('WATER', Math.round(clamp(state.water.primary / WATER_STARTING_GALLONS, 0, 1) * 100) + '%'));
    state.pendingChoice = { id: 'status-view', options: [{ label: 'BACK', action: 'cancel' }] };
  }

  function cmdPosition(state) {
    var ll = currentLatLon(state);
    printBlank();
    printLine('POSITION', 'heading-label');
    printLine(formatLatLon(ll.lat, ll.lon));
    if (state.nav.positionConfidence === 'uncertain') {
      printLine('(dead reckoning — no recent fix)', 'dim');
    }
    printBlank();
    printLine('HEADING', 'heading-label');
    printLine(Math.round(state.nav.heading) + '\u00B0  (intended course ' + Math.round(state.nav.intendedCourse) + '\u00B0)');
    if (state.nav.tack) {
      printLine('BEATING TO WINDWARD \u2014 AUTO-TACK (' + state.nav.tack.toUpperCase() + ' TACK)', 'dim');
    }
    printBlank();
    printLine('PROPULSION', 'heading-label');
    printLine(propulsionLabel(propulsionState(state, state.nav.heading)));
    printBlank();
    printLine('SPEED', 'heading-label');
    // Computed fresh from current conditions rather than read back from
    // state.boat.speed, which is only ever written by simTick() and can
    // otherwise sit uninitialized (or stale) until the next full tick —
    // up to 10 real minutes after a fresh departure, showing a misleading
    // 0.0 even when the boat is actually making way.
    var liveSpeed = computeBoatSpeed(state, state.nav.heading);
    printLine(liveSpeed.toFixed(1) + ' kt');
    printBlank();
    printLine('DISTANCE', 'heading-label');
    var remaining = distanceBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
    printLine(Math.round(state.nav.distanceTraveled) + ' nm sailed \u2014 approximately ' + Math.round(remaining) + ' nm remaining');
    var segStart = WAYPOINTS[Math.max(0, state.nav.waypointIndex - 1)];
    var segEnd = WAYPOINTS[state.nav.waypointIndex] || FINAL_DEST;
    var xt = crossTrackNm(state.nav.lat, state.nav.lon, segStart.lat, segStart.lon, segEnd.lat, segEnd.lon);
    if (xt > 15) {
      printLine('Off the intended track by roughly ' + Math.round(xt) + ' nm.', 'amber');
    }
  }

  function cmdWeather(state) {
    var w = state.weather;
    printBlank();
    printLine('WEATHER', 'heading-label');
    printLine('Wind ' + Math.round(w.windSpeed) + ' kt from ' + compassPoint(w.windDirection) + ' (' + Math.round(w.windDirection) + '\u00B0)');
    printLine(describeSeaState(w.seaState));
    printLine(capitalize(w.condition) + '.');
  }

  function cmdForecast(state) {
    var lines = {
      building: ["Wind expected to build further through the next watch.", "Pressure easing. Expect more of this before it improves."],
      easing: ["Conditions should moderate over the coming hours.", "Wind easing, though seas may take longer to settle."],
      steady: ["No major change expected in the near term.", "Holding steady, for now."],
    };
    var opts = lines[state.weather.trend] || lines.steady;
    printBlank();
    printLine('FORECAST', 'heading-label');
    printLine(opts[Math.floor(Math.random() * opts.length)]);
    printLine('Confidence: limited. No shore forecast out here.', 'dim');
  }


  function cmdSails(state) {
    printBlank();
    printLine('SAILS', 'heading-label');
    printLine('Currently: ' + sailConfigLabel(state.boat.sailConfig) + '.');
    state.pendingChoice = { id: 'sails-choice', options: sailOptions(state) };
  }

  /* --------------------------------------------------------------
     INVENTORY
     ------------------------------------------------------------
     What is physically aboard, right now — distinct from the LOG,
     which is what has happened. Provisions/water/fuel read from the
     same state.food / state.water / state.boat.fuelGallons that EAT,
     DRINK, and the ENGINE menu already use — there is no second copy
     of any of these numbers. The remaining categories live under
     state.supplies.* alongside the existing propane count.
     -------------------------------------------------------------- */
  var SPARES_NAMES = {
    impellers: 'Impellers', belts: 'Drive belts', fuelFilters: 'Fuel filters', oilFilters: 'Oil filters', oil: 'Engine oil (qt)', coolant: 'Coolant (qt)',
    fuses: 'Fuses', wire: 'Wire (ft)', connectors: 'Connectors', batteries: 'Spare batteries',
    hose: 'Hose (ft)', hoseClamps: 'Hose clamps', spareLine: 'Spare line (ft)', shackles: 'Shackles', riggingTape: 'Rigging tape',
    sailRepair: 'Sail repair kits', epoxy: 'Epoxy', sealant: 'Sealant',
  };

  function inventoryLine(name, valueText) {
    var dots = '.'.repeat(Math.max(2, 22 - name.length));
    return name + ' ' + dots + ' ' + valueText;
  }

  function printSuppliesCategory(state, catKey, names) {
    var data = state.supplies[catKey] || {};
    var keys = Object.keys(names);
    var any = keys.some(function (k) { return data[k] > 0; });
    if (!any) {
      printLine('Nothing left in this category.', 'amber');
      return;
    }
    keys.forEach(function (k) {
      if (data[k] > 0) printLine(inventoryLine(names[k], String(data[k])));
    });
  }

  function showInventoryCategory(state, cat) {
    printBlank();
    switch (cat) {
      case 'provisions':
        printLine('PROVISIONS', 'heading-label');
        var anyFood = FOOD_ITEMS.some(function (f) { return state.food[f.key] > 0; }) || state.food.coffee > 0;
        if (!anyFood) {
          printLine('Nothing left aboard to eat.', 'amber');
        } else {
          FOOD_ITEMS.forEach(function (f) { if (state.food[f.key] > 0) printLine(foodItemLine(f, state.food[f.key])); });
          if (state.food.coffee > 0) printLine(foodItemLine({ name: 'Coffee' }, state.food.coffee));
        }
        break;
      case 'water':
        printLine('WATER', 'heading-label');
        printLine(inventoryLine('Fresh water', state.water.primary.toFixed(1) + ' gal'));
        printLine(inventoryLine('Emergency water', state.water.emergency.toFixed(1) + ' gal'));
        break;
      case 'fuel':
        printLine('FUEL', 'heading-label');
        printLine(inventoryLine('Diesel', state.boat.fuelGallons.toFixed(1) + ' gal'));
        printLine(inventoryLine('Propane', state.supplies.propane + ' uses'));
        break;
      case 'spares':
        printLine('SPARES', 'heading-label');
        printSuppliesCategory(state, 'spares', SPARES_NAMES);
        break;
      case 'safety':
        printLine('SAFETY', 'heading-label');
        printLine(inventoryLine('EPIRB', state.rescue.epirbOn ? 'ACTIVE' : 'READY'));
        printLine(inventoryLine('Life raft', state.crew.inLifeRaft ? 'DEPLOYED' : 'READY'));
        printLine(inventoryLine('Flares', String(state.supplies.safety.flares)));
        break;
      default:
        printLine('Nothing there.', 'dim');
    }
    state.pendingChoice = { id: 'inventory-category', options: [{ label: 'BACK', action: 'inventory:back' }] };
