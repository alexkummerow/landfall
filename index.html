          if (!s.boat.repairProtectedUntil) s.boat.repairProtectedUntil = { sails: 0, steering: 0, engine: 0, electrical: 0 };
          s.boat.repairProtectedUntil[systemKey] = s.meta.voyageMinutes + rand(REPAIR_PROTECTION_MIN_HOURS, REPAIR_PROTECTION_MAX_HOURS) * 60;
          log(s, pickFromPool(REPAIR_SUCCESS_LINES[systemKey]));
        } else {
          log(s, pickFromPool(REPAIR_FAILURE_LINES[systemKey]));
        }
        flushNewLogEntries(s);
      },
    });
  }

  // What's actually reachable and worth offering: the aft locker (its
  // own separate, unrelated event) plus whichever of the four tracked
  // systems are currently DAMAGED — nothing else, and never anything
  // GOOD, since there's nothing to do there.
  function buildDamagedSystemsList(state) {
    var b = state.boat;
    var items = [];
    if (state.flags.aftLockerTriggered && !state.flags.aftLockerResolved) {
      items.push({ label: 'AFT LOCKER', action: 'repair:aftLocker' });
    }
    BOAT_FAIL_SYSTEMS.forEach(function (k) {
      if (b[k] === 'DAMAGED') items.push({ label: REPAIR_SYSTEM_LABEL[k], action: 'repair-select:' + k });
    });
    return items;
  }

  // Whether any of the four tracked boat systems is currently DAMAGED
  // -- used to decide whether STATUS offers REPAIR at all (see
  // cmdStatus). Deliberately narrower than buildDamagedSystemsList
  // above: it does not count a pending, still-deferrable aft-locker
  // event on its own, since that's a one-off notice rather than a
  // standing system failure -- cmdStatus's own gate accounts for both.
  function hasRepairableDamage(state) {
    return BOAT_FAIL_SYSTEMS.some(function (k) { return state.boat[k] === 'DAMAGED'; });
  }

  function cmdRepair(state) {
    if (state.crew.location === 'below' && needsCabinLight(state)) { blockedByDarkness(state); return; }
    var items = buildDamagedSystemsList(state);
    if (items.length === 0) {
      printBlank();
      printLine('Nothing aboard needs repair.', 'dim');
      return;
    }
    printBlank();
    printLine('REPAIR', 'heading-label');
    state.pendingChoice = { id: 'repair-menu', options: items.concat([{ label: 'BACK', action: 'cancel' }]) };
  }

  function cmdRestart(state) {
    printBlank();
    printLine('NEW VOYAGE', 'heading-label');
    printLine('This abandons the current voyage and starts over from Seattle.');
    state.pendingChoice = {
      id: 'restart-choice',
      options: [
        { label: 'YES \u2014 START OVER', action: 'confirm-restart' },
        { label: 'NO \u2014 KEEP SAILING', action: 'cancel' },
      ],
    };
  }

  var COMMANDS = {
    status: cmdStatus,
    position: cmdPosition,
    weather: cmdWeather,
    forecast: cmdForecast,
    inventory: cmdInventory,
    'rescue-status': cmdDistress,
    'radio-for-rescue': cmdRadioForRescue,
    sails: cmdSails,
    engine: cmdEngine,
    helm: cmdHelm,
    'change-course': cmdChangeCourse,
    galley: cmdGalley,
    head: cmdHead,
    saloon: cmdSaloon,
    relax: cmdRelax,
    cabin: cmdCabin,
    'nav-station': cmdNavStation,
    electrical: cmdElectrical,
    sleep: cmdSleep,
    eat: cmdEat,
    meals: cmdMeals,
    snacks: cmdSnacks,
    drink: cmdDrink,
    wash: cmdWash,
    clothing: cmdClothing,
    'clothing-top': cmdClothingTop,
    'clothing-outer': cmdClothingOuter,
    'clothing-bottom': cmdClothingBottom,
    'clothing-feet': cmdClothingFeet,
    'clothing-accessories': cmdClothingAccessories,
    bookshelf: cmdBookshelf,
    'tape-player': cmdTapePlayer,
    repair: cmdRepair,
    fish: cmdFish, // FISHING HOOK
    restart: cmdRestart,
  };

  function runCommand(state, raw) {
    // All commands now arrive from a button that getContextualOptions()
    // itself decided was valid for the current state — no free-text entry
    // point exists anymore (see the header RESTART button for the one
    // command that can fire regardless of state). So this just dispatches.
    var word = raw.trim().toLowerCase();
    if (!word) return;
    var fn = COMMANDS[word];
    if (fn) fn(state);
    if (uiBusy) return; // a short action was kicked off; it owns the render/save/scroll tail when it resolves
    renderOptions(state);
    saveGameState(state);
    scrollToBottom();
  }

  // Builds an options array from ordered groups, inserting a divider
  // between any two non-empty groups and simply omitting a group (and
  // its divider) when it has nothing in it — e.g. REPAIR when there's
  // nothing to fix. Keeps the ABOVE/BELOW menus below free of
  // hand-counted divider bookkeeping as conditional items come and go.
  function groupedOptions(groups) {
    var result = [];
    groups.forEach(function (group) {
      if (!group || group.length === 0) return;
      if (result.length > 0) result.push({ divider: true });
      result = result.concat(group);
    });
    return result;
  }

  /* ============================================================
     FISHING
     ------------------------------------------------------------
     CAST -> WAIT -> BITE -> REACT -> LAND -> KEEP/RELEASE. An Above
     Deck activity (see getContextualOptions above and cmdFish below)
     layered on top of two EXISTING systems rather than duplicating
     either: FISH_MEAL_BY_SPECIES/heldFishAsMealItem (the held catch's
     specialty meal, shown in MEALS and eaten via the normal performEat
     path — provisions/hunger/morale) and checkSpoilage (day-rollover
     spoilage). Everything fishing-specific lives in this one block,
     plus the handful of small hooks elsewhere marked "FISHING HOOK".

     TERMINAL PRESENTATION: fishing uses the exact same #temp-view
     track (printLine/printBlank/clearTempView) as every other command
     in the game, and no fishing-specific CSS at all -- REEL IN is a
     plain .option button, same as everything else in #options.
     Landfall's own generic button-click handler already clears
     #temp-view before dispatching ANY action (see renderOptions), so a
     fresh click-triggered screen (CAST, REEL IN, KEEP/RELEASE, STOP
     FISHING) naturally starts from a blank temp-view without this code
     needing to clear it itself. Within a single automatic sequence
     that isn't waiting on a click (the bite arriving, the REEL IN
     prompt, a landing sequence's own hint beats), nothing here ever
     clears -- each new line is simply appended below the last, so the
     whole thing reads as one continuous unfolding of ordinary terminal
     text, never a wiped-and-redrawn screen.

     BITE CHANCE is a flat, unconditional 60% on every cast
     (FISHING_CONFIG.biteChance) -- there is deliberately no hidden
     "local activity" state carrying pressure between casts anymore.
     Each attempt is fully independent, exactly as specified: casting
     again after a catch, a loss, or a plain miss re-rolls from
     scratch, with nothing remembered from the attempt before. The
     one-kept-fish-per-day rule (below) is what actually keeps fishing
     from becoming a free, unlimited food source -- not a bite-chance
     penalty.

     FISH WEIGHT is rolled directly into one of four tiers
     (FISHING_CONFIG.weightTiers) the moment a bite occurs -- there is
     no separate small/medium/large category feeding into it. The tier
     drives rarity, how long and how intense the automatic reel-in
     sequence feels, and -- for the rare top tier only -- whether a
     marlin is even possible. Marlin is NOT a separate roll applied to
     every fish; it only has a chance to occur once the weight tier has
     already landed on the top (30-40lb) bracket, and only in
     marlin-eligible waters -- see beginFishBite. A marlin CAN be
     landed (weight shown, same as anything else) but can never be
     kept -- see revealMarlin/performFishRelease.

     In-progress session state (which phase, the pending reaction
     deadline, the fish about to be revealed, etc.) is deliberately NOT
     part of the persisted `state` object -- it lives in the
     module-level fishingSession variable below, same as uiBusy/
     openInfoPanel. A reaction window can't meaningfully survive a
     reload or a tab switch, so there's nothing to gain from persisting
     it, and leaving the FISH screen (the only way to reach any other
     menu while a session is active, since it owns state.pendingChoice
     the whole time) always cancels whatever's in flight via STOP
     FISHING, which returns to the normal Above Deck menu.

     Only two things about fishing are persisted, entirely within
     state.fishing (see GAME STATE):
       - which voyage day a fish was last kept (the one-per-day rule)
       - the currently-held catch's species and the day it was caught
         (heldFish; its specialty meal — FISH_MEAL_BY_SPECIES — and
         spoilage both key off this, not a separate food[] count)
     ============================================================ */

  var FISHING_CONFIG = {
    biteChance: 0.6, // flat, every cast -- no hidden state modifies this
    bite: {
      totalWaitMs: 90000, // max wait per attempt; if a bite is going to happen, it lands at a uniformly random point anywhere in this window
    },

    biteToPromptDelayMs: 1000, // "The line jerks hard." sits alone for exactly this long, then "REEL IN" appears -- no clicks are accepted during this window

    // Once REEL IN appears, how long the player has to select it -- one
    // flat value regardless of the fish's weight tier. The window is
    // about whether the player is paying attention right now, not a
    // dexterity check.
    reactionWindowMs: 3000,

    // Fish weight is rolled directly into one of these tiers the
    // moment a bite occurs (see beginFishBite) -- `weight` is the
    // relative chance (normalized automatically; these sum to 100 for
    // readability but don't have to), and durationMsRange is how long
    // the automatic reel-in sequence takes for a fish landing in that
    // tier. See FISH_TIER_HINT_POOLS for the matching hint text.
    weightTiers: [
      { key: 'common', minLb: 0, maxLb: 10, weight: 60, durationMsRange: [6000, 9000] },
      { key: 'substantial', minLb: 10, maxLb: 20, weight: 30, durationMsRange: [9000, 13000] },
      { key: 'big', minLb: 20, maxLb: 30, weight: 8, durationMsRange: [13000, 17000] },
      { key: 'trophy', minLb: 30, maxLb: 40, weight: 2, durationMsRange: [18000, 22000] },
    ],

    // Only rolled when the weight tier has ALREADY landed on 'trophy'
    // (itself just 2% of hooked fish) AND the boat is in
    // marlin-eligible waters -- see marlinEligible. Most trophy-tier
    // catches are still an ordinary (if exceptional) large fish, not a
    // marlin -- this is deliberately small so a marlin stays "an
    // especially rare possibility," not a guaranteed flavor of big fish.
    marlinChanceWithinTrophyTier: 0.15,
  };

  // FISH_SPECIES_ANCHORS: six hand-authored species/weight tables, one
  // per named region, anchored to actual nm-remaining-to-Nāwiliwili
  // values (reusing distanceBetween/FINAL_DEST/WAYPOINTS -- the exact
  // same position data voyagePhase itself already uses, so the species
  // mix lines up with the same regions the player already sees named
  // in POSITION). fishSpeciesWeightsForState linearly interpolates
  // every species' weight between the two anchors bracketing the
  // boat's CURRENT position, so the mix shifts gradually with distance
  // sailed rather than snapping at a boundary -- a species fading
  // in/out is just its weight rising from/falling to 0 across anchors,
  // nothing more special than that.
  var FISH_SPECIES = [
    { id: 'coho', name: 'Coho Salmon', maxLb: 15 },
    { id: 'pink', name: 'Pink Salmon', maxLb: 6 },
    { id: 'chinook', name: 'Chinook Salmon', maxLb: 40 },
    { id: 'herring', name: 'Pacific Herring', maxLb: 1.5 },
    { id: 'mackerel', name: 'Pacific Mackerel', maxLb: 4 },
    { id: 'rockfish', name: 'Rockfish', maxLb: 12 },
    { id: 'lingcod', name: 'Lingcod', maxLb: 30 },
    { id: 'bonito', name: 'Pacific Bonito', maxLb: 20 },
    { id: 'albacore', name: 'Albacore', maxLb: 40 },
    { id: 'skipjack', name: 'Skipjack Tuna', hawaiianName: 'Aku', maxLb: 25 },
    { id: 'mahimahi', name: 'Mahi-Mahi', maxLb: 40 },
    { id: 'yellowfin', name: 'Yellowfin Tuna', hawaiianName: 'Ahi', maxLb: 40 },
    { id: 'wahoo', name: 'Wahoo', hawaiianName: 'Ono', maxLb: 40 },
  ];
  var FISH_SPECIES_BY_ID = {};
  FISH_SPECIES.forEach(function (sp) { FISH_SPECIES_BY_ID[sp.id] = sp; });

  // Ordered by DESCENDING distRemainingNm (voyage start first, arrival
  // last) -- fishSpeciesWeightsForState depends on this order. The
  // first three anchors reuse actual waypoints (Shilshole, the Strait's
  // eastern entrance, Cape Flattery); the last three reuse voyagePhase's
  // own offshore/tropics/approach thresholds (1845nm, 861nm, 0nm) so
  // the blend lines up with the same phase boundaries POSITION/regionName
  // already use, even though the species mix itself never hard-switches.
  var FISH_SPECIES_ANCHORS = [
    { // Puget Sound / early departure -- typical catches skew smaller
      distRemainingNm: distanceBetween(WAYPOINTS[0].lat, WAYPOINTS[0].lon, FINAL_DEST.lat, FINAL_DEST.lon),
      weights: { coho: 30, pink: 10, chinook: 5, herring: 20, mackerel: 15, rockfish: 15, lingcod: 8 },
    },
    { // Strait of Juan de Fuca -- transitional between coastal and offshore
      distRemainingNm: distanceBetween(WAYPOINTS[6].lat, WAYPOINTS[6].lon, FINAL_DEST.lat, FINAL_DEST.lon), // 'Strait East'
      weights: { coho: 22, pink: 4, chinook: 10, herring: 8, mackerel: 16, rockfish: 14, lingcod: 12, bonito: 4, albacore: 1 },
    },
    { // Coastal Pacific / just offshore
      distRemainingNm: distanceBetween(WAYPOINTS[11].lat, WAYPOINTS[11].lon, FINAL_DEST.lat, FINAL_DEST.lon), // 'Cape Flattery'
      weights: { coho: 10, chinook: 3, mackerel: 14, rockfish: 5, lingcod: 4, bonito: 12, albacore: 10, skipjack: 2 },
    },
    { // North Pacific / well offshore -- coastal species gone, salmon fading
      distRemainingNm: 1845, // voyagePhase's own offshore/tropics threshold
      weights: { coho: 1, mackerel: 3, bonito: 16, albacore: 26, skipjack: 12, mahimahi: 3, yellowfin: 1 },
    },
    { // Mid-Pacific / tropics
      distRemainingNm: 861, // voyagePhase's own tropics/approach threshold
      weights: { bonito: 6, albacore: 14, skipjack: 22, mahimahi: 22, yellowfin: 8, wahoo: 3 },
    },
    { // Approaching Hawai'i -- northwest species gone entirely
      distRemainingNm: 0,
      weights: { albacore: 2, skipjack: 24, mahimahi: 30, yellowfin: 12, wahoo: 8 },
    },
  ];

  function fishSpeciesWeightsForState(state) {
    var dist = distanceBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
    var anchors = FISH_SPECIES_ANCHORS;
    var earlier = anchors[0], later = anchors[anchors.length - 1];
    for (var i = 0; i < anchors.length - 1; i++) {
      if (dist <= anchors[i].distRemainingNm && dist >= anchors[i + 1].distRemainingNm) {
        earlier = anchors[i];
        later = anchors[i + 1];
        break;
      }
    }
    var span = earlier.distRemainingNm - later.distRemainingNm;
    var frac = span > 0 ? clamp((earlier.distRemainingNm - dist) / span, 0, 1) : 0; // 0 at `earlier`, 1 at `later`
    var weights = {};
    FISH_SPECIES.forEach(function (sp) {
      var wEarlier = earlier.weights[sp.id] || 0;
      var wLater = later.weights[sp.id] || 0;
      weights[sp.id] = wEarlier + (wLater - wEarlier) * frac;
    });
    return weights;
  }

  // Weighted species pick, restricted to species that can plausibly
  // reach the ACTUAL rolled weight (species.maxLb >= weightLb) -- used
  // for every tier, so a catch is never an implausibly large example
  // of a small-bodied species (no 29lb herring), not just at the rare
  // top tier. Falls back to the single largest-maxLb species available
  // at this location if, somehow, nothing qualifies.
  function pickFishSpeciesForWeight(state, weightLb) {
    var weights = fishSpeciesWeightsForState(state);
    var candidates = FISH_SPECIES.filter(function (sp) { return sp.maxLb >= weightLb; });
    var total = 0;
    candidates.forEach(function (sp) { total += weights[sp.id] || 0; });
    if (total <= 0) {
      var byMaxLbDesc = FISH_SPECIES.filter(function (sp) { return (weights[sp.id] || 0) > 0; })
        .sort(function (a, b) { return b.maxLb - a.maxLb; });
      return byMaxLbDesc[0] || FISH_SPECIES[0]; // shouldn't happen -- every anchor has enough species with weight to cover every tier -- but never leave this unhandled
    }
    var roll = Math.random() * total;
    for (var i = 0; i < candidates.length; i++) {
      var w = weights[candidates[i].id] || 0;
      if (roll < w) return candidates[i];
      roll -= w;
    }
    return candidates[candidates.length - 1];
  }

  // Some species go by a different name near Hawai'i (skipjack/aku,
  // yellowfin/ahi, wahoo/ono) -- purely cosmetic, doesn't affect which
  // species gets picked or its weight.
  function fishSpeciesDisplayName(state, species) {
    if (species.hawaiianName && voyagePhase(state) === 'approach') return species.hawaiianName;
    return species.name;
  }

  function pickFishWeightTier() {
    var tiers = FISHING_CONFIG.weightTiers;
    var total = 0;
    tiers.forEach(function (t) { total += t.weight; });
    var roll = Math.random() * total;
    for (var i = 0; i < tiers.length; i++) {
      if (roll < tiers[i].weight) return tiers[i];
      roll -= tiers[i].weight;
    }
    return tiers[tiers.length - 1];
  }

  function pickFishWeightLbInTier(tier) {
    return +(rand(tier.minLb, tier.maxLb)).toFixed(1);
  }

  function marlinEligible(state) {
    var phase = voyagePhase(state);
    return phase === 'tropics' || phase === 'approach';
  }

  function fishAlreadyKeptToday(state) {
    return state.fishing.keptFishOnDay === voyageDayNumber(state);
  }

  /* --------------------------------------------------------------
     FISHING AUDIO -- a fourth independent layer (alongside boat
     ambience, engine audio, and the tape player), built exactly the
     same way as engine audio (see ENGINE_AUDIO_FILES/playEngineOneShot
     etc. in the AMBIENT AUDIO section above): plain HTMLAudioElements,
     lazily created, controlled directly with .play()/.pause()/.volume/
     .currentTime -- no Web Audio API, no new unlock mechanism. Kept as
     its own, fully independent copy of that same small set of helpers
     (fadeFishingVolume mirrors fadeEngineVolume exactly) rather than
     sharing the engine-audio functions, for the same reason engine
     audio itself stays separate from boat ambience: independent
     systems, each easy to reason about on its own.

     Every trigger point below is either a real button click (CAST,
     REEL IN, RELEASE) or a setTimeout chained from one (the bite
     firing, a landing sequence's own beats), so it's already covered
     by the same audioUnlocked gate every other sound in the game
     already relies on -- nothing new to unlock.
     -------------------------------------------------------------- */
  var FISHING_AUDIO_FILES = {
    cast: 'audio/fishing/cast.mp3',
    catch: 'audio/fishing/catch.mp3',
    catchSmall: 'audio/fishing/catch_small.mp3',
    catchMedium: 'audio/fishing/catch_medium.mp3',
    catchLarge: 'audio/fishing/catch_large.mp3',
    drag1: 'audio/fishing/drag_1.mp3',
    drag2: 'audio/fishing/drag_2.mp3',
    reel: 'audio/fishing/reel.mp3',
    release: 'audio/fishing/release.mp3',
  };
  var FISHING_AUDIO_VOLUME = {
    cast: 0.6, catch: 0.65, catchLanding: 0.6,
    drag1: 0.35, drag2: 0.35, reel: 0.4, release: 0.55,
  };
  var FISHING_CROSSFADE_SECONDS = 0.1; // quick fade-in every fishing one-shot uses at its own start (click prevention only) -- unrelated to the reel-to-catch handoff, which is an instant stop, no fade

  var fishingAudioEls = {}; // key -> HTMLAudioElement, created on first use (lazy load, never preloaded) -- same pattern as engineAudioEls

  function getFishingAudioEl(key) {
    var el = fishingAudioEls[key];
    if (el) return el;
    el = new Audio(FISHING_AUDIO_FILES[key]);
    el.loop = (key === 'reel');
    el.preload = 'auto';
    el.volume = 0;
    // Diagnostic only -- a load/decode failure (wrong path, missing
    // file, unsupported format) fires 'error' on the element itself.
    // This is passive (never runs synchronously as part of element
    // creation or playback) and mirrors the same pattern boat ambience
    // already uses successfully elsewhere in this file.
    el.addEventListener('error', function () {
      console.warn('Fishing audio failed to load (' + key + '): ' + FISHING_AUDIO_FILES[key] + (el.error ? ' -- error code ' + el.error.code : ''));
    });
    fishingAudioEls[key] = el;
    return el;
  }

  // Identical in shape to fadeEngineVolume -- see that function's own
  // comment; kept as its own copy here for the independence reasons
  // explained in the section comment above.
  function fadeFishingVolume(el, target, seconds, onComplete) {
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    var start = el.volume;
    if (Math.abs(target - start) < 0.001) { el.volume = target; if (onComplete) onComplete(); return; }
    var stepMs = 20;
    var steps = Math.max(1, Math.round((seconds * 1000) / stepMs));
    var stepIndex = 0;
    el._fadeTimer = setInterval(function () {
      stepIndex++;
      if (stepIndex >= steps) {
        el.volume = target;
        clearInterval(el._fadeTimer);
        el._fadeTimer = null;
        if (onComplete) onComplete();
      } else {
        el.volume = start + (target - start) * (stepIndex / steps);
      }
    }, stepMs);
  }

  // Plays a one-shot (cast/catch/catch_small/catch_medium/catch_large/
  // release/drag1/drag2) from the beginning every time, with a quick
  // fade-in to avoid a click at the start -- and fires onEnded (once)
  // when it naturally finishes, same wiring as playEngineOneShot.
  function playFishingOneShot(key, onEnded) {
    if (!audioUnlocked) return;
    var el = getFishingAudioEl(key);
    el.onended = null;
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    if (!el.paused) el.pause();
    el.currentTime = 0;
    el.volume = 0;
    el._baseVolume = FISHING_AUDIO_VOLUME[key];
    var p = el.play();
    if (p && p.catch) p.catch(function (e) { console.warn('Fishing audio failed to play (' + key + '):', describeError(e)); });
    fadeFishingVolume(el, muted ? 0 : FISHING_AUDIO_VOLUME[key], FISHING_CROSSFADE_SECONDS);
    if (onEnded) {
      el.onended = function () {
        el.onended = null;
        onEnded();
      };
    }
  }

  // Starts the continuous reel.mp3 bed -- fresh from the beginning
  // every time (a new reel-in sequence is always a clean start, never
  // a resume), looped (see getFishingAudioEl), left running underneath
  // the automatic suspense text until stopFishingReelLoop fades it out.
  function startFishingReelLoop() {
    if (!audioUnlocked) return;
    var el = getFishingAudioEl('reel');
    if (!el.paused) el.pause();
    el.currentTime = 0;
    el.volume = 0;
    el._baseVolume = FISHING_AUDIO_VOLUME.reel;
    var p = el.play();
    if (p && p.catch) p.catch(function (e) { console.warn('Fishing audio failed to play (reel):', describeError(e)); });
    fadeFishingVolume(el, muted ? 0 : FISHING_AUDIO_VOLUME.reel, FISHING_CROSSFADE_SECONDS);
  }

  // ONLY touches the reel element -- never catchSmall/catchMedium/
  // catchLarge (see stopFishingLandingSound below, a deliberately
  // separate function so the two lifecycles can never accidentally get
  // conflated). Instant stop, no fade: the size-based catch sound
  // starts in the very same step this is called from (see
  // beginFishLandingSequence/revealMarlin), so there's no gap left to
  // smooth over.
  function stopFishingReelLoop() {
    var el = fishingAudioEls.reel;
    if (!el || el.paused) return;
    el.pause();
  }

  // The landing sound is deliberately allowed to finish playing on its
  // own -- it is NOT touched by clearFishingTimers, and nothing in the
  // normal bite/reel/reveal/KEEP/RELEASE flow calls this. It is only
  // ever cut off from these specific, explicit call sites: a new cast
  // beginning (performFishCast), STOP FISHING (performFishStop), or
  // leaving/re-entering the FISH screen (cmdFish). (A new landing
  // sound about to replace an old one is handled by
  // playFishingLandingAudio's own pause() step, not by this function.)
  function stopFishingLandingSound() {
    if (!fishingLandingAudio.paused) fishingLandingAudio.pause();
  }

  // Which final catch sound fits the fish's actual generated weight --
  // used identically for a normal catch and for marlin (whose weight
  // always falls in the 30-40lb trophy range, so it always resolves to
  // catchLarge here with no separate marlin-specific audio logic
  // needed at all).
  function fishingCatchSoundKeyForWeight(weightLb) {
    if (weightLb <= 10) return 'catchSmall';
    if (weightLb <= 20) return 'catchMedium';
    return 'catchLarge';
  }

  /* --------------------------------------------------------------
     FINAL LANDING AUDIO -- deliberately its own single, dedicated
     element rather than three separate lazily-created ones (unlike
     every other fishing sound, which still goes through
     getFishingAudioEl/playFishingOneShot unchanged). The old
     catchSmall/catchMedium/catchLarge keys meant each size could be
     instantiated for the very first time deep inside the async reel
     sequence, never having been touched during any real user gesture
     -- some mobile browsers require each individual HTMLAudioElement
     to itself be played at least once synchronously within a genuine
     gesture, not just the page as a whole. One element, primed once
     (see primeFishingLandingAudio), then reused for every catch by
     reassigning .src, sidesteps that entirely.
     -------------------------------------------------------------- */
  var fishingLandingAudio = new Audio();
  var fishingLandingAudioPrimed = false;

  // Called synchronously from the REEL IN click itself (a genuine user
  // gesture) so fishingLandingAudio has already been played at least
  // once by the time the async reel sequence actually needs it later.
  // Silent (volume 0, paused back out immediately) and a one-time
  // no-op after the first successful call -- once an element has been
  // gesture-authorized this way it stays authorized for the rest of
  // the page's life, so this never needs to run again.
  function primeFishingLandingAudio() {
    if (fishingLandingAudioPrimed || !audioUnlocked) return;
    fishingLandingAudioPrimed = true;
    fishingLandingAudio.src = FISHING_AUDIO_FILES.catchSmall; // content is irrelevant here -- always reassigned before any real landing playback
    fishingLandingAudio.volume = 0;
    var p = fishingLandingAudio.play();
    if (p && p.then) {
      p.then(function () {
        fishingLandingAudio.pause();
        fishingLandingAudio.currentTime = 0;
      }).catch(function () { /* best-effort priming only -- a real landing play() later still gets its own warning if it fails */ });
    } else {
      fishingLandingAudio.pause();
    }
  }

  // Plays the correct size-based landing sound on the SAME dedicated
  // element every time -- never a fresh Audio() -- by reassigning its
  // .src. Called only from the one place the final suspense beat's own
  // step already triggers it (see beginFishLandingSequence/revealMarlin).
  function playFishingLandingAudio(weightLb) {
    if (!audioUnlocked) return;
    var catchSoundKey = fishingCatchSoundKeyForWeight(weightLb);
    var landingSrc = FISHING_AUDIO_FILES[catchSoundKey];
    fishingLandingAudio.pause();
    fishingLandingAudio.src = landingSrc;
    fishingLandingAudio.currentTime = 0;
    fishingLandingAudio.volume = muted ? 0 : FISHING_AUDIO_VOLUME.catchLanding;
    console.log('LANDING AUDIO', weightLb, landingSrc, fishingLandingAudio.src); // TEMP DEBUG -- remove once confirmed fixed
    var p = fishingLandingAudio.play();
    if (p && p.catch) {
      p.catch(function (err) {
        console.warn('Final fishing catch audio failed:', landingSrc, describeError(err));
      });
    }
  }

  // Drag sounds: alternate strictly drag1 -> drag2 -> drag1 -> ... every
  // cast restarts the alternation at drag1. Timing is measured from
  // when each sound is TRIGGERED, not from when it finishes: first
  // drag at a random point 3-6s after CAST, then every next one at a
  // random point 15-20s after the previous one fired. Pure recursive
  // setTimeout -- at most one pending drag timer ever exists, and the
  // callback re-checks both that a session still exists and that it's
  // still in the 'waiting' phase before playing, in case cancellation
  // was somehow missed.
  var fishingDragTimer = null;
  var fishingNextDragKey = 'drag1';

  function scheduleFishingDragSound(delayMs) {
    fishingDragTimer = setTimeout(function () {
      fishingDragTimer = null;
      if (!fishingSession || fishingSession.phase !== 'waiting') return; // session ended, or no longer waiting for a bite
      var key = fishingNextDragKey;
      playFishingOneShot(key);
      fishingNextDragKey = (key === 'drag1') ? 'drag2' : 'drag1';
      scheduleFishingDragSound(rand(15000, 20000));
    }, delayMs);
  }

  function startFishingDragScheduler() {
    fishingNextDragKey = 'drag1'; // every new cast restarts the alternation at drag1
    scheduleFishingDragSound(rand(3000, 6000));
  }

  function cancelFishingDragScheduler() {
    if (fishingDragTimer) { clearTimeout(fishingDragTimer); fishingDragTimer = null; }
    // Also hard-stops a drag sound that's actively mid-playback right
    // now, rather than letting it finish naturally -- a stray drag
    // sound bleeding into the sudden catch.mp3 bite alert (or into
    // silence after STOP FISHING) would undercut both moments.
    ['drag1', 'drag2'].forEach(function (key) {
      var el = fishingAudioEls[key];
      if (!el) return;
      if (!el.paused) el.pause();
    });
  }

  // Applies the current mute state to whichever fishing element(s) are
  // actually audible right now, instantly -- called from toggleMute,
  // same pattern as applyMuteToEngineAudio.
  function applyMuteToFishingAudio() {
    Object.keys(fishingAudioEls).forEach(function (key) {
      var el = fishingAudioEls[key];
      if (!el || el.paused) return;
      if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
      el.volume = muted ? 0 : (el._baseVolume || 0);
    });
    // fishingLandingAudio is a standalone element, not part of
    // fishingAudioEls -- see its own section comment for why -- so it
    // needs this one extra line rather than being covered by the loop
    // above.
    if (!fishingLandingAudio.paused) {
      fishingLandingAudio.volume = muted ? 0 : FISHING_AUDIO_VOLUME.catchLanding;
    }
  }

  /* --------------------------------------------------------------
     GALLEY AUDIO -- active food-preparation sounds (the player
     physically doing something at the stove), as opposed to anything
     ambient/reactive. Same lazy-per-key HTMLAudioElement shape as
     SAILS_AUDIO_FILES/getSailsAudioEl below -- adding a future
     preparation sound is just one new GALLEY_AUDIO_FILES/
     GALLEY_AUDIO_VOLUME entry here plus one new FOOD_PREP_AUDIO_KEY
     (food/snacks/chocolate), CHORE_AUDIO_KEY (chores), or drink call
     site mapping, nothing structural. Covers food prep (thickBoil,
     thinBoil, boilSizzle, sizzle, boilChop, popcorn, wrapper, nuts,
     mango, tunaCrackers -- see FOOD_PREP_AUDIO_KEY), hot drinks
     (hotDrink) and water (water) in performDrink*, and dishes
     (dishes) in performChore/CHORE_AUDIO_KEY. Every key here is a
     one-shot (none currently loop; loop is only ever set true for an
     explicitly reactive/ambient sound, matching sails' own luffing
     flag) and is played via runAudioSyncedAction, so the existing
     ". .. ..." busy
     indicator lasts exactly as long as the real file does, whatever
     that turns out to be -- see playGalleyOneShot's onEnded wiring
     (and its returned element, which runAudioSyncedAction's own
     duration-derived watchdog uses as a failure-only safety net, never
     the normal path when the audio actually plays).
     -------------------------------------------------------------- */
  var GALLEY_AUDIO_FILES = {
    thickBoil: 'audio/galley/thick_boil.mp3',
    thinBoil: 'audio/galley/thin_boil.mp3',
    boilSizzle: 'audio/galley/boil_sizzle.mp3',
    sizzle: 'audio/galley/sizzle.mp3',
    boilChop: 'audio/galley/boil_chop.mp3',
    popcorn: 'audio/galley/popcorn.mp3',
    wrapper: 'audio/galley/wrapper.mp3',
    nuts: 'audio/galley/nuts.mp3',
    mango: 'audio/galley/mango.mp3',
    tunaCrackers: 'audio/galley/tuna_crakers.mp3', // exact filename spelling per the mapping spec -- "crakers", not "crackers"
    hotDrink: 'audio/galley/hot_drink.mp3',
    water: 'audio/galley/water.mp3',
    dishes: 'audio/galley/dishes.mp3',
  };
  var GALLEY_AUDIO_VOLUME = {
    thickBoil: 0.5, thinBoil: 0.5, boilSizzle: 0.5, sizzle: 0.5, boilChop: 0.5,
    popcorn: 0.5, wrapper: 0.5, nuts: 0.5, mango: 0.5, tunaCrackers: 0.5,
    hotDrink: 0.5, water: 0.5, dishes: 0.5,
  };
  var GALLEY_CROSSFADE_SECONDS = 0.1; // quick fade-in only, click prevention -- same as every other one-shot in this file

  var galleyAudioEls = {}; // key -> HTMLAudioElement, created on first use (lazy load, never preloaded) -- same pattern as sailsAudioEls

  function getGalleyAudioEl(key) {
    var el = galleyAudioEls[key];
    if (el) return el;
    el = new Audio(GALLEY_AUDIO_FILES[key]);
    el.loop = false;
    el.preload = 'auto';
    el.volume = 0;
    el.addEventListener('error', function () {
      console.warn('Galley audio failed to load (' + key + '): ' + GALLEY_AUDIO_FILES[key] + (el.error ? ' -- error code ' + el.error.code : ''));
    });
    galleyAudioEls[key] = el;
    return el;
  }

  // Identical in shape to fadeSailsVolume/fadeFishingVolume -- see
  // those functions' own comments for why each audio system keeps its
  // own independent copy rather than sharing one.
  function fadeGalleyVolume(el, target, seconds, onComplete) {
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    var start = el.volume;
    if (Math.abs(target - start) < 0.001) { el.volume = target; if (onComplete) onComplete(); return; }
    var stepMs = 20;
    var steps = Math.max(1, Math.round((seconds * 1000) / stepMs));
    var stepIndex = 0;
    el._fadeTimer = setInterval(function () {
      stepIndex++;
      if (stepIndex >= steps) {
        el.volume = target;
        clearInterval(el._fadeTimer);
        el._fadeTimer = null;
        if (onComplete) onComplete();
      } else {
        el.volume = start + (target - start) * (stepIndex / steps);
      }
    }, stepMs);
  }

  // Plays a galley one-shot (thickBoil, or any future key added to
  // GALLEY_AUDIO_FILES) once from the beginning, with a quick fade-in,
  // and fires onEnded (once) when it naturally finishes -- the exact
  // onEnded wiring runAudioSyncedAction expects from its
  // config.playAudio, so the MAKING busy-action lasts exactly as long
  // as the real audio file does, for this key and any future one,
  // without ever hard-coding a duration in code. Returns the audio
  // element itself (or null if audio is locked) so
  // runAudioSyncedAction's watchdog can size itself off the real file's
  // own duration rather than a fixed number.
  function playGalleyOneShot(key, onEnded) {
    if (!audioUnlocked) { if (onEnded) onEnded(); return null; }
    var el = getGalleyAudioEl(key);
    el.onended = null;
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    if (!el.paused) el.pause();
    el.currentTime = 0;
    el.volume = 0;
    var p = el.play();
    if (p && p.catch) p.catch(function (e) { console.warn('Galley audio failed to play (' + key + '):', describeError(e)); if (onEnded) onEnded(); });
    fadeGalleyVolume(el, muted ? 0 : GALLEY_AUDIO_VOLUME[key], GALLEY_CROSSFADE_SECONDS);
    if (onEnded) {
      el.onended = function () {
        el.onended = null;
        onEnded();
      };
    }
    return el;
  }

  function applyMuteToGalleyAudio() {
    Object.keys(galleyAudioEls).forEach(function (key) {
      var el = galleyAudioEls[key];
      if (!el || el.paused) return;
      if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
      el.volume = muted ? 0 : GALLEY_AUDIO_VOLUME[key];
    });
  }

  /* --------------------------------------------------------------
     SAILS AUDIO -- raising/lowering one-shots, the luffing loop/fill
     pair, and the winch one-shot for a completed heading change (see
     the module notes on beginCourseTurn for exactly when winch fires —
     ONLY once ACTUAL HEADING reaches the current final target, never
     for sail raising/lowering/reefing, never at the start of a turn,
     never while still turning, never chained to sail_fill). Same
     lazy-per-key HTMLAudioElement shape as FISHING_AUDIO_FILES/
     getFishingAudioEl just above (its own independent copy, for the
     same "each system easy to reason about on its own" reasoning given
     there), with one addition: playSailsOneShot's onEnded hook is what
     lets a sail raise/lower action last exactly as long as its own
     audio file rather than a hardcoded timer (see runAudioSyncedAction
     below).
     -------------------------------------------------------------- */
  var SAILS_AUDIO_FILES = {
    raiseLong: 'audio/sails/raise_sail_long.mp3',
    raiseShort: 'audio/sails/raise_sail_short.mp3',
    lowerLong: 'audio/sails/lower_sail_long.mp3',
    lowerShort: 'audio/sails/lower_sail_short.mp3',
    fill: 'audio/sails/sail_fill.mp3',
    luffing: 'audio/sails/sails_luffing_loop.mp3',
    winch: 'audio/sails/winch_short.mp3',
  };
  var SAILS_AUDIO_VOLUME = {
    raiseLong: 0.6, raiseShort: 0.6, lowerLong: 0.6, lowerShort: 0.6,
    fill: 0.55, luffing: 0.4, winch: 0.55,
  };
  // Only the sail-HANDLING sounds (the boat actually crossing the wind,
  // or the sheets being trimmed in once it arrives) are above-deck-only
  // -- raising/lowering canvas is mechanical, ship-wide noise (halyard
  // work) audible below deck too, same as it always was; unaffected by
  // this.
  var SAILS_LOCATION_GATED_KEYS = { luffing: true, fill: true, winch: true };
  var SAILS_CROSSFADE_SECONDS = 0.1; // quick fade-in every one-shot uses at its own start (click prevention only), same as fishing
  var SAILS_LUFFING_FADE_SECONDS = 0.35; // "a very short fade-in/fade-out" specifically for the loop, per the audio-transitions spec

  var sailsAudioEls = {}; // key -> HTMLAudioElement, created on first use (lazy load, never preloaded) -- same pattern as fishingAudioEls

  function getSailsAudioEl(key) {
    var el = sailsAudioEls[key];
    if (el) return el;
    el = new Audio(SAILS_AUDIO_FILES[key]);
    el.loop = (key === 'luffing');
    el.preload = 'auto';
    el.volume = 0;
    el.addEventListener('error', function () {
      console.warn('Sails audio failed to load (' + key + '): ' + SAILS_AUDIO_FILES[key] + (el.error ? ' -- error code ' + el.error.code : ''));
    });
    sailsAudioEls[key] = el;
    return el;
  }

  // The volume a given sails sound SHOULD actually be heard at right
  // now -- muted always wins, and the above-deck-only sounds (see
  // SAILS_LOCATION_GATED_KEYS) go silent below deck specifically
  // because the player isn't the one hearing the sails work, even
  // though the underlying sail physics keep running identically either
  // way (see isInNoGoZone/computeBoatSpeed, untouched by location).
  function sailsAudibleVolume(state, key) {
    if (muted) return 0;
    if (SAILS_LOCATION_GATED_KEYS[key] && state.crew.location !== 'above') return 0;
    return SAILS_AUDIO_VOLUME[key];
  }

  // Identical in shape to fadeFishingVolume -- see that function's own
  // comment for why this stays its own copy rather than a shared helper.
  function fadeSailsVolume(el, target, seconds, onComplete) {
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    var start = el.volume;
    if (Math.abs(target - start) < 0.001) { el.volume = target; if (onComplete) onComplete(); return; }
    var stepMs = 20;
    var steps = Math.max(1, Math.round((seconds * 1000) / stepMs));
    var stepIndex = 0;
    el._fadeTimer = setInterval(function () {
      stepIndex++;
      if (stepIndex >= steps) {
        el.volume = target;
        clearInterval(el._fadeTimer);
        el._fadeTimer = null;
        if (onComplete) onComplete();
      } else {
        el.volume = start + (target - start) * (stepIndex / steps);
      }
    }, stepMs);
  }

  // Plays a one-shot (raiseLong/raiseShort/lowerLong/lowerShort/fill)
  // from the beginning every time, with a quick fade-in to avoid a
  // click at the start -- and fires onEnded (once) when it naturally
  // finishes, same wiring as playFishingOneShot. This natural 'ended'
  // event is what runAudioSyncedAction waits on for sail raise/lower
  // actions, rather than a separately hardcoded duration. Runs (and
  // still calls onEnded on schedule) even when sailsAudibleVolume
  // resolves to 0 -- audibility is purely a volume question, never a
  // reason to skip the underlying event or its timing. Returns the
  // audio element itself (or null if audio is locked) so
  // runAudioSyncedAction's watchdog can size itself off the real
  // file's own duration rather than a fixed number.
  function playSailsOneShot(key, onEnded, state) {
    if (!audioUnlocked) { if (onEnded) onEnded(); return null; }
    var el = getSailsAudioEl(key);
    el.onended = null;
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    if (!el.paused) el.pause();
    el.currentTime = 0;
    el.volume = 0;
    el._baseVolume = SAILS_AUDIO_VOLUME[key];
    var p = el.play();
    if (p && p.catch) p.catch(function (e) { console.warn('Sails audio failed to play (' + key + '):', describeError(e)); if (onEnded) onEnded(); });
    fadeSailsVolume(el, sailsAudibleVolume(state, key), SAILS_CROSSFADE_SECONDS);
    if (onEnded) {
      el.onended = function () {
        el.onended = null;
        onEnded();
      };
    }
    return el;
  }

  // The luffing loop: fresh from the beginning every time it starts
  // (never a resume), a short fade-in to avoid a click, looped (see
  // getSailsAudioEl). isCurrentlyLuffing (checked by the sole caller,
  // updateNoGoZoneAudio) is the authoritative "should this be playing"
  // signal, NOT this element's own .paused -- that lags behind for the
  // full SAILS_LUFFING_FADE_SECONDS while stopSailsLuffingLoop's fade-
  // out is still in flight, so a guard here based on .paused would
  // wrongly treat "still fading toward silence from the PREVIOUS exit"
  // as "already looping" and skip restarting it -- exactly the bug
  // behind luffing failing to restart if the boat re-enters the no-go
  // zone shortly after leaving it (e.g. a quick direction reversal).
  // Cancelling any in-flight fade and restarting cleanly every time is
  // deliberate, not redundant. Starts (silently, if below deck)
  // regardless of audibility -- the loop tracks the boat's actual
  // luffing condition, not whether anyone can hear it.
  function startSailsLuffingLoop(state) {
    if (!audioUnlocked) return;
    var el = getSailsAudioEl('luffing');
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    el.currentTime = 0;
    el.volume = 0;
    el._baseVolume = SAILS_AUDIO_VOLUME.luffing;
    var p = el.play();
    if (p && p.catch) p.catch(function (e) { console.warn('Sails audio failed to play (luffing):', describeError(e)); });
    fadeSailsVolume(el, sailsAudibleVolume(state, 'luffing'), SAILS_LUFFING_FADE_SECONDS);
  }

  // Fades out then pauses -- unlike stopFishingReelLoop's instant cut,
  // this loop specifically wants the short fade-out called for in the
  // audio-transitions spec. No-ops if not currently playing.
  function stopSailsLuffingLoop() {
    var el = sailsAudioEls.luffing;
    if (!el || el.paused) return;
    fadeSailsVolume(el, 0, SAILS_LUFFING_FADE_SECONDS, function () {
      if (!el.paused) el.pause();
    });
  }

  // Applies the current mute state AND the current above/below-deck
  // audibility to whichever sails element(s) are actually playing right
  // now, instantly -- called from toggleMute (mute changing, no state
  // in scope there, falls back to GAME) and from updateAudioForState
  // (location possibly changing, e.g. GO ABOVE/GO BELOW -- passes its
  // own state explicitly), same pattern as applyMuteToFishingAudio
  // otherwise. Never starts, stops, or restarts anything -- purely a
  // volume sync for whatever's already playing.
  function applyMuteToSailsAudio(state) {
    var s = state || GAME;
    Object.keys(sailsAudioEls).forEach(function (key) {
      var el = sailsAudioEls[key];
      if (!el || el.paused) return;
      if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
      el.volume = s ? sailsAudibleVolume(s, key) : (muted ? 0 : (el._baseVolume || 0));
    });
  }

  // Same overall shape and tail as runShortAction (dots indicator,
  // uiBusy, the finish() sequence) -- but the duration is driven by an
  // actual audio file's natural end (see playSailsOneShot's onEnded
  // hook) rather than a fixed timer, per "whenever possible, use the
  // audio element's actual playback/end state." config: label,
  // playAudio(onEnded) (must eventually call onEnded exactly once, and
  // should return the HTMLAudioElement it's playing so the watchdog
  // below can size itself off the real file), action(state).
  //
  // FAILSAFE, not a competing timer: a fixed setTimeout racing the real
  // audio (the old design) meant any file longer than that fixed number
  // finished the ACTION early even while still audibly playing --
  // exactly backwards from "the audio file itself determines how long
  // the action takes." Instead: start with a generous, config-optional
  // startupFallbackSeconds (default 10) that only covers "we don't know
  // anything yet" -- audio that never even begins, or whose metadata
  // never loads at all (playSailsOneShot/playGalleyOneShot already call
  // onEnded immediately on a play() rejection or while audio is locked,
  // so this rarely needs to fire for that). The instant the returned
  // element reports a real, finite duration -- synchronously if already
  // known from an earlier play of the same (reused, lazy-loaded)
  // element, or via 'loadedmetadata'/'durationchange' once it becomes
  // known -- that startup timer is replaced with one sized to the
  // ACTUAL file: duration + a generous watchdogMarginSeconds (default
  // 5). That derived watchdog is itself only a guard against 'ended'
  // somehow never firing on a genuinely broken playback; it is not
  // the normal path, and normal playback always resolves via the real
  // 'ended' event, which fires first.
  function runAudioSyncedAction(state, config) {
    uiBusy = true;
    var choiceAtStart = state.pendingChoice;

    optionsEl.innerHTML = '';
    clearTempView();
    printPersistentBlank();
    printPersistentLine(config.label, 'heading-label');

    var dotsLine = document.createElement('p');
    dotsLine.className = 'line dim';
    dotsLine.textContent = '.';
    outputEl.insertBefore(dotsLine, tempViewEl);
    scrollToBottom();
    var frames = ['.', '..', '...'];
    var frameIndex = 0;
    var dotTimer = setInterval(function () {
      frameIndex = (frameIndex + 1) % frames.length;
      dotsLine.textContent = frames[frameIndex];
    }, DOT_FRAME_MS);

    var settled = false;
    // Last-resort ceiling while we don't yet know anything about the
    // audio (see the function-level notes) -- replaced the moment a
    // real duration is known, below.
    var watchdogTimer = setTimeout(onAudioDone, (config.startupFallbackSeconds || 10) * 1000);

    function armDurationWatchdog(el) {
      if (settled || !el) return;
      function arm() {
        if (settled) return;
        var d = el.duration;
        if (!isFinite(d) || d <= 0) return; // not known yet -- stay on the startup ceiling until it is
        el.removeEventListener('loadedmetadata', arm);
        el.removeEventListener('durationchange', arm);
        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(onAudioDone, (d + (config.watchdogMarginSeconds || 5)) * 1000);
      }
      arm(); // synchronous check first -- covers the common case where this (reused) element already knows its duration from an earlier play
      el.addEventListener('loadedmetadata', arm);
      el.addEventListener('durationchange', arm);
    }

    function onAudioDone() {
      if (settled) return; // guards against the real 'ended' event and the watchdog both eventually firing
      settled = true;
      clearTimeout(watchdogTimer);
      clearInterval(dotTimer);
      if (dotsLine.parentNode) dotsLine.parentNode.removeChild(dotsLine);
      if (config.action) config.action(state);
      if (state.pendingChoice === choiceAtStart) state.pendingChoice = null;
      uiBusy = false;
      renderOptions(state);
      saveGameState(state);
      updateAudioForState(state);
      scrollToBottom();
    }

    var playingEl = config.playAudio(onAudioDone);
    armDurationWatchdog(playingEl);
  }

  // Sail area ordering, used only to classify a change as a raise or a
  // lower and specifically detect FURLED<->FULL vs every other
  // transition -- see SAILS AUDIO above. Matches the relative ordering
  // sailConfigFactor already implies (reefed carries more canvas than
  // minimal).
  var SAIL_AREA_ORDER = { furled: 0, minimal: 1, reefed: 2, full: 3 };

  // FURLED -> FULL (raising the entire sail from nothing) is the only
  // "long" raise; FULL -> FURLED (lowering everything) is the only
  // "long" lower. Every other increase/decrease -- reefing, shaking out
  // a reef, going to/from minimal/storm canvas -- is "short", per the
  // spec's simple rule.
  function sailChangeAudioKey(fromConfig, toConfig) {
    if (SAIL_AREA_ORDER[toConfig] > SAIL_AREA_ORDER[fromConfig]) {
      return (fromConfig === 'furled' && toConfig === 'full') ? 'raiseLong' : 'raiseShort';
    }
    return (fromConfig === 'full' && toConfig === 'furled') ? 'lowerLong' : 'lowerShort';
  }

  // Unchanged from before this system existed -- same working label and
  // same log line per target config, just no longer tied to a fixed
  // duration.
  var SAIL_CHANGE_WORKING_LABEL = {
    full: 'SETTING FULL SAIL', reefed: 'PUTTING IN A REEF', minimal: 'REDUCING SAIL', furled: 'FURLING SAILS',
  };
  var SAIL_CHANGE_LOG_LINES = {
    full: "Full sail set. More speed, more motion.",
    reefed: "Put a reef in. Quieter below, a little slower.",
    minimal: "Reduced to minimal canvas. Slow, but she's not fighting the wind anymore.",
    furled: "Sails furled. No canvas up at all.",
  };

  function performSailChange(state, targetConfig) {
    var fromConfig = state.boat.sailConfig;
    var audioKey = sailChangeAudioKey(fromConfig, targetConfig);
    runAudioSyncedAction(state, {
      label: SAIL_CHANGE_WORKING_LABEL[targetConfig],
      playAudio: function (onEnded) { return playSailsOneShot(audioKey, onEnded, state); },
      action: function (s) {
        s.boat.sailConfig = targetConfig;
        log(s, SAIL_CHANGE_LOG_LINES[targetConfig]);
        flushNewLogEntries(s);
      },
    });
  }

  // Transient, in-progress fishing session -- NOT persisted; see the
  // section comment above for why. null whenever no cast is currently
  // in flight (idle FISH screen, or the player has left it entirely).
  var fishingSession = null;

  function clearFishingTimers() {
    // FISHING HOOK -- always safe to call, whether or not either was
    // actually active; extends this already-central cleanup point so
    // every existing call site (a new cast, a bite arriving, no bite,
    // a missed reaction, STOP FISHING) also gets audio cleanup for
    // free, with no new call sites needed elsewhere.
    cancelFishingDragScheduler();
    stopFishingReelLoop();
    if (!fishingSession) return;
    if (fishingSession.resolveTimer) clearTimeout(fishingSession.resolveTimer);
    if (fishingSession.dotsTimer) clearInterval(fishingSession.dotsTimer);
    // The waiting dots are a single DOM node this code inserted directly
    // (not through printLine, since it needs to keep updating the SAME
    // element rather than appending a new one every frame) -- remove it
    // explicitly rather than relying on some later clearTempView(),
    // since under the append-only model nothing else will.
    if (fishingSession.dotsLineEl && fishingSession.dotsLineEl.parentNode) {
      fishingSession.dotsLineEl.parentNode.removeChild(fishingSession.dotsLineEl);
    }
  }

  function fishingIdleOptions() {
    return [{ label: 'CAST', action: 'fish-cast' }, { label: 'STOP FISHING', action: 'fish-stop' }];
  }

  function cmdFish(state) {
    clearFishingTimers(); // FISHING HOOK -- defensive; ensures no audio from a previous attempt can leak in
    stopFishingLandingSound(); // FISHING HOOK -- a landing sound is deliberately NOT touched by clearFishingTimers; this is one of its few explicit stopping points
    fishingSession = null; // a fresh visit to the FISH screen always starts idle -- see FISHING section comment on why nothing here is resumed
    printBlank();
    printLine('FISHING', 'heading-label');
    state.pendingChoice = { id: 'fish-idle', options: fishingIdleOptions() };
  }

  function performFishCast(state) {
    clearFishingTimers();
    stopFishingLandingSound(); // FISHING HOOK -- see cmdFish's comment on why this is separate from clearFishingTimers
    var willBite = Math.random() < FISHING_CONFIG.biteChance; // flat 60% -- see FISHING_CONFIG.biteChance comment for why nothing else modifies this

    fishingSession = { phase: 'waiting', willBite: willBite, resolveTimer: null, dotsTimer: null, dotsLineEl: null };

    playFishingOneShot('cast'); // FISHING HOOK -- fire-and-forget, does not delay anything below
    startFishingDragScheduler(); // FISHING HOOK -- cancelled by clearFishingTimers whenever the wait ends, for any reason

    // #temp-view was already cleared by the generic click handler that
    // routed the CAST click here (see renderOptions) -- just append the
    // waiting dots, same visual rhythm as any other short action's dots
    // (see animateDots in runShortAction) and no special styling. A
    // single DOM node whose text content is updated in place -- never
    // prints a new line while waiting.
    var dotsLine = document.createElement('p');
    dotsLine.className = 'line dim';
    dotsLine.textContent = '.';
    tempViewEl.appendChild(dotsLine);
    fishingSession.dotsLineEl = dotsLine;
    var frames = ['.', '..', '...'];
    var frameIndex = 0;
    fishingSession.dotsTimer = setInterval(function () {
      frameIndex = (frameIndex + 1) % frames.length;
      dotsLine.textContent = frames[frameIndex];
    }, DOT_FRAME_MS);

    state.pendingChoice = { id: 'fish-waiting', options: [{ label: 'STOP FISHING', action: 'fish-stop' }] };

    var mySession = fishingSession;
    // If a bite is going to happen at all, it lands at a uniformly
    // random point somewhere in the full wait window -- not weighted
    // toward any particular part of it.
    var resolveAtMs = willBite ? rand(0, FISHING_CONFIG.bite.totalWaitMs) : FISHING_CONFIG.bite.totalWaitMs;
    fishingSession.resolveTimer = setTimeout(function () {
      if (fishingSession !== mySession) return; // superseded -- STOP FISHING was clicked, or another cast started
      if (willBite) beginFishBite(state);
      else resolveFishNoBite(state);
    }, resolveAtMs);
    // Deliberately no renderOptions/save/scroll call here -- this runs
    // inside handleAction (via performFishCast), whose own tail does
    // that once this returns, same as every other action.
  }

  function performFishStop(state) {
    clearFishingTimers();
    stopFishingLandingSound(); // FISHING HOOK -- see cmdFish's comment on why this is separate from clearFishingTimers
    fishingSession = null;
    printBlank();
    printLine('You bring the line in.', 'dim');
    // pendingChoice deliberately left unset -- handleAction's tail
    // clears it (nothing here sets a new one), so the normal Above
    // Deck menu takes over on the next render, exactly like 'cancel'
    // elsewhere. This is what "return the player to the normal Above
    // Deck interface" means mechanically.
  }

  function resolveFishNoBite(state) {
    clearFishingTimers();
    printBlank();
    printLine('Nothing\u2019s biting.', 'dim');
    showFishResultScreen(state);
  }

  // Weight tier, weight, and (if applicable) the marlin/species
  // decision are ALL made right here, the moment the bite occurs --
  // before the player ever sees REEL IN, same as before. None of it is
  // shown or hinted at this point; it only shapes the automatic
  // sequence once a successful reaction hooks the fish.
  function beginFishBite(state) {
    clearFishingTimers(); // stops the dots timer and removes the dots line -- the wait is over
    var tier = pickFishWeightTier();
    var weightLb = pickFishWeightLbInTier(tier);
    // Marlin is only ever possible once the tier roll has ALREADY
    // landed on the rare top bracket, and only in eligible waters --
    // see the FISHING_CONFIG.marlinChanceWithinTrophyTier comment.
    var isMarlin = tier.key === 'trophy' && marlinEligible(state) && Math.random() < FISHING_CONFIG.marlinChanceWithinTrophyTier;
    var species = isMarlin ? null : pickFishSpeciesForWeight(state, weightLb);

    fishingSession = { phase: 'bite-prompt', tier: tier, weightLb: weightLb, isMarlin: isMarlin, species: species, resolveTimer: null };

    printLine('The line jerks hard.');
    playFishingOneShot('catch'); // FISHING HOOK -- the sudden bite alert; fire-and-forget, does not delay anything below
    // No options at all -- ignores clicks/taps before REEL IN appears,
    // since there's nothing here to click.
    state.pendingChoice = { id: 'fish-bite-prompt', options: [] };
    renderOptions(state);
    scrollToBottom();

    var mySession = fishingSession;
    fishingSession.resolveTimer = setTimeout(function () {
      if (fishingSession !== mySession) return;
      beginFishReelPrompt(state);
    }, FISHING_CONFIG.biteToPromptDelayMs);
  }

  function beginFishReelPrompt(state) {
    clearFishingTimers();
    fishingSession.phase = 'reacting';
    printLine('REEL IN'); // a plain, ordinary terminal line -- REEL IN's button (below, in #options) is a normal .option, no special styling either
    state.pendingChoice = { id: 'fish-reacting', options: [{ label: 'REEL IN', action: 'fish-reel' }] };
    renderOptions(state);
    scrollToBottom();

    var mySession = fishingSession;
    fishingSession.resolveTimer = setTimeout(function () {
      if (fishingSession !== mySession) return;
      resolveFishReactionMissed(state);
    }, FISHING_CONFIG.reactionWindowMs);
  }

  function resolveFishReactionMissed(state) {
    clearFishingTimers();
    printBlank();
    printLine('The line goes slack.', 'dim');
    printLine('The fish is lost.', 'dim');
    showFishResultScreen(state);
  }

  function performFishReel(state) {
    if (!fishingSession || fishingSession.phase !== 'reacting') return; // stale/duplicate click -- shouldn't be reachable since the button disappears on the next render, but stay defensive
    clearFishingTimers();
    primeFishingLandingAudio(); // FISHING HOOK -- synchronous, within this genuine click, so fishingLandingAudio is already gesture-authorized well before beginFishLandingSequence's async chain actually needs it
    beginFishLandingSequence(state);
  }

  // Hint beats by weight TIER (not species) -- each tier gets a pool of
  // short lines per beat slot so a sequence doesn't read identically
  // every time. 'trophy' beats are the shared opening/mid beats for
  // EVERY 30-40lb catch, marlin or not -- the player can't tell which
  // it is yet at this point, which is deliberate; the branch only
  // happens in the final beat(s), see beginFishLandingSequence.
  var FISH_TIER_HINT_POOLS = {
    common: [
      ['There\u2019s weight on the line.', 'Something\u2019s there.', 'A light tug.'],
      ['It pulls away, then eases.', 'You gain some line.', 'It comes in without much fuss.'],
    ],
    substantial: [
      ['The line pulls harder.', 'Something pushes back.', 'A stronger tug this time.'],
      ['It runs a little, then settles.', 'It\u2019s not coming in easy.', 'Steady resistance.'],
      ['You gain line, then lose a little back.', 'It fights for a moment.', 'A real pull now.'],
    ],
    big: [
      ['Real weight, right away.', 'This one doesn\u2019t give easily.', 'Something big is pulling back.'],
      ['It runs, and keeps running.', 'The line stays taut.', 'It\u2019s not tiring yet.'],
      ['Whatever it is, it\u2019s strong.', 'The rod bends hard.', 'It\u2019s still fighting.'],
      ['Slowly, you start to gain line.', 'It gives an inch at a time.', 'The fight is starting to turn.'],
    ],
    trophy: [
      ['Heavy.', 'Heavier than anything so far.'],
      ['It runs again.', 'It takes line back, fast.'],
      ['Whatever\u2019s down there is big.', 'This is something else.'],
    ],
  };
  var FISH_GLIMPSE_LINES = ['You catch a glimpse beneath the surface.', 'Something breaks the surface, big.'];
  var MARLIN_FLASH_LINES = ['A flash of blue beneath the surface.'];
  var MARLIN_RARITY_LINES = ['You don\u2019t see many of these this close.', 'Not something you see every voyage.'];

  // Automatic, no further player input: the weight tier's own hint
  // beats (each followed by its own "..." line), then either an
  // ordinary glimpse-and-reveal (most catches) or the marlin-specific
  // flash-and-reveal (only when fishingSession.isMarlin) -- spread
  // evenly across the tier's randomized total duration. Species/weight
  // (or marlin-ness) were already decided back at the bite; nothing
  // here changes what's on the line, only how it's narrated.
  function beginFishLandingSequence(state) {
    var session = fishingSession;
    var tier = session.tier;
    var hintLines = FISH_TIER_HINT_POOLS[tier.key].map(function (pool) { return pickFromPool(pool); });

    startFishingReelLoop(); // FISHING HOOK -- continuous bed underneath the suspense text; stopped at the final beat below (non-marlin) or in revealMarlin (marlin)

    var lines = [];
    hintLines.forEach(function (h) { lines.push(h, '...'); });
    var finalLineIndex = lines.length; // the final suspense beat, about to be appended below -- the exact step that (for a non-marlin catch) triggers the audio transition
    lines.push(session.isMarlin ? pickFromPool(MARLIN_FLASH_LINES) : pickFromPool(FISH_GLIMPSE_LINES));

    session.phase = 'landing';
    state.pendingChoice = { id: 'fish-landing', options: [] }; // automatic -- nothing to click during this sequence
    renderOptions(state);
    scrollToBottom();

    var range = tier.durationMsRange;
    var totalMs = rand(range[0], range[1]);
    var stepMs = totalMs / (lines.length + 1); // + one more beat's worth of pause before the reveal

    var mySession = session;
    var index = 0;
    function showNextLine() {
      if (fishingSession !== mySession) return;
      printLine(lines[index]);
      if (index === finalLineIndex && !session.isMarlin) {
        // FISHING HOOK -- tied directly to this same step, the moment
        // the final suspense line prints: stop reel.mp3 (instant, no
        // fade) and start the size-based catch sound, back-to-back, no
        // timeout between them. Marlin's own final beat (and audio
        // trigger) comes later, inside revealMarlin -- the flash line
        // here is not yet marlin's last line before its reveal.
        stopFishingReelLoop();
        playFishingLandingAudio(session.weightLb);
      }
      scrollToBottom();
      index++;
      if (index < lines.length) {
        fishingSession.resolveTimer = setTimeout(showNextLine, stepMs);
      } else {
        fishingSession.resolveTimer = setTimeout(function () {
          if (fishingSession !== mySession) return;
          if (session.isMarlin) revealMarlin(state);
          else resolveFishLanded(state);
        }, stepMs);
      }
    }
    fishingSession.resolveTimer = setTimeout(showNextLine, stepMs);
  }

  function resolveFishLanded(state) {
    var session = fishingSession;
    var displayName = fishSpeciesDisplayName(state, session.species);

    session.phase = 'keep-release';
    session.pendingCatch = { displayName: displayName, weightLb: session.weightLb };

    // No audio here -- the reel-stop and catch-sound trigger already
    // happened in beginFishLandingSequence, tied directly to the final
    // suspense line's own print step. This is just the text reveal.
    printBlank();
    printLine(displayName.toUpperCase() + ' \u2014 ' + session.weightLb.toFixed(1) + ' LB');

    if (fishAlreadyKeptToday(state)) {
      printLine('I\u2019ve got enough for today.', 'dim');
      state.pendingChoice = { id: 'fish-keep-release', options: [{ label: 'RELEASE', action: 'fish-release' }] };
    } else {
      state.pendingChoice = { id: 'fish-keep-release', options: [{ label: 'KEEP', action: 'fish-keep' }, { label: 'RELEASE', action: 'fish-release' }] };
    }

    renderOptions(state);
    saveGameState(state);
    scrollToBottom();
  }

  // Marlin CAN be landed -- weight shown, same as any other fish -- but
  // can never be kept (see performFishRelease's marlin-release branch,
  // and note there is no "case 'fish-keep'" path into this phase at
  // all). "A marlin." and the rarity line each get their own brief
  // pause rather than appearing all at once, matching the unhurried
  // pacing of everything else here.
  function revealMarlin(state) {
    var session = fishingSession;
    printLine('A marlin.');
    scrollToBottom();

    var mySession = session;
    fishingSession.resolveTimer = setTimeout(function () {
      if (fishingSession !== mySession) return;
      printLine(pickFromPool(MARLIN_RARITY_LINES), 'dim');
      scrollToBottom();
      fishingSession.resolveTimer = setTimeout(function () {
        if (fishingSession !== mySession) return;
        // FISHING HOOK -- tied directly to this same step, right as
        // the rarity line (marlin's own final suspense beat before the
        // reveal) has just printed: stop reel.mp3 (instant, no fade)
        // and start catch_large.mp3, back-to-back, no timeout between
        // them. Marlin's weight always falls in the trophy 30-40lb
        // range, so this naturally resolves to catchLarge -- no
        // separate marlin audio logic needed.
        stopFishingReelLoop();
        playFishingLandingAudio(session.weightLb);
        printBlank();
        printLine('MARLIN \u2014 ' + session.weightLb.toFixed(1) + ' LB');
        session.phase = 'marlin-release';
        state.pendingChoice = { id: 'fish-marlin-release', options: [{ label: 'RELEASE', action: 'fish-release' }] };
        renderOptions(state);
        saveGameState(state);
        scrollToBottom();
      }, 1400);
    }, 1400);
  }

  function performFishKeep(state) {
    if (!fishingSession || fishingSession.phase !== 'keep-release' || !fishingSession.pendingCatch) return;
    var caught = fishingSession.pendingCatch;
    var speciesId = fishingSession.species.id;
    var mealName = FISH_MEAL_BY_SPECIES[speciesId] || caught.displayName;
    state.fishing.heldFish = { speciesId: speciesId, caughtDay: voyageDayNumber(state) };
    state.fishing.keptFishOnDay = voyageDayNumber(state);
    log(state, 'Kept: ' + mealName.toUpperCase() + ' \u2014 1 MEAL (' + caught.displayName + ', ' + caught.weightLb.toFixed(1) + ' lb).');
    flushNewLogEntries(state);
    showFishResultScreen(state);
  }

  function performFishRelease(state) {
    if (!fishingSession) return;
    if (fishingSession.phase === 'marlin-release') {
      playFishingOneShot('release'); // FISHING HOOK
      // A marlin is memorable enough to be worth a permanent voyage-log
      // line, unlike an ordinary release (which stays transient/#temp-view
      // only) -- see the FISHING section comment on why this is the one
      // deliberate asymmetry here.
      printBlank();
      printLine('You let it go.', 'dim');
      log(state, 'A marlin came alongside \u2014 rare enough to remember \u2014 then went back over the side.');
      flushNewLogEntries(state);
      showFishResultScreen(state);
      return;
    }
    if (fishingSession.phase !== 'keep-release') return;
    playFishingOneShot('release'); // FISHING HOOK
    printBlank();
    printLine('You let it go.', 'dim');
    showFishResultScreen(state);
  }

  function showFishResultScreen(state) {
    fishingSession = { phase: 'result' };
    state.pendingChoice = { id: 'fish-result', options: fishingIdleOptions() };
    renderOptions(state);
    saveGameState(state);
    scrollToBottom();
  }

  // What (if anything) the top-level rescue-related menu item should
  // be right now. Once rescue is actually underway, it stays
  // reachable regardless of canRadioForRescue's current value (e.g. a
  // later repair shouldn't hide an already-active rescue) -- see the
  // ACTIVE RESCUE note on canRadioForRescue above. Returns null when
  // neither applies, so callers can simply skip adding anything.
  // Rescue now resolves immediately on COMMENCE RESCUE -- there is no
  // longer a traveling/searching interim phase to show status for, so
  // this only ever needs to check whether rescue can be initiated at
  // all. (phase === 'rescued' is handled earlier, in
  // getContextualOptions, before this function is ever called.)
  function rescueMenuOption(state) {
    if (canRadioForRescue(state)) {
      return { label: 'RADIO FOR RESCUE', action: 'cmd:radio-for-rescue' };
    }
    return null;
  }

  function getContextualOptions(state) {
    // A pending decision always wins — including a restart request made
    // mid-departure, mid-attempt, or mid-sleep, which must be answerable
    // even though those states otherwise show just one button. Pending
    // choices (SAILS' FULL/REEFED/etc, the rescue warning's COMMENCE
    // RESCUE/CANCEL, RESCUE STATUS' FIRE FLARE, and so on) are unaffected
    // by physical location — a rescue interaction started below can
    // still surface FIRE FLARE regardless of where the sailor is standing.
    if (state.pendingChoice) return state.pendingChoice.options;

    if (state.departure.stageIndex < DEPARTURE_STEPS.length) {
      return [{ label: DEPARTURE_STEPS[state.departure.stageIndex].label, action: 'departure-step' }];
    }

    if (state.rescue.phase === 'rescued') {
      // The voyage is over -- rescue was called in and the attempt to
      // reach Kaua'i has ended. Nothing left to do but restart; see
      // beginRescueEndingSequence, which already sets this exact
      // pendingChoice itself (checked above, before this branch is
      // ever reached) -- this is just a defensive fallback matching it.
      return [{ label: 'RESTART', action: 'confirm-restart' }];
    }

    if (state.crew.watchState === 'trying') {
      return [{ label: 'GET UP', action: 'give-up-trying' }];
    }
    if (state.crew.watchState === 'sleeping') {
      return [{ label: 'WAKE UP', action: 'wake-up' }];
    }

    var rescueItem = rescueMenuOption(state);

    if (state.crew.inLifeRaft) {
      // Nothing left to sail, motor, steer, or fix — the voyage has
      // become survival until rescue, full stop. There's no boat left
      // to be above or below on, so this stays the one flat list it
      // always was (minus STATUS, which is gone everywhere now).
      var raftOptions = [
        { label: 'POSITION', action: 'cmd:position' },
        { label: 'WEATHER', action: 'cmd:weather' },
        { label: 'INVENTORY', action: 'cmd:inventory' },
        { divider: true },
        { label: 'EAT', action: 'cmd:eat' },
        { label: 'DRINK', action: 'cmd:drink' },
        { label: 'SLEEP', action: 'cmd:sleep' },
      ];
      if (rescueItem) raftOptions.push(rescueItem);
      return raftOptions;
    }

    // REPAIR no longer lives here at all — it's reachable only from
    // STATUS now, and only while hasRepairableDamage(state) (or a
    // still-pending aft-locker event) is true; see cmdStatus. RADIO
    // FOR RESCUE/RESCUE STATUS keeps its existing placement above deck
    // (aboveMiscGroup, below) — below deck it now lives inside NAV
    // STATION only (see cmdNavStation), matching the stated design
    // intent that dealing with an emergency, like everything else
    // below, means going to the room where that's handled.
    var goLabel = state.crew.location === 'below' ? 'GO ABOVE' : 'GO BELOW';

    if (state.crew.location === 'below') {
      return groupedOptions([
        [
          { label: 'GALLEY', action: 'cmd:galley' },
          { label: 'SALOON', action: 'cmd:saloon' },
          { label: 'NAV STATION', action: 'cmd:nav-station' },
          { label: 'CABIN', action: 'cmd:cabin' },
          { label: 'HEAD', action: 'cmd:head' },
        ],
        [{ label: goLabel, action: 'go-above-below' }],
      ]);
    }

    // ABOVE (the default/starting location).
    var aboveMiscGroup = [];
    if (rescueItem) aboveMiscGroup.push(rescueItem);
    return groupedOptions([
      [
        { label: 'HELM', action: 'cmd:helm' },
        { label: 'SAILS', action: 'cmd:sails' },
        { label: 'ENGINE', action: 'cmd:engine' },
        { label: 'FISH', action: 'cmd:fish' },
      ],
      aboveMiscGroup,
      [{ label: goLabel, action: 'go-above-below' }],
    ]);
  }

  // Which of the read-only "information" categories (if any) currently
  // occupies the temp view. Tracked separately from state.pendingChoice
  // because it's pure UI/interaction convenience — not part of the
  // simulation, not persisted, not something a reload should remember.
  // POSITION, WEATHER, and ROUTINE are deliberately NOT here: they each
  // drive their own focused submenu via pendingChoice instead — no
  // click-again-to-collapse shortcut, BACK is the one way out, and the
  // main BELOW menu is fully hidden while any of them is open rather
  // than staying visible underneath. FORECAST is not here either, for
  // the same reason — it drives its own pendingChoice too.
  var INFO_COMMANDS = { inventory: true };
  var openInfoPanel = null;

  // Cosmetic only — see the --bg-lit CSS variable. Called from
  // renderOptions so it's always in sync with state, including right
  // after loading a saved game. The brighter background is interior
  // cabin illumination — it only applies below deck, even if the
  // lights are left on while the player is above.
  function applyCabinLighting(state) {
    var lit = !!state.boat.cabinLightsOn && state.crew.location === 'below';
    document.documentElement.classList.toggle('cabin-lit', lit);
    document.body.classList.toggle('cabin-lit', lit);
  }

  function renderOptions(state) {
    applyCabinLighting(state);
    applyTapeLocationAudio(state);
    updateBoatAudioForState(state);
    syncActivityDots(state);
    updateNavStrip(state); // the strip reflects live state, so refresh it anywhere the options panel does
    optionsEl.innerHTML = '';
    var opts = getContextualOptions(state);
    opts.forEach(function (opt) {
      if (opt.divider) {
        var div = document.createElement('div');
        div.className = 'option-divider';
        optionsEl.appendChild(div);
        return;
      }
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option';
      btn.textContent = '> ' + opt.label;
      btn.addEventListener('click', function () {
        if (opt.action === 'open-map' || opt.action === 'open-in-windy') {
          // Pure external side effect: opens a new tab and changes
          // nothing about the current Landfall view, so the panel that
          // offered this (POSITION or FORECAST) stays exactly as it was
          // — no clearTempView, no touching openInfoPanel, no re-render.
          var url = opt.action === 'open-map' ? googleMapsUrl(state.nav.lat, state.nav.lon) : windyUrl(state.nav.lat, state.nav.lon);
          window.open(url, '_blank');
          return;
        }
        if (opt.action.indexOf('cmd:') === 0) {
          var cmdName = opt.action.slice(4);
          clearTempView(); // whatever the last command/menu showed is done being looked at
          if (INFO_COMMANDS[cmdName] && openInfoPanel === cmdName) {
            // Same info category clicked again while it's already open:
            // collapse it and return to the plain log view instead of
            // reopening it.
            openInfoPanel = null;
            renderOptions(state);
            saveGameState(state);
            scrollToBottom();
            return;
          }
          openInfoPanel = INFO_COMMANDS[cmdName] ? cmdName : null;
          printEcho(cmdName === 'chore' ? 'chores' : cmdName);
          runCommand(state, cmdName);
        } else {
          clearTempView();
          // Inventory's own category/back sub-choices stay "inside" the
          // inventory panel for toggle purposes; any other action (a sail
          // choice, an eat/drink pick, a generic cancel out of a prompt,
          // etc.) leaves the info-panel system entirely.
          if (opt.action.indexOf('inventory:') !== 0) {
            openInfoPanel = null;
          }
          handleAction(state, opt.action);
        }
      });
      optionsEl.appendChild(btn);
    });
  }

  /* --------------------------------------------------------------
     SHORT PHYSICAL ACTIONS

     A reusable working-indicator system for physical tasks that
     shouldn't resolve instantly — starting the engine, reefing,
     checking the aft locker, pouring water. NOT a loading spinner:
     it represents the sailor actually doing something, so it runs
     on real wall-clock seconds (setTimeout/setInterval), same as a
     human would take a moment. This is orthogonal to — and never
     touches — the voyage clock (meta.voyageMinutes): a few seconds
     of UI pacing is not a time-skip; see PROJECT.md's real-time rule,
     which governs the SIMULATION clock, not interaction pacing.

     Usage: runShortAction(state, { label, duration, action }).
     `action(state)` does whatever an instant handler normally would
     (mutate state, call log()/printLine() itself) — this just wraps
     it with a label and a few seconds of animated dots first, then
     runs the normal render/save tail once it resolves. Any future
     action can opt in with three lines; nothing here is hard-coded
     to a specific task.
     -------------------------------------------------------------- */
  var uiBusy = false; // true while a short action's dots are animating — options are hidden, other actions wait
  var DOT_FRAME_MS = 700;

  // Shared indefinite-duration activity indicator — same single-element,
  // same-frames-and-timing approach as animateDots below, but indefinite
  // rather than fixed-duration (an ongoing activity has no set end time
  // the way a short action does). syncActivityDots is called from
  // renderOptions every time it runs (every action, every live tick,
  // right after load) and is idempotent: it only starts the timer when
  // some activity is active and none is running, and only stops it when
