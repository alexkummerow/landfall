     land on the persistent side, exactly like any other voyage event
     — only the menu's own browsing/status text is temporary.
     -------------------------------------------------------------- */
  function printLine(text, cls) {
    var p = document.createElement('p');
    p.className = 'line' + (cls ? ' ' + cls : '');
    p.textContent = text;
    tempViewEl.appendChild(p);
  }

  function printBlank() {
    var p = document.createElement('p');
    p.className = 'gap';
    tempViewEl.appendChild(p);
  }

  function printEcho(text) {
    var p = document.createElement('p');
    p.className = 'line echo';
    p.textContent = '> ' + text.replace(/-/g, ' ').toUpperCase();
    tempViewEl.appendChild(p);
  }

  function clearTempView() {
    tempViewEl.innerHTML = '';
  }

  function printPersistentLine(text, cls) {
    var p = document.createElement('p');
    p.className = 'line' + (cls ? ' ' + cls : '');
    p.textContent = text;
    outputEl.insertBefore(p, tempViewEl);
  }

  function printPersistentBlank() {
    var p = document.createElement('p');
    p.className = 'gap';
    outputEl.insertBefore(p, tempViewEl);
  }

  function formatShipTime(ts) {
    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var d = new Date(ts);
    var dd = String(d.getDate()).padStart(2, '0');
    var mon = months[d.getMonth()];
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    return dd + ' ' + mon + ' ' + hh + ':' + mm;
  }

  function printLogEntry(entry) {
    var wrap = document.createElement('div');
    wrap.className = 'entry';
    var ts = document.createElement('div');
    ts.className = 'entry-ts';
    ts.textContent = formatShipTime(entry.t);
    var body = document.createElement('div');
    body.className = 'entry-text';
    body.textContent = entry.text;
    wrap.appendChild(ts);
    wrap.appendChild(body);
    outputEl.insertBefore(wrap, tempViewEl);
  }

  function scrollToBottom() {
    outputEl.scrollTop = outputEl.scrollHeight;
  }

  function flushNewLogEntries(state) {
    for (; printedCount < state.log.length; printedCount++) {
      printLogEntry(state.log[printedCount]);
    }
    scrollToBottom();
  }

  // outputEl.innerHTML = '' (a full reset, used by confirmRestart and
  // renderReturn) would delete tempViewEl itself, since it's a child of
  // outputEl — re-attach the same node right after, so every later
  // printPersistentLine/printLogEntry call still has a valid insertBefore
  // target instead of throwing on a detached reference.
  function resetOutputEl() {
    outputEl.innerHTML = '';
    outputEl.appendChild(tempViewEl);
  }

  function setVesselLine(text) { vesselLineEl.textContent = text; }

  function updateClock() {
    if (!GAME) { clockEl.textContent = '\u2014'; navStripEl.hidden = true; return; }
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    clockEl.textContent = hh + ':' + mm;
    updateNavStrip(GAME);
  }

  function regionName(state) {
    var phase = voyagePhase(state);
    if (phase === 'inland') {
      var distFromStart = distanceBetween(state.nav.lat, state.nav.lon, WAYPOINTS[0].lat, WAYPOINTS[0].lon);
      return distFromStart < 3 ? 'SHILSHOLE BAY' : 'PUGET SOUND';
    }
    if (phase === 'strait') return 'STRAIT OF JUAN DE FUCA';
    if (phase === 'coastal' || phase === 'offshore') return 'NORTH PACIFIC';
    if (phase === 'tropics') return 'CENTRAL NORTH PACIFIC';
    if (phase === 'approach') {
      var distToFinal = distanceBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
      if (distToFinal < 5) return 'NAWILIWILI';
      if (distToFinal < 60) return 'KAUA\u02BBI';
      return 'HAWAIIAN WATERS';
    }
    return 'NORTH PACIFIC';
  }

  // Day 1 is the calendar date the voyage departed on; Day 2 begins at
  // the following local midnight, not 24 elapsed hours after departure
  // (a 4pm departure should read DAY 2 at midnight that same night, a
  // few hours in, not at 4pm the next day).
  function voyageDayNumber(state) {
    var departure = new Date(state.meta.departedAt);
    var current = new Date(state.meta.departedAt + state.meta.voyageMinutes * 60000);
    var departureMidnight = new Date(departure.getFullYear(), departure.getMonth(), departure.getDate());
    var currentMidnight = new Date(current.getFullYear(), current.getMonth(), current.getDate());
    var daysSince = Math.round((currentMidnight - departureMidnight) / 86400000);
    return daysSince + 1;
  }

  function updateNavStrip(state) {
    if (!state || state.departure.stageIndex < DEPARTURE_STEPS.length) {
      navStripEl.hidden = true;
      return;
    }
    navStripEl.hidden = false;
    var day = voyageDayNumber(state);
    var speed = computeBoatSpeed(state, state.nav.heading);
    navDayEl.textContent = 'DAY ' + day;
    navSpeedEl.textContent = speed.toFixed(1) + ' KT';
    navHeadingEl.textContent = Math.round(state.nav.heading) + '\u00B0';
    navRegionEl.textContent = regionName(state);
  }

  function compassPoint(deg) {
    var pts = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return pts[Math.round(normalizeDeg(deg) / 22.5) % 16];
  }

  // LABEL column padded to a fixed width so every instrument line in
  // WEATHER lines up — this only works because the font is monospace;
  // manual space-padding would NOT align in a proportional font.
  function instrumentLine(label, value) {
    return label.padEnd(14) + value;
  }

  var SEA_STATE_SHORT_LABELS = ['CALM', 'SLIGHT', 'LIGHT', 'MODERATE', 'ROUGH', 'VERY ROUGH', 'HIGH'];
  function seaStateShortLabel(n) {
    return SEA_STATE_SHORT_LABELS[clamp(n, 0, 6)];
  }

  // Representative wave height in feet per sea-state tier, for the
  // compact SEAS line in WEATHER. Tied to the SAME w.seaState tier that
  // already drives the descriptive label above (and boat speed, fatigue,
  // etc. elsewhere) so the two always correspond — deriving this from a
  // separate real-world wave data source risked the label and the
  // height disagreeing with each other, or with what the simulation is
  // actually doing to the boat.
  var SEA_STATE_WAVE_HEIGHT_FT = [1, 2, 3, 4, 8, 10, 12];
  function seaStateWaveHeightFt(n) {
    return SEA_STATE_WAVE_HEIGHT_FT[clamp(n, 0, 6)];
  }

  function describeLevel(value, tiers) {
    for (var i = 0; i < tiers.length; i++) {
      if (value <= tiers[i].max) return tiers[i].text;
    }
    return tiers[tiers.length - 1].text;
  }

  function fatiguePhrase(v) {
    return describeLevel(v, [
      { max: 20, text: "Fresh. Alert." },
      { max: 40, text: "Tired, but steady." },
      { max: 60, text: "Heavy. Simple tasks take longer than they should." },
      { max: 80, text: "Severe. Concentration is becoming difficult." },
      { max: 100, text: "Exhausted. You shouldn't be making decisions right now." },
    ]);
  }

  // Five-level MORALE, the only face this state shows the player (the
  // underlying 0-100 crew.morale stays hidden, same as fatigue/hunger/
  // thirst always have).
  function moraleLevel(v) {
    return describeLevel(v, [
      { max: 19, text: 'DEPLETED' },
      { max: 39, text: 'LOW' },
      { max: 59, text: 'CONTENT' },
      { max: 79, text: 'GOOD' },
      { max: 100, text: 'UPBEAT' },
    ]);
  }

  function countPhrase(n, criticalMax, lowMax) {
    return describeLevel(n, [
      { max: criticalMax, text: "nearly gone — this needs attention" },
      { max: lowMax, text: "running low" },
      { max: 999, text: "adequate" },
    ]);
  }

  function describeSeaState(n) {
    var labels = [
      "Flat calm.", "Slight ripple.", "Small waves, some whitecaps.",
      "Moderate seas, frequent whitecaps.", "Rough. Spray coming aboard.",
      "Very rough. Heavy going.", "High seas.",
    ];
    return labels[clamp(n, 0, 6)];
  }

  function formatLatLon(lat, lon) {
    var latDeg = Math.floor(Math.abs(lat));
    var latMin = (Math.abs(lat) - latDeg) * 60;
    var lonDeg = Math.floor(Math.abs(lon));
    var lonMin = (Math.abs(lon) - lonDeg) * 60;
    var ns = lat >= 0 ? 'N' : 'S';
    var ew = lon >= 0 ? 'E' : 'W';
    return latDeg + '\u00B0 ' + latMin.toFixed(1) + "' " + ns + ', ' + lonDeg + '\u00B0 ' + lonMin.toFixed(1) + "' " + ew;
  }

  function currentLatLon(state) {
    // The stored lat/lon IS the position — this just adds display-only
    // uncertainty when the electrical system can't be trusted for a fix.
    // It never feeds back into the real, saved position.
    var lat = state.nav.lat, lon = state.nav.lon;
    if (state.nav.positionConfidence === 'uncertain') {
      lat += (Math.random() - 0.5) * 0.4;
      lon += (Math.random() - 0.5) * 0.4;
    }
    return { lat: lat, lon: lon };
  }

  function describeGap(minutes) {
    if (minutes < 90) return Math.round(minutes) + ' minutes';
    var hours = minutes / 60;
    if (hours < 48) return hours.toFixed(1) + ' hours';
    return (hours / 24).toFixed(1) + ' days';
  }

  function sailConfigLabel(cfg) {
    return { full: 'full sail', reefed: 'reefed', minimal: 'minimal canvas', furled: 'furled' }[cfg] || cfg;
  }

  // All four states, each named plainly for what it is rather than as a
  // move relative to wherever the boat happens to be now — with FURLED in
  // the mix, "reduce to reefed" stops making sense if you're coming FROM
  // furled (that would be an increase, not a reduction). The current
  // configuration is left off the list (it's already shown above this in
  // cmdSails) rather than offered as a do-nothing button.
  function sailOptions(state) {
    var cfg = state.boat.sailConfig;
    var configs = [
      { key: 'full', label: 'FULL', action: 'sail-full' },
      { key: 'reefed', label: 'REEFED', action: 'sail-reefed' },
      { key: 'minimal', label: 'MINIMAL', action: 'sail-minimal' },
      { key: 'furled', label: 'FURLED', action: 'sail-furled' },
    ];
    var opts = configs.filter(function (c) { return c.key !== cfg; })
      .map(function (c) { return { label: c.label, action: c.action }; });
    opts.push({ label: 'BACK', action: 'cancel' });
    return opts;
  }

  /* ============================================================
     8. COMMANDS
     ============================================================ */
  // Space-padded columns, not inventoryLine's dot-fill — STATUS and
  // ELECTRICAL PANEL read as a short instrument panel, not a supply list.
  function statusLine(label, value) {
    return label + ' '.repeat(Math.max(2, 12 - label.length)) + value;
  }

  // The DISPLAYED/perceived condition — COLD/COMFORTABLE/HOT. Distinct
  // from the raw cabinTemperatureF number, which always stays visible
  // and accurate (see formatCabinTemp): a running fan can make an
  // otherwise-HOT cabin (up to CABIN_TEMP_FAN_RESCUE_MAX_F) read as
  // COMFORTABLE without the actual temperature having caught up yet —
  // see syncCabinTemperature for that gradual physical effect. The
  // heater has no equivalent trick: it only ever works by actually
  // raising the real temperature, so COLD never gets a similar rescue.
  function cabinConditionLabel(tempF, fanOn) {
    if (tempF == null) return 'COMFORTABLE';
    if (tempF < CABIN_TEMP_COLD_MAX_F) return 'COLD';
    if (tempF > CABIN_TEMP_HOT_MIN_F) {
      if (fanOn && tempF <= CABIN_TEMP_FAN_RESCUE_MAX_F) return 'COMFORTABLE';
      return 'HOT';
    }
    return 'COMFORTABLE';
  }

  function formatCabinTemp(tempF, fanOn) {
    if (tempF == null) return 'COMFORTABLE';
    return Math.round(tempF) + '\u00B0F ' + cabinConditionLabel(tempF, fanOn);
  }

  function cmdStatus(state) {
    var b = state.boat, c = state.crew;
    printBlank();
    printLine('STATUS', 'heading-label');
    printBlank();
    printLine(statusLine('HUNGER', HUNGER_LABELS[hungerLevel(c.hoursSinceMeal)]));
    printLine(statusLine('THIRST', THIRST_LABELS[thirstLevel(c.hoursSinceWater)]));
    printLine(statusLine('ENERGY', ENERGY_LABELS[energyLevel(c.fatigue)]));
    printLine(statusLine('MORALE', moraleLevel(c.morale)));
    printBlank();
    printLine(statusLine('CABIN TEMP', formatCabinTemp(b.cabinTemperatureF, b.fanOn)));
    printLine(statusLine('BATTERY', Math.round(b.battery) + '%'));
    printBlank();
    printLine(statusLine('SAILS', b.sails));
    printLine(statusLine('STEERING', b.steering));
    printLine(statusLine('ENGINE', b.engine));
    printLine(statusLine('ELECTRICAL', b.electrical));
    state.pendingChoice = { id: 'status-view', options: [{ label: 'BACK', action: 'cancel' }] };
  }

  function cmdElectrical(state) {
    var b = state.boat;
    printBlank();
    printLine('ELECTRICAL PANEL', 'heading-label');
    printBlank();
    var batteryLabel = (b.engineOn && b.battery < 100 ? 'CHARGING ' : '') + Math.round(b.battery) + '%';
    printLine(statusLine('BATTERY', batteryLabel));
    printLine(statusLine('CABIN TEMP', formatCabinTemp(b.cabinTemperatureF, b.fanOn)));
    if (b.electrical === 'DAMAGED') {
      printBlank();
      printLine('Electrical system damaged. Controls unavailable until repaired.', 'amber');
    }
    state.pendingChoice = {
      id: 'electrical-panel',
      options: [
        { label: 'CABIN LIGHTS \u2014 ' + (b.cabinLightsOn ? 'ON' : 'OFF'), action: 'electrical:cabinLights' },
        { label: 'HEATER \u2014 ' + (b.heaterOn ? 'ON' : 'OFF'), action: 'electrical:heater' },
        { label: 'FAN \u2014 ' + (b.fanOn ? 'ON' : 'OFF'), action: 'electrical:fan' },
        { label: 'AUTOPILOT \u2014 ' + (b.autopilotOn ? 'ON' : 'OFF'), action: 'electrical:autopilot' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  var ELECTRICAL_TOGGLE_FIELDS = {
    cabinLights: 'cabinLightsOn',
    heater: 'heaterOn',
    fan: 'fanOn',
    autopilot: 'autopilotOn',
  };
  // Toggles flip immediately and redraw the panel — no confirmation
  // prompt, no delay, and deliberately no permanent-log entry for the
  // routine flip itself (these can be switched often; logging every one
  // would clutter the log fast). A dead battery can't power anything
  // new on, though it can still be switched off.
  function performElectricalToggle(state, key) {
    var field = ELECTRICAL_TOGGLE_FIELDS[key];
    if (!field) return;
    var b = state.boat;
    if (!b[field] && b.electrical === 'DAMAGED') {
      printBlank();
      printLine('Electrical system damaged.', 'amber');
      cmdElectrical(state);
      return;
    }
    if (!b[field] && b.battery <= 0) {
      printBlank();
      printLine('No power.', 'amber');
      cmdElectrical(state);
      return;
    }
    b[field] = !b[field];
    cmdElectrical(state);
  }

  function cmdPosition(state) {
    var ll = currentLatLon(state);
    printBlank();
    printLine('POSITION', 'heading-label');
    printLine(formatLatLon(ll.lat, ll.lon));
    if (state.nav.positionConfidence === 'uncertain') {
      printLine('(dead reckoning — no recent fix)', 'dim');
    }
    printBlank();
    printLine('HEADING', 'heading-label');
    printLine(Math.round(state.nav.heading) + '\u00B0  (intended course ' + Math.round(state.nav.intendedCourse) + '\u00B0)');
    if (state.nav.tack) {
      printLine('BEATING TO WINDWARD \u2014 AUTO-TACK (' + state.nav.tack.toUpperCase() + ' TACK)', 'dim');
    }
    printBlank();
    printLine('PROPULSION', 'heading-label');
    printLine(propulsionLabel(propulsionState(state, state.nav.heading)));
    printBlank();
    printLine('SPEED', 'heading-label');
    // Computed fresh from current conditions rather than read back from
    // state.boat.speed, which is only ever written by simTick() and can
    // otherwise sit uninitialized (or stale) until the next full tick —
    // up to 10 real minutes after a fresh departure, showing a misleading
    // 0.0 even when the boat is actually making way.
    var liveSpeed = computeBoatSpeed(state, state.nav.heading);
    printLine(liveSpeed.toFixed(1) + ' kt');
    printBlank();
    printLine('DISTANCE', 'heading-label');
    var remaining = distanceBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
    printLine(Math.round(state.nav.distanceTraveled) + ' nm sailed \u2014 approximately ' + Math.round(remaining) + ' nm remaining');
    if (state.nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX) {
      var segStart = WAYPOINTS[Math.max(0, state.nav.waypointIndex - 1)];
      var segEnd = WAYPOINTS[state.nav.waypointIndex] || FINAL_DEST;
      var xt = crossTrackNm(state.nav.lat, state.nav.lon, segStart.lat, segStart.lon, segEnd.lat, segEnd.lon);
      if (xt > 15) {
        printLine('Off the intended track by roughly ' + Math.round(xt) + ' nm.', 'amber');
      }
    }
    state.pendingChoice = {
      id: 'position-menu',
      options: [
        { label: 'OPEN MAP', action: 'open-map' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  function cmdWeather(state) {
    var w = state.weather;
    printBlank();
    printLine('WEATHER', 'heading-label');
    printLine(instrumentLine('WIND', compassPoint(w.windDirection) + ' ' + Math.round(w.windSpeed) + ' KT'));
    printLine(instrumentLine('SEAS', seaStateShortLabel(w.seaState) + ' \u00B7 ' + seaStateWaveHeightFt(w.seaState) + ' FT'));
    printLine(instrumentLine('TEMP', Math.round(w.temperatureF) + '\u00B0F'));
    printLine(instrumentLine('SKY', w.condition.toUpperCase()));
    if (w.oceanCurrent.speedKt == null) {
      printLine(instrumentLine('CURRENT', 'NO DATA'));
    } else if (w.oceanCurrent.speedKt < 0.2) {
      printLine(instrumentLine('CURRENT', 'NEGLIGIBLE'));
    } else {
      printLine(instrumentLine('CURRENT', compassPoint(w.oceanCurrent.directionDeg) + ' ' + w.oceanCurrent.speedKt.toFixed(1) + ' KT'));
    }
    state.pendingChoice = {
      id: 'weather-menu',
      options: [
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  // Fallback trend lines when no real forecastLine is cached — two
  // lines (wind, then seas), both derived from the SAME underlying
  // state.weather.trend, matching the two-strand NEXT 12 HOURS
  // structure. real.forecastLine, when available, is already
  // summarized from actual forecast data and is used as-is instead.
  var WIND_TREND_LINES = {
    building: 'Wind expected to build further.',
    easing: 'Wind easing over the next several hours.',
    steady: 'No significant wind change expected.',
  };
  var SEA_TREND_LINES = {
    building: 'Seas building to match.',
    easing: 'Seas gradually subsiding.',
    steady: 'Seas holding at their present state.',
  };

  // FORECAST — what's coming, distinct from WEATHER's what's-happening-
  // now: a forward-looking trend (the real API-derived forecastLine
  // when available, otherwise the wind/sea trend lines above — either
  // way driven by actual simulation state, never hardcoded per call),
  // plus a strategically meaningful current observation when one
  // exists (see currentStrategicNote — never a recommendation, purely
  // what the data shows), then the external OPEN IN WINDY link.
  function cmdForecast(state) {
    if (state.boat.battery <= 0 || state.boat.electrical === 'DAMAGED') {
      printBlank();
      printLine('FORECAST', 'heading-label');
      printBlank();
      printLine('NO POWER', 'amber');
      state.pendingChoice = { id: 'forecast-menu', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }
    var real = state.weather.realWx;
    printBlank();
    printLine('FORECAST', 'heading-label');
    printBlank();
    printLine('NEXT 12 HOURS', 'heading-label');
    if (real && real.forecastLine) {
      printLine(real.forecastLine);
    } else {
      var trend = state.weather.trend;
      printLine(WIND_TREND_LINES[trend] || WIND_TREND_LINES.steady);
      printLine(SEA_TREND_LINES[trend] || SEA_TREND_LINES.steady);
    }
    var currentNote = currentStrategicNote(state);
    if (currentNote) {
      printBlank();
      printLine(currentNote);
    }
    state.pendingChoice = {
      id: 'forecast-menu',
      options: [
        { label: 'OPEN IN WINDY', action: 'open-in-windy' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }



  function cmdSails(state) {
    printBlank();
    printLine('SAILS', 'heading-label');
    printLine('Currently: ' + sailConfigLabel(state.boat.sailConfig) + '.');
    state.pendingChoice = { id: 'sails-choice', options: sailOptions(state) };
  }

  /* --------------------------------------------------------------
     INVENTORY
     ------------------------------------------------------------
     What is physically aboard, right now — distinct from the LOG,
     which is what has happened. Provisions/water/fuel read from the
     same state.food / state.water / state.boat.fuelGallons that EAT,
     DRINK, and the ENGINE menu already use — there is no second copy
     of any of these numbers. The remaining categories live under
     state.supplies.* alongside the existing propane count.
     -------------------------------------------------------------- */
  var SPARES_NAMES = {
    sailRepairKit: 'Sail repair kit', steeringParts: 'Steering parts', engineParts: 'Engine parts', fuses: 'Fuses',
  };

  function inventoryLine(name, valueText) {
    var dots = '.'.repeat(Math.max(2, 22 - name.length));
    return name + ' ' + dots + ' ' + valueText;
  }

  function printSuppliesCategory(state, catKey, names, originals) {
    var data = state.supplies[catKey] || {};
    var keys = Object.keys(names);
    var any = keys.some(function (k) { return data[k] > 0; });
    if (!any) {
      printLine('Nothing left in this category.', 'amber');
      return;
    }
    keys.forEach(function (k) {
      if (data[k] > 0) printLine(inventoryLine(names[k], countCurrentOriginal(data[k], originals[k])));
    });
  }

  function showInventoryCategory(state, cat) {
    if (state.crew.location === 'below' && needsCabinLight(state)) { blockedByDarkness(state); return; }
    printBlank();
    switch (cat) {
      case 'provisions':
        printLine('PROVISIONS', 'heading-label');
        var anyFood = FOOD_ITEMS.some(function (f) { return state.food[f.key] > 0; });
        if (!anyFood) {
          printLine('Nothing left aboard to eat.', 'amber');
        } else {
          FOOD_ITEMS.forEach(function (f) { if (state.food[f.key] > 0) printLine(foodItemLine(f, state.food[f.key])); });
        }
        printLine(inventoryLine('Coffee', countCurrentOriginal(state.drinks.coffee, ORIGINAL_COFFEE)));
        printLine(inventoryLine('Tea', countCurrentOriginal(state.drinks.tea, ORIGINAL_TEA)));
        break;
      case 'water':
        printLine('WATER', 'heading-label');
        printLine(inventoryLine('Water', galCurrentOriginal(state.water.gallons, WATER_STARTING_GALLONS)));
        break;
      case 'fuel':
        printLine('FUEL', 'heading-label');
        printLine(inventoryLine('Diesel', galCurrentOriginal(state.boat.fuelGallons, FUEL_STARTING_GALLONS)));
        printLine(inventoryLine('Propane', countCurrentOriginal(state.supplies.propane, ORIGINAL_PROPANE) + ' uses'));
        break;
      case 'spares':
        printLine('SPARES', 'heading-label');
        printSuppliesCategory(state, 'spares', SPARES_NAMES, ORIGINAL_SPARES);
        break;
      case 'safety':
        printLine('SAFETY', 'heading-label');
        printLine(inventoryLine('EPIRB', state.rescue.epirbOn ? 'ACTIVE' : 'READY'));
        printLine(inventoryLine('Life raft', state.crew.inLifeRaft ? 'DEPLOYED' : 'READY'));
        printLine(inventoryLine('Flares', countCurrentOriginal(state.supplies.safety.flares, ORIGINAL_FLARES)));
        break;
      default:
        printLine('Nothing there.', 'dim');
    }
    state.pendingChoice = { id: 'inventory-category', options: [{ label: 'BACK', action: 'inventory:back' }] };
  }

  function cmdInventory(state) {
    if (state.crew.location === 'below' && needsCabinLight(state)) { blockedByDarkness(state); return; }
    printBlank();
    printLine('INVENTORY', 'heading-label');
    state.pendingChoice = {
      id: 'inventory-menu',
      options: [
        { label: 'PROVISIONS', action: 'inventory:provisions' },
        { label: 'WATER', action: 'inventory:water' },
        { label: 'FUEL', action: 'inventory:fuel' },
        { label: 'SPARES', action: 'inventory:spares' },
        { label: 'SAFETY', action: 'inventory:safety' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  function rescueStatusLine(state) {
    var r = state.rescue;
    if (r.phase === 'traveling') return 'help is on the way.';
    if (r.phase === 'searching') return r.encounterActive ? 'rescuers searching nearby.' : 'search underway.';
    if (r.phase === 'rescued') return 'rescued.';
    return '';
  }

  // DISTRESS is the one place EPIRB/life-raft/flare actions live — the
  // SAFETY inventory screen only ever reports what's aboard and its
  // status, never triggers anything itself.
  function cmdDistress(state) {
    printBlank();
    printLine('DISTRESS', 'heading-label');
    var r = state.rescue;
    var opts = [];
    if (!r.epirbOn) {
      printLine('EPIRB: READY');
      opts.push({ label: 'ACTIVATE EPIRB', action: 'activate-epirb' });
    } else {
      printLine('EPIRB: ACTIVE \u2014 ' + rescueStatusLine(state));
    }
    if (!state.crew.inLifeRaft) {
      opts.push({ label: 'DEPLOY LIFE RAFT', action: 'deploy-life-raft' });
    }
    if (r.encounterActive && state.supplies.safety.flares > 0) {
      opts.push({ label: 'FIRE FLARE', action: 'fire-flare' });
    }
    opts.push({ label: 'BACK', action: 'cancel' });
    state.pendingChoice = { id: 'distress-menu', options: opts };
  }

  function cmdEngine(state) {
    printBlank();
    printLine('ENGINE', 'heading-label');
    printLine('Status: ' + (state.boat.engineOn ? 'RUNNING' : 'OFF'));
    printLine('Diesel: ' + galCurrentOriginal(state.boat.fuelGallons, FUEL_STARTING_GALLONS));
    if (!state.boat.engineOn && state.boat.engine === 'DAMAGED') {
      printLine('Engine is damaged. Repair it before starting.', 'amber');
      state.pendingChoice = { id: 'engine-choice', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }
    if (!state.boat.engineOn && state.boat.fuelGallons <= 0) {
      printLine('No diesel left to start it.', 'amber');
      state.pendingChoice = { id: 'engine-choice', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }
    var toggleOption = state.boat.engineOn
      ? { label: 'STOP ENGINE', action: 'engine-stop' }
      : { label: 'START ENGINE', action: 'engine-start' };
    state.pendingChoice = { id: 'engine-choice', options: [toggleOption, { label: 'BACK', action: 'cancel' }] };
  }

  function cmdCourse(state) {
    var nav = state.nav;
    printBlank();
    printLine('COURSE', 'heading-label');

    if (nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX) {
      // COASTAL: fully automatic. SET COURSE is the current leg's
      // bearing (auto-updates as the boat clears each waypoint);
      // ACTUAL HEADING reflects whatever the coastal auto-tack is doing
      // right now, which can differ from it. No manual control here —
      // the corridor is authored-safe and the player isn't required to
      // navigate it. Bearing/distance are computed fresh here rather
      // than read from nav.intendedCourse, which only updates once per
      // simTick and can be a stale tick behind when just viewed.
      var wp = WAYPOINTS[nav.waypointIndex] || FINAL_DEST;
      printLine('SET COURSE ' + Math.round(bearingBetween(nav.lat, nav.lon, wp.lat, wp.lon)) + '\u00B0');
      printLine('ACTUAL HEADING ' + Math.round(nav.heading) + '\u00B0');
      if (nav.tack) {
        printLine('BEATING TO WINDWARD \u2014 AUTO-TACK (' + nav.tack.toUpperCase() + ' TACK)', 'dim');
      }
      printLine('NEXT ' + wp.name);
      printLine('DISTANCE ' + Math.round(distanceBetween(nav.lat, nav.lon, wp.lat, wp.lon)).toLocaleString() + ' NM');
      printBlank();
      printLine('Automatic through the coastal passage \u2014 course control unlocks in open water.', 'dim');
      state.pendingChoice = { id: 'course-menu', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }

    // OPEN OCEAN: full manual course control, automatic steering. Bearing/
    // distance to Nāwiliwili computed fresh for the same reason as above —
    // this must reflect the boat's actual current position the instant
    // the screen is viewed, e.g. right after SET FOR NĀWILIWILI, not
    // whatever nav.intendedCourse happened to hold as of the last tick.
    var liveBearingToDest = bearingBetween(nav.lat, nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
    printLine('SET COURSE ' + Math.round(nav.setCourse) + '\u00B0');
    printLine('ACTUAL HEADING ' + Math.round(nav.heading) + '\u00B0');
    if (nav.tack) {
      printLine('BEATING TO WINDWARD \u2014 AUTO-TACK (' + nav.tack.toUpperCase() + ' TACK)', 'dim');
    }
    printLine('BEARING TO N\u0100WILIWILI ' + Math.round(liveBearingToDest) + '\u00B0');
    printLine('DISTANCE TO N\u0100WILIWILI ' + Math.round(distanceBetween(nav.lat, nav.lon, FINAL_DEST.lat, FINAL_DEST.lon)).toLocaleString() + ' NM');
    if (nav.landWarningLevel !== 'none') {
      printBlank();
      printLine(LAND_WARNING_TEXT[nav.landWarningLevel], 'amber');
    }
    if (state.boat.steering === 'DAMAGED') {
      printBlank();
      printLine('Steering is damaged. Course cannot be changed until it\u2019s repaired.', 'amber');
      state.pendingChoice = { id: 'course-menu', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }
    state.pendingChoice = {
      id: 'course-menu',
      options: [
        { label: 'CHANGE COURSE', action: 'cmd:change-course' },
        { label: 'SET FOR N\u0100WILIWILI', action: 'set-for-nawiliwili' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  var COURSE_DIAL_STEPS = [-10, -1, 1, 10];

  // The player's way of picking any of 000-359 through a button-only
  // interface: dial a draft value up or down from the current course,
  // then confirm. Only ever reachable once open ocean unlocks it (the
  // COURSE screen doesn't offer CHANGE COURSE before then).
  function cmdChangeCourse(state) {
    var nav = state.nav;
    if (state.boat.steering === 'DAMAGED') { cmdCourse(state); return; } // shouldn't be reachable — button isn't shown otherwise
    if (nav.courseDraft == null) nav.courseDraft = Math.round(nav.setCourse);
    printBlank();
    printLine('CHANGE COURSE', 'heading-label');
    printLine('CURRENT COURSE ' + Math.round(nav.setCourse) + '\u00B0');
    printLine('NEW COURSE ' + nav.courseDraft + '\u00B0');
    var opts = COURSE_DIAL_STEPS.map(function (step) {
      return { label: (step > 0 ? '+' : '') + step + '\u00B0', action: 'course-draft:' + step };
    });
    opts.push({ label: 'SET ' + nav.courseDraft + '\u00B0', action: 'course-draft-confirm' });
    opts.push({ label: 'BACK', action: 'course-draft-cancel' });
    state.pendingChoice = { id: 'change-course-menu', options: opts };
  }

  function cmdSleep(state) {
    if (state.crew.watchState !== 'awake') return; // shouldn't be reachable — button isn't shown otherwise
    state.crew.watchState = 'trying';
    state.crew.sleepAttemptStartedAt = state.meta.voyageMinutes;
    state.pendingChoice = null; // otherwise the WELLBEING menu that led here keeps winning in getContextualOptions, and GET UP never actually appears
    clearTempView(); // otherwise printEcho's "> SLEEP" (from the button that led here) sits there redundantly for the whole sleep session
    log(state, tryingToSleepNarrative());
    flushNewLogEntries(state);
  }

  function cmdWellbeing(state) {
    printBlank();
    printLine('WELLBEING', 'heading-label');
    printLine('Taking care of yourself.', 'dim');
    // The menu itself never hides options based on darkness — EAT,
    // READ, WASH, and CHANGE stay visible and clickable at night with
    // the lights off. Each of those already checks needsCabinLight at
    // its own top and shows TOO DARK TO SEE. via blockedByDarkness (the
    // same function CHORES uses) rather than performing the action, so
    // the player discovers the restriction by trying the thing rather
    // than never seeing it offered.
    state.pendingChoice = {
      id: 'wellbeing-menu',
      options: [
        { label: 'EAT', action: 'cmd:eat' },
        { label: 'DRINK', action: 'cmd:drink' },
        { label: 'SLEEP', action: 'cmd:sleep' },
        { label: 'READ', action: 'cmd:bookshelf' },
        { label: 'LISTEN', action: 'cmd:tape-player' },
        { label: 'WASH', action: 'cmd:wash' },
        { label: 'CHANGE', action: 'cmd:dress' },
        { label: 'BACK', action: 'cancel' },
      ],
    };
  }

  // Short, restrained variants per chore so the same line doesn't repeat
  // constantly — picked at random each time; small pools are plenty for
  // something this incidental.
  var CHORE_LINES = {
    dishes: [
      'Washed the bowl and left it upside down to dry. Rain against the cabin roof.',
      'Rinsed the dishes and stowed them. Small thing, but it helps.',
      'Dishes done. The galley looks like itself again.',
    ],
    dryClothes: [
      'Hung everything near the companionway. It smells like wet canvas in here.',
      'Wrung out the oilskins and draped them to dry.',
      'Strung a line below and hung the wet gear along it.',
    ],
    tools: [
      'Stowed the tools back in their places.',
      'Wiped down the tools and put them away.',
      'Cleared the tools off the settee. The cabin feels less like a workshop.',
    ],
    bunk: [
      'Pulled the bunk back together.',
      'Straightened the berth and folded the blanket.',
      'Made the bunk. Small order in a small space.',
    ],
    air: [
      'Cracked the hatch and let the cabin breathe for a while.',
      'Aired the cabin out. The dampness lifts, a little.',
      'Opened things up below. Fresher air, finally.',
    ],
    tidy: [
      'Put everything back where it belongs.\nThe cabin feels bigger somehow.',
      'Cleared the clutter off the settee and stowed it properly.',
      'A few minutes of tidying. Everything has a place again.',
    ],
  };
  function pickChoreLine(kind) {
    var pool = CHORE_LINES[kind];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // One definition per chore: what clears it, what (if anything) gates
  // or consumes on top of that, and the small diminishing-returns
  // morale nudge for actually doing it — same shape as WASH/DISHES
  // always used. Never a big number; this is atmosphere, not a lever.
  var CHORE_DEFS = {
    dishes: {
      label: 'CLEANING UP', duration: 3, moraleKey: 'dishes', moraleGain: 3,
      canDo: function (s) { return hasEnoughWater(s, WATER_DISHES_GAL); },
      consume: function (s) { consumeWater(s, WATER_DISHES_GAL); },
      clear: function (s) { s.crew.dishesDirtySinceMinutes = null; },
    },
    dryClothes: {
      label: 'DRYING GEAR', duration: 3, moraleKey: 'dryClothes', moraleGain: 3,
      clear: function (s) { s.crew.clothesWetSinceMinutes = null; },
    },
    tools: {
      label: 'STOWING TOOLS', duration: 2, moraleKey: 'tools', moraleGain: 2,
      clear: function (s) { s.crew.toolsOutSinceMinutes = null; },
    },
    bunk: {
      label: 'MAKING BUNK', duration: 2, moraleKey: 'bunk', moraleGain: 2,
      clear: function (s) { s.crew.bunkUnmadeSinceMinutes = null; },
    },
    air: {
      label: 'AIRING CABIN', duration: 3, moraleKey: 'air', moraleGain: 3,
      clear: function (s) { s.crew.cabinStuffySinceMinutes = null; s.crew.dampCabinHours = 0; },
    },
    tidy: {
      label: 'TIDYING UP', duration: 3, moraleKey: 'tidy', moraleGain: 3,
      clear: function (s) { s.crew.clutterCount = 0; s.crew.clutterSinceMinutes = null; },
    },
  };
  var CHORE_LABELS = {
    dishes: 'DO DISHES', dryClothes: 'DRY CLOTHES', tools: 'PUT AWAY TOOLS',
    bunk: 'MAKE BUNK', air: 'AIR OUT CABIN', tidy: 'TIDY UP',
  };

  // What's actually available right now, oldest-pending first, capped at
  // 3 so the player is never confronted with a checklist — a quiet boat
  // usually has 0-1 of these true at once.
  function buildChoreOptions(state) {
    var c = state.crew;
    var candidates = [];
    if (c.dishesDirtySinceMinutes != null) candidates.push({ kind: 'dishes', since: c.dishesDirtySinceMinutes });
    if (c.clothesWetSinceMinutes != null) candidates.push({ kind: 'dryClothes', since: c.clothesWetSinceMinutes });
    if (c.toolsOutSinceMinutes != null) candidates.push({ kind: 'tools', since: c.toolsOutSinceMinutes });
    if (c.bunkUnmadeSinceMinutes != null) candidates.push({ kind: 'bunk', since: c.bunkUnmadeSinceMinutes });
    if (c.cabinStuffySinceMinutes != null) candidates.push({ kind: 'air', since: c.cabinStuffySinceMinutes });
    if (c.clutterCount >= CLUTTER_TIDY_THRESHOLD) candidates.push({ kind: 'tidy', since: c.clutterSinceMinutes || 0 });
    candidates.sort(function (a, b) { return a.since - b.since; });
    return candidates.slice(0, 3).map(function (item) {
      return { label: CHORE_LABELS[item.kind], action: 'chore:' + item.kind };
    });
  }

  function cmdChore(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state); return; }
    printBlank();
    printLine('CHORES', 'heading-label');
    var options = buildChoreOptions(state);
    if (options.length === 0) {
      printLine('Nothing needs doing right now.', 'dim');
      state.pendingChoice = { id: 'chore-menu', options: [{ label: 'BACK', action: 'cancel' }] };
      return;
    }
    state.pendingChoice = { id: 'chore-menu', options: options.concat([{ label: 'BACK', action: 'cancel' }]) };
  }

  function performChore(state, kind) {
    var def = CHORE_DEFS[kind];
    if (!def) return;
    if (def.canDo && !def.canDo(state)) {
      printBlank();
      printLine('Not enough water.', 'amber');
      return;
    }
    runShortAction(state, {
      label: def.label,
      duration: def.duration,
      action: function (s) {
        if (def.consume) def.consume(s);
        def.clear(s);
        var gain = routineMoraleGain(s, def.moraleKey, def.moraleGain);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        log(s, pickChoreLine(kind));
        flushNewLogEntries(s);
      },
    });
  }

  // Small, quiet morale nudges for the four new routine activities. Full
  // value if it's genuinely been a while; doing the same thing again
  // soon after helps much less — these are small comforts, not a lever
  // to pull repeatedly for morale. crew.lastRoutineAt tracks each one
  // independently (not persisted anywhere the player can see).
  function routineMoraleGain(state, key, fullGain) {
    var last = state.crew.lastRoutineAt[key];
    var hoursSince = last == null ? 999 : (state.meta.voyageMinutes - last) / 60;
    state.crew.lastRoutineAt[key] = state.meta.voyageMinutes;
    if (hoursSince >= 6) return fullGain;
    if (hoursSince >= 2) return Math.round(fullGain * 0.4);
    return Math.max(1, Math.round(fullGain * 0.15));
  }

  function cmdWash(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:wellbeing'); return; }
    if (!hasEnoughWater(state, WATER_WASH_GAL)) {
      printBlank();
      printLine('Not enough water.', 'amber');
      return;
    }
    runShortAction(state, {
      label: 'WASHING UP',
      duration: 3,
      action: function (s) {
        consumeWater(s, WATER_WASH_GAL);
        var gain = routineMoraleGain(s, 'wash', 4);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        log(s, 'A wash-up with fresh water. Small thing, helps anyway.');
        flushNewLogEntries(s);
      },
    });
  }

  function cmdDress(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:wellbeing'); return; }
    runShortAction(state, {
      label: 'CHANGING',
      duration: 2,
      action: function (s) {
        var gain = routineMoraleGain(s, 'dress', 3);
        s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
        log(s, 'Dry layers on. Feels like a fresh start to the watch.');
        flushNewLogEntries(s);
      },
    });

  function bookProgressPct(bookDef, bookState) {
    return clamp(Math.round((bookState.minutesRead / bookDef.requiredMinutes) * 100), 0, 100);
  }
  function formatBookProgress(bookDef, bookState) {
    if (bookState.completed) return 'READ';
    return bookProgressPct(bookDef, bookState) + '%';
  }

  function buildBookshelfOptions(state) {
    var opts = BOOKS.map(function (b) {
      var bs = state.books[b.id];
      return { label: b.title.toUpperCase() + ' \u2014 ' + formatBookProgress(b, bs), action: 'start-reading:' + b.id };
    });
    opts.push({ label: 'BACK', action: 'cmd:wellbeing' });
    return opts;
  }

  function cmdBookshelf(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:wellbeing'); return; }
    printBlank();
    printLine('BOOKSHELF', 'heading-label');
    state.pendingChoice = { id: 'bookshelf-menu', options: buildBookshelfOptions(state) };
  }

  // Begins the continuous activity: crew.readingBookId marks it active,
  // and syncReadingProgress (called every advanceSimulation, live or
  // offline catch-up alike) does the actual accumulating. The screen
  // itself just shows the quiet "settled in" dots and STOP READING —
  // nothing here needs repeated clicking.
  function performStartReading(state, bookId) {
    var bookDef = BOOKS_BY_ID[bookId];
    if (!bookDef) return;
    var bookState = state.books[bookId];
    if (bookState.completed) { cmdBookshelf(state); return; } // no rereading system yet -- just stay on the shelf
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:wellbeing'); return; } // defensive -- darkness could fall between opening the shelf and picking a book
    state.crew.readingBookId = bookId;
    state.crew.readingLastSyncedAt = currentGameMinutes(state); // starts the continuous clock fresh — nothing before this moment counts toward this session
    bumpClutter(state, 1); // the book itself, left out
    log(state, 'You open ' + bookDef.title + '.');
    flushNewLogEntries(state);
    state.pendingChoice = { id: 'reading', options: [{ label: 'STOP READING', action: 'stop-reading' }] };
  }

  function performStopReading(state) {
    if (state.crew.readingBookId == null) { cmdWellbeing(state); return; } // defensive -- shouldn't be reachable otherwise
    syncReadingProgress(state); // commit the final partial interval since the last sync before stopping, so it's never lost
    if (state.crew.readingBookId == null) { flushNewLogEntries(state); return; } // the sync itself already ended the session (completion or darkness) and set up its own next screen -- don't double-handle it
    state.crew.readingBookId = null;
    log(state, 'You close the book.');
    flushNewLogEntries(state);
    cmdBookshelf(state);
  }

  // TAPE PLAYER — mirrors cmdBookshelf/buildBookshelfOptions in
  // presentation, but unlike READ this is never an exclusive activity:
  // selecting a tape here only ever starts/stops/changes the
  // persistent tape-player object (see section 6); it never sets up a
  // continuous "session" pendingChoice the way performStartReading
  // does, and the player is free to leave this screen immediately
  // while the tape keeps playing.
  function buildTapePlayerOptions(state) {
    var opts = [];
    if (activeTapeTitle != null) {
      opts.push({ label: 'STOP TAPE', action: 'stop-tape' });
    }
    TAPES.forEach(function (t) {
      if (t.title === activeTapeTitle) return; // don't re-list the one already playing
      opts.push({ label: t.title.toUpperCase(), action: 'start-tape:' + t.title });
    });
    opts.push({ label: 'BACK', action: 'cmd:wellbeing' });
    return opts;
  }

  function cmdTapePlayer(state) {
    printBlank();
    printLine('TAPE PLAYER', 'heading-label');
    if (activeTapeTitle != null) {
      printBlank();
      printLine(activeTapeTitle.toUpperCase() + ' \u2014 PLAYING', 'dim');
    }
    state.pendingChoice = { id: 'tape-player-menu', options: buildTapePlayerOptions(state) };
  }

  function performStartTape(state, title) {
    var tape = TAPES_BY_TITLE[title];
    if (!tape) { cmdTapePlayer(state); return; } // defensive
    if (activeTapeTitle != null) {
      // Changing tapes: stop the current one, play the mechanical
      // cassette-stop sound, and queue the new tape to start the
      // moment that sound actually finishes -- never overlapping.
      stopCurrentTapeTrackImmediately();
      pendingNextTapeTitle = tape.title;
      pendingNextTapePath = tape.path;
      playTapeOffSound();
    } else {
      startTapeTrack(tape.title, tape.path);
    }
    cmdTapePlayer(state);
  }

  function performStopTape(state) {
    stopCurrentTapeTrackImmediately();
    pendingNextTapeTitle = null; // an explicit stop cancels any change-in-progress too
    pendingNextTapePath = null;
    playTapeOffSound();
    cmdTapePlayer(state);
  }

  // The continuous reading engine. Progress, milestones, morale, and
  // both kinds of stop (completion, darkness) all live here so the old
  // one-shot logic never has to be duplicated per book. Unlike the old
  // per-tick version, this reacts to actual elapsed game time via its
  // own readingLastSyncedAt timestamp rather than a fixed TICK_MINUTES
  // step, so it doesn't wait for a full simTick to catch up. Called
  // once per advanceSimulation — never also from simTick — so elapsed
  // time is never double-counted.
  // KEPT as its own system even now that TICK_MINUTES=1, same reasoning
  // as syncCabinTemperature above: it never reads TICK_MINUTES, only
  // currentGameMinutes(), so it was already resolution-independent, and
  // it still earns its keep — STOP READING commits an exact sub-minute
  // partial interval rather than losing up to a minute of it, and a
  // milestone/completion is detected the moment it's crossed rather
  // than waiting for the next full tick.
  function syncReadingProgress(state) {
    var c = state.crew;
    if (c.readingBookId == null) return;

    var bookDef = BOOKS_BY_ID[c.readingBookId];
    var bookState = state.books[c.readingBookId];
    if (!bookDef || !bookState) { c.readingBookId = null; state.pendingChoice = null; return; } // defensive

    // Commit whatever time has genuinely elapsed FIRST, before checking
    // for anything that might end the session below -- otherwise a
    // session-ending interruption (darkness, something else taking over
    // the screen) would silently discard reading time that already
    // happened before it was detected, which is exactly the kind of
    // lost-progress bug this continuous system exists to prevent.
    var now = currentGameMinutes(state);
    if (c.readingLastSyncedAt == null) c.readingLastSyncedAt = now;
    var elapsed = now - c.readingLastSyncedAt;
    c.readingLastSyncedAt = now;
    if (elapsed > 0) {
      bookState.minutesRead += elapsed;
      var completing = bookState.minutesRead >= bookDef.requiredMinutes;
      if (completing) bookState.minutesRead = bookDef.requiredMinutes;
      var pct = bookProgressPct(bookDef, bookState);

      // Trigger every newly-crossed milestone, oldest first -- a large
      // offline jump can cross several at once.
      bookDef.milestones.forEach(function (m) {
        if (pct >= m.pct && bookState.triggeredMilestones.indexOf(m.pct) === -1) {
          bookState.triggeredMilestones.push(m.pct);
          log(state, m.text);
        }
      });

      c.readingMoraleAccumMinutes += elapsed;
      if (c.readingMoraleAccumMinutes >= READ_MORALE_CHUNK_MINUTES) {
        c.readingMoraleAccumMinutes -= READ_MORALE_CHUNK_MINUTES;
        var gain = routineMoraleGain(state, 'read', READ_MORALE_CHUNK_GAIN);
        c.morale = clamp(c.morale + gain, 0, 100);
      }

      if (completing) {
        bookState.completed = true;
        c.readingBookId = null;
        state.pendingChoice = { id: 'bookshelf-menu', options: buildBookshelfOptions(state) };
        return; // session already ended by completion -- no need to also check the interruption conditions below
      }
    }

    // Something else already took over the screen (an aft-locker prompt
    // and the like) -- reading quietly stops rather than fighting for
    // the UI; the interrupting event's own message already explains
    // what happened.
    if (state.pendingChoice && state.pendingChoice.id !== 'reading') {
      c.readingBookId = null;
      return;
    }

    // Darkness falling mid-session stops reading outright. Progress up
    // to this point is already committed above; lights are never
    // auto-turned-on and the player is never auto-navigated to the
    // electrical panel.
    if (c.location === 'below' && needsCabinLight(state)) {
      c.readingBookId = null;
      state.pendingChoice = null;
      log(state, 'Too dark to keep reading.');
      return;
    }
  }

  function foodItemLine(item, servings) {
    var dots = '.'.repeat(Math.max(2, 22 - item.name.length));
    return item.name + ' ' + dots + ' ' + countCurrentOriginal(servings, item.original) + ' servings';
  }

  function buildEatOptions(state) {
    var opts = FOOD_ITEMS.filter(function (f) { return state.food[f.key] > 0; })
      .map(function (f) { return { label: f.name.toUpperCase() + ' (' + countCurrentOriginal(state.food[f.key], f.original) + ')', action: 'eat:' + f.key }; });
    opts.push({ label: 'NEVER MIND', action: 'cancel' });
    return opts;
  }

  function cmdEat(state) {
    if (needsCabinLight(state)) { blockedByDarkness(state, 'cmd:wellbeing'); return; }
    printBlank();
    printLine('PROVISIONS', 'heading-label');
    var any = FOOD_ITEMS.some(function (f) { return state.food[f.key] > 0; });
    if (!any) {
      printLine('Nothing left aboard to eat.', 'amber');
      return;
    }
    state.pendingChoice = { id: 'eat-choice', options: buildEatOptions(state) };
  }

  function eatFlavorLine(state, item) {
    var rough = state.weather.seaState >= 4;
    var verb = item.cooked ? 'You make' : 'You eat';
    var where = rough ? 'below, braced against the motion' : (item.cooked ? 'in the galley' : 'in the cockpit');
    return verb + ' ' + item.name.toLowerCase() + ' ' + where + '.';
  }

  // How much hunger-relief TIME each meal category buys, applied as the
  // value hoursSinceMeal resets to (often negative — "buys a few extra
  // hours before hunger starts building again") rather than always
  // snapping to a flat zero. Chocolate isn't listed: it never touches
  // hoursSinceMeal at all.
  var HUNGER_RESET_OFFSET_HOURS = { substantial: -3, roughWeather: -1, quick: 0, fresh: -1 };

  // Comfort, not sustenance — no prep, no seastate/propane/water gates,
  // no hunger/thirst/energy effect at all. A small, temporary morale
  // lift with the same diminishing-returns shape as routineMoraleGain,
  // keyed off lastChocolateAt so several pieces eaten back to back don't
  // each land a full comfort bump.
  function chocolateMoraleGain(state) {
    var last = state.crew.lastChocolateAt;
    var hoursSince = last == null ? 999 : (state.meta.voyageMinutes - last) / 60;
    var fullGain = 7;
    if (hoursSince >= 12) return fullGain;
    if (hoursSince >= 3) return Math.round(fullGain * 0.4);
    return Math.max(1, Math.round(fullGain * 0.15));
  }
  function eatChocolateLine(state) {
    if (state.food.chocolate === 0) return 'You eat the last of the chocolate, and sit for a while.';
    var lines = ['You eat some chocolate.', 'A square of chocolate. Small, but it helps.'];
    return lines[Math.floor(Math.random() * lines.length)];
  }

  function performEat(state, key) {
    var item = FOOD_ITEMS_BY_KEY[key];
    if (!item || state.food[key] <= 0) {
      printBlank();
      printLine("That's already gone.", 'dim');
      return;
    }

    if (item.category === 'chocolate') {
      runShortAction(state, {
        label: 'EATING CHOCOLATE',
        duration: 2,
        action: function (s) {
          s.food[key] -= 1;
          var gain = chocolateMoraleGain(s);
          s.crew.morale = clamp(s.crew.morale + gain, 0, 100);
          s.crew.lastChocolateAt = s.meta.voyageMinutes;
          log(s, eatChocolateLine(s));
          flushNewLogEntries(s);
        },
      });
      return;
    }

    if (item.cooked) {
      if (state.weather.seaState >= 5) {
        printBlank();
        printLine('THE BOAT IS MOVING TOO VIOLENTLY', 'amber');
        printLine('TO COOK SAFELY.', 'amber');
        state.pendingChoice = { id: 'eat-choice', options: buildEatOptions(state) };
        return;
      }
      if (state.supplies.propane <= 0) {
        printBlank();
        printLine('Out of propane. Nothing left to cook with.', 'amber');
        state.pendingChoice = { id: 'eat-choice', options: buildEatOptions(state) };
        return;
      }
    }
    // Cooking water: only oatmeal/rice/pasta carry a per-serving cost
    // (item.waterGal); everything else draws 0 and this check is simply
    // skipped for them.
    var waterNeeded = item.waterGal || 0;
    if (waterNeeded > 0 && !hasEnoughWater(state, waterNeeded)) {
      printBlank();
      printLine('Not enough water.', 'amber');
      state.pendingChoice = { id: 'eat-choice', options: buildEatOptions(state) };
      return;
    }
    // Gates passed (or there weren't any) — the actual preparing/eating
    // takes a few real seconds. Cooking takes longer than grabbing
    // something ready to eat.
    var label = (item.cooked ? 'MAKING ' : 'PREPARING ') + item.name.toUpperCase();
    runShortAction(state, {
      label: label,
      duration: item.cooked ? 5 : 2,
      action: function (s) {
        var c = s.crew;
        if (item.cooked) {
          s.supplies.propane = clamp(s.supplies.propane - 1, 0, 999);
        }
        if (waterNeeded > 0) consumeWater(s, waterNeeded);
        s.food[key] -= 1;

        // Hunger: a real meal genuinely holds longer than a handful of
        // nuts, so this resets to a category-dependent offset rather
        // than always snapping to a flat zero.
        c.hoursSinceMeal = HUNGER_RESET_OFFSET_HOURS[item.category] || 0;

        // Meal-history monotony (hidden, never shown): an exponential
        // moving average nudged toward 1 by a snack, toward 0 by
        // something substantial or fresh. One item barely moves it;
        // several days the same way clearly does — see
        // computeMoraleTarget's snackMealRatio pressure.
        var snackWeight = (item.category === 'quick') ? 1 : (item.category === 'substantial' || item.category === 'fresh') ? 0 : 0.5;
        c.snackMealRatio = c.snackMealRatio * 0.7 + snackWeight * 0.3;

        // A cooked meal leaves dishes behind — stamped once, not
        // re-stamped by a second meal before they're washed, so the
        // clock reflects how long they've ACTUALLY been sitting.
        if (item.cooked && c.dishesDirtySinceMinutes == null) {
          c.dishesDirtySinceMinutes = s.meta.voyageMinutes;
        }
        bumpClutter(s, 1); // wrappers, crumbs, a bowl left out — any meal leaves a little something

        var fatigueGain = item.heavy ? 3 : 1;
        var moraleGain = item.heavy ? 3 : (item.category === 'fresh' ? 2 : 1);
        // Finally breaking a run of snack-heavy eating with something
        // proper feels genuinely restorative, on top of the flat amount.
        if (item.cooked && c.snackMealRatio > 0.5) moraleGain += 2;
        c.fatigue = clamp(c.fatigue - fatigueGain, 0, 100);
        c.morale = clamp(c.morale + moraleGain, 0, 100);
        log(s, eatFlavorLine(s, item));
        flushNewLogEntries(s);
      },
    });
  }

  // DRINK — its own ROUTINE submenu (matching the existing submenu
  // pattern), listing WATER/COFFEE/TEA with their live, authoritative
  // quantities right in the option label. All three draw from the SAME
  // state.water.gallons pool; there is no separate reserve for any of
  // them. Coffee and tea are counted resources of their own
  // (state.drinks), spent one at a time alongside the water they're
  // made with.
  function drinkMenuOptions(state) {
    return [
      { label: instrumentLine('WATER', galCurrentOriginal(state.water.gallons, WATER_STARTING_GALLONS).toUpperCase()), action: 'drink:water' },
      { label: instrumentLine('COFFEE', countCurrentOriginal(state.drinks.coffee, ORIGINAL_COFFEE)), action: 'drink:coffee' },
      { label: instrumentLine('TEA', countCurrentOriginal(state.drinks.tea, ORIGINAL_TEA)), action: 'drink:tea' },
      { label: 'BACK', action: 'cancel' },
    ];
  }

  function cmdDrink(state) {
    printBlank();
    printLine('DRINK', 'heading-label');
    state.pendingChoice = { id: 'drink-menu', options: drinkMenuOptions(state) };
  }

  function performDrinkWater(state) {
    if (!hasEnoughWater(state, WATER_DRINK_GAL)) {
      printBlank();
      printLine('Not enough water.', 'amber');
      state.pendingChoice = { id: 'drink-menu', options: drinkMenuOptions(state) };

  function performTea(state) {
    if (needsCabinLight(state)) {
      printBlank();
      printLine('TOO DARK TO SEE.', 'amber');
      state.pendingChoice = { id: 'drink-menu', options: drinkMenuOptions(state) };
      return;
    }
    if (state.drinks.tea <= 0) {

    }

        s.crew.hoursSinceWater = 0;
        s.crew.morale = clamp(s.crew.morale + 1, 0, 100); // small and quiet -- never shown to the player as a number, just folded into however STATUS's morale label reads afterward
        log(s, 'Tea, warm in your hands. Something steadying about it.');
        flushNewLogEntries(s);

    });

  function pickObservation(state) {
    var phase = voyagePhase(state);
    var pool = OBSERVATIONS[phase] || OBSERVATIONS.offshore;
    var tod = timeOfDayPhase(state);
    var special = [];
    if (tod === 'night' && pool.awe_night) special = special.concat(pool.awe_night);
    if (tod !== 'night' && pool.awe_day) special = special.concat(pool.awe_day);
    if (tod === 'dawn' && pool.sunrise) special = special.concat(pool.sunrise);
    if (tod === 'dusk' && pool.sunset) special = special.concat(pool.sunset);
    if (pool.awe) special = special.concat(pool.awe);
    var recent = state.flags.recentAmbientTexts || [];
    if (special.length && Math.random() < 0.18) {
      return pickFromPoolAvoidingRecent(special, recent);
    }
    var quiet = pool.quiet || [];
    if (!quiet.length) return 'The sea, the sky, the boat. Nothing more to report.';
    return pickFromPoolAvoidingRecent(quiet, recent);
  }


  // Which spare each system's repair consumes, and its display name.
  var REPAIR_SPARE_KEY = { sails: 'sailRepairKit', steering: 'steeringParts', engine: 'engineParts', electrical: 'fuses' };
  var REPAIR_SPARE_LABEL = { sailRepairKit: 'SAIL REPAIR KIT', steeringParts: 'STEERING PARTS', engineParts: 'ENGINE PARTS', fuses: 'FUSES' };
  var REPAIR_SYSTEM_LABEL = { sails: 'SAILS', steering: 'STEERING', engine: 'ENGINE', electrical: 'ELECTRICAL' };

  var REPAIR_SUCCESS_LINES = {
    sails: ['The patch holds. Sail drawing again.', 'Stitched and taped \u2014 she fills properly again.'],
    steering: ['The steering answers again.', 'The rudder bites again, helm answering true.'],
    engine: ['The engine turns over and settles into its rhythm.', 'She catches, coughs once, then runs clean.'],
    electrical: ['New fuse in. The panel comes back to life.', 'Power\u2019s back. The panel lights up again.'],
  };
  var REPAIR_FAILURE_LINES = {
    sails: ['The patch pulls loose as soon as it takes load.', 'Can\u2019t get the seam to hold.'],
    steering: ['The repair does not hold.', 'Whatever\u2019s wrong down there, this didn\u2019t fix it.'],
    engine: ['You put it back together and try the starter. Nothing.', 'Turns over, but won\u2019t catch.'],
    electrical: ['The new fuse goes immediately.', 'Still dead \u2014 the problem\u2019s elsewhere in the run.'],
  };

  // Centralized so the GOOD/FAIR/UNCERTAIN/POOR bands are easy to retune
  // without touching the penalty math itself.
  var REPAIR_SUCCESS_LABEL_THRESHOLDS = [
    { min: 0.70, text: 'GOOD' },
    { min: 0.50, text: 'FAIR' },
    { min: 0.30, text: 'UNCERTAIN' },
    { min: 0, text: 'POOR' },
  ];
  function repairSuccessLabel(chance) {
    for (var i = 0; i < REPAIR_SUCCESS_LABEL_THRESHOLDS.length; i++) {
      if (chance >= REPAIR_SUCCESS_LABEL_THRESHOLDS[i].min) return REPAIR_SUCCESS_LABEL_THRESHOLDS[i].text;
    }
    return 'POOR';
  }

  var REPAIR_BASE_SUCCESS_CHANCE = 0.85;
  var REPAIR_SUCCESS_FLOOR = 0.15; // no single bad factor, or even several, fully prohibits an attempt
  var REPAIR_SUCCESS_CEILING = 0.95;

  // Only the factors actually hurting the attempt are returned — a clean
  // bill of health on any one just leaves it off the list, per the spec.
  // Labels/thresholds mirror STATUS's own wellbeing bands, no new
  // vocabulary invented for this screen.
  function computeRepairPenalties(state) {
    var c = state.crew, w = state.weather;
    var factors = [];

    var eLvl = energyLevel(c.fatigue); // 0=DEPLETED..4=RESTED
    var energyPenalty = [0.35, 0.20, 0.08, 0, 0][eLvl];
    if (energyPenalty > 0) factors.push({ label: 'ENERGY', value: ENERGY_LABELS[eLvl], penalty: energyPenalty });

    var hLvl = hungerLevel(c.hoursSinceMeal); // 0=FULL..4=STARVING
    var hungerPenalty = [0, 0, 0.12, 0.22, 0.22][hLvl];
    if (hungerPenalty > 0) factors.push({ label: 'HUNGER', value: HUNGER_LABELS[hLvl], penalty: hungerPenalty });

    var tLvl = thirstLevel(c.hoursSinceWater);
    var thirstPenalty = [0, 0, 0.12, 0.28, 0.28][tLvl];
    if (thirstPenalty > 0) factors.push({ label: 'THIRST', value: THIRST_LABELS[tLvl], penalty: thirstPenalty });

    var moralePenalty = 0, moraleLabelText = null;
    if (c.morale < 20) { moralePenalty = 0.22; moraleLabelText = 'DEPLETED'; }
    else if (c.morale < 40) { moralePenalty = 0.12; moraleLabelText = 'LOW'; }
    if (moralePenalty > 0) factors.push({ label: 'MORALE', value: moraleLabelText, penalty: moralePenalty });

    var seaPenalty = 0;
    if (w.seaState >= 5) seaPenalty = 0.30;       // VERY ROUGH / HIGH
    else if (w.seaState === 4) seaPenalty = 0.15; // ROUGH
    if (seaPenalty > 0) factors.push({ label: 'SEA STATE', value: SEA_STATE_SHORT_LABELS[w.seaState], penalty: seaPenalty });

    var totalPenalty = factors.reduce(function (sum, f) { return sum + f.penalty; }, 0);
    return { factors: factors, totalPenalty: totalPenalty };
  }

  function repairSuccessChance(state) {
    var p = computeRepairPenalties(state);
    return clamp(REPAIR_BASE_SUCCESS_CHANCE - p.totalPenalty, REPAIR_SUCCESS_FLOOR, REPAIR_SUCCESS_CEILING);
  }

  // The decision screen for one damaged system: only negative factors,
  // the resulting SUCCESS label, and — if a spare remains — the button
  // to actually attempt it. No confirmation beyond this screen itself.
  function cmdRepairSystem(state, systemKey) {
    printBlank();
    printLine('REPAIR \u2014 ' + REPAIR_SYSTEM_LABEL[systemKey], 'heading-label');
    var p = computeRepairPenalties(state);
    p.factors.forEach(function (f) {
      printLine(statusLine(f.label, f.value));
    });
    var chance = repairSuccessChance(state);
    printLine(statusLine('SUCCESS', repairSuccessLabel(chance)));
    var spareKey = REPAIR_SPARE_KEY[systemKey];
    var options = [];
    if (state.supplies.spares[spareKey] > 0) {
      options.push({ label: 'ATTEMPT REPAIR', action: 'attempt-repair:' + systemKey });
    } else {
      printBlank();
      printLine('NO ' + REPAIR_SPARE_LABEL[spareKey] + ' REMAIN.', 'amber');
    }
    options.push({ label: 'BACK', action: 'cmd:repair' });
    state.pendingChoice = { id: 'repair-decision', options: options };
  }

  // The actual attempt: one spare consumed regardless of outcome, some
  // fatigue either way, and — only on success — the system restored to
  // GOOD. A failed attempt leaves the system DAMAGED; it never damages
  // anything else.
  function performSystemRepairAttempt(state, systemKey) {
    var spareKey = REPAIR_SPARE_KEY[systemKey];
    if (state.supplies.spares[spareKey] <= 0) return; // not reachable with the button hidden, but guard anyway
    var chance = repairSuccessChance(state);
    runShortAction(state, {
      label: 'WORKING ON ' + REPAIR_SYSTEM_LABEL[systemKey],
      duration: 6,
      action: function (s) {
        s.supplies.spares[spareKey] -= 1;
        s.crew.fatigue = clamp(s.crew.fatigue + rand(6, 10), 0, 100);
        if (s.crew.toolsOutSinceMinutes == null) s.crew.toolsOutSinceMinutes = s.meta.voyageMinutes;
        if (Math.random() < chance) {
          s.boat[systemKey] = 'GOOD';
          log(s, pickFromPool(REPAIR_SUCCESS_LINES[systemKey]));
        } else {
          log(s, pickFromPool(REPAIR_FAILURE_LINES[systemKey]));
        }
        flushNewLogEntries(s);
      },
    });
  }

  // What's actually reachable and worth offering: the aft locker (its
  // own separate, unrelated event) plus whichever of the four tracked
  // systems are currently DAMAGED — nothing else, and never anything
  // GOOD, since there's nothing to do there.
  function buildDamagedSystemsList(state) {
    var b = state.boat;
    var items = [];
    if (state.flags.aftLockerTriggered && !state.flags.aftLockerResolved) {
      items.push({ label: 'AFT LOCKER', action: 'repair:aftLocker' });
    }
    BOAT_FAIL_SYSTEMS.forEach(function (k) {
      if (b[k] === 'DAMAGED') items.push({ label: REPAIR_SYSTEM_LABEL[k], action: 'repair-select:' + k });
    });
    return items;
  }

  function cmdRepair(state) {
    if (state.crew.location === 'below' && needsCabinLight(state)) { blockedByDarkness(state); return; }
    var items = buildDamagedSystemsList(state);
    if (items.length === 0) {
      printBlank();
      printLine('Nothing aboard needs repair.', 'dim');
      return;
    }
    printBlank();
    printLine('REPAIR', 'heading-label');
    state.pendingChoice = { id: 'repair-menu', options: items.concat([{ label: 'BACK', action: 'cancel' }]) };
  }

  function cmdRestart(state) {
    printBlank();
    printLine('NEW VOYAGE', 'heading-label');
    printLine('This abandons the current voyage and starts over from Seattle.');
    state.pendingChoice = {
      id: 'restart-choice',
      options: [
        { label: 'YES \u2014 START OVER', action: 'confirm-restart' },
        { label: 'NO \u2014 KEEP SAILING', action: 'cancel' },
      ],
    };
  }

  var COMMANDS = {
    status: cmdStatus,
    position: cmdPosition,
    weather: cmdWeather,
    forecast: cmdForecast,
    inventory: cmdInventory,
    distress: cmdDistress,
    sails: cmdSails,
    engine: cmdEngine,
    course: cmdCourse,
    'change-course': cmdChangeCourse,
    wellbeing: cmdWellbeing,
    chore: cmdChore,
    electrical: cmdElectrical,
    sleep: cmdSleep,
    eat: cmdEat,
    drink: cmdDrink,
    wash: cmdWash,
    dress: cmdDress,
    bookshelf: cmdBookshelf,
    'tape-player': cmdTapePlayer,
    repair: cmdRepair,
    fish: cmdFish, // FISHING HOOK
    restart: cmdRestart,
  };

  function runCommand(state, raw) {
    // All commands now arrive from a button that getContextualOptions()
    // itself decided was valid for the current state — no free-text entry
    // point exists anymore (see the header RESTART button for the one
    // command that can fire regardless of state). So this just dispatches.
    var word = raw.trim().toLowerCase();
    if (!word) return;
    var fn = COMMANDS[word];
    if (fn) fn(state);
    if (uiBusy) return; // a short action was kicked off; it owns the render/save/scroll tail when it resolves
    renderOptions(state);
    saveGameState(state);
    scrollToBottom();
  }

  // Builds an options array from ordered groups, inserting a divider
  // between any two non-empty groups and simply omitting a group (and
  // its divider) when it has nothing in it — e.g. REPAIR when there's
  // nothing to fix. Keeps the ABOVE/BELOW menus below free of
  // hand-counted divider bookkeeping as conditional items come and go.
  function groupedOptions(groups) {
    var result = [];
    groups.forEach(function (group) {
      if (!group || group.length === 0) return;
      if (result.length > 0) result.push({ divider: true });
      result = result.concat(group);
    });
    return result;
  }

  /* ============================================================
     FISHING
     ------------------------------------------------------------
     CAST -> WAIT -> BITE -> REACT -> LAND -> KEEP/RELEASE. An Above
     Deck activity (see getContextualOptions above and cmdFish below)
     layered on top of two EXISTING systems rather than duplicating
     either: FOOD_ITEMS' freshFish entry (provisions/hunger/morale) and
     checkSpoilage (per-catch spoilage). Everything fishing-specific
     lives in this one block, plus the handful of small hooks elsewhere
     marked "FISHING HOOK".

     TERMINAL PRESENTATION: fishing uses the exact same #temp-view
     track (printLine/printBlank/clearTempView) as every other command
     in the game, and no fishing-specific CSS at all -- REEL IN is a
     plain .option button, same as everything else in #options.
     Landfall's own generic button-click handler already clears
     #temp-view before dispatching ANY action (see renderOptions), so a
     fresh click-triggered screen (CAST, REEL IN, KEEP/RELEASE, STOP
     FISHING) naturally starts from a blank temp-view without this code
     needing to clear it itself. Within a single automatic sequence
     that isn't waiting on a click (the bite arriving, the REEL IN
     prompt, a landing sequence's own hint beats), nothing here ever
     clears -- each new line is simply appended below the last, so the
     whole thing reads as one continuous unfolding of ordinary terminal
     text, never a wiped-and-redrawn screen.

     BITE CHANCE is a flat, unconditional 60% on every cast
     (FISHING_CONFIG.biteChance) -- there is deliberately no hidden
     "local activity" state carrying pressure between casts anymore.
     Each attempt is fully independent, exactly as specified: casting
     again after a catch, a loss, or a plain miss re-rolls from
     scratch, with nothing remembered from the attempt before. The
     one-kept-fish-per-day rule (below) is what actually keeps fishing
     from becoming a free, unlimited food source -- not a bite-chance
     penalty.

     FISH WEIGHT is rolled directly into one of four tiers
     (FISHING_CONFIG.weightTiers) the moment a bite occurs -- there is
     no separate small/medium/large category feeding into it. The tier
     drives rarity, how long and how intense the automatic reel-in
     sequence feels, and -- for the rare top tier only -- whether a
     marlin is even possible. Marlin is NOT a separate roll applied to
     every fish; it only has a chance to occur once the weight tier has
     already landed on the top (30-40lb) bracket, and only in
     marlin-eligible waters -- see beginFishBite. A marlin CAN be
     landed (weight shown, same as anything else) but can never be
     kept -- see revealMarlin/performFishRelease.

     In-progress session state (which phase, the pending reaction
     deadline, the fish about to be revealed, etc.) is deliberately NOT
     part of the persisted `state` object -- it lives in the
     module-level fishingSession variable below, same as uiBusy/
     openInfoPanel. A reaction window can't meaningfully survive a
     reload or a tab switch, so there's nothing to gain from persisting
     it, and leaving the FISH screen (the only way to reach any other
     menu while a session is active, since it owns state.pendingChoice
     the whole time) always cancels whatever's in flight via STOP
     FISHING, which returns to the normal Above Deck menu.

     Only two things about fishing are persisted, in state.fishing (see
     GAME STATE) and state.food.freshFish:
       - which voyage day a fish was last kept (the one-per-day rule)
       - a timestamp per currently-held Fresh Fish unit (spoilage)
     ============================================================ */

  var FISHING_CONFIG = {
    biteChance: 0.6, // flat, every cast -- no hidden state modifies this
    bite: {
      totalWaitMs: 90000, // max wait per attempt; if a bite is going to happen, it lands at a uniformly random point anywhere in this window
    },

    biteToPromptDelayMs: 1000, // "The line jerks hard." sits alone for exactly this long, then "REEL IN" appears -- no clicks are accepted during this window

    // Once REEL IN appears, how long the player has to select it -- one
    // flat value regardless of the fish's weight tier. The window is
    // about whether the player is paying attention right now, not a
    // dexterity check.
    reactionWindowMs: 3000,

    // Fish weight is rolled directly into one of these tiers the
    // moment a bite occurs (see beginFishBite) -- `weight` is the
    // relative chance (normalized automatically; these sum to 100 for
    // readability but don't have to), and durationMsRange is how long
    // the automatic reel-in sequence takes for a fish landing in that
    // tier. See FISH_TIER_HINT_POOLS for the matching hint text.
    weightTiers: [
      { key: 'common', minLb: 0, maxLb: 10, weight: 60, durationMsRange: [6000, 9000] },
      { key: 'substantial', minLb: 10, maxLb: 20, weight: 30, durationMsRange: [9000, 13000] },
      { key: 'big', minLb: 20, maxLb: 30, weight: 8, durationMsRange: [13000, 17000] },
      { key: 'trophy', minLb: 30, maxLb: 40, weight: 2, durationMsRange: [18000, 22000] },
    ],

    // Only rolled when the weight tier has ALREADY landed on 'trophy'
    // (itself just 2% of hooked fish) AND the boat is in
    // marlin-eligible waters -- see marlinEligible. Most trophy-tier
    // catches are still an ordinary (if exceptional) large fish, not a
    // marlin -- this is deliberately small so a marlin stays "an
    // especially rare possibility," not a guaranteed flavor of big fish.
    marlinChanceWithinTrophyTier: 0.15,

    freshFishSpoilHours: 4, // catch it -> cook/eat it within this many IN-GAME hours
  };

  // FISH_SPECIES_ANCHORS: six hand-authored species/weight tables, one
  // per named region, anchored to actual nm-remaining-to-Nāwiliwili
  // values (reusing distanceBetween/FINAL_DEST/WAYPOINTS -- the exact
  // same position data voyagePhase itself already uses, so the species
  // mix lines up with the same regions the player already sees named
  // in POSITION). fishSpeciesWeightsForState linearly interpolates
  // every species' weight between the two anchors bracketing the
  // boat's CURRENT position, so the mix shifts gradually with distance
  // sailed rather than snapping at a boundary -- a species fading
  // in/out is just its weight rising from/falling to 0 across anchors,
  // nothing more special than that.
  var FISH_SPECIES = [
    { id: 'coho', name: 'Coho Salmon', maxLb: 15 },
    { id: 'pink', name: 'Pink Salmon', maxLb: 6 },
    { id: 'chinook', name: 'Chinook Salmon', maxLb: 40 },
    { id: 'herring', name: 'Pacific Herring', maxLb: 1.5 },
    { id: 'mackerel', name: 'Pacific Mackerel', maxLb: 4 },
    { id: 'rockfish', name: 'Rockfish', maxLb: 12 },
    { id: 'lingcod', name: 'Lingcod', maxLb: 30 },
    { id: 'bonito', name: 'Pacific Bonito', maxLb: 20 },
    { id: 'albacore', name: 'Albacore', maxLb: 40 },
    { id: 'skipjack', name: 'Skipjack Tuna', hawaiianName: 'Aku', maxLb: 25 },
    { id: 'mahimahi', name: 'Mahi-Mahi', maxLb: 40 },
    { id: 'yellowfin', name: 'Yellowfin Tuna', hawaiianName: 'Ahi', maxLb: 40 },
    { id: 'wahoo', name: 'Wahoo', hawaiianName: 'Ono', maxLb: 40 },
  ];
  var FISH_SPECIES_BY_ID = {};
  FISH_SPECIES.forEach(function (sp) { FISH_SPECIES_BY_ID[sp.id] = sp; });

  // Ordered by DESCENDING distRemainingNm (voyage start first, arrival
  // last) -- fishSpeciesWeightsForState depends on this order. The
  // first three anchors reuse actual waypoints (Shilshole, the Strait's
  // eastern entrance, Cape Flattery); the last three reuse voyagePhase's
  // own offshore/tropics/approach thresholds (1845nm, 861nm, 0nm) so
  // the blend lines up with the same phase boundaries POSITION/regionName
  // already use, even though the species mix itself never hard-switches.
  var FISH_SPECIES_ANCHORS = [
    { // Puget Sound / early departure -- typical catches skew smaller
      distRemainingNm: distanceBetween(WAYPOINTS[0].lat, WAYPOINTS[0].lon, FINAL_DEST.lat, FINAL_DEST.lon),
      weights: { coho: 30, pink: 10, chinook: 5, herring: 20, mackerel: 15, rockfish: 15, lingcod: 8 },
    },
    { // Strait of Juan de Fuca -- transitional between coastal and offshore
      distRemainingNm: distanceBetween(WAYPOINTS[6].lat, WAYPOINTS[6].lon, FINAL_DEST.lat, FINAL_DEST.lon), // 'Strait East'
      weights: { coho: 22, pink: 4, chinook: 10, herring: 8, mackerel: 16, rockfish: 14, lingcod: 12, bonito: 4, albacore: 1 },
    },
    { // Coastal Pacific / just offshore
      distRemainingNm: distanceBetween(WAYPOINTS[11].lat, WAYPOINTS[11].lon, FINAL_DEST.lat, FINAL_DEST.lon), // 'Cape Flattery'
      weights: { coho: 10, chinook: 3, mackerel: 14, rockfish: 5, lingcod: 4, bonito: 12, albacore: 10, skipjack: 2 },
    },
    { // North Pacific / well offshore -- coastal species gone, salmon fading
      distRemainingNm: 1845, // voyagePhase's own offshore/tropics threshold
      weights: { coho: 1, mackerel: 3, bonito: 16, albacore: 26, skipjack: 12, mahimahi: 3, yellowfin: 1 },
    },
    { // Mid-Pacific / tropics
      distRemainingNm: 861, // voyagePhase's own tropics/approach threshold
      weights: { bonito: 6, albacore: 14, skipjack: 22, mahimahi: 22, yellowfin: 8, wahoo: 3 },
    },
    { // Approaching Hawai'i -- northwest species gone entirely
      distRemainingNm: 0,
      weights: { albacore: 2, skipjack: 24, mahimahi: 30, yellowfin: 12, wahoo: 8 },
    },
  ];

  function fishSpeciesWeightsForState(state) {
    var dist = distanceBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
    var anchors = FISH_SPECIES_ANCHORS;
    var earlier = anchors[0], later = anchors[anchors.length - 1];
    for (var i = 0; i < anchors.length - 1; i++) {
      if (dist <= anchors[i].distRemainingNm && dist >= anchors[i + 1].distRemainingNm) {
        earlier = anchors[i];
        later = anchors[i + 1];
        break;
      }
    }
    var span = earlier.distRemainingNm - later.distRemainingNm;
    var frac = span > 0 ? clamp((earlier.distRemainingNm - dist) / span, 0, 1) : 0; // 0 at `earlier`, 1 at `later`
    var weights = {};
    FISH_SPECIES.forEach(function (sp) {
      var wEarlier = earlier.weights[sp.id] || 0;
      var wLater = later.weights[sp.id] || 0;
      weights[sp.id] = wEarlier + (wLater - wEarlier) * frac;
    });
    return weights;
  }

  // Weighted species pick, restricted to species that can plausibly
  // reach the ACTUAL rolled weight (species.maxLb >= weightLb) -- used
  // for every tier, so a catch is never an implausibly large example
  // of a small-bodied species (no 29lb herring), not just at the rare
  // top tier. Falls back to the single largest-maxLb species available
  // at this location if, somehow, nothing qualifies.
  function pickFishSpeciesForWeight(state, weightLb) {
    var weights = fishSpeciesWeightsForState(state);
    var candidates = FISH_SPECIES.filter(function (sp) { return sp.maxLb >= weightLb; });
    var total = 0;
    candidates.forEach(function (sp) { total += weights[sp.id] || 0; });
    if (total <= 0) {
      var byMaxLbDesc = FISH_SPECIES.filter(function (sp) { return (weights[sp.id] || 0) > 0; })
        .sort(function (a, b) { return b.maxLb - a.maxLb; });
      return byMaxLbDesc[0] || FISH_SPECIES[0]; // shouldn't happen -- every anchor has enough species with weight to cover every tier -- but never leave this unhandled
    }
