    //
    // COASTAL (waypointIndex < OPEN_WATER_WAYPOINT_INDEX): steps through
    // WAYPOINTS exactly as before — if the budget is enough to reach the
    // current waypoint, the boat arrives there exactly, spends only that
    // much of the budget, advances, and covers the REST of the budget
    // along the new leg's (possibly freshly tacking) heading, rather
    // than sailing straight past it. Several coastal waypoints are
    // closer together than one tick's travel at speed, so this matters.
    //
    // OPEN OCEAN: once the loop below clears the corridor (or the tick
    // started already clear of it), any remaining budget moves in a
    // straight line along the resulting course over ground — checked
    // against Nāwiliwili (arrival) and against LAND_MASSES (grounding)
    // rather than against any further waypoint.
    //
    // Applies identically whether this tick is live or part of a
    // multi-tick offline catch-up, since both just call simTick.
    var heading = computeHeading(state);
    var speedThroughWater = computeBoatSpeed(state, heading);
    var cog = combineWithCurrent(heading, speedThroughWater, state.weather.oceanCurrent);
    state.boat.speed = cog.speedOverGround;
    state.nav.heading = heading;

    var nmRemaining = cog.speedOverGround * (TICK_MINUTES / 60);

    if (state.nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX) {
      var crossingGuard = 0;
      while (nmRemaining > 0 && state.nav.waypointIndex < OPEN_WATER_WAYPOINT_INDEX && crossingGuard < WAYPOINTS.length + 2) {
        crossingGuard++;
        var wp = WAYPOINTS[state.nav.waypointIndex];
        var distToWp = distanceBetween(state.nav.lat, state.nav.lon, wp.lat, wp.lon);
        if (distToWp <= nmRemaining) {
          state.nav.lat = wp.lat;
          state.nav.lon = wp.lon;
          state.nav.distanceTraveled += distToWp;
          if (state.nav.tack) state.nav.tackDistanceNm += distToWp;
          nmRemaining -= distToWp;
          log(state, waypointArrivalLine(wp));
          state.nav.waypointIndex++;
          heading = computeHeading(state); // fresh bearing (and fresh wobble/tack) for the next leg — or, once past OPEN_WATER_WAYPOINT_INDEX, the initial open-ocean course toward Nāwiliwili
          speedThroughWater = computeBoatSpeed(state, heading);
          cog = combineWithCurrent(heading, speedThroughWater, state.weather.oceanCurrent);
          state.nav.heading = heading;
          state.boat.speed = cog.speedOverGround;
        } else {
          var moved = destinationPoint(state.nav.lat, state.nav.lon, cog.courseOverGround, nmRemaining);
          state.nav.lat = moved.lat;
          state.nav.lon = moved.lon;
          state.nav.distanceTraveled += nmRemaining;
          if (state.nav.tack) state.nav.tackDistanceNm += nmRemaining;
          nmRemaining = 0;
        }
      }
    }

    if (nmRemaining > 0) {
      // OPEN OCEAN: free-heading movement (possibly tacking — heading
      // here is whatever resolveAutoTack chose, not necessarily
      // setCourse directly, and the actual track (cog.courseOverGround)
      // can differ further still once current is added). distanceTraveled
      // still tracks actual nm sailed even though nothing is being
      // "arrived at" along the way — only Nāwiliwili itself, and land,
      // matter now.
      var distToFinal = distanceBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon);
      if (distToFinal <= nmRemaining) {
        state.nav.lat = FINAL_DEST.lat;
        state.nav.lon = FINAL_DEST.lon;
        state.nav.distanceTraveled += distToFinal;
        if (!state.flags.arrivedAtDestination) {
          state.flags.arrivedAtDestination = true;
          log(state, waypointArrivalLine(FINAL_DEST));
        }
      } else {
        var projected = destinationPoint(state.nav.lat, state.nav.lon, cog.courseOverGround, nmRemaining);
        if (!applyGroundingIfNeeded(state, projected.lat, projected.lon)) {
          state.nav.lat = projected.lat;
          state.nav.lon = projected.lon;
          state.nav.distanceTraveled += nmRemaining;
          if (state.nav.tack) state.nav.tackDistanceNm += nmRemaining;
        }
      }
    }

    checkLandProximity(state);

    updateCrew(state);
    checkFuel(state);
    updateBattery(state);
    checkAftLocker(state);
    checkScheduledFailures(state);
    checkRescue(state);
    checkWeatherNarration(state, prevCondition);
    checkFatigueNarration(state);
    checkThirstNarration(state);
    checkHungerNarration(state);
    checkCleanlinessNarration(state);
    checkGalleyNarration(state);
    checkSpoilage(state);
    checkMilestones(state);
    checkAmbientEvent(state);
    processSleepTick(state, prevCondition);

    clampState(state);
  }

  // The continuous, sub-tick-precision game clock. voyageMinutes only
  // advances in whole TICK_MINUTES steps, inside simTick — so anything
  // that needs to react smoothly between ticks (reading progress, cabin
  // temperature) reads this instead. leftoverMinutes is the fractional
  // remainder advanceSimulation hasn't yet folded into a full tick, kept
  // current on every call (live, every LIVE_TICK_SECONDS, or offline
  // catch-up) regardless of whether that call actually ran a tick — so
  // together the two always equal the true elapsed game time.
  function currentGameMinutes(state) {
    return state.meta.voyageMinutes + (state.meta.leftoverMinutes || 0);
  }

  function advanceSimulation(state, minutes) {
    var remaining = minutes + (state.meta.leftoverMinutes || 0);
    var ticks = 0;
    state._ambientEventsThisPass = 0; // capped inside checkAmbientEvent — never dumps a backlog after a long absence
    while (remaining >= TICK_MINUTES && ticks < MAX_CATCHUP_TICKS) {
      simTick(state);
      remaining -= TICK_MINUTES;
      ticks++;
    }
    delete state._ambientEventsThisPass; // transient — never persisted
    state.meta.leftoverMinutes = remaining;
    // Continuous (non-tick) systems: each keeps its own last-synced
    // timestamp and folds in whatever elapsed since, in one shot,
    // regardless of how many (if any) full ticks just ran above — see
    // syncReadingProgress and syncCabinTemperature. This is their ONLY
    // update site; neither is also driven by simTick, so elapsed time
    // is never double-counted between the two.
    syncReadingProgress(state);
    syncCabinTemperature(state);
    return ticks;
  }

  function catchUpFromRealTime(state) {
    var now = Date.now();
    var elapsedMinutes = (now - state.meta.lastTick) / 60000;
    if (elapsedMinutes < 1) { state.meta.lastTick = now; return 0; }
    var ticks = advanceSimulation(state, elapsedMinutes);
    state.meta.lastTick = now;
    return ticks;
  }

  /* ============================================================
     5. NARRATIVE / EVENT CHECKS
     ============================================================ */
  function log(state, text) {
    var ts = state.meta.departedAt + state.meta.voyageMinutes * 60000;
    state.log.push({ t: ts, text: text });
  }

  function checkFuel(state) {
    var b = state.boat;
    if (!b.engineOn) return;
    var hrs = TICK_MINUTES / 60;
    b.fuelGallons = clamp(b.fuelGallons - hrs * DIESEL_BURN_RATE_GPH, 0, 999);
    if (b.fuelGallons <= 0) {
      b.engineOn = false;
      stopAllEngineLoops();
      log(state, "The engine coughs and dies. Fuel's gone.");
    }
  }

  // Battery charge — per-tick, driven by simulated elapsed time so it
  // works identically in live play, offline catch-up, and long
  // absences. Entirely separate from checkScheduledFailures'
  // boat.electrical (physical condition). Cabin temperature used to be
  // computed here too; it's now its own continuous system — see
  // syncCabinTemperature.
  function updateBattery(state) {
    var b = state.boat;
    var hrs = TICK_MINUTES / 60;

    // Charging takes priority: while the engine runs, it's actively
    // pushing power in regardless of what's also drawing from it — a
    // real alternator's output dwarfs any of these small loads. 0% to
    // 100% in ten minutes of engine runtime, whether motoring,
    // motor-sailing, or sails furled — anything with the engine on.
    if (b.engineOn) {
      b.battery = clamp(b.battery + hrs * BATTERY_CHARGE_PER_HOUR, 0, 100);
    } else {
      var drain = 0;
      if (b.autopilotOn) drain += BATTERY_DRAIN_AUTOPILOT_PER_HOUR;
      if (b.heaterOn) drain += BATTERY_DRAIN_HEATER_PER_HOUR;
      if (b.fanOn) drain += BATTERY_DRAIN_FAN_PER_HOUR;
      if (b.cabinLightsOn) drain += BATTERY_DRAIN_LIGHTS_PER_HOUR;
      b.battery = clamp(b.battery - hrs * drain, 0, 100);
    }

    // Battery failure forces every load off, once, right when it
    // happens — never auto-restored afterward. The player has to
    // manually switch things back on once power returns.
    if (b.battery <= 0) {
      var hadSomethingOn = b.autopilotOn || b.fanOn || b.heaterOn || b.cabinLightsOn;
      b.autopilotOn = false;
      b.fanOn = false;
      b.heaterOn = false;
      b.cabinLightsOn = false;
      if (hadSomethingOn) {
        log(state, 'Battery dead. Everything electrical drops out.');
      }
    }
  }

  // Cabin temperature — a CONTINUOUS system (unlike battery above): it
  // reacts to actual elapsed game time via its own cabinTemperatureLastSyncedAt
  // timestamp rather than a fixed TICK_MINUTES step, so it doesn't wait
  // for a full simTick to catch up. Called once per advanceSimulation —
  // never also from simTick — so elapsed time is never double-counted.
  // KEPT as its own system even now that TICK_MINUTES=1 (rather than
  // folded back into a plain per-tick update inside simTick): it never
  // reads TICK_MINUTES itself, only currentGameMinutes(), so it's
  // already resolution-independent, and it still earns its keep for
  // sub-minute precision (a value read mid-minute, before that minute's
  // tick has run, is still exactly correct) and for never needing a
  // full tick before reacting to a heater/fan toggle.
  // Follows a simple target-and-catch-up model. The TARGET is the
  // warmer of outside ambient or (only if the heater is on and colder
  // than that) the heater's fixed 68°F ceiling — the heater never
  // pushes the cabin above 68°F, and adds no heat at all once ambient
  // is already warmer than that (ambient simply wins). The actual
  // temperature then moves toward that target at a flat 1°F per
  // in-game minute, warming or cooling alike, never overshooting past
  // it — so a sudden swing in outside temperature or a heater toggle is
  // still felt gradually, not snapped instantly. The fan has NO effect
  // on this physical number at all; it only affects the player-facing
  // HOT/COMFORTABLE read — see cabinConditionLabel.
  function syncCabinTemperature(state) {
    var b = state.boat;
    var now = currentGameMinutes(state);
    if (b.cabinTemperatureLastSyncedAt == null) b.cabinTemperatureLastSyncedAt = now;
    var elapsed = now - b.cabinTemperatureLastSyncedAt;
    b.cabinTemperatureLastSyncedAt = now;
    if (elapsed <= 0) return; // nothing to add (also guards a clock that hasn't moved, or moved backward)

    var outside = state.weather.temperatureF;
    if (b.cabinTemperatureF == null) b.cabinTemperatureF = outside;
    var cabinTarget = outside > CABIN_HEATER_TARGET_F ? outside : (b.heaterOn ? CABIN_HEATER_TARGET_F : outside);
    var maxCabinChange = CABIN_TEMP_CHANGE_PER_MINUTE_F * elapsed;
    if (b.cabinTemperatureF < cabinTarget) {
      b.cabinTemperatureF = Math.min(cabinTarget, b.cabinTemperatureF + maxCabinChange);
    } else if (b.cabinTemperatureF > cabinTarget) {
      b.cabinTemperatureF = Math.max(cabinTarget, b.cabinTemperatureF - maxCabinChange);
    }
  }

  function checkAftLocker(state) {
    var f = state.flags;
    if (!f.aftLockerTriggered && state.meta.voyageMinutes >= f.aftLockerTriggerAt) {
      f.aftLockerTriggered = true;
      log(state, "Something in the aft locker has come loose. A dull, irregular thud with every roll.");
      state.pendingChoice = {
        id: 'aft-locker',
        options: [
          { label: 'INSPECT NOW', action: 'resolve-aft-locker-now' },
          { label: 'SECURE IT LATER', action: 'defer-aft-locker' },
        ],
      };
      return;
    }
    if (f.aftLockerTriggered && !f.aftLockerResolved && f.aftLockerDeferredAt !== null && !f.aftLockerEscalated) {
      var hoursSinceDeferred = (state.meta.voyageMinutes - f.aftLockerDeferredAt) / 60;
      if (hoursSinceDeferred > 5) {
        f.aftLockerEscalated = true;
        state.crew.morale = clamp(state.crew.morale - 4, 0, 100);
        if (state.boat.steering === 'GOOD') {
          state.boat.steering = 'DAMAGED';
          log(state, "The thud from aft has worked something loose against the steering gear. Should have looked sooner.");
        } else {
          log(state, "The thud from aft has worked something loose. Should have looked sooner.");
        }
      }
    }
  }

  /* --------------------------------------------------------------
     BOAT SYSTEM FAILURES

     Four tracked systems — SAILS, STEERING, ENGINE, ELECTRICAL — each
     simply GOOD or DAMAGED, no gradual wear. A failure is a distinct,
     randomly-scheduled incident (24-48h apart on average, centered on
     36h), weighted toward whichever system current conditions make most
     plausible, never picking a system already DAMAGED. Occasionally a
     failure schedules a short follow-up ("chain") instead of the normal
     interval, so a bad stretch can occasionally compound — but usually
     doesn't. Runs from checkScheduledFailures every tick, so it works
     identically in live play, offline catch-up, and long absences.
     -------------------------------------------------------------- */
  var FAILURE_INTERVAL_MIN_HOURS = 24;
  var FAILURE_INTERVAL_MAX_HOURS = 48;   // centered ~36h
  var FAILURE_CHAIN_CHANCE = 0.18;       // 15-20% chance of a shortened follow-up after ANY failure
  var FAILURE_CHAIN_MIN_HOURS = 2;
  var FAILURE_CHAIN_MAX_HOURS = 10;
  var BOAT_FAIL_SYSTEMS = ['sails', 'steering', 'engine', 'electrical'];

  function scheduleNextFailure(state, chained) {
    var hrs = chained
      ? rand(FAILURE_CHAIN_MIN_HOURS, FAILURE_CHAIN_MAX_HOURS)
      : rand(FAILURE_INTERVAL_MIN_HOURS, FAILURE_INTERVAL_MAX_HOURS);
    // Bad weather modestly shortens a chain interval specifically — the
    // normal cadence is left alone by conditions entirely.
    if (chained && (state.weather.seaState >= 4 || state.weather.condition === 'squall')) {
      hrs *= 0.8;
    }
    state.boat.nextFailureAt = state.meta.voyageMinutes + hrs * 60;
  }

  // Weighting is a soft nudge, not a rule — every GOOD system always has
  // SOME chance, conditions just shift the odds toward whichever failure
  // makes the most sense right now.
  function pickFailureSystem(state) {
    var b = state.boat, w = state.weather;
    var candidates = BOAT_FAIL_SYSTEMS.filter(function (k) { return b[k] === 'GOOD'; });
    if (candidates.length === 0) return null;
    var weights = {};
    candidates.forEach(function (k) { weights[k] = 1; });
    if (weights.sails !== undefined) {
      if (w.windSpeed > 24) weights.sails += 1;
      if (w.condition === 'squall') weights.sails += 1.5;
      if (b.sailConfig === 'full' && w.windSpeed > 20) weights.sails += 1;
    }
    if (weights.steering !== undefined) {
      if (w.seaState >= 4) weights.steering += 1;
      if (w.seaState >= 5) weights.steering += 1;
    }
    if (weights.engine !== undefined) {
      if (b.engineOn) weights.engine += 1.5;
    }
    if (weights.electrical !== undefined) {
      var loadCount = (b.autopilotOn ? 1 : 0) + (b.heaterOn ? 1 : 0) + (b.fanOn ? 1 : 0) + (b.cabinLightsOn ? 1 : 0);
      if (loadCount >= 2) weights.electrical += 1;
      if (w.seaState >= 4) weights.electrical += 0.5;
    }
    var total = candidates.reduce(function (sum, k) { return sum + weights[k]; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < candidates.length; i++) {
      r -= weights[candidates[i]];
      if (r <= 0) return candidates[i];
    }
    return candidates[candidates.length - 1];
  }

  var FAILURE_NARRATIVES = {
    sails: [
      'A sharp crack overhead. The sail has torn along a seam.',
      'Something lets go in the rig. The sail collapses loose.',
    ],
    steering: [
      'The helm suddenly goes loose in your hands.',
      'The wheel turns, but the rudder does not answer.',
    ],
    engine: [
      'The engine coughs hard and dies.',
      'A warning smell from below. The engine temperature is climbing fast.',
    ],
    electrical: [
      'A fuse blows somewhere behind the panel. The cabin goes dark.',
    ],
  };

  function triggerFailure(state, systemKey) {
    var b = state.boat;
    b[systemKey] = 'DAMAGED';
    if (systemKey === 'engine' && b.engineOn) {
      b.engineOn = false; // shut down immediately if it was running
      stopAllEngineLoops();
    }
    if (systemKey === 'electrical') {
      // A fuse problem, not a dead battery — battery charge itself is
      // untouched. But every load it feeds drops out right away, same
      // shape as a dead battery, and stays off until the player
      // manually switches it back on (see performElectricalToggle) —
      // repair only restores ACCESS, never flips anything back on itself.
      b.autopilotOn = false;
      b.fanOn = false;
      b.heaterOn = false;
      b.cabinLightsOn = false;
    }
    log(state, pickFromPool(FAILURE_NARRATIVES[systemKey]));
    flushNewLogEntries(state);
  }

  function checkScheduledFailures(state) {
    var b = state.boat;
    if (state.crew.inLifeRaft) return; // no boat systems left to fail
    if (state.meta.voyageMinutes < b.nextFailureAt) return;
    var sys = pickFailureSystem(state);
    if (!sys) {
      // Everything's already DAMAGED — nothing left to break. Push the
      // schedule out so this doesn't re-check every single tick.
      scheduleNextFailure(state, false);
      return;
    }
    triggerFailure(state, sys);
    scheduleNextFailure(state, Math.random() < FAILURE_CHAIN_CHANCE);
  }

  /* --------------------------------------------------------------
     RESCUE

     EPIRB -> real-time travel to the search area -> a SEARCH phase
     made of discrete, widely-spaced "encounters" (an aircraft or
     vessel actually searching nearby) each open for a real multi-hour
     window — long enough that checking Landfall a couple of times a
     day is enough to catch one and fire a flare. Missing a window
     never fails the rescue; it just means the next encounter, a few
     hours later, resolves without the flare's help. This is real
     time throughout: nothing here is a caller of advanceSimulation(),
     it only ever reads state.meta.voyageMinutes and reschedules a
     future timestamp for simTick to notice on some later real tick.
     -------------------------------------------------------------- */
  var RESCUE_ENCOUNTER_WINDOW_MINUTES = 180; // how long an encounter stays open for a flare response
  var RESCUE_ENCOUNTER_MIN_GAP = 180;        // 3-8 real hours between search encounters
  var RESCUE_ENCOUNTER_MAX_GAP = 480;

  function estimateRescueTravelMinutes(state) {
    var phase = voyagePhase(state);
    var baseHours = { inland: 1, strait: 2, coastal: 4, offshore: 20, tropics: 16, approach: 7 }[phase];
    if (baseHours == null) baseHours = 14;
    var weatherFactor = (state.weather.seaState >= 5) ? 1.4 : 1.0;
    return Math.round(baseHours * weatherFactor * 60);
  }

  function rescueEncounterChance(state) {
    var r = state.rescue;
    var chance = 0.4; // aboard the boat, reasonable visibility, baseline
    if (state.crew.inLifeRaft) chance -= 0.15; // a much smaller target
    var tod = timeOfDayPhase(state);
    if (tod === 'night') chance -= 0.15;
    if (state.weather.condition === 'squall' || state.weather.seaState >= 5) chance -= 0.1;
    if (r.encounterFlareFired) {
      var boost = 0.4;
      if (state.crew.inLifeRaft) boost += 0.1;  // exactly where a flare matters most
      if (tod === 'night') boost += 0.1;
      chance += boost;
    }
    return clamp(chance, 0.1, 0.95);
  }

  function beginRescueEncounter(state) {
    var r = state.rescue;
    r.encounterActive = true;
    r.encounterStartedAt = state.meta.voyageMinutes;
    r.encounterFlareFired = false;
    r.encounterKind = Math.random() < 0.5 ? 'aircraft' : 'vessel';
    log(state, r.encounterKind === 'aircraft'
      ? 'You hear an aircraft. It circles somewhere in the distance.'
      : 'A vessel is visible, working a search pattern.');
    log(state, 'Rescuers are searching the area.');
    flushNewLogEntries(state);
  }

  function resolveRescueEncounter(state) {
    var r = state.rescue;
    var success = Math.random() < rescueEncounterChance(state);
    r.encounterActive = false;
    if (success) {
      r.phase = 'rescued';
      log(state, r.encounterKind === 'aircraft'
        ? 'The aircraft circles once more. This time it stays.'
        : 'The vessel alters course toward you. It keeps coming.');
      log(state, 'RESCUED');
      flushNewLogEntries(state);
    } else {
      log(state, r.encounterKind === 'aircraft'
        ? "The aircraft's gone quiet. It could come back."
        : 'The vessel moves off, still searching elsewhere.');
      flushNewLogEntries(state);
      r.nextSearchEventAt = state.meta.voyageMinutes + rand(RESCUE_ENCOUNTER_MIN_GAP, RESCUE_ENCOUNTER_MAX_GAP);
    }
  }

  function checkRescue(state) {
    var r = state.rescue;
    if (!r.epirbOn || r.phase === 'rescued') return;

    if (r.phase === 'traveling') {
      if (state.meta.voyageMinutes >= r.activatedAt + r.travelMinutes) {
        r.phase = 'searching';
        log(state, "You're in the search area now.");
        flushNewLogEntries(state);
        r.nextSearchEventAt = state.meta.voyageMinutes + rand(RESCUE_ENCOUNTER_MIN_GAP, RESCUE_ENCOUNTER_MAX_GAP);
      }
      return;
    }

    if (r.phase !== 'searching') return;

    if (r.encounterActive) {
      if (state.meta.voyageMinutes >= r.encounterStartedAt + RESCUE_ENCOUNTER_WINDOW_MINUTES) {
        resolveRescueEncounter(state);
      }
      return;
    }

    if (r.nextSearchEventAt != null && state.meta.voyageMinutes >= r.nextSearchEventAt) {
      beginRescueEncounter(state);
    }
  }

  function weatherChangeLine(condition) {
    var lines = {
      rain: "Rain starts, fine and steady.",
      squall: "A squall line closing fast. Everything goes grey.",
      overcast: "Cloud thickens overhead. The horizon dims.",
      clear: "The overcast breaks. Stars, briefly, then gone again.",
    };
    return lines[condition] || ("Sky shifts to " + condition + ".");
  }

  function checkWeatherNarration(state, prevCondition) {
    if (state.weather.condition !== prevCondition) {
      log(state, weatherChangeLine(state.weather.condition));
    }
  }

  function checkFatigueNarration(state) {
    var f = state.flags;
    if (state.crew.fatigue > 75 && !f.fatigueNarrated) {
      f.fatigueNarrated = true;
      log(state, "Hands feel slow. Everything simple takes an extra beat.");
    }
    if (state.crew.fatigue < 50) f.fatigueNarrated = false;
  }

  function checkThirstNarration(state) {
    var f = state.flags;
    if (thirstLevel(state.crew.hoursSinceWater) >= 3 && !f.thirstNarrated) {
      f.thirstNarrated = true;
      log(state, "Your mouth feels like the inside of a sail bag. Water, before anything else.");
    }
    if (thirstLevel(state.crew.hoursSinceWater) < 2) f.thirstNarrated = false;
  }

  function checkHungerNarration(state) {
    var f = state.flags;
    if (hungerLevel(state.crew.hoursSinceMeal) >= 3 && !f.hungerNarrated) {
      f.hungerNarrated = true;
      log(state, "Stomach's stopped asking and started aching. You need real food.");
    }
    if (hungerLevel(state.crew.hoursSinceMeal) < 2) f.hungerNarrated = false;
  }

  function checkCleanlinessNarration(state) {
    var f = state.flags;
    var hours = hoursSinceWash(state);
    if (hours > 60 && !f.cleanlinessNarrated) {
      f.cleanlinessNarrated = true;
      log(state, 'You could use a wash.');
    }
    if (hours < 24) f.cleanlinessNarrated = false;
  }

  function checkGalleyNarration(state) {
    var f = state.flags;
    var hours = dishesDirtyHours(state);
    if (hours > 36 && !f.galleyNarrated) {
      f.galleyNarrated = true;
      log(state, 'The galley could use some attention.');
    }
    if (hours < 12) f.galleyNarrated = false;
  }

  /* --------------------------------------------------------------
     PASSIVE AMBIENT EVENTS

     Observations ("something the sailor notices outside themselves")
     and ponderings ("something that surfaces in the sailor's mind")
     both flow through here — chosen at random, on a single schedule
     that reschedules itself every time, so the two never label
     themselves and never compete for airtime by running on separate
     clocks. Nothing about this touches the voyage clock; it only
     ever decides whether THIS tick is the one that writes a log line.
     -------------------------------------------------------------- */
  var AMBIENT_MIN_GAP_MINUTES = 90;   // at least 1.5h between ambient events
  var AMBIENT_MAX_GAP_MINUTES = 300;  // at most 5h — "substantial stretches" without one
  var AMBIENT_CATCHUP_CAP = 2;        // a long absence surfaces at most this many, never a backlog dump
  var AMBIENT_HISTORY_LENGTH = 6;     // how many recent picks to avoid repeating

  function ambientEventsAllowed(state) {
    if (state.departure.stageIndex < DEPARTURE_STEPS.length) return false; // mid opening-sequence — no room for musing
    if (state.crew.inLifeRaft) return false; // pure survival focus — no idle noticing from a raft
    if (state.crew.watchState !== 'awake') return false;      // asleep or trying to be — not noticing anything
    if (state.pendingChoice) return false;                    // mid-decision, not the moment for a stray thought
    if (state.weather.condition === 'squall') return false;   // storms and emergencies dominate attention
    if (state.weather.seaState >= 5) return false;
    if (state.flags.aftLockerTriggered && !state.flags.aftLockerResolved) return false; // an active problem aboard
    if (hungerLevel(state.crew.hoursSinceMeal) >= 3) return false;  // severe hunger/thirst — physical concerns dominate
    if (thirstLevel(state.crew.hoursSinceWater) >= 3) return false;
    return true;
  }

  function ponderingChance(state) {
    var chance = 0.35; // observations are somewhat more common than ponderings overall
    if (state.meta.voyageMinutes / 1440 > 4) chance += 0.15; // more likely after several days offshore
    var tod = timeOfDayPhase(state);
    if (tod === 'night' || tod === 'dawn' || tod === 'dusk') chance += 0.15; // solitude, routine, quiet hours
    if (state.weather.seaState <= 2 && state.weather.condition !== 'rain') chance += 0.1; // calm sailing
    var phase = voyagePhase(state);
    if (phase === 'offshore' || phase === 'tropics') chance += 0.1; // extended solitude, long uneventful stretches
    return clamp(chance, 0.1, 0.75);
  }

  function checkAmbientEvent(state) {
    var f = state.flags;
    if (f.nextAmbientEventAt == null) {
      f.nextAmbientEventAt = state.meta.voyageMinutes + rand(AMBIENT_MIN_GAP_MINUTES, AMBIENT_MAX_GAP_MINUTES);
      return;
    }
    if (state.meta.voyageMinutes < f.nextAmbientEventAt) return;
    // Reschedule unconditionally, whether or not something actually fires —
    // a suppressed slot (danger, asleep, etc.) doesn't get "saved up" for
    // later; it just tries again at the next randomized interval.
    f.nextAmbientEventAt = state.meta.voyageMinutes + rand(AMBIENT_MIN_GAP_MINUTES, AMBIENT_MAX_GAP_MINUTES);

    if (state._ambientEventsThisPass !== undefined && state._ambientEventsThisPass >= AMBIENT_CATCHUP_CAP) return;
    if (!ambientEventsAllowed(state)) return;

    var text = Math.random() < ponderingChance(state) ? pickPondering(state) : pickObservation(state);
    if (!f.recentAmbientTexts) f.recentAmbientTexts = [];
    f.recentAmbientTexts.push(text);
    if (f.recentAmbientTexts.length > AMBIENT_HISTORY_LENGTH) f.recentAmbientTexts.shift();
    log(state, text);
    flushNewLogEntries(state);
    if (state._ambientEventsThisPass !== undefined) state._ambientEventsThisPass++;
  }

  function checkSpoilage(state) {
    var days = state.meta.voyageMinutes / 1440;
    var f = state.flags, food = state.food;
    if (!f.freshFruitSpoiled && days > 6 && food.freshFruit > 0) {
      food.freshFruit = 0;
      f.freshFruitSpoiled = true;
      log(state, "The last of the fresh fruit has gone soft and off. Over the side with it.");
    }
    if (!f.freshBreadSpoiled && days > 4 && food.freshBread > 0) {
      food.freshBread = 0;
      f.freshBreadSpoiled = true;
      log(state, "The bread has finally gone \u2014 mold, then over the side.");
    }
    // FISHING HOOK -- Fresh Fish, one timestamp per currently-held unit
    // rather than a single flag: it's caught mid-voyage, at whatever
    // moment, not part of the fixed starting provisions the two checks
    // above are timed against.
    var caughtAt = state.fishing.freshFishCaughtAt;
    if (caughtAt.length) {
      var windowMinutes = FISHING_CONFIG.freshFishSpoilHours * 60;
      var stillGood = [];
      var anySpoiled = false;
      for (var i = 0; i < caughtAt.length; i++) {
        if (state.meta.voyageMinutes - caughtAt[i] >= windowMinutes) anySpoiled = true;
        else stillGood.push(caughtAt[i]);
      }
      if (anySpoiled) {
        state.fishing.freshFishCaughtAt = stillGood;
        food.freshFish = stillGood.length;
        log(state, 'The fish has spoiled.');
      }
    }
  }

  function checkMilestones(state) {
    var milestone = Math.floor(state.nav.distanceTraveled / 300);
    if (milestone > state.flags.lastMilestone) {
      state.flags.lastMilestone = milestone;
      log(state, (milestone * 300) + " nautical miles behind you now.");
    }
  }

  function waypointArrivalLine(wp) {
    var lines = {
      'Shilshole Exit': 'Clear of the marina, into open Puget Sound.',
      'Puget Sound': 'Threading the channel toward Admiralty Inlet.',
      'Admiralty South': 'Into Admiralty Inlet \u2014 the water narrows here.',
      'Admiralty North': 'Clear of Marrowstone Island. Turning toward Port Townsend.',
      'Point Wilson': 'Port Townsend slides by off the beam. Almost to the strait.',
      'Strait East': 'Into the Strait of Juan de Fuca proper.',
      'Strait East 2': 'Dungeness Spit somewhere off to port, well clear.',
      'Strait Mid': 'Mid-strait now \u2014 the Olympics to port, Vancouver Island to starboard.',
      'Strait West': "Nearing the strait's mouth. Cape Flattery ahead.",
      'Cape Approach': 'Rounding toward Cape Flattery.',
      'Cape Flattery': 'Clear of Cape Flattery. The Pacific opens up ahead.',
      'open water, well offshore': 'Well clear of the coast now, turning south to find the trades.',
      'the trade wind belt': 'Into the trade winds. Turning west for Hawaiʻi.',
      'Kauaʻi': 'Kauaʻi rises off the bow.',
    };
    return lines[wp.name] || (wp.name + ' behind you now.');
  }

  function resolveAftLocker(state) {
    var c = state.crew;
    var penalty = 0;
    if (hungerLevel(c.hoursSinceMeal) >= 3) penalty += 0.12;
    if (thirstLevel(c.hoursSinceWater) >= 3) penalty += 0.15;
    if (coffeeActive(state)) penalty -= 0.05;
    if (c.morale < 40) penalty += 0.06; // rattled, more likely to fumble it
    var successChance = clamp(0.92 - c.fatigue / 150 - penalty, 0.2, 0.92);
    var success = Math.random() < successChance;
    state.flags.aftLockerResolved = true;
    c.fatigue = clamp(c.fatigue + 4, 0, 100);
    if (success) {
      log(state, "Found it: a jerry can, worked loose from its strap. Lashed down tight. Quiet again.");
    } else {
      log(state, "Fumbled it in the dark \u2014 a bruised knuckle, and it's still not quite secure.");
    }
    flushNewLogEntries(state);
  }

  /* --------------------------------------------------------------
     SLEEP PRESSURE

     Sleep is still a STATE, never a call that manufactures time — but
     it's now three states, not two: 'awake' -> 'trying' -> 'sleeping'.
     Selecting SLEEP only ever starts an attempt; every tick after that
     (whether the live loop or catchUpFromRealTime) rolls real, condition-
     driven odds for actually falling asleep, and later for staying that
     way. A well-rested sailor can select SLEEP and simply lie there,
     exactly as asked — this is what keeps "close game, tap SLEEP" from
     ever being a guaranteed free fatigue reset.
     -------------------------------------------------------------- */
  var TRYING_TO_SLEEP_GIVE_UP_MINUTES = 120; // give up and get up after 2 hours of not falling asleep

  function tryingToSleepNarrative() {
    var options = [
      "You go below and try to settle. The autopilot holds her course.",
      "You lie down, still half dressed, and wait for it to take you.",
      "Eyes closed. Whether sleep comes is another matter.",
    ];
    return options[Math.floor(Math.random() * options.length)];
  }

  function describeSleepDuration(minutes) {
    if (minutes < 20) return "a few minutes";
    if (minutes < 60) return "under an hour";
    var rounded = Math.round((minutes / 60) * 2) / 2; // nearest half hour
    return rounded + (rounded === 1 ? " hour" : " hours");
  }

  // Chance of actually dropping off while 'trying', PER OLD 10-MINUTE
  // TICK (all the math below is tuned against that frame) -- converted
  // to the correct per-current-tick chance via tickProbability() at the
  // very end, so the conditions/weights here never need to change.
  // Fatigue does most of the work; a long stretch already awake nudges
  // it further; rough seas and recent coffee push back against it.
  function fallAsleepChance(state) {
    var c = state.crew;
    var base = 0.15;
    var fatigueBoost = clamp(c.fatigue / 100, 0, 1) * 0.55;
    var awakeBoost = clamp((c.hoursSinceRest - 4) / 20, 0, 0.25);
    var seaPenalty = state.weather.seaState >= 4 ? 0.15 : (state.weather.seaState >= 3 ? 0.05 : 0);
    var coffeePenalty = coffeeActive(state) ? 0.18 : 0;
    var p10 = clamp(base + fatigueBoost + awakeBoost - seaPenalty - coffeePenalty, 0.03, 0.9);
    return tickProbability(p10);
  }

  // Chance of surfacing again once 'sleeping', PER OLD 10-MINUTE TICK,
  // same tickProbability() conversion as fallAsleepChance above. Low
  // remaining fatigue (already well rested) makes waking likelier;
  // rough seas add their own chance on top — sleep interrupted by
  // weather, not just completed by resting enough.
  function wakeChanceWhileSleeping(state) {
    var c = state.crew;
    var restedness = clamp(1 - c.fatigue / 100, 0, 1);
    var base = 0.02 + restedness * 0.10;
    var seaBoost = state.weather.seaState >= 5 ? 0.12 : (state.weather.seaState >= 4 ? 0.05 : 0);
    var p10 = clamp(base + seaBoost, 0.01, 0.6);
    return tickProbability(p10);
  }

  function wakeUp(state, baseText, includeDuration) {
    var start = state.crew.sleepStartedAt;
    var minutesAsleep = start == null ? 0 : state.meta.voyageMinutes - start;
    state.crew.watchState = 'awake';
    state.crew.sleepStartedAt = null;
    if (state.crew.bunkUnmadeSinceMinutes == null) state.crew.bunkUnmadeSinceMinutes = state.meta.voyageMinutes;
    var text = baseText;
    if (includeDuration !== false && minutesAsleep >= 5) {
      text += ' Roughly ' + describeSleepDuration(minutesAsleep) + ' below.';
    }
    log(state, text);
    flushNewLogEntries(state);
  }

  // Advances the 'trying' -> 'sleeping' -> 'awake' state machine by one
  // tick. This is the only place any of those transitions happen, so it
  // runs identically whether it's the live loop or a multi-day catch-up.
  function processSleepTick(state, prevCondition) {
    var c = state.crew;

    if (c.watchState === 'trying') {
      if (Math.random() < fallAsleepChance(state)) {
        c.watchState = 'sleeping';
        // Only stamp this on the FIRST drop-off of the session — a restless
        // wake-and-resettle (above) deliberately leaves sleepStartedAt alone
        // so the eventual "roughly X hours below" spans the whole night,
        // not just the last stretch after the last stir.
        if (c.sleepStartedAt == null) c.sleepStartedAt = state.meta.voyageMinutes;
        return;
      }
      var elapsed = state.meta.voyageMinutes - c.sleepAttemptStartedAt;
      if (elapsed >= TRYING_TO_SLEEP_GIVE_UP_MINUTES) {
        c.watchState = 'awake';
        c.sleepAttemptStartedAt = null;
        c.sleepStartedAt = null; // fully awake now — a later session starts its own duration count clean
        log(state, "The rest wouldn't come. Up again.");
      }
      return;
    }

    if (c.watchState === 'sleeping') {
      // Something demanding attention (e.g. the aft locker) always wins.
      if (state.pendingChoice) {
        wakeUp(state, "Something's wrong. You're awake, fast.", false);
        return;
      }
      // A squall breaking is loud and wet enough to end anyone's sleep.
      if (state.weather.condition === 'squall' && prevCondition !== 'squall') {
        wakeUp(state, "Cold spray through the hatch \u2014 you're awake.", false);
        return;
      }
      if (Math.random() < wakeChanceWhileSleeping(state)) {
        if (c.fatigue <= 20) {
          // Actually rested — this is a real end to the sleep, not a blip.
          wakeUp(state, "You surface on your own, rested.");
        } else {
          // Still genuinely exhausted: a real wake would leave them stuck
          // fully 'awake' and racking up MORE fatigue for the rest of an
          // unattended absence over one unlucky roll. A still-tired sailor
          // instead stirs and drifts straight back toward sleep — logged,
          // but not a full wake (watchState goes to 'trying', where the
          // normal high fallAsleepChance at this fatigue very quickly
          // pulls them back under).
          log(state, "Restless. You surface for a moment, then let it take you again.");
          flushNewLogEntries(state);
          c.watchState = 'trying';
          c.sleepAttemptStartedAt = state.meta.voyageMinutes;
        }
      }
    }
  }

  /* ============================================================
     6. AMBIENT AUDIO
     ------------------------------------------------------------
     Two independent systems share this one AudioContext/masterGain:

     - Weather texture (rain), still synthesized here since it doesn't
       duplicate what the recorded boat-ambience files below are for --
       rain is precipitation, an orthogonal phenomenon to sea state.
       (There is deliberately no synthesized hum/oscillator layer here
       any more -- an earlier version had a constant 55Hz sine tone,
       which is exactly the kind of old procedural boat-ambience sound
       the new recordings replace, and it was audible as a continuous
       low tone competing with them. Removed entirely, not just muted.)

     - BOAT AMBIENCE (recorded, from audio/boat/): replaces what used
       to be synthesized wind/wave/rigging noise, the hum, and
       procedural hull creaks entirely -- those were exactly what the
       new recordings now provide, so layering the old procedural
       versions underneath them would just be duplicated/competing
       sound. See getBoatAudioState/updateBoatAudioForState further
       down: state.crew.location and state.weather.seaState are the
       only inputs, matching the game's existing state directly rather
       than inventing a parallel audio-only weather variable.

     masterGain feeds audioCtx.destination once; every layer, old or
     new, is just a source -> (filter/gain) chain into that one
     master, so the global mute toggle (toggleMute) affects everything
     uniformly with no per-system special-casing.
     ============================================================ */
  var audioCtx = null;
  var audioUnlocked = false;
  var masterGain = null;
  var muted = false;
  var layers = {};

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      buildAudioGraph();
    } catch (e) {
      console.warn('Audio unavailable:', describeError(e));
    }
  }

  function makeNoiseBuffer(ctx, seconds) {
    var bufferSize = Math.floor(ctx.sampleRate * seconds);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    var last = 0;
    for (var i = 0; i < bufferSize; i++) {
      var white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02; // lightly filtered ("brown-ish") noise reads as rain, not static
      data[i] = last * 3.5;
    }
    return buffer;
  }

  function makeNoiseLayer(ctx, seconds, filterType, freq, q) {
    var source = ctx.createBufferSource();
    source.buffer = makeNoiseBuffer(ctx, seconds);
    source.loop = true;
    var filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = freq;
    if (q) filter.Q.value = q;
    var gainNode = ctx.createGain();
    gainNode.gain.value = 0;
    source.connect(filter).connect(gainNode).connect(masterGain);
    source.start();
    return { source: source, filter: filter, gain: gainNode, targetGain: 0 };
  }

  function buildAudioGraph() {
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 0.5;
    masterGain.connect(audioCtx.destination);

    layers.rain = makeNoiseLayer(audioCtx, 4, 'highpass', 3500, 0.7);

    if (GAME) updateAudioForState(GAME);
    if (GAME && GAME.boat.engineOn) {
      // Catches up a resumed save where the engine was already running
      // before sound was ever unlocked -- the normal engine-start
      // trigger only fires from the real START ENGINE action, which
      // won't fire again on a resume. No start.mp3 here, since the
      // engine didn't just start; straight into whichever loop matches
      // the current deck.
      if (GAME.crew.location === 'above') playEngineLoop('cruise', ENGINE_VOLUME.cruise);
      else playEngineLoop('interior', ENGINE_VOLUME.interior);
    }
  }

  // The single top-level "sync all ambient audio to current state" entry
  // point -- rain here, and boat ambience (recorded exterior/
  // interior/creak tracks) delegated to updateBoatAudioForState.
  // Engine audio is NOT synced here -- it's triggered directly from the
  // actual engine-start/engine-stop actions (see beginEngineStartAudio/
  // beginEngineStopAudio) and the GO ABOVE/GO BELOW handler
  // (transitionEngineLocationAudio), not inferred from render state.
  function updateAudioForState(state) {
    if (audioCtx && layers.rain) {
      var now = audioCtx.currentTime;
      var rainOn = (state.weather.condition === 'rain' || state.weather.condition === 'squall') ? 1 : 0;
      layers.rain.gain.gain.linearRampToValueAtTime(rainOn * 0.12, now + 2);
    }
    updateBoatAudioForState(state);
  }

  function toggleMute() {
    muted = !muted;
    if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
    applyMuteToEngineAudio(); // engine audio bypasses masterGain entirely, so it needs its own mute application
    applyMuteToFishingAudio(); // FISHING HOOK -- same reasoning as engine audio
    updateSoundLabel();
  }

  function updateSoundLabel() {
    soundBtn.textContent = audioUnlocked ? (muted ? 'SOUND: OFF' : 'SOUND: ON') : 'SOUND: OFF';
  }

  /* --------------------------------------------------------------
     BOAT AMBIENCE (recorded) -- three independent looping channels
     (exterior, interior, creak), each capable of crossfading between
     recordings, or to/from silence, without ever overlapping itself.
     getBoatAudioState() is the single source of truth for which file
     (if any) each channel should be playing, derived entirely from
     state.crew.location and state.weather.seaState -- no separate
     "calm/moderate/heavy/severe" audio-only weather tier invented.
     Exterior and interior are mutually exclusive by location; creak
     only ever plays alongside interior, never above deck.
     -------------------------------------------------------------- */
  var BOAT_AUDIO_FILES = {
    exteriorCalm: 'audio/boat/exterior_calm.mp3',
    exteriorChop: 'audio/boat/exterior_chop.mp3',
    exteriorWaves: 'audio/boat/exterior_waves.mp3',
    exteriorGale: 'audio/boat/exterior_gale.mp3',
    interiorCalm: 'audio/boat/interior_calm.mp3',
    interiorChop: 'audio/boat/interior_chop.mp3',
    interiorRough: 'audio/boat/interior_rough.mp3',
    creaksLight: 'audio/boat/creaks_light.mp3',
    creaksHeavy: 'audio/boat/creaks_heavy.mp3',
  };
  var BOAT_AMBIENCE_CROSSFADE_SECONDS = 2; // shared by location transitions and weather-tier changes alike

  // location/seaState -> which file (if any) each channel wants. Pure
  // function of explicit values, per the task's boundaries -- above
  // deck: 0 / 1-2 / 3-4 / 5-6 -> calm/chop/waves/gale. Below deck: 0 / 1-2 /
  // 3-6 -> calm/chop/rough, with creaks starting at 3 (light 3-4, heavy
  // 5-6) layered on top. interior_rough is deliberately the SAME file
  // across 3-4 and 5-6 -- only the creak layer changes at that boundary,
  // so it's never restarted crossing it (see setBoatChannelTrack's
  // skip-if-unchanged check). Takes location as a parameter (rather than
  // reading state.crew.location directly) so a transition in progress
  // can ask "what should play for the location the player is headed
  // TO", which state.crew.location doesn't reflect until the GO ABOVE/GO
  // BELOW action actually commits.
  function getBoatAudioStateFor(location, seaState) {
    var exteriorTrack = null, interiorTrack = null, creakTrack = null;
    if (location === 'above') {
      if (seaState <= 0) exteriorTrack = BOAT_AUDIO_FILES.exteriorCalm;
      else if (seaState <= 2) exteriorTrack = BOAT_AUDIO_FILES.exteriorChop;
      else if (seaState <= 4) exteriorTrack = BOAT_AUDIO_FILES.exteriorWaves;
      else exteriorTrack = BOAT_AUDIO_FILES.exteriorGale;
    } else {
      if (seaState <= 0) interiorTrack = BOAT_AUDIO_FILES.interiorCalm;
      else if (seaState <= 2) interiorTrack = BOAT_AUDIO_FILES.interiorChop;
      else interiorTrack = BOAT_AUDIO_FILES.interiorRough; // shared by 3-4 and 5-6 on purpose
      if (seaState <= 2) creakTrack = null;
      else if (seaState <= 4) creakTrack = BOAT_AUDIO_FILES.creaksLight;
      else creakTrack = BOAT_AUDIO_FILES.creaksHeavy;
    }
    return { location: location, seaState: seaState, exteriorTrack: exteriorTrack, interiorTrack: interiorTrack, creakTrack: creakTrack };
  }

  function getBoatAudioState(state) {
    return getBoatAudioStateFor(state.crew.location, state.weather.seaState);
  }

  function makeBoatChannel(name, targetGain) {
    return {
      name: name,
      targetGain: targetGain,
      slots: [null, null],    // each becomes { el, gain, pendingPath, pendingGeneration } once built -- two so an outgoing loop can fade out while an incoming one fades in, never a click/pop or dead silence between
      activeIndex: -1,        // which slot we're currently pointing at (loading OR confirmed-playing), or -1 if silent
      desiredPath: null,      // the LATEST path this channel has been asked for -- recorded synchronously on every call, regardless of anything else; async callbacks compare against this (plus generation) to detect staleness
      loadingPath: null,      // path an in-flight play() attempt is currently for, or null if nothing in flight
      currentPath: null,      // CONFIRMED actually playing, or null. ONLY ever set once playback is confirmed -- the play() Promise resolves and/or the element's 'playing' event fires -- AND that path is still desired at that moment. Never set merely because play() was called without throwing.
      generation: 0,          // bumped every time a genuinely new attempt begins; closures/slots capture their own generation so a slow or stale async result can recognize it's been superseded and refuse to resurrect old state
    };
  }
  var boatChannels = {
    exterior: makeBoatChannel('exterior', 0.6),
    interior: makeBoatChannel('interior', 0.5),
    creak: makeBoatChannel('creak', 0.4), // layered on top of interior, so mixed a bit under it
  };

  function ensureBoatChannelSlot(channel, index) {
    if (channel.slots[index] || !audioCtx) return;
    try {
      var el = new Audio();
      el.loop = true;
      el.preload = 'auto';
      el.volume = 1; // explicit, defensive -- this element's own volume multiplier must never be anything but full; the GainNode is what actually controls level
      var slot = { el: el, gain: null, pendingPath: null, pendingGeneration: -1, pauseTimer: null, gainTarget: 0 };
      el.addEventListener('error', function () {
        // el.currentSrc reflects the resolved URL that actually failed
        // (this element is reused for different paths over time, so
        // reading it fresh here -- not capturing a path in a closure --
        // is what makes this correct for whichever load just failed).
        var path = el.currentSrc || el.src;
        console.error('BOAT AUDIO FILE ERROR', 'path:', path, 'audio.error.code:', el.error ? el.error.code : null);
      });
      el.addEventListener('loadeddata', function () {
        var path = el.currentSrc || el.src;
        console.log('BOAT AUDIO LOADED', 'path:', path, 'duration:', el.duration);
      });
      el.addEventListener('playing', function () {
        var path = el.currentSrc || el.src;
        console.log('BOAT AUDIO PLAYING', 'path:', path);
        // Confirmation path #2 (alongside the play() Promise below) --
        // only commit if this slot's most recent attempt is still the
        // channel's most recent attempt overall AND still what's
        // actually desired; otherwise this is a stale signal from a
        // track that's since been superseded (e.g. the player changed
        // location again before this one finished starting).
        if (slot.pendingGeneration === channel.generation && channel.desiredPath === slot.pendingPath) {
          channel.currentPath = slot.pendingPath;
          channel.loadingPath = null;
        }
      });
      var source = audioCtx.createMediaElementSource(el);
      var gain = audioCtx.createGain();
      gain.gain.value = 0;
      source.connect(gain).connect(masterGain);
      slot.gain = gain;
      channel.slots[index] = slot;
    } catch (e) {
      console.warn('Boat ambience unavailable:', describeError(e));
    }
  }

  // "Healthy" means currentPath isn't just a remembered string -- the
  // element it names is actually, verifiably the one loaded, running,
  // AND audible (or on its way there). A stale currentPath alone must
  // never suppress a genuine restart attempt -- and neither must a path
  // match by itself: a slot can be the correct track, unpaused and
  // unended, yet still be the OUTGOING half of some earlier crossfade,
  // gain ramping toward (or already sitting at) 0. gainTarget records
  // the most recently scheduled destination for this slot's ramp --
  // checking it (rather than the ramp's current, mid-flight, instant
  // value) means an in-progress legitimate fade-in still reads healthy.
  function boatChannelIsHealthy(channel) {
    if (channel.currentPath === null) return channel.activeIndex === -1;
    if (channel.activeIndex === -1) return false;
    var slot = channel.slots[channel.activeIndex];
    if (!slot) return false;
    var el = slot.el;
    return !!(el.src && el.src.indexOf(channel.currentPath) !== -1 && !el.paused && !el.ended && slot.gainTarget === channel.targetGain);
  }

  // Crossfades `channel` toward `desiredPath` (or silence if null).
  // currentPath is ONLY ever committed once playback is actually
  // confirmed (see the play() .then() and the 'playing' listener
  // above) -- never merely because play() didn't throw synchronously,
  // since that proves nothing about whether audio is actually coming
  // out. A generation counter, checked at commit time, means a slow or
  // stale async result from an attempt that's since been superseded by
  // a newer request can never resurrect old state. The skip-if-
  // unchanged optimization only fires when the channel is genuinely,
  // verifiably already there (boatChannelIsHealthy) -- a bare
  // currentPath string match is never sufficient on its own.
  function setBoatChannelTrack(channel, desiredPath, locationForLog, seaStateForLog) {
    channel.desiredPath = desiredPath; // record the latest ask immediately and unconditionally -- this is what staleness checks compare against

    if (!audioCtx) return; // not unlocked yet -- desiredPath is recorded so the first real attempt, once it exists, isn't blocked by anything here
    if (channel.currentPath === desiredPath && boatChannelIsHealthy(channel)) return; // genuinely already there
    if (desiredPath != null && channel.loadingPath === desiredPath) return; // already mid-attempt for this exact (non-silent) path -- don't stack a duplicate. Must not apply when desiredPath is null: loadingPath sits at null at rest, so without this guard "go silent" would match loadingPath===null on nearly every call and skip the fade-out below entirely

    channel.generation++;
    var myGeneration = channel.generation;
    var now = audioCtx.currentTime;
    var outgoingIndex = channel.activeIndex;

    if (outgoingIndex !== -1 && channel.slots[outgoingIndex]) {
      var outgoing = channel.slots[outgoingIndex];
      if (outgoing.pauseTimer) { clearTimeout(outgoing.pauseTimer); outgoing.pauseTimer = null; } // this slot may already have a pause pending from an EARLIER fade-out -- if so it's stale as of this new fade-out and must not fire mid-way through (or after) this one
      outgoing.gainTarget = 0;
      outgoing.gain.gain.cancelScheduledValues(now);
      outgoing.gain.gain.setValueAtTime(outgoing.gain.gain.value, now);
      outgoing.gain.gain.linearRampToValueAtTime(0, now + BOAT_AMBIENCE_CROSSFADE_SECONDS);
      outgoing.pauseTimer = setTimeout(function () {
        outgoing.pauseTimer = null;
        outgoing.el.pause();
      }, BOAT_AMBIENCE_CROSSFADE_SECONDS * 1000 + 100);
    }

    if (desiredPath == null) {
      channel.activeIndex = -1;
      channel.currentPath = null;
      channel.loadingPath = null;
      return;
    }

    channel.loadingPath = desiredPath;
    console.log('BOAT AUDIO REQUEST', 'location:', locationForLog, 'seaState:', seaStateForLog, 'desiredPath:', desiredPath);

    try {
      var incomingIndex = outgoingIndex === 0 ? 1 : 0;
      ensureBoatChannelSlot(channel, incomingIndex);
      var incoming = channel.slots[incomingIndex];
      if (!incoming) { if (channel.loadingPath === desiredPath) channel.loadingPath = null; return; } // couldn't build -- currentPath/loadingPath left clear, so the next render retries

      if (incoming.pauseTimer) { clearTimeout(incoming.pauseTimer); incoming.pauseTimer = null; } // this slot may still be carrying a pause scheduled from when IT was the outgoing track of an earlier crossfade -- now that it's wanted again, that pause must never be allowed to fire
      incoming.pendingPath = desiredPath;
      incoming.pendingGeneration = myGeneration;
      var alreadyLoaded = incoming.el.src && incoming.el.src.indexOf(desiredPath) !== -1;
      if (!alreadyLoaded) {
        incoming.el.src = desiredPath;
        incoming.el.currentTime = 0;
      } // else: same track this slot already had (e.g. reused mid-fade-out before returning to it) -- resume in place rather than restarting the loop from zero
      incoming.gainTarget = channel.targetGain;
      incoming.gain.gain.cancelScheduledValues(now);
      incoming.gain.gain.setValueAtTime(incoming.gain.gain.value, now);
      incoming.gain.gain.linearRampToValueAtTime(channel.targetGain, now + BOAT_AMBIENCE_CROSSFADE_SECONDS);
      channel.activeIndex = incomingIndex; // pointing at it now, but NOT yet confirmed -- currentPath stays whatever it was

      var playPromise = incoming.el.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(function () {
          // Confirmation path #1. Stale-check before committing: a
          // newer request may have already superseded this one while
          // the browser was still deciding whether to allow playback.
          if (channel.generation !== myGeneration || channel.desiredPath !== desiredPath) return;
          channel.currentPath = desiredPath;
          channel.loadingPath = null;
          console.log('BOAT AUDIO PLAY SUCCESS', 'path:', desiredPath, 'paused:', incoming.el.paused,
            'volume:', incoming.el.volume, 'muted:', incoming.el.muted, 'currentTime:', incoming.el.currentTime);
        }, function (error) {
          console.error('BOAT AUDIO PLAY FAILED', 'path:', desiredPath, 'error name:', error && error.name, 'error message:', error && error.message);
          // currentPath was never set for this attempt -- nothing to
          // undo. Only clear loadingPath if this is still the most
          // recent attempt (a newer one may already be in flight).
          if (channel.generation === myGeneration && channel.loadingPath === desiredPath) channel.loadingPath = null;
        });
      }
      // If no Promise is returned at all (very old browsers), the
      // 'playing' listener above is the sole confirmation path.
    } catch (e) {
      console.error('Boat audio failed to start (' + channel.name + ' channel, ' + desiredPath + '):', describeError(e));
      if (channel.loadingPath === desiredPath) channel.loadingPath = null;
    }
  }

  // Hands a {location, seaState, exteriorTrack, interiorTrack,
  // creakTrack} shape to setBoatChannelTrack for all three channels,
  // which alone decides whether anything actually needs to happen.
  // Shared by both entry points below so GO ABOVE and GO BELOW are never
  // separate implementations of the same crossfade.
  function applyBoatAudioDesiredState(desired) {
    setBoatChannelTrack(boatChannels.exterior, desired.exteriorTrack, desired.location, desired.seaState);
    setBoatChannelTrack(boatChannels.interior, desired.interiorTrack, desired.location, desired.seaState);
    setBoatChannelTrack(boatChannels.creak, desired.creakTrack, desired.location, desired.seaState);
  }

  // The state-driven entry point, for everything that isn't a location
  // transition in progress: the live loop, restart, offline catch-up,
  // sound-on, and weather changing while the player stays put. Called
  // from updateAudioForState and directly from renderOptions.
  function updateBoatAudioForState(state) {
    applyBoatAudioDesiredState(getBoatAudioState(state));
  }

  // Called the MOMENT a GO ABOVE/GO BELOW transition begins -- not when
  // it finishes. state.crew.location doesn't flip to targetLocation
  // until the short action's dots finish running (several seconds
  // later), so a call that read state.crew.location here would just
  // re-apply the OLD location's ambience and silently undo nothing.
  // Taking the target explicitly is what lets the crossfade start on
  // click and makes both directions genuinely the same code path.
  function transitionBoatAudioToLocation(state, targetLocation) {
    applyBoatAudioDesiredState(getBoatAudioStateFor(targetLocation, state.weather.seaState));
  }

  /* --------------------------------------------------------------
     ENGINE AUDIO -- a third, independent layer alongside boat/
     environment ambience (above) and the tape player (below): the
     recorded sound of the engine itself, playing underneath whichever
     of those happen to be audible, never replacing them.

     Deliberately NOT built on the boat-ambience channel machinery
     above (no desiredPath/currentPath/loadingPath/generation
     tracking) -- just four ordinary HTMLAudioElements, created lazily,
     controlled directly with .play()/.pause()/.volume/.currentTime.
     There is no "sync engine audio to current state" function that
     runs on every render: the actual engine-start/engine-stop action
     handlers below call these functions directly, at the moment the
     player's choice actually takes effect (see the engine-start/
     engine-stop cases and the departure-sequence START ENGINE step).
     This means engine audio is authored to react to real events, not
     inferred after the fact from state.boat.engineOn -- though that
     flag remains the sole source of truth for whether the engine
     itself is running; nothing here tracks a second, independent
     notion of "is engine audio on."
     -------------------------------------------------------------- */
  var ENGINE_AUDIO_FILES = {
    start: 'audio/engine/start.mp3',
    cruise: 'audio/engine/cruise.mp3',
    interior: 'audio/engine/interior.mp3',
    off: 'audio/engine/off.mp3',
  };
  var ENGINE_VOLUME = { start: 0.55, cruise: 0.55, interior: 0.45, off: 0.55 };
  var ENGINE_TRANSITION_SECONDS = 0.1; // click prevention only -- not an audible crossfade

  var engineAudioEls = {}; // key -> HTMLAudioElement, created on first use (lazy load, never preloaded)

  function getEngineAudioEl(key) {
    var el = engineAudioEls[key];
    if (el) return el;
    el = new Audio(ENGINE_AUDIO_FILES[key]);
    el.loop = (key === 'cruise' || key === 'interior');
    el.preload = 'auto';
    el.volume = 0;
    engineAudioEls[key] = el;
    return el;
  }

  // Ramps `el.volume` from its current value to `target` over `seconds`
  // real seconds, plain setInterval steps -- no Web Audio API, no
  // AudioParam scheduling. Cancels any fade already in flight on this
  // element first, so overlapping requests can't fight each other.
  function fadeEngineVolume(el, target, seconds, onComplete) {
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    var start = el.volume;
    if (Math.abs(target - start) < 0.001) { el.volume = target; if (onComplete) onComplete(); return; }
    var stepMs = 20;
    var steps = Math.max(1, Math.round((seconds * 1000) / stepMs));
    var stepIndex = 0;
    el._fadeTimer = setInterval(function () {
      stepIndex++;
      if (stepIndex >= steps) {
        el.volume = target;
        clearInterval(el._fadeTimer);
        el._fadeTimer = null;
        if (onComplete) onComplete();
      } else {
        el.volume = start + (target - start) * (stepIndex / steps);
      }
    }, stepMs);
  }

  // Starts (or leaves alone, if already playing) a looping engine
  // track, fading to its target volume. el._baseVolume is remembered so
  // toggleMute can restore the right level later without re-deriving
  // what this element was fading toward.
  function playEngineLoop(key, baseVolume) {
    if (!audioUnlocked) return;
    var el = getEngineAudioEl(key);
    el._baseVolume = baseVolume;
    if (el.paused) {
      el.volume = 0;
      var p = el.play();
      if (p && p.catch) p.catch(function (e) { console.warn('Engine audio failed to play (' + key + '):', describeError(e)); });
    }
    fadeEngineVolume(el, muted ? 0 : baseVolume, ENGINE_TRANSITION_SECONDS);
  }

  // Fades a looping engine track to silence, then pauses it.
  function stopEngineLoop(key) {
    var el = engineAudioEls[key];
    if (!el) return;
    el._baseVolume = 0;
    if (el.paused) return;
    fadeEngineVolume(el, 0, ENGINE_TRANSITION_SECONDS, function () { el.pause(); });
  }

  // Plays a one-shot (start.mp3/off.mp3) from the beginning every time,
  // fading in, and fires onEnded (once) when it naturally finishes --
  // ordinary 'ended', not looped, no staleness tracking needed since
  // stopAllEngineLoops (below) always clears any pending onended before
  // it could fire late.
  function playEngineOneShot(key, baseVolume, onEnded) {
    if (!audioUnlocked) return;
    var el = getEngineAudioEl(key);
    el.onended = null;
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    if (!el.paused) el.pause();
    el.currentTime = 0;
    el.volume = 0;
    el._baseVolume = baseVolume;
    var p = el.play();
    if (p && p.catch) p.catch(function (e) { console.warn('Engine audio failed to play (' + key + '):', describeError(e)); });
    fadeEngineVolume(el, muted ? 0 : baseVolume, ENGINE_TRANSITION_SECONDS);
    if (onEnded) {
      el.onended = function () {
        el.onended = null;
        onEnded();
      };
    }
  }

  // The one small helper for automatic shutdowns (fuel out, engine
  // damage): stops whichever engine loop is currently active so audio
  // can never keep playing once state.boat.engineOn is false, and
  // clears any pending start.mp3 handoff so it can't fire late and
  // start a loop after the engine has already stopped. No off.mp3 here
  // -- this is a safety net, not the player-facing shutdown
  // presentation (see beginEngineStopAudio below for that).
  function stopAllEngineLoops() {
    var startEl = engineAudioEls.start;
    if (startEl) {
      startEl.onended = null;
      if (startEl._fadeTimer) { clearInterval(startEl._fadeTimer); startEl._fadeTimer = null; }
      if (!startEl.paused) startEl.pause();
      startEl.volume = 0;
      startEl._baseVolume = 0;
    }
    stopEngineLoop('cruise');
    stopEngineLoop('interior');
  }

  // Called directly from the engine-start action (both the ENGINE menu
  // toggle and the departure-sequence START ENGINE step) at the moment
  // state.boat.engineOn actually becomes true -- never inferred later
  // from render state. Above deck: start.mp3 once, then hands off to
  // looping cruise.mp3 when it naturally ends. Below deck: straight
  // into looping interior.mp3, no one-shot intro (today the ENGINE menu
  // is above-deck only, so this branch isn't reachable in normal play,
  // but stays correct if that ever changes).
  function beginEngineStartAudio(location) {
    if (location === 'above') {
      playEngineOneShot('start', ENGINE_VOLUME.start, function () {
        playEngineLoop('cruise', ENGINE_VOLUME.cruise);
      });
    } else {
      playEngineLoop('interior', ENGINE_VOLUME.interior);
    }
  }

  // Called directly from the engine-stop action at the moment
  // state.boat.engineOn actually becomes false. Above deck: cruise
  // fades out and off.mp3 plays once. Below deck: interior just fades
  // out -- off.mp3 is an exterior/cockpit-perspective sound, so it's
  // skipped below deck rather than played out of place; the engine
  // sound simply stops with the same short fade.
  function beginEngineStopAudio(location) {
    stopAllEngineLoops();
    if (location === 'above') {
      playEngineOneShot('off', ENGINE_VOLUME.off, null);
    }
  }

  // Called immediately when a GO ABOVE/GO BELOW transition begins (same
  // reasoning as transitionBoatAudioToLocation above -- uses the TARGET
  // location, since state.crew.location hasn't updated yet), but only
  // if the engine is actually running. Never plays start.mp3 -- that's
  // solely beginEngineStartAudio's job, exactly once per engine run;
  // relocating a running engine always crossfades directly between
  // cruise and interior.
  function transitionEngineLocationAudio(state, targetLocation) {
    if (!state.boat.engineOn) return;
    if (targetLocation === 'above') {
      stopEngineLoop('interior');
      playEngineLoop('cruise', ENGINE_VOLUME.cruise);
    } else {
      stopEngineLoop('cruise');
      playEngineLoop('interior', ENGINE_VOLUME.interior);
    }
  }

  // Applies the current mute state to whichever engine element(s) are
  // actually audible right now, instantly (matching masterGain's own
  // instant, non-ramped mute toggle) -- called from toggleMute.
  function applyMuteToEngineAudio() {
    ['start', 'cruise', 'interior', 'off'].forEach(function (key) {
      var el = engineAudioEls[key];
      if (!el || el.paused) return;
      if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
      el.volume = muted ? 0 : (el._baseVolume || 0);
    });
  }

  /* --------------------------------------------------------------
     TAPE PLAYER — a persistent world object (a physical cassette
     player below deck), entirely separate from the ambient/synthesized
     layers above: its own plain HTMLAudioElement, with NO Web Audio
     routing at all -- deliberately so. An earlier version routed this
     element through a small Web Audio graph (MediaElementAudioSourceNode
     -> BiquadFilterNode -> GainNode) to achieve the above-deck muffling
     effect; that routing is a documented source of subtle playback-rate/
     pitch drift in some browsers (the graph's clock has to stay
     resampled against the AudioContext's own clock, which is not
     always perfectly stable), so it has been removed entirely. Above/
     below-deck is now just tapeAudioEl.volume, and speed/pitch are
     therefore always exactly the source MP3's: nothing here ever
     touches playbackRate away from 1.0, detunes anything, or
     periodically corrects currentTime.

     All of this state is intentionally module-level, not part of
     `state`/save data — see the note above tapeListenDay/tapeListenCount
     in newGameState for the one piece that DOES need to persist (the
     daily morale anti-spam counters), and TAPE PLAYER STATE further
     down for why the rest doesn't.

     Menus (cmdTapePlayer et al.) only ever CONTROL this — start,
     stop, change tape — they never own its lifecycle: once started, a
     tape keeps playing through every other menu, activity, and
     above/below-deck transition until it's explicitly stopped or
     reaches its natural end. The game's clock and the cassette's
     playback clock are entirely separate: once .play() is called,
     the browser's own native audio clock owns timing from there --
     nothing here is ever synchronized to voyageMinutes, simulation
     ticks, or any other game-time source.
     -------------------------------------------------------------- */
  var tapeAudioEl = null;        // single, reused plain <audio> element -- plays TAPES tracks AND tape_off.mp3 in sequence, since the two never overlap
  var activeTapeTitle = null;    // title of the TAPES entry currently playing, or null -- this is what TAPE PLAYER's "X -- PLAYING" reflects; briefly null again while tape_off.mp3 is the only thing sounding, whether stopping or changing tapes
  var tapeAudioRole = null;      // 'track' | 'tape_off' | null -- which of the two tapeAudioEl is currently loaded with, so the shared 'ended' handler knows what just finished
  var pendingNextTapeTitle = null; // set only when CHANGING tapes: which tape to start once the in-flight tape_off.mp3 finishes
  var pendingNextTapePath = null;
  var tapeSessionQualified = false; // whether the CURRENT listening session (since this tape/track started) has already been credited toward today's morale allowance

  var TAPE_QUALIFYING_SECONDS = 300;  // 5 minutes of actual playback before a session counts
  var TAPE_MORALE_FIRST = 5;          // first qualifying listen this voyage day -- comparable to a wash/change
  var TAPE_MORALE_SECOND = 2;         // second: noticeably smaller, matching a single reading-morale chunk
  var TAPE_MORALE_DAILY_LIMIT = 2;    // third and beyond: no further benefit, but never blocks listening itself
  var TAPE_VOLUME_ABOVE = 0;          // above deck: completely inaudible -- the cassette mechanism keeps running below, the player just can't hear it from up there
  var TAPE_VOLUME_BELOW = 1;          // below deck: the MP3's own normal supplied level, unmodified

  // Called from the player's own explicit tape-selection click (never
  // proactively/on load). Lazily creates the one persistent <audio>
  // element -- no AudioContext, no Web Audio graph, nothing else to
  // build. Plain HTMLAudioElement playback needs nothing more than a
  // user-gesture-triggered .play() call to satisfy autoplay policy.
  function ensureTapeAudioReady() {
    if (tapeAudioEl) return true;
    try {
      tapeAudioEl = new Audio();
      tapeAudioEl.preload = 'auto';
      tapeAudioEl.addEventListener('ended', onTapeAudioEnded);
      tapeAudioEl.addEventListener('timeupdate', onTapeTimeUpdate);
      return true;
    } catch (e) {
      console.warn('Tape player audio unavailable:', describeError(e));
      return false;
    }
  }

  // Instant, no fade, and NEVER anything but a volume change -- no
  // filter, no playbackRate touch, no seek. Safe to call whether or
  // not a tape is currently playing (harmless either way, since it
  // always applies to whatever's loaded); safe to call before the
  // element exists (no-op).
  function applyTapeLocationAudio(state) {
    if (!tapeAudioEl) return;
    var above = !!(state && state.crew.location === 'above');
    tapeAudioEl.volume = above ? TAPE_VOLUME_ABOVE : TAPE_VOLUME_BELOW;
  }

  // Awards the qualifying-listen morale, once per session, respecting
  // the day's diminishing returns -- called both mid-playback (the
  // moment 5 minutes of actual audio time is reached, so a long-running
  // tape doesn't require the player to stop it to "cash in") and on a
  // track's natural end (so a tape shorter than 5 minutes still
  // qualifies by finishing). tapeSessionQualified makes a second call
  // for the same session a harmless no-op either way.
  function awardTapeListenMorale() {
    if (!GAME || tapeSessionQualified) return;
    tapeSessionQualified = true;
    var c = GAME.crew;
    var today = Math.floor(GAME.meta.voyageMinutes / 1440);
    if (c.tapeListenDay !== today) {
      c.tapeListenDay = today;
      c.tapeListenCount = 0;
    }
    if (c.tapeListenCount >= TAPE_MORALE_DAILY_LIMIT) return; // still fine to listen -- just no more benefit today
    c.tapeListenCount++;
    var gain = c.tapeListenCount === 1 ? TAPE_MORALE_FIRST : TAPE_MORALE_SECOND;
    c.morale = clamp(c.morale + gain, 0, 100);
    saveGameState(GAME); // persist the anti-spam counter promptly -- this isn't tied to any UI action's own save/flush
  }

  function onTapeTimeUpdate() {
    if (tapeAudioRole === 'track' && !tapeSessionQualified && tapeAudioEl.currentTime >= TAPE_QUALIFYING_SECONDS) {
      awardTapeListenMorale();
    }
  }

  // Shared 'ended' handler for both roles the single audio element can
  // hold. A track ending naturally: credit a qualifying short tape,
  // clear the active-tape state, play the mechanical stop sound, and
  // never restart/advance to anything else -- this fires at exactly
  // the file's real natural end regardless of location, so a tape that
  // finishes while the player is above deck clears correctly and on
  // time; it just isn't audible when it happens. tape_off.mp3 ending:
  // either silence (the normal case) or, if the player selected a
  // different tape while this one was stopping, start that tape now
  // that the cassette-swap sound has actually finished.
  function onTapeAudioEnded() {
    if (tapeAudioRole === 'track') {
      awardTapeListenMorale(); // no-op if already credited via onTapeTimeUpdate
      activeTapeTitle = null;
      playTapeOffSound();
    } else if (tapeAudioRole === 'tape_off') {
      tapeAudioRole = null;
      if (pendingNextTapePath) {
        var title = pendingNextTapeTitle, path = pendingNextTapePath;
        pendingNextTapeTitle = null;
        pendingNextTapePath = null;
        startTapeTrack(title, path);
      }
    }
  }

  function stopCurrentTapeTrackImmediately() {
    if (tapeAudioEl && tapeAudioRole === 'track') {
      tapeAudioEl.pause();
      tapeAudioEl.currentTime = 0;
    }
    activeTapeTitle = null;
  }

  // play() is expected to return a Promise, but not every environment
  // guarantees that (confirmed: it can come back undefined) -- calling
  // .catch() on whatever it returns without checking would throw an
  // uncaught exception right out of the click handler that triggered
  // it, which is exactly the UI breakage graceful failure is supposed
  // to prevent. This is the ONLY place tapeAudioEl.play() is ever
  // called.
  function safePlayTapeAudio() {
    try {
      var p = tapeAudioEl.play();
      if (p && typeof p.catch === 'function') p.catch(function () {});
    } catch (e) {
      // fail gracefully -- e.g. file genuinely missing, autoplay blocked without a promise, or play() itself throwing
    }
  }

  // The ONE place a src is loaded and playback started, for either a
  // music track or tape_off.mp3 -- centralizing this is what guarantees
  // playbackRate/defaultPlaybackRate are always explicitly 1.0 no
  // matter which path led here, per the core rule that speed and pitch
  // must always match the source file exactly. Nothing outside this
  // function ever touches playbackRate, defaultPlaybackRate, or
  // currentTime once playback is underway.
  function loadAndPlayTapeAudio(path) {
    tapeAudioEl.src = path;
    tapeAudioEl.currentTime = 0;
    tapeAudioEl.playbackRate = 1.0;
    tapeAudioEl.defaultPlaybackRate = 1.0;
    safePlayTapeAudio();
  }

  function playTapeOffSound() {
    if (!tapeAudioEl) return;
    tapeAudioRole = 'tape_off';
    loadAndPlayTapeAudio(TAPE_OFF_PATH);
  }

  function startTapeTrack(title, path) {
    if (!ensureTapeAudioReady()) return; // audio unavailable in this browser/session -- fail gracefully, no UI breakage
    activeTapeTitle = title;
    tapeAudioRole = 'track';
    tapeSessionQualified = false;
    applyTapeLocationAudio(GAME);
    loadAndPlayTapeAudio(path);
  }

  /* ============================================================
     7. TERMINAL RENDERING
     ============================================================ */
  var outputEl = document.getElementById('output');
  var tempViewEl = document.getElementById('temp-view');
  var optionsEl = document.getElementById('options');
  var clockEl = document.getElementById('clock');
  var vesselLineEl = document.getElementById('vessel-line');
  var navStripEl = document.getElementById('navstrip');
  var navDayEl = document.getElementById('nav-day');
  var navSpeedEl = document.getElementById('nav-speed');
  var navHeadingEl = document.getElementById('nav-heading');
  var navRegionEl = document.getElementById('nav-region');
  var soundBtn = document.getElementById('sound-btn');
  var restartBtn = document.getElementById('restart-btn');

  /* --------------------------------------------------------------
     TWO SEPARATE RENDER SURFACES, both inside #output:

     PERSISTENT (printPersistentLine/Blank, printLogEntry) — the
     voyage's actual history. Append-only, never cleared, drives
     entirely off state.log (plus a handful of one-time scene-setting
     lines: the pre-departure intro, the short-action "STARTING
     ENGINE"-style headers, the CAST OFF closing beat, the welcome-
     back header). Always inserted just BEFORE tempViewEl, so that
     div stays pinned as the last child no matter how much history
     accumulates above it.

     TEMPORARY (printLine/Blank/Echo, inside #temp-view) — whatever
     menu or status screen is currently open: STATUS, POSITION,
     INVENTORY and its categories, the SAILS/ENGINE/COURSE prompts,
     confirmation/rejection text like "Left as it was." or "Nothing
     there." None of this is a voyage event, so none of it touches
     state.log — and unlike the persistent side, it gets wiped by
     clearTempView() at the start of every new interaction, so
     yesterday's menu never lingers behind today's.

     A real ACTION taken from a menu (eating, drinking, starting the
     engine, changing sail) still calls log()+flushNewLogEntries() to
