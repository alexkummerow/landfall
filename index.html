    var roll = Math.random() * total;
    for (var i = 0; i < candidates.length; i++) {
      var w = weights[candidates[i].id] || 0;
      if (roll < w) return candidates[i];
      roll -= w;
    }
    return candidates[candidates.length - 1];
  }

  // Some species go by a different name near Hawai'i (skipjack/aku,
  // yellowfin/ahi, wahoo/ono) -- purely cosmetic, doesn't affect which
  // species gets picked or its weight.
  function fishSpeciesDisplayName(state, species) {
    if (species.hawaiianName && voyagePhase(state) === 'approach') return species.hawaiianName;
    return species.name;
  }

  function pickFishWeightTier() {
    var tiers = FISHING_CONFIG.weightTiers;
    var total = 0;
    tiers.forEach(function (t) { total += t.weight; });
    var roll = Math.random() * total;
    for (var i = 0; i < tiers.length; i++) {
      if (roll < tiers[i].weight) return tiers[i];
      roll -= tiers[i].weight;
    }
    return tiers[tiers.length - 1];
  }

  function pickFishWeightLbInTier(tier) {
    return +(rand(tier.minLb, tier.maxLb)).toFixed(1);
  }

  function marlinEligible(state) {
    var phase = voyagePhase(state);
    return phase === 'tropics' || phase === 'approach';
  }

  function fishAlreadyKeptToday(state) {
    return state.fishing.keptFishOnDay === voyageDayNumber(state);
  }

  /* --------------------------------------------------------------
     FISHING AUDIO -- a fourth independent layer (alongside boat
     ambience, engine audio, and the tape player), built exactly the
     same way as engine audio (see ENGINE_AUDIO_FILES/playEngineOneShot
     etc. in the AMBIENT AUDIO section above): plain HTMLAudioElements,
     lazily created, controlled directly with .play()/.pause()/.volume/
     .currentTime -- no Web Audio API, no new unlock mechanism. Kept as
     its own, fully independent copy of that same small set of helpers
     (fadeFishingVolume mirrors fadeEngineVolume exactly) rather than
     sharing the engine-audio functions, for the same reason engine
     audio itself stays separate from boat ambience: independent
     systems, each easy to reason about on its own.

     Every trigger point below is either a real button click (CAST,
     REEL IN, RELEASE) or a setTimeout chained from one (the bite
     firing, a landing sequence's own beats), so it's already covered
     by the same audioUnlocked gate every other sound in the game
     already relies on -- nothing new to unlock.
     -------------------------------------------------------------- */
  var FISHING_AUDIO_FILES = {
    cast: 'audio/fishing/cast.mp3',
    catch: 'audio/fishing/catch.mp3',
    catchSmall: 'audio/fishing/catch_small.mp3',
    catchMedium: 'audio/fishing/catch_medium.mp3',
    catchLarge: 'audio/fishing/catch_large.mp3',
    drag1: 'audio/fishing/drag_1.mp3',
    drag2: 'audio/fishing/drag_2.mp3',
    reel: 'audio/fishing/reel.mp3',
    release: 'audio/fishing/release.mp3',
  };
  var FISHING_AUDIO_VOLUME = {
    cast: 0.6, catch: 0.65, catchSmall: 0.6, catchMedium: 0.6, catchLarge: 0.6,
    drag1: 0.35, drag2: 0.35, reel: 0.4, release: 0.55,
  };
  var FISHING_CROSSFADE_SECONDS = 0.1; // quick fade-in every fishing one-shot uses at its own start (click prevention only) -- unrelated to the reel-to-catch handoff, which is an instant stop, no fade

  var fishingAudioEls = {}; // key -> HTMLAudioElement, created on first use (lazy load, never preloaded) -- same pattern as engineAudioEls

  function getFishingAudioEl(key) {
    var el = fishingAudioEls[key];
    if (el) return el;
    el = new Audio(FISHING_AUDIO_FILES[key]);
    el.loop = (key === 'reel');
    el.preload = 'auto';
    el.volume = 0;
    // Diagnostic only -- a load/decode failure (wrong path, missing
    // file, unsupported format) fires 'error' on the element itself.
    // This is passive (never runs synchronously as part of element
    // creation or playback) and mirrors the same pattern boat ambience
    // already uses successfully elsewhere in this file.
    el.addEventListener('error', function () {
      console.warn('Fishing audio failed to load (' + key + '): ' + FISHING_AUDIO_FILES[key] + (el.error ? ' -- error code ' + el.error.code : ''));
    });
    fishingAudioEls[key] = el;
    return el;
  }

  // Identical in shape to fadeEngineVolume -- see that function's own
  // comment; kept as its own copy here for the independence reasons
  // explained in the section comment above.
  function fadeFishingVolume(el, target, seconds, onComplete) {
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    var start = el.volume;
    if (Math.abs(target - start) < 0.001) { el.volume = target; if (onComplete) onComplete(); return; }
    var stepMs = 20;
    var steps = Math.max(1, Math.round((seconds * 1000) / stepMs));
    var stepIndex = 0;
    el._fadeTimer = setInterval(function () {
      stepIndex++;
      if (stepIndex >= steps) {
        el.volume = target;
        clearInterval(el._fadeTimer);
        el._fadeTimer = null;
        if (onComplete) onComplete();
      } else {
        el.volume = start + (target - start) * (stepIndex / steps);
      }
    }, stepMs);
  }

  // Plays a one-shot (cast/catch/catch_small/catch_medium/catch_large/
  // release/drag1/drag2) from the beginning every time, with a quick
  // fade-in to avoid a click at the start -- and fires onEnded (once)
  // when it naturally finishes, same wiring as playEngineOneShot.
  function playFishingOneShot(key, onEnded) {
    if (!audioUnlocked) return;
    var el = getFishingAudioEl(key);
    el.onended = null;
    if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
    if (!el.paused) el.pause();
    el.currentTime = 0;
    el.volume = 0;
    el._baseVolume = FISHING_AUDIO_VOLUME[key];
    var p = el.play();
    if (p && p.catch) p.catch(function (e) { console.warn('Fishing audio failed to play (' + key + '):', describeError(e)); });
    fadeFishingVolume(el, muted ? 0 : FISHING_AUDIO_VOLUME[key], FISHING_CROSSFADE_SECONDS);
    if (onEnded) {
      el.onended = function () {
        el.onended = null;
        onEnded();
      };
    }
  }

  // Starts the continuous reel.mp3 bed -- fresh from the beginning
  // every time (a new reel-in sequence is always a clean start, never
  // a resume), looped (see getFishingAudioEl), left running underneath
  // the automatic suspense text until stopFishingReelLoop fades it out.
  function startFishingReelLoop() {
    if (!audioUnlocked) return;
    var el = getFishingAudioEl('reel');
    if (!el.paused) el.pause();
    el.currentTime = 0;
    el.volume = 0;
    el._baseVolume = FISHING_AUDIO_VOLUME.reel;
    var p = el.play();
    if (p && p.catch) p.catch(function (e) { console.warn('Fishing audio failed to play (reel):', describeError(e)); });
    fadeFishingVolume(el, muted ? 0 : FISHING_AUDIO_VOLUME.reel, FISHING_CROSSFADE_SECONDS);
  }

  // ONLY touches the reel element -- never catchSmall/catchMedium/
  // catchLarge (see stopFishingLandingSound below, a deliberately
  // separate function so the two lifecycles can never accidentally get
  // conflated). Instant stop, no fade: the size-based catch sound
  // starts in the very same step this is called from (see
  // beginFishLandingSequence/revealMarlin), so there's no gap left to
  // smooth over.
  function stopFishingReelLoop() {
    var el = fishingAudioEls.reel;
    if (!el || el.paused) return;
    el.pause();
  }

  // The landing sound (catchSmall/catchMedium/catchLarge) is
  // deliberately allowed to finish playing on its own -- it is NOT
  // touched by clearFishingTimers, and nothing in the normal
  // bite/reel/reveal/KEEP/RELEASE flow calls this. It is only ever cut
  // off from these specific, explicit call sites: a new cast beginning
  // (performFishCast), STOP FISHING (performFishStop), leaving/
  // re-entering the FISH screen (cmdFish), or a new landing sound about
  // to replace it (beginFishLandingSequence/revealMarlin, defensively,
  // in case an earlier one from a prior catch is somehow still going).
  function stopFishingLandingSound() {
    ['catchSmall', 'catchMedium', 'catchLarge'].forEach(function (key) {
      var el = fishingAudioEls[key];
      if (!el || el.paused) return;
      el.pause();
    });
  }

  // Which final catch sound fits the fish's actual generated weight --
  // used identically for a normal catch and for marlin (whose weight
  // always falls in the 30-40lb trophy range, so it always resolves to
  // catchLarge here with no separate marlin-specific audio logic
  // needed at all).
  function fishingCatchSoundKeyForWeight(weightLb) {
    if (weightLb <= 10) return 'catchSmall';
    if (weightLb <= 20) return 'catchMedium';
    return 'catchLarge';
  }

  // Drag sounds: alternate strictly drag1 -> drag2 -> drag1 -> ... every
  // cast restarts the alternation at drag1. Timing is measured from
  // when each sound is TRIGGERED, not from when it finishes: first
  // drag at a random point 3-6s after CAST, then every next one at a
  // random point 15-20s after the previous one fired. Pure recursive
  // setTimeout -- at most one pending drag timer ever exists, and the
  // callback re-checks both that a session still exists and that it's
  // still in the 'waiting' phase before playing, in case cancellation
  // was somehow missed.
  var fishingDragTimer = null;
  var fishingNextDragKey = 'drag1';

  function scheduleFishingDragSound(delayMs) {
    fishingDragTimer = setTimeout(function () {
      fishingDragTimer = null;
      if (!fishingSession || fishingSession.phase !== 'waiting') return; // session ended, or no longer waiting for a bite
      var key = fishingNextDragKey;
      playFishingOneShot(key);
      fishingNextDragKey = (key === 'drag1') ? 'drag2' : 'drag1';
      scheduleFishingDragSound(rand(15000, 20000));
    }, delayMs);
  }

  function startFishingDragScheduler() {
    fishingNextDragKey = 'drag1'; // every new cast restarts the alternation at drag1
    scheduleFishingDragSound(rand(3000, 6000));
  }

  function cancelFishingDragScheduler() {
    if (fishingDragTimer) { clearTimeout(fishingDragTimer); fishingDragTimer = null; }
    // Also hard-stops a drag sound that's actively mid-playback right
    // now, rather than letting it finish naturally -- a stray drag
    // sound bleeding into the sudden catch.mp3 bite alert (or into
    // silence after STOP FISHING) would undercut both moments.
    ['drag1', 'drag2'].forEach(function (key) {
      var el = fishingAudioEls[key];
      if (!el) return;
      if (!el.paused) el.pause();
    });
  }

  // Applies the current mute state to whichever fishing element(s) are
  // actually audible right now, instantly -- called from toggleMute,
  // same pattern as applyMuteToEngineAudio.
  function applyMuteToFishingAudio() {
    Object.keys(fishingAudioEls).forEach(function (key) {
      var el = fishingAudioEls[key];
      if (!el || el.paused) return;
      if (el._fadeTimer) { clearInterval(el._fadeTimer); el._fadeTimer = null; }
      el.volume = muted ? 0 : (el._baseVolume || 0);
    });
  }

  // Transient, in-progress fishing session -- NOT persisted; see the
  // section comment above for why. null whenever no cast is currently
  // in flight (idle FISH screen, or the player has left it entirely).
  var fishingSession = null;

  function clearFishingTimers() {
    // FISHING HOOK -- always safe to call, whether or not either was
    // actually active; extends this already-central cleanup point so
    // every existing call site (a new cast, a bite arriving, no bite,
    // a missed reaction, STOP FISHING) also gets audio cleanup for
    // free, with no new call sites needed elsewhere.
    cancelFishingDragScheduler();
    stopFishingReelLoop();
    if (!fishingSession) return;
    if (fishingSession.resolveTimer) clearTimeout(fishingSession.resolveTimer);
    if (fishingSession.dotsTimer) clearInterval(fishingSession.dotsTimer);
    // The waiting dots are a single DOM node this code inserted directly
    // (not through printLine, since it needs to keep updating the SAME
    // element rather than appending a new one every frame) -- remove it
    // explicitly rather than relying on some later clearTempView(),
    // since under the append-only model nothing else will.
    if (fishingSession.dotsLineEl && fishingSession.dotsLineEl.parentNode) {
      fishingSession.dotsLineEl.parentNode.removeChild(fishingSession.dotsLineEl);
    }
  }

  function fishingIdleOptions() {
    return [{ label: 'CAST', action: 'fish-cast' }, { label: 'STOP FISHING', action: 'fish-stop' }];
  }

  function cmdFish(state) {
    clearFishingTimers(); // FISHING HOOK -- defensive; ensures no audio from a previous attempt can leak in
    stopFishingLandingSound(); // FISHING HOOK -- a landing sound is deliberately NOT touched by clearFishingTimers; this is one of its few explicit stopping points
    fishingSession = null; // a fresh visit to the FISH screen always starts idle -- see FISHING section comment on why nothing here is resumed
    printBlank();
    printLine('FISHING', 'heading-label');
    state.pendingChoice = { id: 'fish-idle', options: fishingIdleOptions() };
  }

  function performFishCast(state) {
    clearFishingTimers();
    stopFishingLandingSound(); // FISHING HOOK -- see cmdFish's comment on why this is separate from clearFishingTimers
    var willBite = Math.random() < FISHING_CONFIG.biteChance; // flat 60% -- see FISHING_CONFIG.biteChance comment for why nothing else modifies this

    fishingSession = { phase: 'waiting', willBite: willBite, resolveTimer: null, dotsTimer: null, dotsLineEl: null };

    playFishingOneShot('cast'); // FISHING HOOK -- fire-and-forget, does not delay anything below
    startFishingDragScheduler(); // FISHING HOOK -- cancelled by clearFishingTimers whenever the wait ends, for any reason

    // #temp-view was already cleared by the generic click handler that
    // routed the CAST click here (see renderOptions) -- just append the
    // waiting dots, same visual rhythm as any other short action's dots
    // (see animateDots in runShortAction) and no special styling. A
    // single DOM node whose text content is updated in place -- never
    // prints a new line while waiting.
    var dotsLine = document.createElement('p');
    dotsLine.className = 'line dim';
    dotsLine.textContent = '.';
    tempViewEl.appendChild(dotsLine);
    fishingSession.dotsLineEl = dotsLine;
    var frames = ['.', '..', '...'];
    var frameIndex = 0;
    fishingSession.dotsTimer = setInterval(function () {
      frameIndex = (frameIndex + 1) % frames.length;
      dotsLine.textContent = frames[frameIndex];
    }, DOT_FRAME_MS);

    state.pendingChoice = { id: 'fish-waiting', options: [{ label: 'STOP FISHING', action: 'fish-stop' }] };

    var mySession = fishingSession;
    // If a bite is going to happen at all, it lands at a uniformly
    // random point somewhere in the full wait window -- not weighted
    // toward any particular part of it.
    var resolveAtMs = willBite ? rand(0, FISHING_CONFIG.bite.totalWaitMs) : FISHING_CONFIG.bite.totalWaitMs;
    fishingSession.resolveTimer = setTimeout(function () {
      if (fishingSession !== mySession) return; // superseded -- STOP FISHING was clicked, or another cast started
      if (willBite) beginFishBite(state);
      else resolveFishNoBite(state);
    }, resolveAtMs);
    // Deliberately no renderOptions/save/scroll call here -- this runs
    // inside handleAction (via performFishCast), whose own tail does
    // that once this returns, same as every other action.
  }

  function performFishStop(state) {
    clearFishingTimers();
    stopFishingLandingSound(); // FISHING HOOK -- see cmdFish's comment on why this is separate from clearFishingTimers
    fishingSession = null;
    printBlank();
    printLine('You bring the line in.', 'dim');
    // pendingChoice deliberately left unset -- handleAction's tail
    // clears it (nothing here sets a new one), so the normal Above
    // Deck menu takes over on the next render, exactly like 'cancel'
    // elsewhere. This is what "return the player to the normal Above
    // Deck interface" means mechanically.
  }

  function resolveFishNoBite(state) {
    clearFishingTimers();
    printBlank();
    printLine('Nothing\u2019s biting.', 'dim');
    showFishResultScreen(state);
  }

  // Weight tier, weight, and (if applicable) the marlin/species
  // decision are ALL made right here, the moment the bite occurs --
  // before the player ever sees REEL IN, same as before. None of it is
  // shown or hinted at this point; it only shapes the automatic
  // sequence once a successful reaction hooks the fish.
  function beginFishBite(state) {
    clearFishingTimers(); // stops the dots timer and removes the dots line -- the wait is over
    var tier = pickFishWeightTier();
    var weightLb = pickFishWeightLbInTier(tier);
    // Marlin is only ever possible once the tier roll has ALREADY
    // landed on the rare top bracket, and only in eligible waters --
    // see the FISHING_CONFIG.marlinChanceWithinTrophyTier comment.
    var isMarlin = tier.key === 'trophy' && marlinEligible(state) && Math.random() < FISHING_CONFIG.marlinChanceWithinTrophyTier;
    var species = isMarlin ? null : pickFishSpeciesForWeight(state, weightLb);

    fishingSession = { phase: 'bite-prompt', tier: tier, weightLb: weightLb, isMarlin: isMarlin, species: species, resolveTimer: null };

    printLine('The line jerks hard.');
    playFishingOneShot('catch'); // FISHING HOOK -- the sudden bite alert; fire-and-forget, does not delay anything below
    // No options at all -- ignores clicks/taps before REEL IN appears,
    // since there's nothing here to click.
    state.pendingChoice = { id: 'fish-bite-prompt', options: [] };
    renderOptions(state);
    scrollToBottom();

    var mySession = fishingSession;
    fishingSession.resolveTimer = setTimeout(function () {
      if (fishingSession !== mySession) return;
      beginFishReelPrompt(state);
    }, FISHING_CONFIG.biteToPromptDelayMs);
  }

  function beginFishReelPrompt(state) {
    clearFishingTimers();
    fishingSession.phase = 'reacting';
    printLine('REEL IN'); // a plain, ordinary terminal line -- REEL IN's button (below, in #options) is a normal .option, no special styling either
    state.pendingChoice = { id: 'fish-reacting', options: [{ label: 'REEL IN', action: 'fish-reel' }] };
    renderOptions(state);
    scrollToBottom();

    var mySession = fishingSession;
    fishingSession.resolveTimer = setTimeout(function () {
      if (fishingSession !== mySession) return;
      resolveFishReactionMissed(state);
    }, FISHING_CONFIG.reactionWindowMs);
  }

  function resolveFishReactionMissed(state) {
    clearFishingTimers();
    printBlank();
    printLine('The line goes slack.', 'dim');
    printLine('The fish is lost.', 'dim');
    showFishResultScreen(state);
  }

  function performFishReel(state) {
    if (!fishingSession || fishingSession.phase !== 'reacting') return; // stale/duplicate click -- shouldn't be reachable since the button disappears on the next render, but stay defensive
    clearFishingTimers();
    beginFishLandingSequence(state);
  }

  // Hint beats by weight TIER (not species) -- each tier gets a pool of
  // short lines per beat slot so a sequence doesn't read identically
  // every time. 'trophy' beats are the shared opening/mid beats for
  // EVERY 30-40lb catch, marlin or not -- the player can't tell which
  // it is yet at this point, which is deliberate; the branch only
  // happens in the final beat(s), see beginFishLandingSequence.
  var FISH_TIER_HINT_POOLS = {
    common: [
      ['There\u2019s weight on the line.', 'Something\u2019s there.', 'A light tug.'],
      ['It pulls away, then eases.', 'You gain some line.', 'It comes in without much fuss.'],
    ],
    substantial: [
      ['The line pulls harder.', 'Something pushes back.', 'A stronger tug this time.'],
      ['It runs a little, then settles.', 'It\u2019s not coming in easy.', 'Steady resistance.'],
      ['You gain line, then lose a little back.', 'It fights for a moment.', 'A real pull now.'],
    ],
    big: [
      ['Real weight, right away.', 'This one doesn\u2019t give easily.', 'Something big is pulling back.'],
      ['It runs, and keeps running.', 'The line stays taut.', 'It\u2019s not tiring yet.'],
      ['Whatever it is, it\u2019s strong.', 'The rod bends hard.', 'It\u2019s still fighting.'],
      ['Slowly, you start to gain line.', 'It gives an inch at a time.', 'The fight is starting to turn.'],
    ],
    trophy: [
      ['Heavy.', 'Heavier than anything so far.'],
      ['It runs again.', 'It takes line back, fast.'],
      ['Whatever\u2019s down there is big.', 'This is something else.'],
    ],
  };
  var FISH_GLIMPSE_LINES = ['You catch a glimpse beneath the surface.', 'Something breaks the surface, big.'];
  var MARLIN_FLASH_LINES = ['A flash of blue beneath the surface.'];
  var MARLIN_RARITY_LINES = ['You don\u2019t see many of these this close.', 'Not something you see every voyage.'];

  // Automatic, no further player input: the weight tier's own hint
  // beats (each followed by its own "..." line), then either an
  // ordinary glimpse-and-reveal (most catches) or the marlin-specific
  // flash-and-reveal (only when fishingSession.isMarlin) -- spread
  // evenly across the tier's randomized total duration. Species/weight
  // (or marlin-ness) were already decided back at the bite; nothing
  // here changes what's on the line, only how it's narrated.
  function beginFishLandingSequence(state) {
    var session = fishingSession;
    var tier = session.tier;
    var hintLines = FISH_TIER_HINT_POOLS[tier.key].map(function (pool) { return pickFromPool(pool); });

    startFishingReelLoop(); // FISHING HOOK -- continuous bed underneath the suspense text; stopped at the final beat below (non-marlin) or in revealMarlin (marlin)

    var lines = [];
    hintLines.forEach(function (h) { lines.push(h, '...'); });
    var finalLineIndex = lines.length; // the final suspense beat, about to be appended below -- the exact step that (for a non-marlin catch) triggers the audio transition
    lines.push(session.isMarlin ? pickFromPool(MARLIN_FLASH_LINES) : pickFromPool(FISH_GLIMPSE_LINES));

    session.phase = 'landing';
    state.pendingChoice = { id: 'fish-landing', options: [] }; // automatic -- nothing to click during this sequence
    renderOptions(state);
    scrollToBottom();

    var range = tier.durationMsRange;
    var totalMs = rand(range[0], range[1]);
    var stepMs = totalMs / (lines.length + 1); // + one more beat's worth of pause before the reveal

    var mySession = session;
    var index = 0;
    function showNextLine() {
      if (fishingSession !== mySession) return;
      printLine(lines[index]);
      if (index === finalLineIndex && !session.isMarlin) {
        // FISHING HOOK -- tied directly to this same step, the moment
        // the final suspense line prints: stop reel.mp3 (instant, no
        // fade) and start the size-based catch sound, back-to-back, no
        // timeout between them. Marlin's own final beat (and audio
        // trigger) comes later, inside revealMarlin -- the flash line
        // here is not yet marlin's last line before its reveal.
        stopFishingReelLoop();
        stopFishingLandingSound(); // defensive -- clears a stray sound left over from an earlier catch, never this one
        playFishingOneShot(fishingCatchSoundKeyForWeight(session.weightLb));
      }
      scrollToBottom();
      index++;
      if (index < lines.length) {
        fishingSession.resolveTimer = setTimeout(showNextLine, stepMs);
      } else {
        fishingSession.resolveTimer = setTimeout(function () {
          if (fishingSession !== mySession) return;
          if (session.isMarlin) revealMarlin(state);
          else resolveFishLanded(state);
        }, stepMs);
      }
    }
    fishingSession.resolveTimer = setTimeout(showNextLine, stepMs);
  }

  function resolveFishLanded(state) {
    var session = fishingSession;
    var displayName = fishSpeciesDisplayName(state, session.species);

    session.phase = 'keep-release';
    session.pendingCatch = { displayName: displayName, weightLb: session.weightLb };

    // No audio here -- the reel-stop and catch-sound trigger already
    // happened in beginFishLandingSequence, tied directly to the final
    // suspense line's own print step. This is just the text reveal.
    printBlank();
    printLine(displayName.toUpperCase() + ' \u2014 ' + session.weightLb.toFixed(1) + ' LB');

    if (fishAlreadyKeptToday(state)) {
      printLine('I\u2019ve got enough for today.', 'dim');
      state.pendingChoice = { id: 'fish-keep-release', options: [{ label: 'RELEASE', action: 'fish-release' }] };
    } else {
      state.pendingChoice = { id: 'fish-keep-release', options: [{ label: 'KEEP', action: 'fish-keep' }, { label: 'RELEASE', action: 'fish-release' }] };
    }

    renderOptions(state);
    saveGameState(state);
    scrollToBottom();
  }

  // Marlin CAN be landed -- weight shown, same as any other fish -- but
  // can never be kept (see performFishRelease's marlin-release branch,
  // and note there is no "case 'fish-keep'" path into this phase at
  // all). "A marlin." and the rarity line each get their own brief
  // pause rather than appearing all at once, matching the unhurried
  // pacing of everything else here.
  function revealMarlin(state) {
    var session = fishingSession;
    printLine('A marlin.');
    scrollToBottom();

    var mySession = session;
    fishingSession.resolveTimer = setTimeout(function () {
      if (fishingSession !== mySession) return;
      printLine(pickFromPool(MARLIN_RARITY_LINES), 'dim');
      scrollToBottom();
      fishingSession.resolveTimer = setTimeout(function () {
        if (fishingSession !== mySession) return;
        // FISHING HOOK -- tied directly to this same step, right as
        // the rarity line (marlin's own final suspense beat before the
        // reveal) has just printed: stop reel.mp3 (instant, no fade)
        // and start catch_large.mp3, back-to-back, no timeout between
        // them. Marlin's weight always falls in the trophy 30-40lb
        // range, so this naturally resolves to catchLarge -- no
        // separate marlin audio logic needed.
        stopFishingReelLoop();
        stopFishingLandingSound(); // defensive -- see beginFishLandingSequence's own note on this
        playFishingOneShot(fishingCatchSoundKeyForWeight(session.weightLb));
        printBlank();
        printLine('MARLIN \u2014 ' + session.weightLb.toFixed(1) + ' LB');
        session.phase = 'marlin-release';
        state.pendingChoice = { id: 'fish-marlin-release', options: [{ label: 'RELEASE', action: 'fish-release' }] };
        renderOptions(state);
        saveGameState(state);
        scrollToBottom();
      }, 1400);
    }, 1400);
  }

  function performFishKeep(state) {
    if (!fishingSession || fishingSession.phase !== 'keep-release' || !fishingSession.pendingCatch) return;
    var caught = fishingSession.pendingCatch;
    state.food.freshFish = (state.food.freshFish || 0) + 1;
    state.fishing.freshFishCaughtAt.push(state.meta.voyageMinutes);
    state.fishing.keptFishOnDay = voyageDayNumber(state);
    log(state, 'Kept: FRESH FISH \u2014 1 MEAL (' + caught.displayName + ', ' + caught.weightLb.toFixed(1) + ' lb).');
    flushNewLogEntries(state);
    showFishResultScreen(state);
  }

  function performFishRelease(state) {
    if (!fishingSession) return;
    if (fishingSession.phase === 'marlin-release') {
      playFishingOneShot('release'); // FISHING HOOK
      // A marlin is memorable enough to be worth a permanent voyage-log
      // line, unlike an ordinary release (which stays transient/#temp-view
      // only) -- see the FISHING section comment on why this is the one
      // deliberate asymmetry here.
      printBlank();
      printLine('You let it go.', 'dim');
      log(state, 'A marlin came alongside \u2014 rare enough to remember \u2014 then went back over the side.');
      flushNewLogEntries(state);
      showFishResultScreen(state);
      return;
    }
    if (fishingSession.phase !== 'keep-release') return;
    playFishingOneShot('release'); // FISHING HOOK
    printBlank();
    printLine('You let it go.', 'dim');
    showFishResultScreen(state);
  }

  function showFishResultScreen(state) {
    fishingSession = { phase: 'result' };
    state.pendingChoice = { id: 'fish-result', options: fishingIdleOptions() };
    renderOptions(state);
    saveGameState(state);
    scrollToBottom();
  }

  function getContextualOptions(state) {
    // A pending decision always wins — including a restart request made
    // mid-departure, mid-attempt, or mid-sleep, which must be answerable
    // even though those states otherwise show just one button. Pending
    // choices (SAILS' FULL/REEFED/etc, DISTRESS' ACTIVATE EPIRB/DEPLOY
    // LIFE RAFT/FIRE FLARE, and so on) are unaffected by physical
    // location — a rescue interaction started below can still surface
    // FIRE FLARE regardless of where the sailor is standing.
    if (state.pendingChoice) return state.pendingChoice.options;

    if (state.departure.stageIndex < DEPARTURE_STEPS.length) {
      return [{ label: DEPARTURE_STEPS[state.departure.stageIndex].label, action: 'departure-step' }];
    }

    if (state.rescue.phase === 'rescued') {
      // The voyage is over — nothing left to do but look back at it. The
      // log itself is always visible above, scrolled into history, so
      // there's nothing else worth offering here. (STATUS used to be
      // the one thing left to press; it's no longer player-facing, and
      // nothing replaces it — there's genuinely nothing left to do.)
      return [];
    }

    if (state.crew.watchState === 'trying') {
      return [{ label: 'GET UP', action: 'give-up-trying' }];
    }
    if (state.crew.watchState === 'sleeping') {
      return [{ label: 'WAKE UP', action: 'wake-up' }];
    }

    if (state.crew.inLifeRaft) {
      // Nothing left to sail, motor, steer, or fix — the voyage has
      // become survival until rescue, full stop. There's no boat left
      // to be above or below on, so this stays the one flat list it
      // always was (minus STATUS, which is gone everywhere now).
      return [
        { label: 'POSITION', action: 'cmd:position' },
        { label: 'WEATHER', action: 'cmd:weather' },
        { label: 'INVENTORY', action: 'cmd:inventory' },
        { divider: true },
        { label: 'EAT', action: 'cmd:eat' },
        { label: 'DRINK', action: 'cmd:drink' },
        { label: 'SLEEP', action: 'cmd:sleep' },
        { label: 'DISTRESS', action: 'cmd:distress' },
      ];
    }

    // REPAIR is always offered in both locations now, plain-labeled —
    // cmdRepair decides, by location, exactly what's reachable and shows
    // its own picker if there's more than one thing (or one) to choose
    // from; "nothing to fix" if not.
    var goLabel = state.crew.location === 'below' ? 'GO ABOVE' : 'GO BELOW';

    if (state.crew.location === 'below') {
      return groupedOptions([
        [
          { label: 'WELLBEING', action: 'cmd:wellbeing' },
          { label: 'CHORES', action: 'cmd:chore' },
        ],
        [
          { label: 'POSITION', action: 'cmd:position' },
          { label: 'WEATHER', action: 'cmd:weather' },
          { label: 'FORECAST', action: 'cmd:forecast' },
          { label: 'INVENTORY', action: 'cmd:inventory' },
        ],
        [
          { label: 'STATUS', action: 'cmd:status' },
          { label: 'ELECTRICAL PANEL', action: 'cmd:electrical' },
          { label: 'REPAIR', action: 'cmd:repair' },
          { label: 'DISTRESS', action: 'cmd:distress' },
        ],
        [{ label: goLabel, action: 'go-above-below' }],
      ]);
    }

    // ABOVE (the default/starting location).
    return groupedOptions([
      [
        { label: 'SAILS', action: 'cmd:sails' },
        { label: 'ENGINE', action: 'cmd:engine' },
        { label: 'COURSE', action: 'cmd:course' },
        { label: 'FISH', action: 'cmd:fish' },
      ],
      [{ label: 'REPAIR', action: 'cmd:repair' }],
      [{ label: goLabel, action: 'go-above-below' }],
    ]);
  }

  // Which of the read-only "information" categories (if any) currently
  // occupies the temp view. Tracked separately from state.pendingChoice
  // because it's pure UI/interaction convenience — not part of the
  // simulation, not persisted, not something a reload should remember.
  // POSITION, WEATHER, and ROUTINE are deliberately NOT here: they each
  // drive their own focused submenu via pendingChoice instead — no
  // click-again-to-collapse shortcut, BACK is the one way out, and the
  // main BELOW menu is fully hidden while any of them is open rather
  // than staying visible underneath. FORECAST is not here either, for
  // the same reason — it drives its own pendingChoice too.
  var INFO_COMMANDS = { inventory: true };
  var openInfoPanel = null;

  // Cosmetic only — see the --bg-lit CSS variable. Called from
  // renderOptions so it's always in sync with state, including right
  // after loading a saved game. The brighter background is interior
  // cabin illumination — it only applies below deck, even if the
  // lights are left on while the player is above.
  function applyCabinLighting(state) {
    var lit = !!state.boat.cabinLightsOn && state.crew.location === 'below';
    document.documentElement.classList.toggle('cabin-lit', lit);
    document.body.classList.toggle('cabin-lit', lit);
  }

  function renderOptions(state) {
    applyCabinLighting(state);
    applyTapeLocationAudio(state);
    updateBoatAudioForState(state);
    syncActivityDots(state);
    updateNavStrip(state); // the strip reflects live state, so refresh it anywhere the options panel does
    optionsEl.innerHTML = '';
    var opts = getContextualOptions(state);
    opts.forEach(function (opt) {
      if (opt.divider) {
        var div = document.createElement('div');
        div.className = 'option-divider';
        optionsEl.appendChild(div);
        return;
      }
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option';
      btn.textContent = '> ' + opt.label;
      btn.addEventListener('click', function () {
        if (opt.action === 'open-map' || opt.action === 'open-in-windy') {
          // Pure external side effect: opens a new tab and changes
          // nothing about the current Landfall view, so the panel that
          // offered this (POSITION or FORECAST) stays exactly as it was
          // — no clearTempView, no touching openInfoPanel, no re-render.
          var url = opt.action === 'open-map' ? googleMapsUrl(state.nav.lat, state.nav.lon) : windyUrl(state.nav.lat, state.nav.lon);
          window.open(url, '_blank');
          return;
        }
        if (opt.action.indexOf('cmd:') === 0) {
          var cmdName = opt.action.slice(4);
          clearTempView(); // whatever the last command/menu showed is done being looked at
          if (INFO_COMMANDS[cmdName] && openInfoPanel === cmdName) {
            // Same info category clicked again while it's already open:
            // collapse it and return to the plain log view instead of
            // reopening it.
            openInfoPanel = null;
            renderOptions(state);
            saveGameState(state);
            scrollToBottom();
            return;
          }
          openInfoPanel = INFO_COMMANDS[cmdName] ? cmdName : null;
          printEcho(cmdName === 'chore' ? 'chores' : cmdName);
          runCommand(state, cmdName);
        } else {
          clearTempView();
          // Inventory's own category/back sub-choices stay "inside" the
          // inventory panel for toggle purposes; any other action (a sail
          // choice, an eat/drink pick, a generic cancel out of a prompt,
          // etc.) leaves the info-panel system entirely.
          if (opt.action.indexOf('inventory:') !== 0) {
            openInfoPanel = null;
          }
          handleAction(state, opt.action);
        }
      });
      optionsEl.appendChild(btn);
    });
  }

  /* --------------------------------------------------------------
     SHORT PHYSICAL ACTIONS

     A reusable working-indicator system for physical tasks that
     shouldn't resolve instantly — starting the engine, reefing,
     checking the aft locker, pouring water. NOT a loading spinner:
     it represents the sailor actually doing something, so it runs
     on real wall-clock seconds (setTimeout/setInterval), same as a
     human would take a moment. This is orthogonal to — and never
     touches — the voyage clock (meta.voyageMinutes): a few seconds
     of UI pacing is not a time-skip; see PROJECT.md's real-time rule,
     which governs the SIMULATION clock, not interaction pacing.

     Usage: runShortAction(state, { label, duration, action }).
     `action(state)` does whatever an instant handler normally would
     (mutate state, call log()/printLine() itself) — this just wraps
     it with a label and a few seconds of animated dots first, then
     runs the normal render/save tail once it resolves. Any future
     action can opt in with three lines; nothing here is hard-coded
     to a specific task.
     -------------------------------------------------------------- */
  var uiBusy = false; // true while a short action's dots are animating — options are hidden, other actions wait
  var DOT_FRAME_MS = 700;

  // Shared indefinite-duration activity indicator — same single-element,
  // same-frames-and-timing approach as animateDots below, but indefinite
  // rather than fixed-duration (an ongoing activity has no set end time
  // the way a short action does). syncActivityDots is called from
  // renderOptions every time it runs (every action, every live tick,
  // right after load) and is idempotent: it only starts the timer when
  // some activity is active and none is running, and only stops it when
  // one is running but nothing is active anymore — so it never fights
  // an already-cycling animation, and it self-corrects after ANY way an
  // activity can end (an explicit stop, natural completion, an
  // interruption, or resuming mid-activity after a reload) without
  // needing an explicit stop call scattered at each of those sites.
  // activityDotsShouldBeVisible is where a future continuous activity
  // adds its own condition — READ and SLEEP already share this exact
  // mechanism rather than each having their own copy.
  var activityDotsTimer = null;
  var activityDotsEl = null;
  var ACTIVITY_DOT_FRAMES = ['.', '..', '...'];

  function activityDotsShouldBeVisible(state) {
    if (state.pendingChoice && state.pendingChoice.id === 'reading') return true;
    if (state.crew.watchState === 'trying' || state.crew.watchState === 'sleeping') return true;
    return false;
  }

  function startActivityDots() {
    activityDotsEl = document.createElement('p');
    activityDotsEl.className = 'line dim';
    activityDotsEl.textContent = ACTIVITY_DOT_FRAMES[0];
    outputEl.insertBefore(activityDotsEl, tempViewEl);
    var frameIndex = 0;
    activityDotsTimer = setInterval(function () {
      frameIndex = (frameIndex + 1) % ACTIVITY_DOT_FRAMES.length;
      if (activityDotsEl) activityDotsEl.textContent = ACTIVITY_DOT_FRAMES[frameIndex];
    }, DOT_FRAME_MS);
  }

  function stopActivityDots() {
    if (activityDotsTimer) { clearInterval(activityDotsTimer); activityDotsTimer = null; }
    if (activityDotsEl && activityDotsEl.parentNode) activityDotsEl.parentNode.removeChild(activityDotsEl);
    activityDotsEl = null;
  }

  function syncActivityDots(state) {
    var shouldBeActive = activityDotsShouldBeVisible(state);
    if (shouldBeActive && !activityDotsTimer) {
      startActivityDots();
    } else if (!shouldBeActive && activityDotsTimer) {
      stopActivityDots();
    }
  }

  function runShortAction(state, config) {
    uiBusy = true;
    var choiceAtStart = state.pendingChoice; // preserved/cleared the same way handleAction's tail would

    optionsEl.innerHTML = '';
    clearTempView(); // whatever menu was open is done being looked at once an action starts
    printPersistentBlank();

    // Normally the label (e.g. "STARTING ENGINE") is printed permanently,
    // same as everything else in the scrollback. config.transientLabel
    // opts a specific action out of that: the label shows only while the
    // dots are running and is gone once resolved, leaving just the
    // result line behind — for actions minor enough that only the
    // outcome, not the doing, belongs in the permanent record.
    var labelEl = null;
    if (config.transientLabel) {
      labelEl = document.createElement('p');
      labelEl.className = 'line heading-label';
      labelEl.textContent = config.label;
      outputEl.insertBefore(labelEl, tempViewEl);
    } else {
      printPersistentLine(config.label, 'heading-label');
    }

    // One animated "." / ".." / "..." run, for `durationSeconds` real seconds,
    // then `onDone`. Factored out so a short action can optionally chain a
    // second, label-less pause after its own result — the dots themselves
    // ARE that pause; nothing about voyage time is touched by any of this.
    function animateDots(durationSeconds, onDone) {
      var dotsLine = document.createElement('p');
      dotsLine.className = 'line dim';
      dotsLine.textContent = '.';
      outputEl.insertBefore(dotsLine, tempViewEl);
      scrollToBottom();

      var frames = ['.', '..', '...'];
      var frameIndex = 0;
      var dotTimer = setInterval(function () {
        frameIndex = (frameIndex + 1) % frames.length;
        dotsLine.textContent = frames[frameIndex];
      }, DOT_FRAME_MS);

      setTimeout(function () {
        clearInterval(dotTimer);
        if (dotsLine.parentNode) dotsLine.parentNode.removeChild(dotsLine);
        if (labelEl && labelEl.parentNode) { labelEl.parentNode.removeChild(labelEl); labelEl = null; }
        onDone();
      }, durationSeconds * 1000);
    }

    function finish() {
      if (state.pendingChoice === choiceAtStart) {
        state.pendingChoice = null;
      }
      uiBusy = false;
      renderOptions(state);
      saveGameState(state);
      updateAudioForState(state);
      scrollToBottom();
    }

    animateDots(config.duration || 3, function () {
      if (config.action) config.action(state);
      if (config.thenBeat) {
        // A second silent beat — no new heading, just more dots — before a
        // final action. Used where a moment needs two results in sequence
        // (e.g., "you ease away from the dock." ... "the voyage has begun.").
        animateDots(config.thenBeat.duration || 3, function () {
          if (config.thenBeat.action) config.thenBeat.action(state);
          finish();
        });
      } else {
        finish();
      }
    });
  }

  function handleAction(state, action) {
    // Restarting discards the current game object entirely, so it can't
    // flow through the normal tail below (which would re-save and
    // re-render the very state this just deleted). Handle it and bail out.
    if (action === 'confirm-restart') {
      confirmRestart();
      return;
    }

    // performEat() (and in principle other handlers) can legitimately
    // re-open a pendingChoice itself — e.g. re-showing the food list after
    // a blocked cooking attempt. Only clear it in the tail below if nothing
    // during this action set a NEW one; otherwise the blanket reset would
    // immediately wipe out the very re-prompt we just opened.
    var choiceBeforeHandling = state.pendingChoice;

    if (action.indexOf('eat:') === 0) {
      performEat(state, action.slice(4));
    } else if (action.indexOf('chore:') === 0) {
      performChore(state, action.slice(6));
    } else if (action.indexOf('electrical:') === 0) {
      performElectricalToggle(state, action.slice(11));
    } else if (action.indexOf('start-reading:') === 0) {
      performStartReading(state, action.slice(14));
    } else if (action === 'stop-reading') {
      performStopReading(state);
    } else if (action.indexOf('start-tape:') === 0) {
      performStartTape(state, action.slice(11));
    } else if (action === 'stop-tape') {
      performStopTape(state);
    } else if (action === 'drink:water') {
      performDrinkWater(state);
    } else if (action === 'drink:coffee') {
      performCoffee(state);
    } else if (action === 'drink:tea') {
      performTea(state);
    } else if (action.indexOf('inventory:') === 0) {
      var invCat = action.slice(10);
      if (invCat === 'back') {
        cmdInventory(state);
      } else {
        showInventoryCategory(state, invCat);
      }
    } else if (action === 'repair:aftLocker') {
      runShortAction(state, { label: 'CHECKING AFT LOCKER', duration: 6, action: resolveAftLocker });
    } else if (action.indexOf('repair-select:') === 0) {
      cmdRepairSystem(state, action.slice(14));
    } else if (action.indexOf('attempt-repair:') === 0) {
      performSystemRepairAttempt(state, action.slice(15));
    } else if (action.indexOf('fish-') === 0) {
      // FISHING HOOK -- the whole cast/wait/bite/reel/land/keep-release
      // session lives in its own section (search "FISHING" above
      // getContextualOptions); this just routes the player-clicked
      // actions into it. uiBusy is deliberately never set for any of
      // these -- the session drives its own state.pendingChoice/
      // renderOptions calls directly from its own setTimeout chain
      // rather than through runShortAction, since (unlike every other
      // short action) it's long, variable-length, and interruptible
      // (STOP FISHING) rather than fixed-duration.
      switch (action) {
        case 'fish-cast': performFishCast(state); break;
        case 'fish-stop': performFishStop(state); break;
        case 'fish-reel': performFishReel(state); break;
        case 'fish-keep': performFishKeep(state); break;
        case 'fish-release': performFishRelease(state); break;
        default: break;
      }
    } else if (action.indexOf('course-draft:') === 0) {
      // The CHANGE COURSE dial: nudge the draft value and redraw the
      // same picker so the player sees where they've landed before
      // confirming — this is the button-only way to reach any of
      // 000-359 without a free-text field.
      var step = parseInt(action.slice(13), 10);
      state.nav.courseDraft = normalizeDeg(state.nav.courseDraft + step);
      cmdChangeCourse(state);
    } else {
      switch (action) {
        case 'cancel':
          printBlank();
          printLine('Left as it was.', 'dim');
          break;
        case 'give-up-trying':
          state.crew.watchState = 'awake';
          state.crew.sleepAttemptStartedAt = null;
          state.crew.sleepStartedAt = null; // fully awake now — a later session starts its own duration count clean
          printBlank();
          printLine('You give up on it and get up.', 'dim');
          break;
        case 'wake-up':
          printBlank();
          wakeUp(state, 'You wake and go above.');
          break;
        case 'go-above-below':
          // A physical place, tracked independently of any menu — the
          // label the player just clicked already told them which way
          // they're headed, so this just carries it out. "GOING BELOW"/
          // "GOING ABOVE" is only shown while the dots run (transientLabel)
          // and doesn't stick around — just the result, "You go below."/
          // "You go above.", stays in the scrollback, and even that isn't
          // a timestamped voyage-log entry — too minor and too frequent
          // to be worth a permanent log line every time.
          var goingBelow = state.crew.location !== 'below';
          transitionBoatAudioToLocation(state, goingBelow ? 'below' : 'above');
          transitionEngineLocationAudio(state, goingBelow ? 'below' : 'above');
          runShortAction(state, {
            label: goingBelow ? 'GOING BELOW' : 'GOING ABOVE',
            transientLabel: true,
            duration: 2,
            action: function (s) {
              s.crew.location = goingBelow ? 'below' : 'above';
              printPersistentLine(goingBelow ? 'You go below.' : 'You go above.', 'dim');
            },
          });
          break;
        case 'sail-full':
          runShortAction(state, {
            label: 'SETTING FULL SAIL',
            duration: 4,
            action: function (s) {
              s.boat.sailConfig = 'full';
              log(s, "Full sail set. More speed, more motion.");
              flushNewLogEntries(s);
            },
          });
          break;
        case 'sail-reefed':
          runShortAction(state, {
            label: 'PUTTING IN A REEF',
            duration: 4,
            action: function (s) {
              s.boat.sailConfig = 'reefed';
              log(s, "Put a reef in. Quieter below, a little slower.");
              flushNewLogEntries(s);
            },
          });
          break;
        case 'sail-minimal':
          runShortAction(state, {
            label: 'REDUCING SAIL',
            duration: 5,
            action: function (s) {
              s.boat.sailConfig = 'minimal';
              log(s, "Reduced to minimal canvas. Slow, but she's not fighting the wind anymore.");
              flushNewLogEntries(s);
            },
          });
          break;
        case 'sail-furled':
          runShortAction(state, {
            label: 'FURLING SAILS',
            duration: 5,
            action: function (s) {
              s.boat.sailConfig = 'furled';
              log(s, "Sails furled. No canvas up at all.");
              flushNewLogEntries(s);
            },
          });
          break;
        case 'engine-start':
          if (state.boat.engine === 'DAMAGED') break; // shouldn't be reachable — button isn't shown otherwise
          runShortAction(state, {
            label: 'STARTING ENGINE',
            duration: 3,
            action: function (s) {
              s.boat.engineOn = true;
              beginEngineStartAudio(s.crew.location);
              // Recalculate immediately, using the heading as of the last
              // real tick — never invent a fresh heading here, since
              // computeHeading() also rolls a per-tick drift wobble that
              // must only ever happen on an actual simulated tick.
              s.boat.speed = computeBoatSpeed(s, s.nav.heading);
              log(s, 'BATTERY CHARGING');
              flushNewLogEntries(s);
              printBlank();
              printLine(propulsionLabel(propulsionState(s, s.nav.heading)) + '.');
              printLine(s.boat.speed.toFixed(1) + ' kt', 'dim');
            },
          });
          break;
        case 'engine-stop':
          runShortAction(state, {
            label: 'STOPPING ENGINE',
            duration: 2,
            action: function (s) {
              s.boat.engineOn = false;
              beginEngineStopAudio(s.crew.location);
              s.boat.speed = computeBoatSpeed(s, s.nav.heading);
              log(s, 'Engine stopped.');
              flushNewLogEntries(s);
              printBlank();
              printLine(propulsionLabel(propulsionState(s, s.nav.heading)) + '.');
              printLine(s.boat.speed.toFixed(1) + ' kt', 'dim');
            },
          });
          break;
        case 'activate-epirb':
          runShortAction(state, {
            label: 'ACTIVATING EPIRB',
            duration: 4,
            action: function (s) {
              s.rescue.epirbOn = true;
              s.rescue.activatedAt = s.meta.voyageMinutes;
              s.rescue.phase = 'traveling';
              s.rescue.travelMinutes = estimateRescueTravelMinutes(s);
              log(s, 'Distress beacon transmitting.');
              log(s, 'Rescue requested.');
              flushNewLogEntries(s);
            },
          });
          break;
        case 'deploy-life-raft':
          runShortAction(state, {
            label: 'DEPLOYING LIFE RAFT',
            duration: 6,
            action: function (s) {
              s.crew.inLifeRaft = true;
              log(s, 'The raft inflates alongside.');
              log(s, 'You climb aboard, and cut away from the boat.');
              flushNewLogEntries(s);
            },
          });
          break;
        case 'fire-flare':
          runShortAction(state, {
            label: 'FIRING FLARE',
            duration: 3,
            action: function (s) {
              s.supplies.safety.flares = clamp(s.supplies.safety.flares - 1, 0, 999);
              s.rescue.encounterFlareFired = true;
              log(s, 'A red flare climbs above the water.');
              flushNewLogEntries(s);
              resolveRescueEncounter(s);
            },
          });
          break;
      case 'course-draft-confirm':
        state.nav.setCourse = state.nav.courseDraft;
        state.nav.courseDraft = null;
        refreshHeadingAndSpeed(state);
        printBlank();
        printLine('New course set: ' + Math.round(state.nav.setCourse) + '\u00B0.', 'dim');
        cmdCourse(state);
        break;
      case 'course-draft-cancel':
        state.nav.courseDraft = null;
        cmdCourse(state);
        break;
      case 'set-for-nawiliwili':
        if (state.boat.steering === 'DAMAGED') { cmdCourse(state); break; } // shouldn't be reachable — button isn't shown otherwise
        state.nav.setCourse = Math.round(bearingBetween(state.nav.lat, state.nav.lon, FINAL_DEST.lat, FINAL_DEST.lon));
        refreshHeadingAndSpeed(state);
        printBlank();
        printLine('Course set direct for N\u0101wiliwili: ' + state.nav.setCourse + '\u00B0.', 'dim');
        cmdCourse(state);
        break;
      case 'resolve-aft-locker-now':
        resolveAftLocker(state);
        break;
      case 'defer-aft-locker':
        state.flags.aftLockerDeferredAt = state.meta.voyageMinutes;
        printBlank();
        printLine('It can wait. For now.', 'dim');
        break;
      case 'departure-step':
        var step = DEPARTURE_STEPS[state.departure.stageIndex];
        if (step) {
          runShortAction(state, {
            label: step.workingLabel || step.label,
            duration: step.duration || 3,
            action: function (s) {
              if (step.onEnter) step.onEnter(s);
              if (step.text) {
                log(s, typeof step.text === 'function' ? step.text(s) : step.text);
                flushNewLogEntries(s);
              }
              s.departure.stageIndex++;
              if (step.afterLog) step.afterLog(s);
            },
            thenBeat: step.thenBeat,
          });
        }
        break;
      default:
        break;
      }
    }
    if (uiBusy) return; // a short action was kicked off; it owns the tail (including the pendingChoice check) when it resolves
    if (state.pendingChoice === choiceBeforeHandling) {
      state.pendingChoice = null;
    }
    renderOptions(state);
    saveGameState(state);
    updateAudioForState(state);
    scrollToBottom();
  }

  /* ============================================================
     9. BOOT SEQUENCE
     ============================================================ */
  // The departure sequence walks through these one button at a time before
  // normal gameplay opens up. Each step is a plain state change (like EAT or
  // REPAIR) — it does not touch the clock; real time is passing throughout
  // exactly as it always does (see PROJECT.md).
  var DEPARTURE_STEPS = [
    { label: 'BOARD', workingLabel: 'BOARDING', duration: 2, text: "You step aboard." },
    {
      label: 'START ENGINE',
      workingLabel: 'STARTING ENGINE',
      duration: 3,
      text: 'BATTERY CHARGING',
      onEnter: function (s) { s.boat.engineOn = true; beginEngineStartAudio(s.crew.location); },
    },
    {
      label: 'CAST OFF',
      workingLabel: 'CASTING OFF',
      duration: 3,
      // The scripted sequence ends here — sails stay furled, the engine
      // stays running, and everything from this point on is a player
      // decision. The closing beat below isn't a separate button: once
      // the last line is off, there's nothing left to deliberately DO —
      // the boat just leaves, on its own, as the direct consequence. The
      // pause before "the voyage has begun" is a second dot-animation
      // beat (thenBeat), not a separate delay mechanism — the dots ARE
      // the beat, same real-time short-action system either time.
      afterLog: function (s) {
        printPersistentBlank();
        printPersistentLine('You ease away from the dock.', 'dim');
      },
      thenBeat: {
        duration: 3,
        action: function (s) {
          printPersistentBlank();
          log(s, 'The voyage has begun.');
          flushNewLogEntries(s);
        },
      },
    },
  ];

  var liveTimer = null;

  function startLiveLoop() {
    if (liveTimer) return;
    var last = Date.now();
    liveTimer = setInterval(function () {
      if (!GAME) return;
      var now = Date.now();
      var minutes = (now - last) / 60000;
      last = now;
      var ticks = advanceSimulation(GAME, minutes);
      GAME.meta.lastTick = now;
      // ticks > 0 covers the coarse simulation; the continuous systems
      // (reading milestones/completion, darkness interrupting a
      // session) synced inside advanceSimulation can also log something
      // worth showing on their own, even when no full tick just ran —
      // printedCount lagging behind state.log.length is the precise,
      // cheap signal for that.
      if (ticks > 0 || printedCount < GAME.log.length) {
        flushNewLogEntries(GAME);
        if (!uiBusy) renderOptions(GAME); // a short action owns the options panel while its dots are animating
        updateAudioForState(GAME);
      }
      saveGameState(GAME);
    }, LIVE_TICK_SECONDS * 1000);
  }

  function renderPreDeparture() {
    printPersistentLine(VESSEL_NAME + ' \u2014 ' + DEPARTURE_PORT, 'heading-label');
    printPersistentBlank();
    printPersistentLine('Lines still on the dock. Grey morning, the kind Seattle keeps for departures.');
    printPersistentLine('Ahead: ' + ROUTE_DISTANCE_NM.toLocaleString() + ' nautical miles of open Pacific, and ' + DESTINATION_PORT + ', somewhere past the curve of the world.');
    printPersistentBlank();
    printPersistentLine('You are sailing alone.');

    optionsEl.innerHTML = '';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option';
    btn.textContent = '> ' + DEPARTURE_STEPS[0].label;
    btn.addEventListener('click', function () {
      GAME = newGameState();
      unlockAudio();
      updateAudioForState(GAME); // safe no-op if audio isn't unlocked yet; keeps a restart's ambience in sync immediately
      updateSoundLabel();
      setVesselLine('S/V ' + VESSEL_NAME + ' \u2014 UNDERWAY');
      restartBtn.hidden = false;
      startLiveLoop();
      clearTempView();
      handleAction(GAME, 'departure-step'); // logs, flushes, advances the stage, and renders/saves/scrolls
      updateClock();
    });
    optionsEl.appendChild(btn);
  }

  function confirmRestart() {
    // A restart discards the save and begins a fresh voyage "now" — this is
    // not a time-skip (see PROJECT.md): it doesn't fast-forward or rewind
    // an in-progress voyage, it just starts over exactly like a first visit.
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { console.warn('Could not clear save:', describeError(e)); }
    GAME = null;
    printedCount = 0;
    resetOutputEl();
    restartBtn.hidden = true;
    setVesselLine('S/V ' + VESSEL_NAME + ' \u2014 AT DOCK');
    renderPreDeparture();
    updateClock();
  }

  function renderReturn(state, ticks) {
    resetOutputEl();
    printPersistentLine('S/V ' + VESSEL_NAME + ' \u2014 underway', 'heading-label');
    if (ticks > 0) {
      printPersistentBlank();
      printPersistentLine('(' + describeGap(ticks * TICK_MINUTES) + ' since you were last aboard.)', 'dim');
    }
    state.log.forEach(printLogEntry);
    printedCount = state.log.length;
    renderOptions(state);
    scrollToBottom();
  }

  // Saves from before real dead reckoning existed have no lat/lon at all —
  // position used to be interpolated from percent-of-route-traveled. Give
  // those saves one seeded fix so the switch doesn't teleport anyone; every
  // tick from here on moves from wherever this lands, same as any other
  // point in the voyage. New saves already have lat/lon and skip this.
  function migrateNavIfNeeded(state) {
    var nav = state.nav;
    if (nav.tack === undefined) nav.tack = null;
    if (nav.tackDistanceNm === undefined) nav.tackDistanceNm = 0;
    if (nav.setCourse === undefined) nav.setCourse = null; // computeHeading() lazily sets this toward Nāwiliwili on first open-ocean use if still null
    if (nav.courseDraft === undefined) nav.courseDraft = null;
    if (nav.landWarningLevel === undefined) nav.landWarningLevel = 'none';
    if (nav.groundedOn === undefined) nav.groundedOn = null;
    if (state.flags && state.flags.arrivedAtDestination === undefined) state.flags.arrivedAtDestination = false;
    if (typeof nav.lat === 'number' && typeof nav.lon === 'number') return;
    var legacyTotal = 2850; // the flat distance old saves' progress was measured against
    var frac = clamp((nav.distanceTraveled || 0) / legacyTotal, 0, 1);
    var start = WAYPOINTS[0];
    nav.lat = start.lat + (FINAL_DEST.lat - start.lat) * frac - Math.sin(frac * Math.PI) * 2.5;
    nav.lon = start.lon + (FINAL_DEST.lon - start.lon) * frac;
    nav.waypointIndex = 1;
    for (var i = 1; i < WAYPOINTS.length; i++) {
      var covered = distanceBetween(start.lat, start.lon, WAYPOINTS[i].lat, WAYPOINTS[i].lon);
      if (covered <= (nav.distanceTraveled || 0)) nav.waypointIndex = Math.min(i + 1, WAYPOINTS.length - 1);
    }
    delete nav.crossTrackDeviation; // replaced by a value computed fresh from position, not stored
    nav.heading = computeHeading(state); // also refreshes nav.intendedCourse so the display isn't stale
  }

  // The closest point lying ON the current WAYPOINTS route (projected
  // onto whichever leg is nearest) to an arbitrary lat/lon, plus the
  // index of that leg's "ahead" waypoint (i.e. the one a boat there
  // should be steering toward). Flat local projection, not full
  // spherical geometry — plenty accurate at the few-mile scale this is
  // ever used at.
  function nearestPointOnRoute(lat, lon) {
    var best = null, bestDist = Infinity;
    for (var i = 0; i < WAYPOINTS.length - 1; i++) {
      var a = WAYPOINTS[i], b = WAYPOINTS[i + 1];
      var mlat = toRad((a.lat + b.lat) / 2);
      var ax = a.lon * Math.cos(mlat), ay = a.lat;
      var bx = b.lon * Math.cos(mlat), by = b.lat;
      var px = lon * Math.cos(mlat), py = lat;
      var abx = bx - ax, aby = by - ay;
      var apx = px - ax, apy = py - ay;
      var ab2 = abx * abx + aby * aby;
      var t = ab2 === 0 ? 0 : clamp((apx * abx + apy * aby) / ab2, 0, 1);
      var cLat = a.lat + t * (b.lat - a.lat);
      var cLon = a.lon + t * (b.lon - a.lon);
      var d = distanceBetween(lat, lon, cLat, cLon);
      if (d < bestDist) { bestDist = d; best = { lat: cLat, lon: cLon, aheadIndex: i + 1 }; }
    }
    return best;
  }

  // Recovery for one specific, known bug: an earlier version of the
  // coastal route crossed straight over the southern end of Marrowstone
  // Island, so a save made during that window could have a position
  // that's physically on the island. The box below is a little larger
  // than the island itself to catch anything that old bug could have
  // produced crossing it. This is NOT a general "keep the boat on the
  // route" snap — a position outside this specific box, however far
  // from any waypoint, is left completely untouched.
  function recoverPositionIfOnLand(state) {
    var nav = state.nav;
    if (typeof nav.lat !== 'number' || typeof nav.lon !== 'number') return;
    var onMarrowstone = nav.lat >= 47.995 && nav.lat <= 48.115 && nav.lon >= -122.71 && nav.lon <= -122.655;
    if (!onMarrowstone) return;
    var recovered = nearestPointOnRoute(nav.lat, nav.lon);
    if (!recovered) return;
    nav.lat = recovered.lat;
    nav.lon = recovered.lon;
    nav.heading = computeHeading(state);
  }

  // One-time migration for the coastal waypoint chain being replaced
  // wholesale with an exact, externally-supplied set of points (a
  // different count and numbering than whatever a save was using
  // before). This does NOT move the boat — its actual lat/lon, the
  // ground truth, is untouched — it only re-points nav.waypointIndex at
  // whichever new waypoint the boat should now be steering toward,
  // found by projecting its current position onto the new route. Runs
  // once per save (guarded by nav.coastalRouteMigrated) rather than
  // every load, since repeatedly re-deriving the target from position
  // could in principle walk it backward a step if wobble ever puts the
  // boat fractionally closer to the previous leg's line.
  function migrateCoastalWaypointIndexIfNeeded(state) {
    var nav = state.nav;
    if (nav.coastalRouteMigrated) return;
    nav.coastalRouteMigrated = true;
    if (typeof nav.lat !== 'number' || typeof nav.lon !== 'number') return; // migrateNavIfNeeded handles this case
    var found = nearestPointOnRoute(nav.lat, nav.lon);
    if (!found) return;
    nav.waypointIndex = found.aheadIndex;
    nav.heading = computeHeading(state); // also refreshes nav.intendedCourse so the display isn't stale
  }

  // Earlier saves tracked food/water as abstract "days remaining," had no
  // propane, and only ever had watchState 'awake'/'sleeping'. Give those
  // saves a real starting inventory (scaled down by how much of the old
  // abstract countdown they'd already burned through) and fill in the new
  // crew fields, then switch to the real systems from here on. New saves
  // already have state.food and skip this entirely.
  function migrateProvisionsIfNeeded(state) {
    var c = state.crew, b = state.boat;
    if (!state.food) {
      var foodFrac = clamp((c.foodDays != null ? c.foodDays : 24) / 24, 0, 1);
      var waterFrac = clamp((c.waterDays != null ? c.waterDays : 30) / 30, 0, 1);
      state.food = {
        oatmeal: Math.round(18 * foodFrac), pasta: Math.round(12 * foodFrac), rice: Math.round(16 * foodFrac),
        soup: Math.round(8 * foodFrac), chili: Math.round(8 * foodFrac), tuna: Math.round(10 * foodFrac),
        crackers: Math.round(12 * foodFrac), peanutButter: Math.round(10 * foodFrac), nuts: Math.round(16 * foodFrac),
        driedFruit: Math.round(12 * foodFrac), energyBars: Math.round(12 * foodFrac),
        freshFruit: Math.round(8 * foodFrac), freshBread: Math.round(6 * foodFrac),
        chocolate: Math.round(6 * foodFrac), coffee: Math.round(24 * foodFrac),
      };
      state.water = { primary: +(35 * waterFrac).toFixed(1), emergency: 8 };
      state.supplies = { propane: Math.round(60 * foodFrac) };
      delete c.foodDays;
      delete c.waterDays;
    }
    // Consolidate the old primary+emergency water split into one
    // authoritative pool. This sums whatever remained of each — an
    // existing voyage's actual remaining supply carries over exactly,
    // never reset to the new 50-gallon starting amount and never
    // topped up with phantom extra water.
    if (state.water.gallons === undefined) {
      var oldPrimary = state.water.primary != null ? state.water.primary : 0;
      var oldEmergency = state.water.emergency != null ? state.water.emergency : 0;
      state.water = { gallons: oldPrimary + oldEmergency };
    }
    // Coffee moves out of food into its own drinks bucket, preserving
    // however much the player already has left. Tea never existed
    // before this pass, so there's no prior consumption to preserve —
    // an existing voyage is granted a fresh supply of it.
    if (!state.drinks) {
      state.drinks = {
        coffee: state.food.coffee != null ? state.food.coffee : 24,
        tea: 24,
      };
      delete state.food.coffee;
    }
    // Comfort Food is retired in favor of Chocolate — any existing save
    // that still has the old key carries its quantity over exactly
    // (never topped up, never reset), then the old key is dropped.
    if (state.food.comfort !== undefined) {
      state.food.chocolate = (state.food.chocolate || 0) + state.food.comfort;
      delete state.food.comfort;
    }
    if (state.food.chocolate === undefined) state.food.chocolate = 4;
    // Rebase an existing voyage's food onto the CURRENT canonical
    // departure quantities while preserving exactly how much has
    // already been eaten — never resetting to full, never just
    // swapping the denominator underneath the same remaining count,
    // and never letting CURRENT end up above the new ORIGINAL. Runs at
    // most once per save: newGameState() already stamps
    // meta.foodInventoryVersion at FOOD_INVENTORY_VERSION up front, so
    // a fresh voyage never touches this at all, and once an existing
    // save has been rebased here its version marker prevents it from
    // ever happening again on a later load.
    if (state.meta.foodInventoryVersion === undefined) state.meta.foodInventoryVersion = 0;
    if (state.meta.foodInventoryVersion < FOOD_INVENTORY_VERSION) {
      FOOD_ITEMS.forEach(function (f) {
        var oldStarting = OLD_FOOD_ORIGINAL[f.key];
        if (oldStarting != null && state.food[f.key] != null) {
          var consumed = oldStarting - state.food[f.key];
          state.food[f.key] = Math.max(0, f.original - consumed);
        }
      });
      state.meta.foodInventoryVersion = FOOD_INVENTORY_VERSION;
    }
    if (c.sleepAttemptStartedAt === undefined) c.sleepAttemptStartedAt = null;
    if (c.lastCoffeeAt === undefined) c.lastCoffeeAt = null;
    if (c.coffeeCount === undefined) c.coffeeCount = 0;
    if (c.snackMealRatio === undefined) c.snackMealRatio = 0;
    if (c.dishesDirtySinceMinutes === undefined) c.dishesDirtySinceMinutes = null;
    if (c.lastChocolateAt === undefined) c.lastChocolateAt = null;
    if (c.clothesWetSinceMinutes === undefined) c.clothesWetSinceMinutes = null;
    if (c.toolsOutSinceMinutes === undefined) c.toolsOutSinceMinutes = null;
    if (c.bunkUnmadeSinceMinutes === undefined) c.bunkUnmadeSinceMinutes = null;
    if (c.dampCabinHours === undefined) c.dampCabinHours = 0;
    if (c.cabinStuffySinceMinutes === undefined) c.cabinStuffySinceMinutes = null;
    if (c.clutterCount === undefined) c.clutterCount = 0;
    if (c.clutterSinceMinutes === undefined) c.clutterSinceMinutes = null;
    if (c.readingBookId === undefined) c.readingBookId = null;
    if (c.readingLastSyncedAt === undefined) c.readingLastSyncedAt = currentGameMinutes(state);
    if (c.readingMoraleAccumMinutes === undefined) c.readingMoraleAccumMinutes = 0;
    if (c.tapeListenDay === undefined) c.tapeListenDay = null;
    if (c.tapeListenCount === undefined) c.tapeListenCount = 0;
    if (!state.books) state.books = newBooksState();
    BOOKS.forEach(function (b) {
      if (!state.books[b.id]) state.books[b.id] = { minutesRead: 0, completed: false, triggeredMilestones: [] };
    });
    if (c.lastRoutineAt.dryClothes === undefined) c.lastRoutineAt.dryClothes = null;
    if (c.lastRoutineAt.tools === undefined) c.lastRoutineAt.tools = null;
    if (c.lastRoutineAt.bunk === undefined) c.lastRoutineAt.bunk = null;
    if (c.lastRoutineAt.air === undefined) c.lastRoutineAt.air = null;
    if (c.lastRoutineAt.tidy === undefined) c.lastRoutineAt.tidy = null;
    if (c.location === undefined) c.location = 'above';
    if (b.battery === undefined) b.battery = 100;
    if (b.autopilotOn === undefined) b.autopilotOn = true;
    if (b.fanOn === undefined) b.fanOn = false;
    if (b.heaterOn === undefined) b.heaterOn = false;
    if (b.cabinLightsOn === undefined) b.cabinLightsOn = false;
    if (b.cabinTemperatureF === undefined || b.cabinTemperatureF === null) b.cabinTemperatureF = state.weather.temperatureF;
    if (b.cabinTemperatureLastSyncedAt === undefined) b.cabinTemperatureLastSyncedAt = currentGameMinutes(state);
    if (state.flags.hungerNarrated === undefined) state.flags.hungerNarrated = false;
    if (state.flags.cleanlinessNarrated === undefined) state.flags.cleanlinessNarrated = false;
    if (state.flags.galleyNarrated === undefined) state.flags.galleyNarrated = false;
    if (state.flags.freshFruitSpoiled === undefined) state.flags.freshFruitSpoiled = false;
    if (state.flags.freshBreadSpoiled === undefined) state.flags.freshBreadSpoiled = false;
    // Diesel used to be tracked as "hours of motoring left" — convert any
    // older save to real gallons at the same burn rate the simulation now
    // uses, so a save mid-passage doesn't suddenly gain or lose fuel.
    if (b.fuelGallons === undefined) {
      var legacyHours = b.fuelHours != null ? b.fuelHours : 20;
      b.fuelGallons = +(legacyHours * DIESEL_BURN_RATE_GPH).toFixed(1);
      delete b.fuelHours;
    }
    // Consolidate the old 11-category supplies (engine/rigging/electrical/
    // Simplified spares: initialize the four new categories once,
    // regardless of whatever the save's old spares table looked like
    // (a handful of oil/coolant/wire/etc counts, or nothing at all for
    // very old saves) — there's no natural mapping from the old
    // categories to the new ones, so an existing voyage just starts
    // them at the same canonical amounts a fresh voyage would.
    if (!state.supplies.spares || state.supplies.spares.sailRepairKit === undefined) {
      state.supplies.spares = {
        sailRepairKit: ORIGINAL_SPARES.sailRepairKit,
        steeringParts: ORIGINAL_SPARES.steeringParts,
        engineParts: ORIGINAL_SPARES.engineParts,
        fuses: ORIGINAL_SPARES.fuses,
      };
    }
    if (c.inLifeRaft === undefined) c.inLifeRaft = false;
    if (!state.rescue) {
      state.rescue = {
        epirbOn: false, activatedAt: null, phase: 'none', travelMinutes: 0,
        nextSearchEventAt: null, encounterActive: false, encounterStartedAt: null,
        encounterKind: null, encounterFlareFired: false,
      };
    }
    // One-time conversion from the old five-tier numeric condition model
    // (HULL/RIGGING/SAILS/ENGINE/ELECTRICAL/STEERING, 0-100, plus
    // flooding and per-system major-repair tracking) to the new
    // four-system GOOD/DAMAGED model. b.hull existing at all is exactly
    // what marks an old-format save — a fresh voyage never has it, so
    // this can never re-run and never resets an already-migrated save.
    if (b.hull !== undefined) {
      var migrateCondition = function (v) { return (v != null && v < 25) ? 'DAMAGED' : 'GOOD'; };
      b.sails = migrateCondition(b.sails);
      b.steering = migrateCondition(b.steering);
      b.engine = migrateCondition(b.engine);
      b.electrical = migrateCondition(b.electrical);
      // HULL and BILGE aren't migrated into anything else — just gone.
      delete b.hull;
      delete b.rigging;
      delete b.floodRate;
      delete b.bilgeWater;
      delete b.majorRepairUsed;
      delete state.flags.hullLeakTriggerAt;
      delete state.flags.hullLeakTriggered;
      delete state.flags.hullLeakResolved;
      delete state.flags.bilgeWarned50;
      delete state.flags.bilgeWarned100;
      delete state.flags.sailWarningIssued;
    }
    if (b.nextFailureAt === undefined) {
      // Migrating into the new failure system starts its clock now, same
      // randomized 24-48h window a fresh voyage gets.
      b.nextFailureAt = state.meta.voyageMinutes + rand(24, 48) * 60;
    }
    if (!c.lastRoutineAt) {
      c.lastRoutineAt = { wash: null, dress: null, dishes: null, read: null };
    }
    // Real-world weather anchor and displayed temperature are new too. A
    // save that predates them just means "no real data yet" — identical
    // to never having connectivity, which the whole system already has
    // to handle gracefully.
    var w = state.weather;
    if (w.temperatureF === undefined) w.temperatureF = estimateTemperatureF(state.nav.lat);
    if (!w.realWx) {
      w.realWx = {
        fetchedRealMs: null, lat: null, lon: null,
        windSpeedKt: null, windDirectionDeg: null, temperatureF: null,
        condition: null, forecastLine: null,
      };
    }
    if (!w.oceanCurrent) {
      w.oceanCurrent = { fetchedRealMs: null, lat: null, lon: null, speedKt: null, directionDeg: null, northSample: null, southSample: null };
    }
    if (w.oceanCurrent.northSample === undefined) w.oceanCurrent.northSample = null;
    if (w.oceanCurrent.southSample === undefined) w.oceanCurrent.southSample = null;
    // FISHING HOOK -- backfill for any save that predates this feature.
    if (state.food.freshFish === undefined) state.food.freshFish = 0;
    if (!state.fishing) {
      state.fishing = {
        keptFishOnDay: null,
        freshFishCaughtAt: [],
      };
    }
  }

  function boot() {
    var saved = loadGameState();
    if (!saved) {
      renderPreDeparture();
      updateClock();
      return;
    }
    GAME = saved;
    migrateNavIfNeeded(GAME);
    recoverPositionIfOnLand(GAME);
    migrateCoastalWaypointIndexIfNeeded(GAME);
    migrateProvisionsIfNeeded(GAME);
    restartBtn.hidden = false;
    setVesselLine('S/V ' + VESSEL_NAME + ' \u2014 UNDERWAY');
    var ticks = catchUpFromRealTime(GAME);
    saveGameState(GAME);
    renderReturn(GAME, ticks);
    startLiveLoop();
    updateClock();
  }

  restartBtn.addEventListener('click', function () {
    if (!GAME || uiBusy) return;
    clearTempView();
    printEcho('restart');
    runCommand(GAME, 'restart');
  });

  soundBtn.addEventListener('click', function () {
    if (!audioUnlocked) {
      unlockAudio();
      if (GAME) updateAudioForState(GAME);
    } else {
      toggleMute();
    }
    updateSoundLabel();
  });

  document.addEventListener('visibilitychange', function () {
    if (!GAME) return;
    if (document.visibilityState === 'hidden') {
      GAME.meta.lastTick = Date.now();
      saveGameState(GAME);
    } else if (document.visibilityState === 'visible') {
      var ticks = catchUpFromRealTime(GAME);
      if (ticks > 0) {
        flushNewLogEntries(GAME);
        if (!uiBusy) renderOptions(GAME); // a short action owns the options panel while its dots are animating
        updateAudioForState(GAME);
      }
      saveGameState(GAME);
      updateClock();
    }
  });

  window.addEventListener('pagehide', function () {
    if (!GAME) return;
    GAME.meta.lastTick = Date.now();
    saveGameState(GAME);
  });

  boot();
  setInterval(updateClock, 30000);

})();
</script>
</body>
</html>
